<!-- f06: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f06.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 6.18 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f06-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f06" data-width="1080" data-height="1920">
    <canvas id="f06-canvas" width="1080" height="1920"></canvas>
    <div id="f06-r1" class="rot" style="top: 700px"><span id="f06-r1-in" class="rot-t"><span class="k">CHERNOBYL</span><br>Sem <span class="y">pessoas</span></span></div>
    <div id="f06-r2" class="rot" style="top: 700px"><span id="f06-r2-in" class="rot-t"><span class="k">CHERNOBYL</span><br><span class="y">7×</span> mais lobos</span></div>
  </div>
  <script>
    (function () {
      const D0 = 6.18;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f06-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f06" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f06-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.75 * K);
      tl.to("#f06-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.8 * K);
      tl.fromTo("#f06-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 3.17 * K);
      tl.to("#f06-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 5.88 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f06"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f06"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/avenida.js")
      ]).then(async ([K_, T, A, AVENIDA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f06-canvas");

        const st = T.createToyStage(canvas, { fov: 42, ceu: ["#7FA6C9", "#F5D3A0"], nevoa: [25, 190], corNevoa: "#d8c8aa", luz: 0.95 });
        const S = st.scene, cam = st.cam;
        const av = AVENIDA.avenida(S);
        const rr = mulberry32(606);
        // 1 lobo na frente; aos 3,2 s ("sete vezes") chegam mais 6 vindos do mato do estacionamento
        const lobos = Array.from({ length: 7 }, (_, i) => {
          const l = AVENIDA.fauna("lobo", { fase: rr(), cor: [0x847b70, 0x6f675d, 0x948a7c, 0x5f5850][i % 4] });
          l.group.scale.setScalar(1.15); S.add(l.group);
          l.o = { dx: (rr() - 0.5) * 4, dz: -1.5 - rr() * 5, t0: 3.17 + (i - 1) * 0.17, sx: -14 - rr() * 6 };
          return l;
        });
        const cervos = [[3.6, -14, 0.7], [5.4, -18, 2.3], [2.2, -21, -2.6]].map(([x, z, ry], i) => {
          const c = AVENIDA.fauna("cervo", { fase: i * 0.37, chifre: i !== 1 }); c.group.position.set(x, 0.4, z); c.group.rotation.y = ry; c.group.scale.setScalar(1.05); S.add(c.group); return c;
        });
        const aves = T.bando(S, { n: 14, seed: 607, cor: 0x3d4248 });
        function render(t) {
          av.set({ racha: 1, mato: 1, hera: 0.3, sujeira: 0.4, ferrugem: 0.25, floresta: 0.12, fenda: 0.1 }, t);
          const lz = -6 + t * 3.0, lx = -0.8 + Math.sin(t * 0.6) * 0.6;
          lobos.forEach((l, i) => {
            let x = lx + (i ? l.o.dx : 0), z = lz + (i ? l.o.dz : 0), dx = 0, dz = 1;
            if (i) { // chega correndo de lado e entra na matilha
              const k = ease.outCubic(range(t, l.o.t0, l.o.t0 + 1.3));
              x = lerp(l.o.sx, x, k); z = lerp(lz - 3 + l.o.dz, z, k); dx = (1 - k) * 2.2; dz = 1;
              l.group.visible = t > l.o.t0 - 0.05;
            }
            l.group.position.set(x, 0.12, z);
            l.group.rotation.y = Math.atan2(-dz, dx);
            l.update(t, { passo: i && t < l.o.t0 + 1.3 ? 3.2 : 2.2, cabeca: -0.1 });
          });
          cervos.forEach((c, i) => {
            const alerta = i === 0 ? ease.inOutSine(range(t, 2.4, 3.0)) : 0;
            c.update(t, { cabeca: lerp(-1.25, 0.1, alerta) + Math.sin(t * 1.7 + i) * 0.05, vira: alerta * 0.6 });
          });
          aves.update(t, [-10 + t * 5, 22, -10], [6, 2, 4], 0.3, 0.5);
          const e = ease.inOutSine(range(t, 0, 6.18));
          cam.position.set(lerp(4.0, -2.2, e), lerp(3.0, 3.4, e), lerp(23, 19.5, e));
          cam.lookAt(lerp(lx + 1.5, lx, e), lerp(1.0, 0.7, e), lz - 2);
          st.sol(0, lz, 40);
          st.draw();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
