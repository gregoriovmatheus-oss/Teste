<!-- f10: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f10.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.55 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f10-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }
.rot-t .selo{display:inline-block;font-family:"Inter",sans-serif;font-weight:800;font-size:112px;line-height:1.05;letter-spacing:0.01em;text-transform:uppercase;background:linear-gradient(180deg,#ffffff 35%,#9fd6ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 16px rgba(0,0,0,0.65))}.rot-t .sp{display:block;font-family:"JetBrains Mono",monospace;font-weight:500;font-size:28px;letter-spacing:0.34em;color:#7cc8ff;margin-bottom:12px;text-transform:uppercase}.rot-t .sl{display:block;width:380px;height:2px;margin:14px auto 0;background:linear-gradient(90deg,rgba(124,200,255,0),#7cc8ff,rgba(124,200,255,0))}#f10-r2,#f10-r3{align-items:flex-end}#f10-r2-in,#f10-r3-in{font-size:68px}
  </style>
  <div id="root" data-composition-id="f10" data-width="1080" data-height="1920">
    <canvas id="f10-canvas" width="1080" height="1920"></canvas>
    <div id="f10-r1" class="rot" style="top: 580px"><span id="f10-r1-in" class="rot-t" style="opacity: 1"><span class="sp">TEMPO SEM HUMANOS</span><span class="selo">100 ANOS</span><span class="sl"></span></span></div>
    <div id="f10-r2" class="rot" style="top: 700px"><span id="f10-r2-in" class="rot-t">Árvores no meio das <span class="y">avenidas</span></span></div>
    <div id="f10-r3" class="rot" style="top: 700px"><span id="f10-r3-in" class="rot-t"><span class="k">ESTACIONAMENTOS</span><br>viram <span class="y">floresta</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.55;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f10-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f10" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.set("#f10-r1-in", { opacity: 1 }, 0);
      tl.fromTo("#f10-r1-in", { scale: 1 }, { scale: 1.08, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.out" }, 0.2 * K);
      tl.fromTo("#f10-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.1 * K);
      tl.to("#f10-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.55 * K);
      tl.fromTo("#f10-r3-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.95 * K);
      tl.to("#f10-r3-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 5.25 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f10"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f10"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/avenida.js")
      ]).then(async ([K_, T, A, AVENIDA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f10-canvas");

        const st = T.createToyStage(canvas, { fov: 46, ceu: ["#4A6CA3", "#F3B477"], nevoa: [40, 260], corNevoa: "#d9b48c", luz: 0.95 });
        const S = st.scene, cam = st.cam;
        st.bloom = 0.5;
        const av = AVENIDA.avenida(S);
        const aves = T.bando(S, { n: 30, seed: 1001, cor: 0x3a3f46 });
        const cervo = AVENIDA.fauna("cervo", { fase: 0.2 }); cervo.group.position.set(1.5, 0.12, 6); cervo.group.rotation.y = 2.2; S.add(cervo.group);
        function render(t) {
          const fl = lerp(0.18, 1, ease.inOutSine(range(t, 0.4, 4.8)));
          av.set({ racha: 1, mato: 1, hera: lerp(0.55, 1, range(t, 0, 4)), sujeira: 0.9, ferrugem: 1, floresta: fl, fenda: 0.6 }, t);
          cervo.update(t, { cabeca: -1.1 + Math.sin(t * 1.3) * 0.08 });
          aves.update(t, [-20 + t * 6, 26 + t, -30], [10, 3, 6], 0.2, 0.6);
          const e = ease.inOutSine(range(t, 0, 5.55));
          const [bx, by, bz] = av.BASE.pos, [lx, ly, lz] = av.BASE.look;
          cam.position.set(lerp(bx, -1.5, e), lerp(by, 13, e), lerp(bz, 36, e));
          cam.lookAt(lerp(lx, 0, e), lerp(ly, 4, e), lerp(lz, -26, e));
          st.sol(0, 0, 70);
          st.draw();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
