<!-- f02: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f02.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.7 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f02-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f02" data-width="1080" data-height="1920">
    <canvas id="f02-canvas" width="1080" height="1920"></canvas>
    <div id="f02-r1" class="rot" style="top: 700px"><span id="f02-r1-in" class="rot-t">Luzes <span class="y">acesas</span></span></div>
    <div id="f02-r2" class="rot" style="top: 700px"><span id="f02-r2-in" class="rot-t"><span class="y">Silêncio</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.7;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f02-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f02" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f02-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.2 * K);
      tl.to("#f02-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.6 * K);
      tl.fromTo("#f02-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 4.2 * K);
      tl.to("#f02-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 5.4 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f02"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f02"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/avenida.js")
      ]).then(async ([K_, T, A, AVENIDA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f02-canvas");

        const st = T.createToyStage(canvas, { fov: 44, ceu: ["#2E4176", "#EE9E62"], nevoa: [45, 260], corNevoa: "#7a6270", luz: 0.6 });
        const S = st.scene, cam = st.cam;
        st.hemi.intensity = 0.45;
        const av = AVENIDA.avenida(S);
        // celular largado no asfalto, tela ainda acesa
        const cel = new THREE.Group(); cel.position.set(-0.9, 0.13, 39.2); cel.rotation.y = 0.5; S.add(cel);
        T.mesh(T.roundBox(0.42, 0.06, 0.84, 0.03), 0x15161a, cel, 0.3);
        const tela = new THREE.Mesh(new THREE.PlaneGeometry(0.36, 0.74), new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0x9fd0ff, emissiveIntensity: 1.6 }));
        tela.rotation.x = -Math.PI / 2; tela.position.y = 0.065; cel.add(tela);
        const celG = new THREE.Sprite(AVENIDA.glowMat(0x9fd0ff)); celG.scale.setScalar(1.6); celG.position.y = 0.2; cel.add(celG); celG.material.opacity = 0.5;
        // pombos andando no asfalto vazio
        const pombos = [0, 1, 2].map((i) => { const p = A.createAnimal("passaro", { fase: i * 0.3, cor2: 0x6d7078 }); p.group.scale.setScalar(0.32); p.group.position.set(1.2 + i * 0.7, 0.13, 35.5 - i * 0.9); A.face(p.group, -0.4, 1); S.add(p.group); return p; });
        function render(t) {
          av.set({ janelas: 1, apagao: 0, luzRua: 1, farois: 1, sinal: 1, sujeira: 0.05 }, t);
          pombos.forEach((p, i) => { p.update(t, { passo: 2.2 }); p.group.position.z = 35.5 - i * 0.9 + t * 0.28; p.group.position.x = 1.2 + i * 0.7 - t * 0.12; });
          celG.material.opacity = 0.45 + 0.1 * Math.sin(t * 2);
          const e = ease.inOutSine(range(t, 0, 5.7));
          cam.position.set(lerp(-0.4, 0.5, e), lerp(0.9, 2.8, e), lerp(44, 29, e));
          cam.lookAt(lerp(-0.4, 0, e), lerp(0.5, 2.6, e), lerp(32, 0, e));
          st.sol(0, 20, 60);
          st.draw();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
