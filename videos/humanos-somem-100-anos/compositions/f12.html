<!-- f12: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f12.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.27 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f12-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f12" data-width="1080" data-height="1920">
    <canvas id="f12-canvas" width="1080" height="1920"></canvas>
    <div id="f12-r1" class="rot" style="top: 700px"><span id="f12-r1-in" class="rot-t">Prédios <span class="y">rachados</span></span></div>
    <div id="f12-r2" class="rot" style="top: 700px"><span id="f12-r2-in" class="rot-t">Animais <span class="y">sem medo</span><br>de nós</span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.27;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f12-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f12" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f12-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.55 * K);
      tl.to("#f12-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.1 * K);
      tl.fromTo("#f12-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.95 * K);
      tl.to("#f12-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 4.97 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f12"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f12"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/avenida.js")
      ]).then(async ([K_, T, A, AVENIDA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f12-canvas");

        const st = T.createToyStage(canvas, { fov: 42, ceu: ["#3E5E96", "#F2A86A"], nevoa: [25, 200], corNevoa: "#d3a985", luz: 0.9 });
        const S = st.scene, cam = st.cam;
        st.bloom = 0.5;
        const av = AVENIDA.avenida(S);
        const olhar = [1.2, 13];
        const povo = AVENIDA.gente(S, { n: 160, seed: 1201, zona: [18, 44], rua: 0.75 });
        povo.P.forEach((p) => { if (Math.hypot(p.x0 - olhar[0], p.z0 - olhar[1]) < 7) p.z0 += 8; });
        // heróis (animals.js) bem perto da câmera, olhando o cervo
        const herois = [[-1.6, 22.5, 0xb83a2e, 0x2c3550], [0.6, 23.4, 0x2f5c8a, 0x3a3a3e], [2.6, 22.2, 0xe8e2d4, 0x6b5a48]].map(([x, z, c1, c2], i) => {
          const h = A.createAnimal("humano", { cor: c1, cor2: c2, fase: i * 0.3, mulher: i === 1 }); h.group.position.set(x, 0.12, z); h.group.scale.setScalar(1.05);
          A.face(h.group, olhar[0] - x, olhar[1] - z); S.add(h.group); return h;
        });
        const cervos = [[1.2, 13, 1.7, true], [-2.4, 9.5, 0.9, false], [4.5, 8, 2.6, false]].map(([x, z, ry, ch], i) => { const c = AVENIDA.fauna("cervo", { fase: i * 0.4, chifre: ch }); c.group.position.set(x, 0.12, z); c.group.rotation.y = ry; S.add(c.group); return c; });
        const lobos = [[-6.2, 4, 0.4], [-7.4, 2.2, -0.3]].map(([x, z, ry], i) => { const l = AVENIDA.fauna("lobo", { fase: i * 0.5 }); l.group.position.set(x, 0.12, z); l.group.rotation.y = ry; S.add(l.group); return l; });
        function render(t) {
          av.set({ racha: 1, mato: 1, hera: 1, sujeira: 0.9, ferrugem: 1, floresta: 1, fenda: lerp(0.7, 1, range(t, 0.6, 1.6)) }, t);
          povo.update(t, { olha: olhar });
          herois.forEach((h, i) => h.update(t, { cabeca: Math.sin(t * 0.8 + i) * 0.06 }));
          // o cervo vem até as pessoas, sem medo
          const c0 = cervos[0], k = ease.inOutSine(range(t, 1.2, 4.4));
          c0.group.position.set(lerp(1.2, 0.8, k), 0.12, lerp(13, 18.5, k)); c0.group.rotation.y = -Math.PI / 2 + 0.15;
          c0.update(t, { passo: k > 0 && k < 1 ? 1.1 : 0, cabeca: k >= 1 ? -0.5 + Math.sin(t * 2) * 0.05 : 0.05 });
          cervos.slice(1).forEach((c, i) => c.update(t, { cabeca: -1.1 + Math.sin(t + i) * 0.1 }));
          lobos.forEach((l, i) => l.update(t, { cabeca: Math.sin(t * 0.7 + i) * 0.2, vira: Math.sin(t * 0.5 + i) * 0.4 }));
          // grua: de trás das pessoas até o lado, na altura dos olhos
          const e = ease.inOutSine(range(t, 0, 5.27)), a = lerp(-0.25, 0.75, e), R = lerp(11, 9, e);
          cam.position.set(1 + Math.sin(a) * R, lerp(2.6, 3.4, e), 18 + Math.cos(a) * R);
          cam.lookAt(lerp(0.6, 0.8, e), lerp(1.6, 1.4, e), lerp(14, 18, e));
          st.sol(0, 15, 40);
          st.draw();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
