<!-- f01: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f01.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.49 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f01-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f01" data-width="1080" data-height="1920">
    <canvas id="f01-canvas" width="1080" height="1920"></canvas>
    <div id="f01-r1" class="rot" style="top: 700px"><span id="f01-r1-in" class="rot-t"><span class="k">UM EXPERIMENTO MENTAL</span><br>E se os humanos <span class="y">sumissem?</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.49;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f01-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f01" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f01-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.0 * K);
      tl.to("#f01-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 1.6 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f01"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f01"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/avenida.js"), import("./assets/lib/blocks/terra.js")
      ]).then(async ([K_, T, A, AVENIDA, TERRA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f01-canvas");

        const st = T.createToyStage(canvas, { fov: 46, ceu: ["#46679E", "#F2B47A"], nevoa: [70, 320], corNevoa: "#e9b98c" });
        const S = st.scene, cam = st.cam;
        const av = AVENIDA.avenida(S);
        const povo = AVENIDA.gente(S, { n: 280, seed: 31, zona: [-50, 52], rua: 0.1 });
        const faixa = AVENIDA.gente(S, { n: 26, seed: 32, zona: [17, 20], rua: 1 });
        faixa.P.forEach((p, i) => { p.dx = i % 2 ? 1 : -1; p.dz = 0; p.x0 = p.x0 * 0.9; });
        const pombos = T.bando(S, { n: 18, seed: 33, cor: 0x55585e });
        // ---------- órbita: Terra real, luzes das cidades acendendo no fim da tarde ----------
        const ES = new THREE.Scene(); ES.background = new THREE.Color(0x000000);
        ES.add(TERRA.createCeu({ seed: 7, n: 5000, via: 0.55 }));
        const E = await TERRA.createTerra({ raio: 1 }); ES.add(E.group);
        E.sol.set(1, 0.2, -0.15); E.u.luzes.value = 1.1; E.u.atmo.value = 1.2;
        const cam2 = new THREE.PerspectiveCamera(36, 1080 / 1920, 0.005, 2000);
        st.extraWarm = [{ renderer: st.renderer, scene: ES, camera: cam2 }];
        const T1 = 2.0;
        function render(t) {
          if (t < T1) {
            // mergulho lento e pesado até a cidade (fim de tarde, na linha do terminador)
            st.bloom = 0.8;
            E.aim(-46.6 - t * 1.5, -23.5);
            E.nuv.rotation.y = t * 0.004;
            const e = ease.inCubic(range(t, 0, T1));
            const d = lerp(3.6, 1.04, e);
            cam2.position.set(lerp(0.35, 0.02, e), lerp(0.25, 0.01, e), d);
            cam2.lookAt(0, 0, 0);
            cam2.rotateZ(lerp(0.12, 0, e));
            st.draw(ES, cam2, { cor: "#fff3e2", a: range(t, 1.6, T1) });
          } else {
            st.bloom = 0.45;
            const u = t - T1;
            av.carrosAndando(t, 3.25, 1.9);
            av.set({ farois: 0.6, sinal: 1, janelas: 0.35, luzRua: 0.5 }, t);
            // o evento, em câmera lenta: cada pessoa vira poeira de luz subindo
            povo.update(t, { modo: "some", t0: 3.1, dur: 0.55, anda: t < 3.1, bd: 1.6, sobe: 3.5, lento: 3 });
            faixa.update(t, { modo: "some", t0: 3.1, dur: 0.55, anda: t < 3.1, bd: 1.6, sobe: 3.5, lento: 3 });
            pombos.update(t, [6 + t * 3, 15 + t * 1.2, -4 - t * 3], [5, 1.5, 4], -0.6, 0.45);
            const ev = Math.sin(Math.PI * range(t, 3.05, 4.7));
            st.vel = ev * 0.6; st.velT = t;
            const e = ease.outCubic(range(u, 0, 5.49 - T1));
            cam.position.set(lerp(14, 3, e), lerp(70, 8.5, e), lerp(96, 50, e));
            cam.lookAt(0, lerp(0, 5, e), lerp(-10, -20, e));
            st.sol(0, 10, 70);
            st.draw(S, cam, u < 0.5 ? { cor: "#fff3e2", a: 1 - u / 0.5 } : null);
            // piscar de olhos: pálpebras fecham e abrem (2,72 a 3,05 s)
            const b = Math.sin(Math.PI * range(t, 2.72, 3.05));
            if (b > 0.01) {
              const c = st.ctx, hh = 960 * b;
              c.fillStyle = "#07060c";
              c.beginPath(); c.moveTo(0, 0); c.lineTo(1080, 0); c.lineTo(1080, hh - 60); c.quadraticCurveTo(540, hh + 90, 0, hh - 60); c.fill();
              c.beginPath(); c.moveTo(0, 1920); c.lineTo(1080, 1920); c.lineTo(1080, 1920 - hh + 60); c.quadraticCurveTo(540, 1920 - hh - 90, 0, 1920 - hh + 60); c.fill();
            }
          }
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
