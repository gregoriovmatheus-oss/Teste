<!-- f07: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f07.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.86 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f07-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }
.rot-t .selo{display:inline-block;font-family:"Inter",sans-serif;font-weight:800;font-size:128px;line-height:1.05;letter-spacing:0.01em;text-transform:uppercase;background:linear-gradient(180deg,#ffffff 35%,#9fd6ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 16px rgba(0,0,0,0.65))}.rot-t .sp{display:block;font-family:"JetBrains Mono",monospace;font-weight:500;font-size:28px;letter-spacing:0.34em;color:#7cc8ff;margin-bottom:12px;text-transform:uppercase}.rot-t .sl{display:block;width:380px;height:2px;margin:14px auto 0;background:linear-gradient(90deg,rgba(124,200,255,0),#7cc8ff,rgba(124,200,255,0))}
  </style>
  <div id="root" data-composition-id="f07" data-width="1080" data-height="1920">
    <canvas id="f07-canvas" width="1080" height="1920"></canvas>
    <div id="f07-r1" class="rot" style="top: 300px"><span id="f07-r1-in" class="rot-t" style="opacity: 1"><span class="sp">TEMPO SEM HUMANOS</span><span class="selo">DÉCADAS</span><span class="sl"></span></span></div>
    <div id="f07-r2" class="rot" style="top: 700px"><span id="f07-r2-in" class="rot-t">Aço <span class="y">enferruja</span></span></div>
    <div id="f07-r3" class="rot" style="top: 700px"><span id="f07-r3-in" class="rot-t"><span class="k">FERRUGEM</span><br>até <span class="y">6×</span> o volume</span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.86;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f07-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f07" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.set("#f07-r1-in", { opacity: 1 }, 0);
      tl.fromTo("#f07-r1-in", { scale: 1 }, { scale: 1.08, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.out" }, 0.2 * K);
      tl.fromTo("#f07-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.0 * K);
      tl.to("#f07-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.3 * K);
      tl.fromTo("#f07-r3-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 4.15 * K);
      tl.to("#f07-r3-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 5.56 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f07"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f07"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/avenida.js")
      ]).then(async ([K_, T, A, AVENIDA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f07-canvas");

        const st = T.createToyStage(canvas, { fov: 44, ceu: ["#8EA2B8", "#E2D8C2"], nevoa: [30, 230], corNevoa: "#cfc7b4", luz: 0.85 });
        const S = st.scene, cam = st.cam;
        const av = AVENIDA.avenida(S);
        // ---- diagrama: corte de uma parede de concreto com vergalhões de aço ----
        const GS = new THREE.Scene();
        GS.background = T.gradTex("#1d2430", "#3a3f48"); GS.environment = S.environment;
        GS.add(new THREE.HemisphereLight(0xcfe0ff, 0x3a3430, 1.2));
        const dl = new THREE.DirectionalLight(0xffe2c0, 2.6); dl.position.set(-6, 8, 10); GS.add(dl);
        const conc = new THREE.Mesh(new THREE.BoxGeometry(8, 5, 3), new THREE.MeshStandardMaterial({ color: 0xb9b4aa, roughness: 0.95, transparent: true, opacity: 0.42, depthWrite: false }));
        conc.position.y = 2.5; GS.add(conc);
        const corte = new THREE.Mesh(new THREE.PlaneGeometry(8, 5), new THREE.MeshStandardMaterial({ color: 0x8f8a80, roughness: 1, side: THREE.DoubleSide, transparent: true, opacity: 0.35 }));
        corte.position.set(0, 2.5, 1.505); GS.add(corte);
        const barras = [[-2.2, 1.3], [2.2, 1.3], [-2.2, 3.7], [2.2, 3.7]].map(([x, y]) => {
          const m = new THREE.MeshStandardMaterial({ color: 0x8c949c, roughness: 0.35, metalness: 0.85 });
          const b = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 3.2, 20), m); b.rotation.x = Math.PI / 2; b.position.set(x, y, 0); GS.add(b);
          return { b, m, x, y };
        });
        // setas de pressão saindo de cada barra (a ferrugem empurra o concreto)
        const setaMat = new THREE.MeshBasicMaterial({ color: 0x7cc8ff });
        const setas = [];
        barras.forEach(({ x, y }) => { for (let k = 0; k < 6; k++) {
          const a = k / 6 * Math.PI * 2 + 0.3, g = new THREE.Group(); g.position.set(x, y, 1.55); g.rotation.z = a - Math.PI / 2; GS.add(g);
          const haste = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.5, 0.02), setaMat); haste.position.y = 0.55; g.add(haste);
          const ponta = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.26, 10), setaMat); ponta.position.y = 0.92; g.add(ponta);
          setas.push(g);
        } });
        // trincas crescendo na face do concreto a partir das barras
        const rr = mulberry32(707), TR = [];
        barras.forEach(({ x, y }) => { for (let c = 0; c < 3; c++) { let px = x, py = y, a = rr() * 6.28; const n = 7 + Math.floor(rr() * 5);
          for (let j = 0; j < n; j++) { a += (rr() - 0.5) * 0.9; const L = 0.25 + rr() * 0.3; const nx = px + Math.cos(a) * L, ny = py + Math.sin(a) * L; if (ny < 0.05 || ny > 4.95 || Math.abs(nx) > 3.95) break; TR.push({ x: (px + nx) / 2, y: (py + ny) / 2, L, a, k: j / n }); px = nx; py = ny; } } });
        const tri = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0x1b1714 }), TR.length); GS.add(tri);
        const lasca = new THREE.Mesh(T.roundBox(1.6, 0.5, 1.4, 0.1), new THREE.MeshStandardMaterial({ color: 0xb9b4aa, roughness: 0.95 })); GS.add(lasca);
        const cam2 = new THREE.PerspectiveCamera(40, 1080 / 1920, 0.1, 200);
        const o = new THREE.Object3D();
        st.extraWarm = [{ renderer: st.renderer, scene: GS, camera: cam2 }];
        const aco = new THREE.Color(0x8c949c), oxi = new THREE.Color(0xc0581f);
        function render(t) {
          if (t < 2.62) {
            const fe = ease.inOutSine(range(t, 0.9, 2.5));
            av.set({ racha: 1, mato: 1, hera: 0.45, sujeira: 0.6, ferrugem: 0.25 + 0.75 * fe, floresta: 0.25, fenda: 0.2 }, t);
            const e = ease.inOutSine(range(t, 0, 2.62));
            cam.position.set(lerp(-5.5, -3.2, e), lerp(2.2, 3.4, e), lerp(16, 6, e));
            cam.lookAt(lerp(-2.4, -2.6, e), 0.8, lerp(6, -6, e));
            st.sol(-2, 0, 30);
            st.draw(S, cam, { cor: "#0b0a12", a: range(t, 2.35, 2.62) });
          } else {
            const u = t - 2.62;
            const inc = ease.inOutSine(range(t, 3.4, 4.6));     // "incha"
            const rac = ease.outCubic(range(t, 4.55, 5.5));      // "racha"
            barras.forEach(({ b, m }) => { const s = 1 + inc * 0.9; b.scale.set(s, 1, s); m.color.copy(aco).lerp(oxi, Math.min(1, inc * 1.3)); m.metalness = lerp(0.85, 0.1, inc); m.roughness = lerp(0.35, 1, inc); });
            setas.forEach((g, i) => { const k = ease.outBack(range(t, 3.6 + (i % 6) * 0.04, 4.2 + (i % 6) * 0.04)); g.scale.setScalar(Math.max(1e-3, k * (1 + 0.08 * Math.sin(t * 8 + i)))); });
            TR.forEach((p, i) => { const k = clamp((rac * 1.3 - p.k) / 0.2); o.position.set(p.x, p.y, 1.52); o.rotation.set(0, 0, p.a); o.scale.set(p.L * k + 1e-3, 0.05, 0.02); o.updateMatrix(); tri.setMatrixAt(i, o.matrix); });
            tri.instanceMatrix.needsUpdate = true;
            const sp = range(t, 5.25, 5.86);
            lasca.position.set(2.4 + sp * 0.8, 4.75 + sp * 1.2 - sp * sp * 3, 0.9 + sp * 2.2); lasca.rotation.set(sp * 1.5, 0, -sp * 2);
            const e = ease.inOutSine(range(u, 0, 3.24));
            cam2.position.set(lerp(-7, 4.5, e), lerp(5.5, 3.6, e), lerp(11, 9.5, e));
            cam2.lookAt(0, 2.5, 0);
            st.draw(GS, cam2, { cor: "#0b0a12", a: 1 - range(u, 0, 0.3) });
          }
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
