<!-- f03: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f03.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 6.71 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f03-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }
.rot-t .selo{display:inline-block;font-family:"Inter",sans-serif;font-weight:800;font-size:128px;line-height:1.05;letter-spacing:0.01em;text-transform:uppercase;background:linear-gradient(180deg,#ffffff 35%,#9fd6ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 16px rgba(0,0,0,0.65))}.rot-t .sp{display:block;font-family:"JetBrains Mono",monospace;font-weight:500;font-size:28px;letter-spacing:0.34em;color:#7cc8ff;margin-bottom:12px;text-transform:uppercase}.rot-t .sl{display:block;width:380px;height:2px;margin:14px auto 0;background:linear-gradient(90deg,rgba(124,200,255,0),#7cc8ff,rgba(124,200,255,0))}
  </style>
  <div id="root" data-composition-id="f03" data-width="1080" data-height="1920">
    <canvas id="f03-canvas" width="1080" height="1920"></canvas>
    <div id="f03-r1" class="rot" style="top: 300px"><span id="f03-r1-in" class="rot-t" style="opacity: 1"><span class="sp">TEMPO SEM HUMANOS</span><span class="selo">HORAS</span><span class="sl"></span></span></div>
    <div id="f03-r2" class="rot" style="top: 700px"><span id="f03-r2-in" class="rot-t">Rede elétrica <span class="y">caindo</span></span></div>
    <div id="f03-r3" class="rot" style="top: 700px"><span id="f03-r3-in" class="rot-t"><span class="k">EM ATÉ</span><br><span class="y">2 dias</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 6.71;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f03-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f03" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.set("#f03-r1-in", { opacity: 1 }, 0);
      tl.fromTo("#f03-r1-in", { scale: 1 }, { scale: 1.08, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.out" }, 0.2 * K);
      tl.fromTo("#f03-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.5 * K);
      tl.to("#f03-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 4.0 * K);
      tl.fromTo("#f03-r3-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 4.7 * K);
      tl.to("#f03-r3-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 6.41 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f03"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f03"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/avenida.js")
      ]).then(async ([K_, T, A, AVENIDA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f03-canvas");

        const st = T.createToyStage(canvas, { fov: 46, ceu: ["#070C22", "#2B2D52"], nevoa: [60, 320], corNevoa: "#141a33", luz: 0.35, nuvens: 0 });
        const S = st.scene, cam = st.cam;
        st.hemi.color.setHex(0x8fa6ff); st.hemi.intensity = 0.32; st.key.color.setHex(0xaab8ff); st.rim.intensity = 0.1; S.environment = null;
        const av = AVENIDA.avenida(S);
        // estrelas (aparecem quando a cidade apaga)
        const rs = mulberry32(303), sp = new Float32Array(600 * 3);
        for (let i = 0; i < 600; i++) { const a = rs() * 6.28, e = 0.15 + rs() * 1.2, d = 900; sp[i * 3] = Math.cos(a) * Math.cos(e) * d; sp[i * 3 + 1] = Math.sin(e) * d; sp[i * 3 + 2] = Math.sin(a) * Math.cos(e) * d - 200; }
        const sg = new THREE.BufferGeometry(); sg.setAttribute("position", new THREE.BufferAttribute(sp, 3));
        const sm = new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
        S.add(new THREE.Points(sg, sm));
        function render(t) {
          // 3,3 s: a rede começa a cair (prédio a prédio); ~6 s: tudo apagado
          const ap = ease.inOutSine(range(t, 3.3, 6.1));
          const rua = t < 4.9 ? 1 : t < 5.25 ? (Math.sin(t * 60) > 0 ? 0.9 : 0.1) : 0;
          av.set({ janelas: 1, apagao: ap, skyline: ease.inOutSine(range(t, 3.0, 5.6)), luzRua: rua, farois: lerp(0.9, 0.35, range(t, 0, 6.7)), sinal: t < 4.9 ? 1 : 0, sujeira: 0.08 }, t);
          sm.opacity = 0.9 * range(t, 4.8, 6.4);
          const e = ease.inOutSine(range(t, 0, 6.71));
          const [bx, by, bz] = av.BASE.pos, [lx, ly, lz] = av.BASE.look;
          cam.position.set(lerp(bx, 7, e), lerp(by, 24, e), lerp(bz, 72, e));
          cam.lookAt(lerp(lx, 0, e), lerp(ly, 10, e), lerp(lz, -40, e));
          st.sol(0, 0, 80);
          st.draw();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
