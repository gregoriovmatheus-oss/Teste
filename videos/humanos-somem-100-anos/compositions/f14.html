<!-- f14: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f14.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 6.57 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f14-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f14" data-width="1080" data-height="1920">
    <canvas id="f14-canvas" width="1080" height="1920"></canvas>
    <div id="f14-r1" class="rot" style="top: 700px"><span id="f14-r1-in" class="rot-t">Com ou <span class="y">sem a gente</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 6.57;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f14-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f14" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f14-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 4.05 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f14"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f14"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/avenida.js"), import("./assets/lib/blocks/terra.js")
      ]).then(async ([K_, T, A, AVENIDA, TERRA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f14-canvas");

        const st = T.createToyStage(canvas, { fov: 46, ceu: ["#2F4A80", "#F09A5E"], nevoa: [80, 520], corNevoa: "#c99a7c", luz: 0.85 });
        const S = st.scene, cam = st.cam;
        const av = AVENIDA.avenida(S);
        av.set({ racha: 1, mato: 1, hera: 1, sujeira: 0.9, ferrugem: 1, floresta: 1, fenda: 0.8 }, 0);
        // cidade-floresta em volta da avenida (instanciada): prédios cobertos de verde e copas por toda parte
        const rr = mulberry32(1401), o = new THREE.Object3D();
        const cel = [];
        for (let x = -230; x <= 230; x += 22) for (let z = -300; z <= 160; z += 22) { if (Math.abs(x) < 34) continue; cel.push([x + (rr() - 0.5) * 6, z + (rr() - 0.5) * 6]); }
        const pr = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), T.M(0xffffff, 0.9), cel.length); S.add(pr); pr.receiveShadow = true;
        const tops = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 8, 6), T.M(0xffffff, 0.9), cel.length * 3); S.add(tops);
        const NC = 2400, cp = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 8, 6), T.M(0xffffff, 0.85), NC); S.add(cp);
        const pc = [0x9c8f7c, 0xb5afa5, 0x8d8780, 0xa07a5c, 0x7d8480], vc = [0x3f6e2c, 0x4f7f34, 0x5a8a3a, 0x36612a, 0x6a8f3e];
        cel.forEach(([x, z], i) => {
          const w = 8 + rr() * 8, h = 8 + Math.pow(rr(), 1.5) * 45;
          o.position.set(x, h / 2, z); o.rotation.set(0, 0, 0); o.scale.set(w, h, w); o.updateMatrix(); pr.setMatrixAt(i, o.matrix); pr.setColorAt(i, new THREE.Color(pc[i % 5]).multiplyScalar(0.75));
          for (let j = 0; j < 3; j++) { o.position.set(x + (rr() - 0.5) * w * 0.7, h + 0.4, z + (rr() - 0.5) * w * 0.7); o.scale.set(1.5 + rr() * 2.5, 0.8 + rr(), 1.5 + rr() * 2.5); o.updateMatrix(); tops.setMatrixAt(i * 3 + j, o.matrix); tops.setColorAt(i * 3 + j, new THREE.Color(vc[(i + j) % 5])); }
        });
        for (let i = 0; i < NC; i++) {
          const x = (rr() - 0.5) * 520, z = -320 + rr() * 500; if (Math.abs(x) < 15 && z > -100) { o.scale.setScalar(1e-4); } else { const s = 3 + rr() * 4; o.scale.set(s, s * 0.85, s); }
          o.position.set(x, 5 + rr() * 3, z); o.updateMatrix(); cp.setMatrixAt(i, o.matrix); cp.setColorAt(i, new THREE.Color(vc[i % 5]).multiplyScalar(0.8 + rr() * 0.3));
        }
        const aves = T.bando(S, { n: 40, seed: 1402, cor: 0x2a2e34 });
        // ---------- a Terra vista do espaço (o planeta continua) ----------
        const ES = new THREE.Scene(); ES.background = new THREE.Color(0x000000);
        ES.add(TERRA.createCeu({ seed: 14, n: 4000, via: 0.5 }));
        const E = await TERRA.createTerra({ raio: 1 }); ES.add(E.group);
        E.sol.set(1, 0.15, -0.35); E.u.luzes.value = 0.25; E.u.atmo.value = 1.1;
        const cam2 = new THREE.PerspectiveCamera(36, 1080 / 1920, 0.01, 2000);
        st.extraWarm = [{ renderer: st.renderer, scene: ES, camera: cam2 }];
        const T1 = 3.3;
        function render(t) {
          if (t < T1) {
            st.bloom = 0.5;
            av.set({ racha: 1, mato: 1, hera: 1, sujeira: 0.9, ferrugem: 1, floresta: 1, fenda: 0.8 }, t);
            aves.update(t, [-10 + t * 7, 30 + t * 4, 10], [14, 4, 8], 0.4, 0.8);
            const e = ease.inOutSine(range(t, 0, T1));
            cam.position.set(lerp(-2, 8, e), lerp(16, 210, e), lerp(48, 70, e));
            cam.lookAt(0, 0, lerp(-10, -30, e));
            st.sol(0, -20, lerp(70, 220, e));
            st.draw(S, cam, { cor: "#ffffff", a: 0.9 * range(t, T1 - 0.35, T1) });
          } else {
            st.bloom = 0.8;
            const u = t - T1;
            E.aim(-46.6 + u * 4, -23.5 + u * 1.5);
            E.nuv.rotation.y = u * 0.01;
            const e = ease.outCubic(range(u, 0, 3.27));
            cam2.position.set(lerp(0.25, 0.9, e), lerp(-0.15, -0.6, e), lerp(1.5, 4.4, e));
            cam2.lookAt(0, lerp(0.1, 0.2, e), 0);
            st.draw(ES, cam2, { cor: "#ffffff", a: 0.8 * (1 - range(u, 0, 0.45)) });
          }
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
