<!-- f13: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f13.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 3.54 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f13-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f13" data-width="1080" data-height="1920">
    <canvas id="f13-canvas" width="1080" height="1920"></canvas>
    <div id="f13-r1" class="rot" style="top: 700px"><span id="f13-r1-in" class="rot-t">A natureza<br><span class="y">não esperou</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 3.54;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f13-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f13" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f13-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.4 * K);
      tl.to("#f13-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.24 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f13"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f13"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/avenida.js")
      ]).then(async ([K_, T, A, AVENIDA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f13-canvas");

        const st = T.createToyStage(canvas, { fov: 44, ceu: ["#3F5F98", "#F1AB70"], nevoa: [60, 320], corNevoa: "#d6ad86", luz: 0.95 });
        const S = st.scene, cam = st.cam;
        st.bloom = 0.45;
        const av = AVENIDA.avenida(S);
        const off = document.createElement("canvas"); off.width = 1080; off.height = 1920;
        const oc = off.getContext("2d");
        function render(t) {
          const e = ease.inOutSine(range(t, 0, 3.54));
          cam.position.set(lerp(22, -10, e), lerp(30, 24, e), lerp(58, 52, e));
          cam.lookAt(0, 3, lerp(-12, -18, e));
          st.sol(0, 0, 80);
          // antes: cidade limpa, luzes acesas
          av.set({ janelas: 0.6, luzRua: 0.8, farois: 0.5, sinal: 1 }, t);
          st.draw();
          oc.clearRect(0, 0, 1080, 1920); oc.drawImage(canvas, 0, 0);
          // 100 anos depois: a mata toma a avenida
          av.set({ racha: 1, mato: 1, hera: 1, sujeira: 0.9, ferrugem: 1, floresta: 1, fenda: 0.8 }, t);
          st.draw();
          // cortina: o "depois" avança da direita para a esquerda
          const wx = lerp(980, 60, ease.inOutCubic(range(t, 0.25, 3.2)));
          const c = st.ctx;
          c.save(); c.beginPath(); c.rect(0, 0, wx, 1920); c.clip(); c.drawImage(off, 0, 0); c.restore();
          c.save();
          c.fillStyle = "#7cc8ff"; c.shadowColor = "rgba(124,200,255,0.9)"; c.shadowBlur = 18; c.fillRect(wx - 2, 0, 4, 1920);
          c.shadowBlur = 0; c.font = '600 30px "JetBrains Mono", monospace'; c.textBaseline = "middle";
          c.fillStyle = "rgba(10,14,24,0.55)";
          const tagA = "ANTES", tagB = "+100 ANOS";
          const yA = 560;
          if (wx > 200) { c.fillRect(wx - 210, yA - 26, 190, 52); c.fillStyle = "#ffffff"; c.textAlign = "right"; c.fillText(tagA, wx - 36, yA); }
          c.fillStyle = "rgba(10,14,24,0.55)";
          if (wx < 900) { c.fillRect(wx + 20, yA - 26, 250, 52); c.fillStyle = "#7cc8ff"; c.textAlign = "left"; c.fillText(tagB, wx + 36, yA); }
          c.restore();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
