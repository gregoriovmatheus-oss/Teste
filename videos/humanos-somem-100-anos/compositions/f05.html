<!-- f05: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f05.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.19 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f05-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }
.rot-t .selo{display:inline-block;font-family:"Inter",sans-serif;font-weight:800;font-size:128px;line-height:1.05;letter-spacing:0.01em;text-transform:uppercase;background:linear-gradient(180deg,#ffffff 35%,#9fd6ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 16px rgba(0,0,0,0.65))}.rot-t .sp{display:block;font-family:"JetBrains Mono",monospace;font-weight:500;font-size:28px;letter-spacing:0.34em;color:#7cc8ff;margin-bottom:12px;text-transform:uppercase}.rot-t .sl{display:block;width:380px;height:2px;margin:14px auto 0;background:linear-gradient(90deg,rgba(124,200,255,0),#7cc8ff,rgba(124,200,255,0))}
  </style>
  <div id="root" data-composition-id="f05" data-width="1080" data-height="1920">
    <canvas id="f05-canvas" width="1080" height="1920"></canvas>
    <div id="f05-r1" class="rot" style="top: 300px"><span id="f05-r1-in" class="rot-t" style="opacity: 1"><span class="sp">TEMPO SEM HUMANOS</span><span class="selo">ANOS</span><span class="sl"></span></span></div>
    <div id="f05-r2" class="rot" style="top: 700px"><span id="f05-r2-in" class="rot-t"><span class="y">Gelo</span> + <span class="y">calor</span></span></div>
    <div id="f05-r3" class="rot" style="top: 700px"><span id="f05-r3-in" class="rot-t">Mato em <span class="y">cada fresta</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.19;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f05-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f05" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.set("#f05-r1-in", { opacity: 1 }, 0);
      tl.fromTo("#f05-r1-in", { scale: 1 }, { scale: 1.08, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.out" }, 0.2 * K);
      tl.fromTo("#f05-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.85 * K);
      tl.to("#f05-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.6 * K);
      tl.fromTo("#f05-r3-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 3.1 * K);
      tl.to("#f05-r3-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 4.89 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f05"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f05"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/avenida.js")
      ]).then(async ([K_, T, A, AVENIDA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f05-canvas");

        const st = T.createToyStage(canvas, { fov: 48, ceu: ["#8FA9C4", "#E6E2D6"], nevoa: [40, 280], luz: 0.85 });
        const S = st.scene, cam = st.cam;
        const av = AVENIDA.avenida(S);
        const bgInv = S.background, bgVer = T.gradTex("#5E95D0", "#F3DDB2");
        // neve caindo (inverno), some quando chega o calor
        const rn = mulberry32(505), NP = 1400, np = new Float32Array(NP * 3), nv = Array.from({ length: NP }, () => [(rn() - 0.5) * 40, rn() * 30, 10 + rn() * 40, rn() * 6, 1.5 + rn()]);
        const ng = new THREE.BufferGeometry(); ng.setAttribute("position", new THREE.BufferAttribute(np, 3));
        const nm = new THREE.PointsMaterial({ color: 0xffffff, size: 0.16, transparent: true, opacity: 0.9, depthWrite: false });
        const neve = new THREE.Points(ng, nm); neve.frustumCulled = false; S.add(neve);
        function render(t) {
          const inverno = 1 - ease.inOutSine(range(t, 1.3, 2.6));
          const racha = ease.inOutSine(range(t, 1.55, 3.0));
          const mato = ease.outCubic(range(t, 2.95, 5.0));
          av.set({ neve: inverno, racha, mato, sujeira: 0.3, ferrugem: 0.12, hera: 0.08 + mato * 0.12 }, t);
          S.background = inverno > 0.5 ? bgInv : bgVer;
          st.key.intensity = lerp(1.4, 3.0, 1 - inverno); st.key.color.setHex(inverno > 0.5 ? 0xdfe8ff : 0xffd2a0);
          nm.opacity = 0.9 * inverno;
          nv.forEach(([x, y0, z, ph, sp], i) => { np[i * 3] = x + Math.sin(t * 1.3 + ph) * 0.6; np[i * 3 + 1] = ((y0 - t * sp) % 30 + 30) % 30; np[i * 3 + 2] = z; });
          ng.attributes.position.needsUpdate = true;
          // começa rente ao asfalto (vê a rachadura e o broto) e sobe até o enquadramento-base
          const e = ease.inOutCubic(range(t, 0.2, 5.19));
          const [bx, by, bz] = av.BASE.pos, [lx, ly, lz] = av.BASE.look;
          cam.position.set(lerp(0.3, bx, e), lerp(1.5, by, e), lerp(28, bz, e));
          cam.lookAt(lerp(-0.6, lx, e), lerp(0.1, ly, e), lerp(17, lz, e));
          st.sol(0, 15, 60);
          st.draw();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
