<!-- f09: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f09.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 6.21 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f09-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }
    .chip{display:inline-block;font-family:"JetBrains Mono","Menlo",monospace;font-weight:500;font-size:28px;letter-spacing:.14em;line-height:1.1;padding:14px 26px;border-radius:6px;text-shadow:none;text-transform:uppercase;background:rgba(4,8,16,.62);text-align:left}.chip.im{color:#ff8a4c;border:2px solid #ff8a4c}.chip.le{color:#7cc8ff;border:2px solid #7cc8ff}.chip.di{color:#ffd28a;border:2px solid #ffd28a}.chip small{display:block;font-size:20px;color:rgba(255,255,255,.8);letter-spacing:.1em;margin-top:6px}#f09-r3{top:1262px!important;height:110px;left:0;right:0;justify-content:center;align-items:flex-start}

  </style>
  <div id="root" data-composition-id="f09" data-width="1080" data-height="1920">
    <canvas id="f09-canvas" width="1080" height="1920"></canvas>
    <div id="f09-r1" class="rot" style="top: 700px"><span id="f09-r1-in" class="rot-t"><span class="k">OXIGÊNIO NO AR</span><br><span class="y">~21%</span><br>e estável</span></div>
    <div id="f09-r2" class="rot" style="top: 700px"><span id="f09-r2-in" class="rot-t"><span class="k">EM 24 HORAS</span><br>Quase <span class="y">nada muda</span></span></div>
    <div id="f09-r3" class="rot" style="top: 700px"><span id="f09-r3-in" class="rot-t"><span class="chip le">● Lento<small>estoque enorme</small></span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 6.21;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f09-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f09" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f09-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.95 * K);
      tl.to("#f09-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.9 * K);
      tl.fromTo("#f09-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 4.4 * K);
      tl.fromTo("#f09-r3-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.95 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f09"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f09"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/oceano.js"), import("./assets/lib/blocks/terra.js")
      ]).then(async ([K_, T, A, OCEANO, TERRA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f09-canvas");

        const O = OCEANO, G0 = 41.57;
        try { await document.fonts.load('500 26px "JetBrains Mono"'); } catch (e) {}
        const st = T.createToyStage(canvas, { fov: 45, ceu: ["#000000", "#02030a"], nuvens: 0, nevoa: null });
        const S = st.scene, cam = st.cam;
        // Sol logo acima do horizonte: a Terra seca em contraluz, a atmosfera acesa na borda
        const { E } = await O.espacoDoc(st, TERRA, { solDir: [0.42, 0.6, -0.68], solRaio: 5 });
        E.u.seco.value = 1; E.u.nuvens.value = 0.5; E.u.atmo.value = 1.4; st.bloom = 0.85;
        // moléculas do ar: 78% N2 (azul-acinzentado), 21% O2 (vermelho)
        const NM = 340, rr = mulberry32(91), mol = [];
        for (let i = 0; i < NM; i++) mol.push({ p: new THREE.Vector3((rr() - 0.5) * 0.9, (rr() - 0.5) * 1.5, -0.25 - rr() * 0.9), o2: rr() < 0.21, a: rr() * 6.28, f: 0.5 + rr(), ax: new THREE.Vector3(rr() - 0.5, rr() - 0.5, rr() - 0.5).normalize() });
        const mk = (cor, n) => { const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(n * 6), 3));
          const p = new THREE.Points(g, new THREE.PointsMaterial({ color: cor, size: 0.016, map: O.texPonto(), transparent: true, depthWrite: false, opacity: 0.95 })); cam.add(p); return p; };
        S.add(cam);
        const pN = mk(0x8a94a6, NM), pO = mk(0x7cc8ff, NM);
        const off = new THREE.Vector3();
        function render(t) {
          const u = t / D;
          E.aim(lerp(20, 34, u), lerp(-10, -4, u)); E.nuv.rotation.y = t * 0.01;
          cam.position.set(lerp(-0.08, 0.06, u), 0, lerp(1.52, 1.42, ease.inOutSine(u)));
          cam.up.set(0, 1, 0);
          cam.lookAt(cam.position.x * 0.5, lerp(1.13, 1.2, u), cam.position.z - 1);
          const aN = pN.geometry.attributes.position, aO = pO.geometry.attributes.position;
          let iN = 0, iO = 0;
          for (const m of mol) {
            const x = m.p.x + Math.sin(t * m.f + m.a) * 0.03 + t * 0.012, y = m.p.y + Math.cos(t * m.f * 0.8 + m.a) * 0.03, z = m.p.z;
            off.copy(m.ax).multiplyScalar(0.007).applyAxisAngle(new THREE.Vector3(0, 0, 1), t * 3 * m.f);
            const a = m.o2 ? aO : aN, i = m.o2 ? iO++ : iN++;
            a.setXYZ(2 * i, x + off.x, y + off.y, z + off.z); a.setXYZ(2 * i + 1, x - off.x, y - off.y, z - off.z);
          }
          pN.geometry.setDrawRange(0, iN * 2); pO.geometry.setDrawRange(0, iO * 2);
          aN.needsUpdate = aO.needsUpdate = true;
          st.draw();
          const ctx = st.ctx, h = O.horaEm(G0 + t);
          // barra da composição do ar: não muda enquanto o relógio corre
          const a = range(t, 0.8, 1.2);
          if (a > 0) {
            ctx.save(); ctx.globalAlpha = a;
            const X = 70, Y0 = 520, HB = 290, W = 54;
            ctx.fillStyle = "rgba(6,10,18,0.66)"; ctx.beginPath(); ctx.roundRect(X - 18, Y0 - 56, W + 210, HB + 96, 14); ctx.fill();
            ctx.font = '500 19px "JetBrains Mono", monospace'; ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.textBaseline = "middle"; ctx.textAlign = "left";
            ctx.fillText("COMPOSIÇÃO DO AR", X, Y0 - 28);
            const seg = [[0.78, "#5d6676", "N₂ 78%"], [0.21, "#7cc8ff", "O₂ 21%"], [0.01, "#cfcfcf", ""]];
            let y = Y0 + HB;
            for (const [f, c, l] of seg) {
              const hh = f * HB; ctx.fillStyle = c; ctx.fillRect(X, y - hh, W, hh);
              if (l) { ctx.font = l.startsWith("O") ? '600 34px "JetBrains Mono", monospace' : '600 26px "JetBrains Mono", monospace'; ctx.fillStyle = c; ctx.fillText(l, X + W + 16, y - hh / 2); }
              y -= hh;
            }
            ctx.font = '500 19px "JetBrains Mono", monospace'; ctx.fillStyle = "#9fe3a8";
            ctx.fillText("● ESTÁVEL · " + String(Math.floor(h)).padStart(2, "0") + " H", X, Y0 + HB + 22);
            ctx.restore();
          }
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
