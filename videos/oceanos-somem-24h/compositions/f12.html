<!-- f12: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f12.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 4.75 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f12-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f12" data-width="1080" data-height="1920">
    <canvas id="f12-canvas" width="1080" height="1920"></canvas>
    <div id="f12-r1" class="rot" style="top: 700px"><span id="f12-r1-in" class="rot-t"><span class="k">T+24:00</span><br><span class="y">24 horas</span> depois</span></div>
  </div>
  <script>
    (function () {
      const D0 = 4.75;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f12-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f12" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f12-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.1 * K);
      tl.to("#f12-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 1.8 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f12"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f12"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/oceano.js")
      ]).then(async ([K_, T, A, OCEANO]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f12-canvas");

        const O = OCEANO, G0 = 60.55, TC = 2.7;
        try { await document.fonts.load('500 26px "JetBrains Mono"'); } catch (e) {}
        // parte A: a água volta e invade a bacia
        const st = T.createToyStage(canvas, { fov: 50, ceu: ["#4b78ad", "#d9c7a8"], nevoa: [60, 520], corNevoa: "#a9a294", nuvens: 0, exposicao: 1.05 });
        const S = st.scene, cam = st.cam;
        const alt = (x, z) => 3.2 * O.fbm(x * 0.03, z * 0.03, 4, 21) + 1.2 * Math.abs(O.ruido(x * 0.012, z * 0.05, 22)) + Math.max(0, -z - 120) * 0.12;
        S.add(O.terreno({ w: 600, d: 700, sx: 90, sz: 100, cz: -220, alt, cor: (x, z, y, c) => O.mistura(c, 0x6f6152, 0x9a8a72, (y + 2) / 8) }));
        const ag = new THREE.PlaneGeometry(600, 700, 50, 60); ag.rotateX(-Math.PI / 2); ag.translate(0, 0, -220);
        const ap = ag.attributes.position, base = Float32Array.from(ap.array), col = new Float32Array(ap.count * 3);
        const chao = new Float32Array(ap.count); for (let i = 0; i < ap.count; i++) chao[i] = alt(base[i * 3], base[i * 3 + 2]);
        ag.setAttribute("color", new THREE.BufferAttribute(col, 3));
        const agua = new THREE.Mesh(ag, T.TOON({ vertexColors: true, roughness: 0.12, transparent: true, opacity: 0.92, side: THREE.DoubleSide })); agua.material.envMapIntensity = 0.6; S.add(agua);
        const cA = new THREE.Color(0x1a5f7c), cE = new THREE.Color(0xf2efe8), cc = new THREE.Color();
        // parte B: a Terra fica azul de novo
        const st2 = T.createToyStage(canvas, { fov: 36, nuvens: 0, nevoa: null });
        O.espaco(st2, { solDir: [-0.8, 0.35, 0.55] });
        const G = O.globoSeco(st2.scene, {});
        function render(t) {
          if (t < TC) {
            // frente d'água vindo do fundo (-z) e subindo
            const wl = lerp(-4, 12, ease.inQuad(range(t, 0.2, TC))), frente = lerp(-420, 40, ease.inOutSine(range(t, 0, TC)));
            for (let i = 0; i < ap.count; i++) {
              const x = base[i * 3], z = base[i * 3 + 2], dz = z - frente;
              const y = wl + 4 * Math.exp(-((dz / 14) ** 2)) - (dz > 0 ? 30 * smoothstep(0, 25, dz) : 0) + 0.5 * Math.sin(0.2 * z + 0.15 * x - t * 6);
              ap.setY(i, y);
              const pr = y - chao[i], esp = clamp(1 - pr / 0.5) * 0.8 + Math.exp(-((dz / 5) ** 2)) * 0.9;
              cc.copy(cA).lerp(cE, clamp(esp)); col.set([cc.r, cc.g, cc.b], i * 3);
            }
            ap.needsUpdate = true; ag.attributes.color.needsUpdate = true; ag.computeVertexNormals();
            const u = t / TC;
            cam.position.set(lerp(-10, -4, u), lerp(9, 7, u), lerp(30, 18, u));
            cam.lookAt(0, lerp(4, 3, u), -80);
            st.sol(0, -40, 90);
            st.draw();
            const sub = range(t, 2.25, 2.6);
            if (sub > 0) { st.ctx.fillStyle = `rgba(20,90,130,${0.85 * sub})`; st.ctx.fillRect(0, 0, 1080, 1920); }
          } else {
            const u = t - TC;
            G.setAgua(ease.inOutCubic(range(t, 2.85, 4.2)));
            G.aim(lerp(150, 175, u / 2), lerp(8, 2, u / 2));
            const d = lerp(4.2, 6.6, ease.outCubic(range(u, 0, 2.05)));
            st2.cam.position.set(0.3, 0.2, d); st2.cam.lookAt(0, 0.2, 0);
            st2.T = st.T; st2.D = st.D;
            st2.draw(st2.scene, st2.cam, { cor: "#145a82", a: 1 - range(u, 0, 0.35) });
          }
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
