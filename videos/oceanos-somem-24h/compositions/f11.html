<!-- f11: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f11.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.75 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f11-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }
    .chip{display:inline-block;font-family:"JetBrains Mono","Menlo",monospace;font-weight:500;font-size:28px;letter-spacing:.14em;line-height:1.1;padding:14px 26px;border-radius:6px;text-shadow:none;text-transform:uppercase;background:rgba(4,8,16,.62);text-align:left}.chip.im{color:#ff8a4c;border:2px solid #ff8a4c}.chip.le{color:#7cc8ff;border:2px solid #7cc8ff}.chip.di{color:#ffd28a;border:2px solid #ffd28a}.chip small{display:block;font-size:20px;color:rgba(255,255,255,.8);letter-spacing:.1em;margin-top:6px}#f11-r2{top:1262px!important;height:110px;left:0;right:0;justify-content:center;align-items:flex-start}

  </style>
  <div id="root" data-composition-id="f11" data-width="1080" data-height="1920">
    <canvas id="f11-canvas" width="1080" height="1920"></canvas>
    <div id="f11-r1" class="rot" style="top: 700px"><span id="f11-r1-in" class="rot-t"><span class="k">VAPOR NO AR</span><br>Dura <span class="y">~9 dias</span></span></div>
    <div id="f11-r2" class="rot" style="top: 700px"><span id="f11-r2-in" class="rot-t"><span class="chip di">● Em dias<small>a chuva acaba</small></span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.75;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f11-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f11" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f11-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.9 * K);
      tl.to("#f11-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 5.4 * K);
      tl.fromTo("#f11-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.9 * K);
      tl.to("#f11-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 5.4 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f11"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f11"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/oceano.js")
      ]).then(async ([K_, T, A, OCEANO]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f11-canvas");

        const O = OCEANO, G0 = 54.8;
        const st = T.createToyStage(canvas, { fov: 52, ceu: ["#3a4656", "#a59a8a"], nevoa: [40, 340], corNevoa: "#6f6c68", nuvens: 0, exposicao: 1.0, luz: 0.7 });
        const S = st.scene, cam = st.cam;
        const alt = (x, z) => 1.6 * O.fbm(x * 0.04, z * 0.04, 4, 111) + 0.15 * Math.sin(x * 0.6);
        S.add(O.terreno({ w: 400, d: 400, sx: 80, sz: 80, cz: -120, alt, cor: (x, z, y, c) => O.mistura(c, 0x4e463d, 0x8a7c66, (y + 1) / 3) }));
        // poças que refletem o céu
        const poca = T.TOON({ color: 0x5d6a78, roughness: 0.05, metalness: 0.3 }), rr = mulberry32(112);
        for (let i = 0; i < 14; i++) { const x = (rr() - 0.5) * 60, z = 10 - rr() * 80; const m = new THREE.Mesh(new THREE.CircleGeometry(1, 20), poca); m.rotation.x = -Math.PI / 2; m.scale.set(2 + rr() * 5, 1.5 + rr() * 3, 1); m.position.set(x, alt(x, z) + 0.25, z); S.add(m); }
        // nuvens remanescentes (escuras) — não são repostas: encolhem
        const mN = T.TOON({ color: 0x6d737c, roughness: 1, emissive: 0x20242a, emissiveIntensity: 0.3 });
        const nuv = Array.from({ length: 16 }, (_, i) => { const n = T.nuvem(400 + i); n.traverse((o) => { if (o.isMesh) o.material = mN; }); const s = 5 + rr() * 5; n.userData = { s, enc: 0.25 + rr() * 0.5 };
          n.position.set((rr() - 0.5) * 120, 34 + rr() * 22, -20 - rr() * 110); n.scale.setScalar(s); S.add(n); return n; });
        // chuva: segmentos caindo (posição = função de t)
        const NC = 1600, cg = new THREE.BufferGeometry(), cp = new Float32Array(NC * 6), sem = [];
        for (let i = 0; i < NC; i++) sem.push([(rr() - 0.5) * 90, 20 - rr() * 110, rr(), 0.8 + rr() * 0.4]);
        cg.setAttribute("position", new THREE.BufferAttribute(cp, 3));
        const chuva = new THREE.LineSegments(cg, new THREE.LineBasicMaterial({ color: 0xcfd9e6, transparent: true, opacity: 0.55 })); S.add(chuva);
        function render(t) {
          const fim = range(t, 3.6, 5.75);
          for (let i = 0; i < NC; i++) {
            const [x, z, ph, v] = sem[i], H = 40, y = 40 - (((t * v * 1.1 + ph) % 1) * H);
            cp.set([x, y, z, x - 0.15, y - 1.6, z], i * 6);
          }
          cg.attributes.position.needsUpdate = true;
          cg.setDrawRange(0, Math.floor(NC * (1 - 0.6 * fim)) * 2);
          nuv.forEach((n, i) => n.scale.setScalar(n.userData.s * (1 - n.userData.enc * ease.inOutSine(range(t, 1.5, 5.75)))));
          st.hemi.intensity = 0.4 + 0.3 * fim; st.key.intensity = 1.4 + 1.6 * fim;
          const u = t / D, e = ease.inOutSine(u);
          cam.position.set(lerp(-4, 3, u), lerp(2.2, 9, e), lerp(24, 16, u));
          cam.lookAt(lerp(0, 2, u), lerp(8, 34, e), -40);
          st.sol(0, -20, 80);
          st.draw();
          // gotas grossas perto da lente (2D)
          const ctx = st.ctx, r = mulberry32(113);
          ctx.save(); ctx.strokeStyle = "rgba(220,230,240,0.35)"; ctx.lineCap = "round";
          for (let i = 0; i < 70 * (1 - 0.6 * fim); i++) { const x = r() * 1080, sp = 2200 + r() * 1200, ph = r(), y = ((t * sp / 1920 + ph) % 1) * 2100 - 100; ctx.lineWidth = 1.5 + r() * 2.5; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 8, y + 70 + r() * 60); ctx.stroke(); }
          ctx.restore();
          O.etiqueta(ctx, cam, nuv[3].position, "NUVENS SEM REPOSIÇÃO", { dx: -60, dy: 160, tam: 24, a: range(t, 3.8, 4.2) });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
