<!-- f05: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f05.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 6.81 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f05-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }

  </style>
  <div id="root" data-composition-id="f05" data-width="1080" data-height="1920">
    <canvas id="f05-canvas" width="1080" height="1920"></canvas>

  </div>
  <script>
    (function () {
      const D0 = 6.81;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f05-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f05" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });

      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f05"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f05"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/relogio.js")
      ]).then(async ([K_, T, A, RELOGIO]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f05-canvas");

const R = RELOGIO;
await R.prepara();
const st = R.palcoDoc(T, canvas, { fov: 34 });
const S = st.scene, cam = st.cam;
// idade em que as pessoas morrem (0–100 anos): poucas cedo, o pico perto dos 80; a medicina só lê chances nessa curva
const N = 101, W = 0.03, geo = new THREE.BoxGeometry(W * 0.78, 1, W * 0.78);
const m = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x7cc8ff, emissiveIntensity: 0.55, roughness: 0.35 });
const im = new THREE.InstancedMesh(geo, m, N); im.frustumCulled = false; S.add(im);
const g = (a) => Math.exp((a - 84) / 9) * Math.exp(-Math.exp((a - 84) / 9));
const dist = (a) => (a === 0 ? 0.22 : 0.012 + (a < 40 ? 0.004 * a / 40 : 0)) * 0.6 + 2.3 * g(a), x0 = -N * W / 2;
const o = new THREE.Object3D(), cor = new THREE.Color(), azul = new THREE.Color(0x9fd6ff), lar = new THREE.Color(0xff8a4c);
const marca = new THREE.Mesh(new THREE.BoxGeometry(0.012, 1, 0.012), new THREE.MeshBasicMaterial({ color: 0xff8a4c })); S.add(marca);
const ponto = R.brilho(0xff8a4c, 0.4, "suave", 0); S.add(ponto);
const al = new THREE.Vector3(), v = new THREE.Vector3(), XM = x0 + 76.5 * W;
for (let i = 0; i < N; i++) im.setColorAt(i, azul);
function render(t) {
  for (let i = 0; i < N; i++) { const k = ease.outCubic(range(t, 0.3 + i * 0.016, 0.9 + i * 0.016)), hh = Math.max(0.001, dist(i) * k);
    o.position.set(x0 + (i + 0.5) * W, hh / 2, 0); o.scale.set(1, hh, 1); o.updateMatrix(); im.setMatrixAt(i, o.matrix);
    im.setColorAt(i, cor.copy(azul).lerp(lar, Math.abs(i - 76) < 1 ? range(t, 5.35, 5.7) : 0)); }
  im.instanceMatrix.needsUpdate = true; im.instanceColor.needsUpdate = true;
  const km = ease.outCubic(range(t, 5.35, 5.9)); marca.scale.y = Math.max(0.001, 1.25 * km); marca.position.set(XM, 0.625 * km, 0.02); marca.visible = km > 0;
  ponto.position.set(XM, 1.25 * km, 0.02); ponto.material.opacity = km;
  const e = ease.inOutSine(range(t, 0, 6.81));
  cam.position.set(lerp(-1.3, 0.85, e), lerp(0.5, 0.75, e), lerp(2.0, 3.3, e)); al.set(lerp(-1.2, 0.8, e), lerp(0.2, 0.25, e), 0); cam.lookAt(al);
  st.bloom = 0.8; st.draw();
  const c = st.ctx;
  R.txt(c, "IDADE AO MORRER · CHANCES", 540, 700, { tam: 26, cor: R.AZUL, a: range(t, 0.52, 0.8), esp: 0.26 });
  R.txt(c, "SÓ ESTIMA CHANCES", 540, 985, { tam: 32, cor: "#fff", a: range(t, 1.72, 2.0) * (1 - range(t, 2.7, 2.85)), esp: 0.22 });
  R.tag(c, "0 ANOS", v.set(x0 + 0.5 * W, 0.02, 0), cam, range(t, 0.6, 0.9) * (1 - range(t, 2.7, 2.9)), { dy: 120, tam: 20, cor: "#9aa4b0" });
  R.txt(c, "BRASIL · EXPECTATIVA DE VIDA", 540, 985, { tam: 28, cor: R.AZUL, a: range(t, 3.04, 3.3), esp: 0.2 });
  R.numero(c, "76 ANOS", 300, 690, range(t, 5.35, 5.6), { tam: 92, cor: "#ff8a4c" });
}

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
