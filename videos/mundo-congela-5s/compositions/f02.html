<template>
  <style>
    @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 600; font-display: block; src: url("assets/fonts/montserrat-latin-600-normal.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; overflow: hidden; background: #d7e6f2; }
    #f02-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #f02-pulse { position: absolute; inset: 0; opacity: 0;
      background: radial-gradient(ellipse at 50% 50%, rgba(216, 67, 47, 0) 45%, rgba(216, 67, 47, 0.38) 100%); }
    #f02-heart { position: absolute; left: 480px; top: 880px; width: 150px; height: 140px; opacity: 0; }
    #f02-heart svg { display: block; width: 150px; height: 140px; overflow: visible; }
    #f02-mute { position: absolute; left: 700px; top: 700px; width: 190px; opacity: 0;
      font-family: "Montserrat", sans-serif; font-weight: 600; font-size: 30px; letter-spacing: 0.2em; color: #ffffff;
      text-shadow: 0 2px 14px rgba(4, 10, 20, 0.7); text-align: center; }
    #f02-mute .db { display: block; font-size: 64px; letter-spacing: 0.02em; color: #8fcbf2; }
  </style>
  <div id="root" data-composition-id="f02" data-width="1080" data-height="1920">
    <canvas id="f02-canvas" width="1080" height="1920"></canvas>
    <div id="f02-pulse" data-layout-ignore></div>
    <div id="f02-mute" class="clip" data-start="3.6" data-duration="2.5"><span class="db">0 dB</span>SEM SOM</div>
    <div id="f02-heart" class="clip" data-start="6.1" data-duration="2.07" data-layout-ignore>
      <svg viewBox="-75 -70 150 140">
        <path d="M0 52 C-30 30 -66 8 -66 -22 C-66 -48 -42 -62 -22 -58 C-10 -56 -3 -48 0 -40 C3 -48 10 -56 22 -58 C42 -62 66 -48 66 -22 C66 8 30 30 0 52 Z"
          fill="rgba(216,67,47,0.14)" stroke="#D8432F" stroke-width="6" stroke-linejoin="round"
          style="filter: drop-shadow(0 0 10px rgba(216,67,47,0.85));" />
        <path d="M-58 -6 L-28 -6 L-18 -26 L-6 18 L6 -14 L14 -6 L58 -6" fill="none" stroke="#ffffff" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
  </div>
  <script>
    (function () {
      /* ---------- 2D layers (GSAP) ---------- */
      const tl = gsap.timeline({ paused: true });
      // faint heartbeat pulses at the first coracao.mp3 (abs 8.8 → local 3.5; beats +0, +0.28, +1.84, +2.11)
      [3.5, 3.78, 5.34, 5.61].forEach((b, i) => {
        tl.fromTo("#f02-pulse", { opacity: 0 }, { opacity: i % 2 ? 0.35 : 0.55, duration: 0.07, ease: "power2.out", immediateRender: false }, b);
        tl.to("#f02-pulse", { opacity: 0, duration: 0.22, ease: "power2.in" }, b + 0.08);
      });
      tl.fromTo("#f02-mute", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 3.6);
      tl.to("#f02-mute", { opacity: 0, duration: 0.25, ease: "power2.in" }, 5.85);
      // heart: second coracao.mp3 at local 6.2 (beats 6.2, 6.48; first file's tail 6.55, 6.85; then 8.04)
      tl.fromTo("#f02-heart", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out" }, 6.1);
      [6.2, 6.48, 6.85, 7.37, 8.04].forEach((b, i) => {
        const s = i === 1 ? 1.12 : 1.25;
        tl.to("#f02-heart", { scale: s, duration: 0.08, ease: "power2.out" }, b);
        tl.to("#f02-heart", { scale: 1, duration: 0.2, ease: "power2.in" }, b + 0.09);
        tl.fromTo("#f02-pulse", { opacity: 0 }, { opacity: 0.6, duration: 0.07, ease: "power2.out", immediateRender: false }, b);
        tl.to("#f02-pulse", { opacity: 0, duration: 0.25, ease: "power2.in" }, b + 0.08);
      });
      tl.set({}, {}, 8.17);
      window.__timelines = window.__timelines || {};
      window.__timelines["f02"] = tl;

      /* ---------- 3D (Three.js via kit) ---------- */
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f02"] = import("./assets/lib/kit.js").then(async (K) => {
        const { THREE, PALETTE, ease, range, lerp, clamp, mulberry32 } = K;
        const canvas = document.getElementById("f02-canvas");
        const renderer = K.createRenderer(canvas);
        const M = K.maqueteMaterial;

        const scene = new THREE.Scene();
        const skyCol = new THREE.Color(0xbfd0df);
        scene.background = skyCol;
        scene.fog = new THREE.Fog(0xbfd0df, 22, 60);
        const lights = K.addMaqueteLights(scene, { intensity: 1, target: [0, 0, 0], shadowSize: 14 });
        lights.key.position.set(-9, 16, 8);
        lights.key.shadow.camera.far = 60;
        lights.key.color.set(0xffe6c8);
        const cam = new THREE.PerspectiveCamera(35, K.W / K.H, 0.05, 200);
        const world = new THREE.Group();
        scene.add(world);
        const box = new THREE.BoxGeometry(1, 1, 1);
        const add = (mat, sx, sy, sz, x, y, z, shadow = true) => {
          const m = new THREE.Mesh(box, mat);
          m.scale.set(sx, sy, sz);
          m.position.set(x, y, z);
          m.castShadow = shadow; m.receiveShadow = true;
          world.add(m);
          return m;
        };

        // street: road (z > 2.2), curb, sidewalk, building row behind
        const road = M(PALETTE.road, { roughness: 0.95 }); road.userData.frostMax = 0.45;
        const walk = M(0xa7afb9, { roughness: 0.9 });
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), road);
        ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; world.add(ground);
        add(walk, 60, 0.16, 5, 0, 0.08, -0.3, false);
        add(M(0xc7ccd3), 60, 0.2, 0.25, 0, 0.1, 2.25, false);
        const tones = [0xd9dde2, 0xc7ccd3, 0xb6bdc6, 0xe6e3dc, 0xa9b1bb];
        const rb = mulberry32(31);
        for (let x = -30; x < 30;) {
          const w = 5 + rb() * 4, h = 6 + rb() * 10;
          add(M(tones[Math.floor(rb() * tones.length)], { roughness: 0.85 }), w - 0.3, h, 6, x + w / 2, h / 2, -6);
          add(M(0x3d4450, { roughness: 0.7 }), w - 1.4, 2.4, 0.1, x + w / 2, 1.4, -2.95, false); // storefront glass
          x += w;
        }
        // lamp + speaker on a pole
        const metal = M(0x5b636e, { roughness: 0.6 });
        add(metal, 0.12, 3.4, 0.12, 3.2, 1.7, 1.6);
        const SPK = new THREE.Vector3(3.0, 2.95, 1.55);
        const spk = add(M(0x2c323b, { roughness: 0.65 }), 0.5, 0.7, 0.42, SPK.x, SPK.y, SPK.z);
        spk.rotation.y = -0.5;
        const cone = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.2, 0.06, 20), M(0x8d96a2, { roughness: 0.6 }));
        cone.rotation.z = Math.PI / 2; cone.position.set(-0.26, 0.05, 0); spk.add(cone);
        // bench + parked car for scale
        add(M(0x7f6a55), 1.6, 0.08, 0.45, -2.6, 0.5, -1.4); add(metal, 0.08, 0.42, 0.4, -3.3, 0.29, -1.4); add(metal, 0.08, 0.42, 0.4, -1.9, 0.29, -1.4);
        add(M(0x3d4450, { roughness: 0.6 }), 4.2, 0.85, 1.9, -4.5, 0.62, 3.6);
        add(M(0x3d4450, { roughness: 0.6 }), 2.3, 0.65, 1.7, -4.7, 1.35, 3.6);

        // person (faces +z), coat in accent so it reads through the frost
        const person = new THREE.Group();
        person.position.set(0, 0.16, 0.6);
        world.add(person);
        const coat = M(PALETTE.accent, { roughness: 0.75 }); coat.userData.frostMax = 0.3;
        const pants = M(0x3d4450, { roughness: 0.8 }); pants.userData.frostMax = 0.4;
        const skin = M(0xd9b49a, { roughness: 0.8 }); skin.userData.frostMax = 0.35;
        const pp = (mat, sx, sy, sz, x, y, z) => {
          const m = new THREE.Mesh(box, mat); m.scale.set(sx, sy, sz); m.position.set(x, y, z);
          m.castShadow = m.receiveShadow = true; person.add(m); return m;
        };
        pp(pants, 0.15, 0.82, 0.18, -0.1, 0.41, 0); pp(pants, 0.15, 0.82, 0.18, 0.1, 0.41, 0);
        pp(pants, 0.17, 0.08, 0.28, -0.1, 0.04, 0.04); pp(pants, 0.17, 0.08, 0.28, 0.1, 0.04, 0.04);
        pp(coat, 0.44, 0.66, 0.26, 0, 1.12, 0);
        pp(coat, 0.11, 0.6, 0.13, -0.28, 1.12, 0); pp(coat, 0.11, 0.6, 0.13, 0.28, 1.12, 0);
        pp(skin, 0.1, 0.1, 0.11, -0.28, 0.77, 0); pp(skin, 0.1, 0.1, 0.11, 0.28, 0.77, 0);
        pp(skin, 0.1, 0.08, 0.1, 0, 1.48, 0);
        const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.13, 1), skin);
        head.scale.set(1, 1.15, 1); head.position.set(0, 1.64, 0); head.castShadow = true; person.add(head);
        const dark = M(0x1e232b, { roughness: 0.8 }); dark.userData.frostMax = 0.1;
        pp(dark, 0.27, 0.07, 0.27, 0, 1.77, -0.01); // cap
        pp(dark, 0.035, 0.035, 0.02, -0.045, 1.66, 0.125); pp(dark, 0.035, 0.035, 0.02, 0.045, 1.66, 0.125); // eyes
        const CHEST = new THREE.Vector3(0.05, 0.16 + 1.22, 0.6 + 0.13);

        // frozen sound waves: arcs in the (dir, up) plane, built from instanced segments
        const dir = new THREE.Vector3(-1, -0.18, 0.05).normalize();
        const up = new THREE.Vector3(0, 1, 0).addScaledVector(dir, -dir.y).normalize();
        const SEG = 26, RINGS = 5, ARC = 0.75;
        const segGeo = new THREE.BoxGeometry(1, 1, 1);
        const waveMat = new THREE.MeshStandardMaterial({ color: PALETTE.ice, roughness: 0.5, emissive: 0x5a9cc8, emissiveIntensity: 0.55 });
        const waves = new THREE.InstancedMesh(segGeo, waveMat, SEG * RINGS);
        world.add(waves);
        const rw = mulberry32(77);
        const segs = [];
        const Yax = new THREE.Vector3(0, 1, 0);
        for (let i = 0; i < RINGS; i++) {
          const r = 0.45 + i * 0.42;
          for (let k = 0; k < SEG; k++) {
            const a = -ARC + (2 * ARC * (k + 0.5)) / SEG;
            const p = SPK.clone().addScaledVector(dir, 0.2 + r * Math.cos(a)).addScaledVector(up, r * Math.sin(a));
            const tan = up.clone().multiplyScalar(Math.cos(a)).addScaledVector(dir, -Math.sin(a)).normalize();
            const q = new THREE.Quaternion().setFromUnitVectors(Yax, tan);
            segs.push({
              p, q, len: (2 * ARC * r) / SEG * 1.02, ring: i,
              drift: new THREE.Vector3(rw() - 0.5, -0.2 - rw() * 0.3, rw() - 0.5),
              spin: new THREE.Vector3(rw() * 6 - 3, rw() * 6 - 3, rw() * 6 - 3), delay: rw() * 0.35,
            });
          }
        }
        const mtx = new THREE.Matrix4(), qq = new THREE.Quaternion(), ee = new THREE.Euler(), vp = new THREE.Vector3(), vs = new THREE.Vector3();
        function drawWaves(t) {
          segs.forEach((s, idx) => {
            const t0 = 3.45 + s.ring * 0.14 + s.delay;
            const p = range(t, t0, t0 + 1.7);
            const crack = range(t, 3.2, 3.5) * 0.04;          // a shiver just before it breaks
            vp.copy(s.p).addScaledVector(s.drift, p * 1.4);
            vp.y -= 1.6 * p * p + crack * Math.sin(idx * 1.7);
            ee.set(s.spin.x * p, s.spin.y * p, s.spin.z * p);
            qq.setFromEuler(ee).multiply(s.q);
            const sc = 1 - ease.inQuad(p);
            const brk = p > 0 ? 0.55 : 1;                       // segments separate into shards
            vs.set(0.045 * sc + 0.0001, s.len * sc * brk + 0.0001, 0.045 * sc + 0.0001);
            mtx.compose(vp, qq, vs);
            waves.setMatrixAt(idx, mtx);
          });
          waves.instanceMatrix.needsUpdate = true;
        }

        K.setFrost(world, 0.85);
        renderer.toneMappingExposure = 0.98;

        /* ---------- shots (local seconds) ---------- */
        const look = new THREE.Vector3();
        function shot(t) {
          if (t < 2.6) {            // A: wide frozen sidewalk, slow dolly in ("Zero absoluto… volta ao normal")
            const p = ease.inOutSine(t / 2.6);
            cam.position.set(lerp(-4.6, -3.4, p), lerp(2.3, 2.1, p), lerp(14.5, 12.0, p));
            look.set(lerp(1.3, 1.4, p), lerp(1.7, 1.6, p), 0.8);
          } else if (t < 4.5) {     // B: speaker + frozen waves; they shatter on "silêncio"
            const p = ease.inOutSine(range(t, 2.6, 4.5));
            cam.position.set(lerp(5.4, 4.6, p), lerp(2.9, 2.8, p), lerp(9.8, 8.6, p));
            look.set(lerp(2.0, 1.8, p), lerp(2.5, 2.35, p), 1.3);
          } else if (t < 6.1) {     // C: track from the speaker toward the person through falling shards
            const p = ease.inOutCubic(range(t, 4.5, 6.1));
            cam.position.set(lerp(3.2, 1.6, p), lerp(2.3, 1.8, p), lerp(6.0, 5.0, p));
            look.set(lerp(1.4, 0.3, p), lerp(1.7, 1.45, p), lerp(1.2, 0.7, p));
          } else {                  // D: close on the chest, heart line-art over it
            const p = ease.outCubic(range(t, 6.1, 8.17));
            const d = lerp(4.3, 3.6, p);
            cam.position.set(CHEST.x + 0.35 - 0.2 * p, CHEST.y + 0.05, CHEST.z + d);
            look.copy(CHEST);
          }
          cam.lookAt(look);
        }
        function render(t) {
          shot(t);
          drawWaves(t);
          renderer.render(scene, cam);
        }
        await renderer.compileAsync(scene, cam);
        // kit.sceneStart() returns 0 for this host at render time, so fall back to the host's data-start
        const kOff = K.sceneStart(canvas);
        const hostEl = document.querySelector('[data-composition-src="compositions/f02.html"][data-start]');
        const off = kOff || (hostEl ? parseFloat(hostEl.getAttribute("data-start")) : 5.3) || 5.3;
        await K.bindSeek(canvas, (t) => render(Math.max(0, t + kOff - off)));
        const gl = renderer.getContext();
        gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));
      });
    })();
  </script>
</template>
