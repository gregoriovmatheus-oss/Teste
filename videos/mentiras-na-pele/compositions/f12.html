<!-- f12: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f12.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 4.56 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f12-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f12" data-width="1080" data-height="1920">
    <canvas id="f12-canvas" width="1080" height="1920"></canvas>

  </div>
  <script>
    (function () {
      const D0 = 4.56;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f12-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f12" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });

      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f12"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f12"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/pele.js")
      ]).then(async ([K_, T, A, PELE]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f12-canvas");

        await PELE.fontes();
        const st = T.createToyStage(canvas, { fov: 38, ceu: ["#2a3a5c", "#d89a70"], nevoa: [16, 80], corNevoa: "#6f5a5a", luz: 0.8 });
        const S = st.scene, cam = st.cam;
        const praca = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), T.M(0x9a8f82, 0.85)); praca.rotation.x = -Math.PI / 2; praca.receiveShadow = true; S.add(praca);
        const linha = new THREE.Mesh(new THREE.PlaneGeometry(0.08, 40), new THREE.MeshBasicMaterial({ color: 0x7cc8ff, transparent: true, opacity: 0.6, toneMapped: false })); linha.rotation.x = -Math.PI / 2; linha.position.set(0, 0.01, -8); S.add(linha);
        for (let i = 0; i < 6; i++) { const b = T.predio({ w: 8, d: 8, h: 14 + (i * 7) % 12, seed: 1200 + i }); b.position.set(-22 + i * 9, 0, -26 - (i % 2) * 4); S.add(b); }
        // à esquerda: pele limpa, à vista; à direita: casacos, capuzes e marcas escapando
        const R = mulberry32(1212), pa = [], pb = [];
        for (let i = 0; i < 22; i++) pa.push([-1.2 - R() * 7, 2 - R() * 14, 0.4 + (R() - 0.5) * 0.8]);
        for (let i = 0; i < 22; i++) pb.push([1.2 + R() * 7, 2 - R() * 14, -0.4 + (R() - 0.5) * 0.8]);
        const Ah = PELE.multidao(S, { pos: pa, seed: 1213 });
        const Bc = PELE.multidao(S, { pos: pb, seed: 1214, casaco: true });
        pb.forEach((p, i) => Bc.marca(i, 0.55 + 0.4 * R()));
        const quente = PELE.brilho(0xffd6a0, 22, "suave", 0.18); quente.position.set(-5, 3, -6); S.add(quente);
        function render(t) {
          Ah.update(t); Bc.update(t); Bc.pele.u.uBri.value = 1.4;
          // dolly lateral: das pessoas honestas para as que se cobrem
          const e = ease.inOutSine(range(t, 1.9, 4.2));
          cam.position.set(lerp(-6.5, 6.0, e) + t * 0.15, lerp(2.4, 2.1, e), lerp(7.5, 6.5, e) - t * 0.2 + Math.sin(e * Math.PI) * 1.5);
          cam.lookAt(lerp(-4.2, 4.6, e), 1.2, -4);
          st.sol(lerp(-4, 4, e), -4, 14);
          st.bloom = 0.45;
          st.draw();
          const c = st.ctx;
          PELE.txt(c, "HONESTAS", 540, 600, { tam: 56, cor: PELE.AZUL, a: PELE.fade(t, 2.1, 3.0, 0.2), esp: 0.16 });
          PELE.txt(c, "COBERTAS", 540, 600, { tam: 56, cor: PELE.LARANJA, a: PELE.fade(t, 3.93, 9, 0.2), esp: 0.16 });
          PELE.txt(c, "PELE À VISTA", 540, 670, { tam: 26, cor: "#e8eef5", a: PELE.fade(t, 2.2, 3.0, 0.2) });
          PELE.txt(c, "MARCAS ESCONDIDAS", 540, 670, { tam: 26, cor: "#e8eef5", a: PELE.fade(t, 4.0, 9, 0.2) });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
