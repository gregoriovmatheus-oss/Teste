<!-- f13: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f13.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 7.07 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f13-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f13" data-width="1080" data-height="1920">
    <canvas id="f13-canvas" width="1080" height="1920"></canvas>
    <div id="f13-r1" class="rot" style="top: 470px"><span id="f13-r1-in" class="rot-t">Uma pele que<br><span class="y">não mente</span></span></div>
    <div id="f13-r2" class="rot" style="top: 470px"><span id="f13-r2-in" class="rot-t">Você teria coragem<br>de <span class="y">mostrar a sua?</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 7.07;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f13-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f13" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f13-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.3 * K);
      tl.to("#f13-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.95 * K);
      tl.fromTo("#f13-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 3.48 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f13"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f13"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/pele.js")
      ]).then(async ([K_, T, A, PELE]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f13-canvas");

        await PELE.fontes();
        const st = T.createToyStage(canvas, { fov: 30, ceu: ["#0d0909", "#2a1a13"], nevoa: null, nuvens: 0, luz: 0.8, exposicao: 1.05 });
        const S = st.scene, cam = st.cam;
        st.rim.color.set(0x8fc4ff); st.rim.intensity = 1.8; st.hemi.intensity = 0.35;
        const parede = new THREE.Mesh(new THREE.PlaneGeometry(400, 300), T.M(0x2a1d17, 0.95)); parede.position.set(0, 0, -90); S.add(parede);
        PELE.bokeh(S, { n: 30, seed: 11, centro: [-8, 6, -60], area: [90, 70, 20], tam: [5, 13], op: 0.32 });
        // 1) de volta ao braço com o presente (a mesma imagem da abertura, agora tomada pela marca)
        const B = PELE.bracoClose({ pele: 0xd39a72, manga: 0x4d5b6c, papel: 0x8a1f2c });
        B.group.rotation.set(0.25, -0.35, 0.62); B.group.position.set(1.5, -2.5, 0); S.add(B.group);
        B.pele.marca(0, B.PULSO, 4.9);
        // 2) a pessoa inteira, segurando o presente, vira e olha para a câmera
        const sala = new THREE.Group(); sala.position.set(200, 0, 0); S.add(sala);
        const piso = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), T.M(0x3a2a20, 0.55)); piso.rotation.x = -Math.PI / 2; piso.receiveShadow = true; sala.add(piso);
        const bk = PELE.bokeh(sala, { n: 24, seed: 131, centro: [0, 2.5, -9], area: [14, 5, 3], tam: [0.6, 1.6], op: 0.35 });
        const P = PELE.corpo({ cor: 0x4d5b6c, cor2: 0x2c3550, cabelo: 0x2a1d16, pele: 0xd39a72, esc: 14 });
        sala.add(P.group); P.group.rotation.y = -0.9;
        const pres = new THREE.Mesh(T.roundBox(0.24, 0.2, 0.24, 0.02), T.M(0x8a1f2c, 0.6)); pres.position.set(0, -0.4, 0.1); P.arms[0].el.add(pres);
        const fita = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.21, 0.04), T.M(0xd8b25a, 0.3, { metalness: 0.6 })); fita.position.set(0, -0.4 + 0.1, 0.1); P.arms[0].el.add(fita);
        const TC = 3.0, v = new THREE.Vector3();
        function render(t) {
          B.pele.u.uBri.value = 1.1; B.update(t);
          P.pele.marca(0, P.PONTOS.pulsoE, 0.16); P.pele.marca(1, [0.24, 1.15, 0.05], 0.1 + 0.05 * range(t, 4, 7));
          P.pele.u.uBri.value = 1.3; P.pele.marca(2, P.PONTOS.pescoco, 0.07 * ease.outCubic(range(t, 4.2, 5.2)));
          sala.updateMatrixWorld(true);
          // cabeça vira para a câmera em "Você teria coragem" (3,48 s)
          const camA = lerp(0.15, 0.05, range(t, TC, 7.07));
          const olha = ease.inOutCubic(range(t, 3.4, 4.3));
          P.pose(t, { bracoE: [0.45, 1.25, 0.1], cabeca: [lerp(-0.6, 0.65 + camA, olha), lerp(-0.15, 0.02, olha)], tronco: 0.25 * olha });
          st.vel = 0.6 * Math.max(0, 1 - Math.abs(t - TC) / 0.22); st.velT = t;
          if (t < TC) {
            v.set(...B.PULSO); B.group.localToWorld(v);
            const e = ease.inOutSine(range(t, 0, TC)), a = lerp(0.35, -0.1, e), R = lerp(16, 21, e);
            cam.position.set(v.x + Math.sin(a) * R, v.y + lerp(3.5, 6, e), v.z + Math.cos(a) * R);
            cam.lookAt(v.x - 1.5, v.y + 0.5, v.z);
            st.sol(0, 0, 18);
          } else {
            // dolly-in lento até o rosto que encara a câmera
            const e = ease.inOutSine(range(t, TC, 7.07)), R = lerp(3.4, 1.55, e);
            cam.position.set(200 + Math.sin(camA) * R, lerp(1.6, 1.8, e), Math.cos(camA) * R);
            cam.lookAt(200 + lerp(0.1, 0.02, e), lerp(1.55, 1.88, e), 0);
            st.sol(200, 0, 4);
          }
          st.bloom = 0.6;
          st.draw(S, cam, { cor: "#0b0a12", a: range(t, 6.55, 7.07) * 0.6 });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
