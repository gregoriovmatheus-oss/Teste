<!-- f02: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f02.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 7.73 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f02-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f02" data-width="1080" data-height="1920">
    <canvas id="f02-canvas" width="1080" height="1920"></canvas>
    <div id="f02-r1" class="rot" style="top: 470px"><span id="f02-r1-in" class="rot-t"><span class="k">NESTE MUNDO</span><br>Cada mentira, <span class="y">uma marca</span></span></div>
    <div id="f02-r2" class="rot" style="top: 470px"><span id="f02-r2-in" class="rot-t">Mentira grande:<br><span class="y">o corpo inteiro</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 7.73;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f02-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f02" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f02-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.8 * K);
      tl.to("#f02-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.65 * K);
      tl.fromTo("#f02-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 5.47 * K);
      tl.to("#f02-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 7.43 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f02"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f02"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/pele.js")
      ]).then(async ([K_, T, A, PELE]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f02-canvas");

        await PELE.fontes();
        const st = T.createToyStage(canvas, { fov: 34, ceu: ["#07090e", "#1a2230"], nevoa: [14, 60], corNevoa: "#0d1118", nuvens: 0, luz: 0.85 });
        const S = st.scene, cam = st.cam;
        st.rim.color.set(0x8fc4ff); st.rim.intensity = 2.2; st.hemi.intensity = 0.3;
        const E = PELE.estudio(S, { raio: 1.4 });
        E.poca.position.set(0, 1.1, -1.4); E.poca.scale.setScalar(5);
        const P = PELE.corpo({ cor: 0xe8e2d4, cor2: 0x2c3550, cabelo: 0x2a1d16, pele: 0xd6a07a, esc: 13 });
        S.add(P.group);
        const PT = P.PONTOS;
        // mentiras pequenas: marcas discretas (pulso, pescoço, mão) — ditas em 3,6 / 4,2 / 4,6 s
        const peq = [[PT.pulsoE, 3.59, "PEQUENA"], [PT.pescoco, 4.16, ""], [PT.maoD, 4.62, ""]];
        const v = new THREE.Vector3();
        function render(t) {
          P.pose(t, { cabeca: [Math.sin(t * 0.4) * 0.15, -0.05] });
          peq.forEach(([p, t0], i) => P.pele.marca(i, p, 0.075 * ease.outCubic(range(t, t0, t0 + 0.6))));
          // mentira grande (5,5 s): a mancha nasce no peito e toma o corpo inteiro até 7,0 s
          const g = range(t, 5.47, 7.3);
          P.pele.marca(3, PT.peito, g <= 0 ? 0 : 0.05 + 1.6 * ease.inOutSine(g));
          P.pele.u.uBri.value = 0.9 + 0.8 * Math.sin(Math.PI * range(t, 5.4, 7.0));
          P.pose(t, { cabeca: [Math.sin(t * 0.4) * 0.15, -0.05] });
          // órbita contínua; acelera e sobe quando o corpo é tomado
          const a = -0.5 + t * 0.16 + 1.4 * ease.inOutSine(range(t, 5.2, 7.73));
          const R = lerp(5.4, 3.6, ease.inOutSine(range(t, 0, 5.2))) + 0.8 * ease.inOutSine(range(t, 5.2, 7.73));
          cam.position.set(Math.sin(a) * R, lerp(1.5, 1.25, range(t, 0, 5)) + 0.9 * ease.inOutSine(range(t, 5.4, 7.73)), Math.cos(a) * R);
          cam.lookAt(0, lerp(1.55, 1.45, range(t, 0, 5)) - 0.35 * ease.inOutSine(range(t, 5.4, 7.73)), 0);
          st.sol(0, 0, 4);
          st.bloom = 0.5 + 0.35 * g;
          st.vel = 0.25 * Math.sin(Math.PI * range(t, 5.4, 6.4)); st.velT = t;
          st.draw();
          const c = st.ctx;
          peq.forEach(([p, t0, s], i) => {
            v.set(...p); P.group.localToWorld(v);
            const [x, y] = PELE.proj(v, cam);
            const a2 = range(t, t0, t0 + 0.4) * (1 - range(t, 5.2, 5.5));
            PELE.tag(c, x, y, x + (i === 0 ? -190 : i === 1 ? -150 : 170), y - 90 - i * 30, i === 0 ? "MENTIRA PEQUENA" : "", { cor: PELE.LARANJA, a: a2, tam: 26 });
          });
          PELE.txt(c, "MARCAS DISCRETAS", 540, 1330, { tam: 30, cor: PELE.AZUL, a: PELE.fade(t, 4.16, 5.3, 0.25) });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
