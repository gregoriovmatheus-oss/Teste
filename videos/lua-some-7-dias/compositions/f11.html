<!-- f11: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f11.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.14 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f11-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f11" data-width="1080" data-height="1920">
    <canvas id="f11-canvas" width="1080" height="1920"></canvas>
    <div id="f11-r1" class="rot" style="top: 700px"><span id="f11-r1-in" class="rot-t">Nunca<br><span class="y">parada</span></span></div>
    <div id="f11-r2" class="rot" style="top: 700px"><span id="f11-r2-in" class="rot-t"><span class="k">AFASTAMENTO</span><br><span class="y">3,8 cm</span><br>por ano</span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.14;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f11-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f11" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f11-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.5 * K);
      tl.to("#f11-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 1.55 * K);
      tl.fromTo("#f11-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 3.0 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f11"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f11"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/lua.js")
      ]).then(async ([K_, T, A, LUA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f11-canvas");

        // f11 — diagrama: a Lua orbita a Terra e a órbita cresce em espiral (escala exagerada): órbita antiga sólida, nova tracejada, seta para fora. Grua descendo.
        const st = T.createToyStage(canvas, { fov: 40, ceu: "#02040a", nevoa: null, nuvens: 0, exposicao: 1.0 });
        const S = st.scene, cam = st.cam;
        st.bloom = 0.5;
        S.environment = null;
        LUA.estrelas(S, { n: 2800, r: 400, seed: 111 });
        const SUN = new THREE.Vector3(-200, 60, 160);
        const E = LUA.terra(S, { r: 1 }); E.setSol(SUN); E.grupo.rotation.z = 0.41;
        st.key.position.copy(SUN); st.key.target.position.set(0, 0, 0); st.key.castShadow = false; st.key.intensity = 3.2; st.key.color.set(0xfff1e0);
        st.hemi.intensity = 0.2; st.hemi.color.set(0x8fa8d8); st.rim.intensity = 0;
        const R0 = 4, luaM = LUA.luaEsfera(0.32); S.add(luaM);
        const antiga = LUA.anel(R0, { tubo: 0.02, cor: 0xb8c8e8, opac: 0.55 }); S.add(antiga);
        const nova = LUA.anelTracejado(1, { n: 120, tubo: 0.02, cor: 0xff8a4c, opac: 0.9 }); S.add(nova);
        const rastro = LUA.pontos(S, 160, { tam: 1, atenua: 140 });
        for (let i = 0; i < 160; i++) rastro.C.set([1.0, 0.8, 0.5], i * 3);
        const seta = LUA.seta(0xff8a4c, 0.035); S.add(seta.g);
        const Rt = (t) => R0 + 1.1 * ease.inOutSine(range(t, 1.9, 4.6));
        const th = (t) => 0.9 + t * 0.55;
        const pm = new THREE.Vector3(), a = new THREE.Vector3(), b = new THREE.Vector3();
        function render(t) {
          E.giro.rotation.y = t * 0.6;
          const R = Rt(t), ang = th(t);
          pm.set(Math.cos(ang) * R, 0, -Math.sin(ang) * R);
          luaM.position.copy(pm); luaM.rotation.y = ang - Math.PI / 2;
          const kn = range(t, 1.9, 2.3);
          nova.scale.set(R / 1, R / 1, 1); nova.visible = kn > 0; nova.userData.mat.opacity = 0.9 * kn;
          for (let i = 0; i < 160; i++) {
            const tt = t - i * 0.022, R2 = Rt(tt), a2 = th(tt);
            rastro.P.set([Math.cos(a2) * R2, 0, -Math.sin(a2) * R2], i * 3); rastro.A[i] = (1 - i / 160) * 0.8; rastro.S[i] = 0.5 * (1 - i / 200);
          }
          rastro.sync();
          const ks = ease.outCubic(range(t, 2.4, 3.0));
          a.copy(pm).normalize().multiplyScalar(R + 0.42); b.copy(pm).normalize().multiplyScalar(R + 0.42 + 1.1);
          seta.set(a, b, ks); seta.g.visible = ks > 0.02;
          const e = ease.inOutCubic(clamp(t / D));
          cam.position.set(lerp(0.5, 7.5, e), lerp(23, 8.5, e), lerp(9, 16, e));
          cam.lookAt(lerp(0.3, 0.8, e), lerp(-3, -3.2, e), lerp(4, 2, e));
          st.draw();
          const c = st.ctx, fa = LUA.borda(t, D);
          const [x, y] = LUA.proj(b, cam);
          LUA.tag(c, "+3,8 CM/ANO", x, y - 60, { a: fa * range(t, 3.1, 3.5), tam: 32, cor: "#ff8a4c" });
          LUA.tag(c, "ESCALA EXAGERADA", 420, 300, { a: fa * range(t, 2.2, 2.6) * 0.9, tam: 24, fundo: "rgba(8,10,20,0.4)" });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
