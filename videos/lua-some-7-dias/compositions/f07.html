<!-- f07: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f07.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.95 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f07-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f07" data-width="1080" data-height="1920">
    <canvas id="f07-canvas" width="1080" height="1920"></canvas>
    <div id="f07-r1" class="rot" style="top: 700px"><span id="f07-r1-in" class="rot-t">Leões caçam<br><span class="y">no escuro</span></span></div>
    <div id="f07-r2" class="rot" style="top: 700px"><span id="f07-r2-in" class="rot-t">Presas<br><span class="y">expostas</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.95;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f07-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f07" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f07-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.7 * K);
      tl.to("#f07-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.7 * K);
      tl.fromTo("#f07-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 4.0 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f07"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f07"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/lua.js")
      ]).then(async ([K_, T, A, LUA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f07-canvas");

        // f07 — savana numa noite sem lua: dois leões avançam agachados no capim; as zebras pastam sem ver. No fim, elas levantam a cabeça e os leões arrancam.
        const st = T.createToyStage(canvas, { fov: 42, ceu: "#02040a", nevoa: [30, 260], corNevoa: "#0b1422", nuvens: 0, exposicao: 1.4 });
        const S = st.scene, cam = st.cam;
        st.bloom = 0.45;
        S.environment = null;
        LUA.ceuDome(S, { topo: "#02050c", horiz: "#13213a", base: "#05080c" });
        const est = LUA.estrelas(S, { n: 3600, r: 1200, so: "cima", seed: 71 }); est.mat.uniforms.uA.value = 1.6;
        const via = LUA.viaLactea(S, { r: 1150, seed: 72, normal: new THREE.Vector3(0.7, 0.3, 0.65).normalize() }); via.set(0.55);
        const hgt = (x, z) => 0.25 * Math.sin(x * 0.1) * Math.cos(z * 0.13) + 4 * smoothstep(-60, -180, z);
        LUA.terreno(S, hgt, { w: 400, d: 300, seg: 70, cor: 0x4f4a30, cz: -80 });
        const gr = LUA.grama(S, { n: 2600, area: [-14, 26, -16, 5], seed: 73, cor: 0x9a8650, alt: [0.25, 0.7], h: hgt });
        const rr = mulberry32(74);
        for (let i = 0; i < 9; i++) { const x = -40 + i * 12 + rr() * 6, z = -35 - rr() * 60; const a = LUA.acacia(1.4 + rr() * 0.8, 75 + i, 0x2c3420); a.position.set(x, hgt(x, z), z); S.add(a); }
        const leoes = [0, 1].map((i) => { const l = A.createAnimal("leao", { fase: i * 0.45 }); l.group.scale.setScalar(0.95); S.add(l.group); return l; });
        const zebras = [[13, -6, 2.6], [16, -8.5, -2.2], [18.5, -5.5, 0.8], [21, -9, 3.6]].map(([x, z, ry], i) => { const zb = A.createAnimal("zebra", { fase: i * 0.3 }); zb.group.position.set(x, hgt(x, z), z); zb.group.rotation.y = ry; S.add(zb.group); return zb; });
        st.key.color.set(0x8ea6d8); st.key.intensity = 0.9; st.sol(6, -2, 30); st.key.position.set(-10, 30, 20);
        st.hemi.color.set(0x3a5682); st.hemi.groundColor.set(0x14100a); st.hemi.intensity = 0.65;
        st.rim.color.set(0x9db8e8); st.rim.intensity = 1.4; st.rim.position.set(30, 12, -30);
        function render(t) {
          gr.update(t, 0.6);
          const corre = ease.inCubic(range(t, 5.0, 5.95));
          leoes.forEach((l, i) => {
            const x = -5 - i * 2.2 + t * 0.9 + corre * 3.5, z = 1.5 + i * 1.6 - t * 0.35;
            l.group.position.set(x, hgt(x, z) - 0.28 * (1 - corre), z);
            A.face(l.group, 1, -0.4);
            l.update(t, { passo: lerp(0.65, 2.3, corre), amp: lerp(0.32, 0.6, corre), cabeca: -0.12 });
          });
          const alerta = ease.outCubic(range(t, 4.7, 5.2));
          zebras.forEach((z, i) => z.update(t, { pescoco: lerp(0.95, -0.1, alerta) + Math.sin(t * 1.5 + i) * 0.05 }));
          const lx = -5 + t * 0.9;
          const e = ease.inOutSine(clamp(t / D));
          cam.position.set(lx - 9 + e * 2, hgt(lx - 9, 6) + lerp(2.8, 3.2, e), lerp(7.5, 6.5, e));
          cam.lookAt(lx + 6 + e * 3, lerp(0.6, 1.0, e), -2.5);
          st.draw();
          LUA.tag(st.ctx, "7 NOITES SEM LUAR", 450, 1330, { a: range(t, 3.1, 3.6) * LUA.borda(t, D), tam: 32, borda: "rgba(150,170,220,0.9)" });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
