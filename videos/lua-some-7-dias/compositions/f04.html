<!-- f04: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f04.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.34 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f04-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f04" data-width="1080" data-height="1920">
    <canvas id="f04-canvas" width="1080" height="1920"></canvas>
    <div id="f04-r1" class="rot" style="top: 700px"><span id="f04-r1-in" class="rot-t"><span class="k">FORÇA DAS MARÉS</span><br><span class="y">2/3</span><br>vêm da Lua</span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.34;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f04-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f04" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f04-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.9 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f04"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f04"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/lua.js")
      ]).then(async ([K_, T, A, LUA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f04-canvas");

        // f04 — diagrama 3D: Lua em órbita puxando a Terra. Setas de gravidade (todas para a Lua, menores longe dela) e os dois bojos de maré crescendo. Câmera orbitando.
        const st = T.createToyStage(canvas, { fov: 38, ceu: "#02040a", nevoa: null, nuvens: 0, exposicao: 1.0 });
        const S = st.scene, cam = st.cam;
        st.bloom = 0.5;
        S.environment = null;
        LUA.ceuDoc(S, { seed: 41, n: 5000, via: 0.32, raio: 400 });
        const E = await LUA.terraDoc(S, { r: 1 });
        const SUN = new THREE.Vector3(60, 40, 90);
        E.setSol(SUN); E.u.atmo.value = 0.8;
        st.key.position.copy(SUN); st.key.target.position.set(0, 0, 0); st.key.castShadow = false; st.key.intensity = 3.0; st.key.color.set(0xfff1e0);
        st.hemi.intensity = 0.35; st.hemi.color.set(0x8fa8d8); st.hemi.groundColor.set(0x222838); st.rim.intensity = 0.6; st.rim.position.set(-60, 10, -40);
        // oceano deformado (bojos), exagerado para ver
        const marG = new THREE.Group(); S.add(marG);
        const mar = new THREE.Mesh(new THREE.SphereGeometry(1.0, 56, 36), new THREE.MeshStandardMaterial({ color: 0x4fb0ff, transparent: true, opacity: 0.55, roughness: 0.15, depthWrite: false, envMapIntensity: 0, emissive: 0x1a5fa8, emissiveIntensity: 0.9 }));
        marG.add(mar);
        const R = 4.0;
        const luaM = LUA.luaEsfera(0.34); S.add(luaM);
        const orb = LUA.anelTracejado(R, { n: 120, tubo: 0.012, cor: 0xb8c8e8, opac: 0.45 }); S.add(orb);
        // setas de gravidade: lado próximo, centro, lado oposto (∝ 1/d²)
        const L = [1.6, 0.95, 0.64];
        const setas = [0, 1, 2].map(() => { const s = LUA.seta(0x7cc8ff, 0.04); S.add(s.g); return s; });
        const u = new THREE.Vector3(), a = new THREE.Vector3(), b = new THREE.Vector3(), alvo = new THREE.Vector3(), tmp = new THREE.Vector3();
        function render(t) {
          const th = 0.25 + t * 0.12;
          u.set(Math.cos(th), 0, -Math.sin(th));
          luaM.position.copy(u).multiplyScalar(R); luaM.rotation.y = th - Math.PI / 2;
          E.giro.rotation.y = t * 0.35; E.nuvens.rotation.y = t * 0.03;
          marG.rotation.y = th;
          const bj = ease.inOutCubic(range(t, 1.6, 2.6));
          mar.scale.set(1.035 + 0.42 * bj, 1.03 - 0.06 * bj, 1.03 - 0.06 * bj);
          const sa = ease.outCubic(range(t, 0.45, 1.3));
          [1.06, 0, -1.06].forEach((off, i) => { a.copy(u).multiplyScalar(off).setY(off === 0 ? 0 : 0.0); b.copy(a).addScaledVector(u, L[i]); setas[i].set(a, b, sa); setas[i].g.visible = sa > 0.02; });
          // câmera em órbita, sistema na parte de cima do quadro
          const ph = 0.55 + t * 0.2;
          alvo.set(u.x * 1.55, -1.7, u.z * 1.55);
          cam.position.set(alvo.x + Math.sin(ph) * 13.5, 5.0, alvo.z + Math.cos(ph) * 13.5);
          cam.lookAt(alvo);
          st.draw();
          const c = st.ctx, fa = LUA.borda(t, D);
          let [x, y] = LUA.proj(luaM.position, cam);
          LUA.tag(c, "LUA", x, y - 95, { a: fa * range(t, 0.2, 0.6), tam: 32 });
          tmp.copy(u).multiplyScalar(1.0); [x, y] = LUA.proj(tmp.setY(0), cam);
          LUA.tag(c, "GRAVIDADE", x, y + 110, { a: fa * range(t, 0.7, 1.1) * (1 - range(t, 1.9, 2.2)), tam: 30, cor: "#7cc8ff" });
          const pb1 = tmp.copy(u).multiplyScalar(1.45); [x, y] = LUA.proj(pb1, cam);
          LUA.tag(c, "BOJO", x + 40, y - 110, { a: fa * range(t, 2.0, 2.4), tam: 30, ax: x, ay: y, cor: "#9fd0ff" });
          const pb2 = tmp.copy(u).multiplyScalar(-1.45); const [x2, y2] = LUA.proj(pb2, cam);
          LUA.tag(c, "BOJO", x2 - 40, y2 - 110, { a: fa * range(t, 2.2, 2.6), tam: 30, ax: x2, ay: y2, cor: "#9fd0ff" });
          LUA.tag(c, "BOJOS EXAGERADOS", 540, 1300, { a: fa * range(t, 2.4, 2.8) * 0.9, tam: 24, fundo: "rgba(8,10,20,0.35)" });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
