<!-- Modelo de cena 3D (R01). cenas.py --criar copia para compositions/fNN.html trocando os marcadores de id e duração.
     Padrão: script clássico registra buildReady na hora; import dinâmico do kit e dos blocos;
     K.bindSeek(canvas, render) dá o tempo LOCAL da cena (sem gambiarra de data-start). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b1018; }
    #__ID__-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #__ID__-titulo { position: absolute; left: 160px; right: 200px; top: 660px; text-align: center; }
    #__ID__-titulo-in { display: block; font-family: "EB Garamond", serif; font-size: 84px; line-height: 1.05; color: #fff;
      text-shadow: 0 4px 26px rgba(4, 10, 20, 0.75), 0 1px 4px rgba(4, 10, 20, 0.6); }
    #__ID__-titulo-in .ice { color: #8fcbf2; }
  </style>
  <div id="root" data-composition-id="__ID__" data-width="1080" data-height="1920">
    <canvas id="__ID__-canvas" width="1080" height="1920"></canvas>
    <div id="__ID__-titulo" class="clip" data-start="0.3" data-duration="2.2">
      <span id="__ID__-titulo-in">Texto da <span class="ice">cena</span></span>
    </div>
  </div>
  <script>
    (function () {
      /* 2D por cima (GSAP). Título entre y 640 e 1000: o HUD ocupa 290-620 e a legenda 1045-1195. */
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#__ID__-titulo-in", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.3);
      tl.to("#__ID__-titulo-in", { opacity: 0, duration: 0.2, ease: "power2.in" }, 2.3);
      tl.set({}, {}, __DUR__);
      window.__timelines = window.__timelines || {};
      window.__timelines["__ID__"] = tl;

      /* 3D */
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["__ID__"] = Promise.all([
        import("./assets/lib/kit.js"),
        import("./assets/lib/blocks/city.js"),
        // import("./assets/lib/blocks/globe.js"), import("./assets/lib/blocks/particles.js"),
        // import("./assets/lib/blocks/shockwave.js"), import("./assets/lib/blocks/counter.js"),
      ]).then(async ([K, { createCity }]) => {
        const { THREE, ease, range, lerp, clamp } = K;
        const canvas = document.getElementById("__ID__-canvas");
        const renderer = K.createRenderer(canvas);
        const scene = new THREE.Scene();
        const cam = new THREE.PerspectiveCamera(35, K.W / K.H, 1, 2000);
        const city = createCity(scene, { seed: 7, geada: [__DUR__ * 0.6, __DUR__ * 0.6 + 0.35], paraEm: __DUR__ * 0.6 });

        function render(t) {               // t = segundos locais da cena
          const p = ease.outCubic(clamp(t / __DUR__));
          const h = lerp(300, 175, p), ang = lerp(-0.35, 0.05, p);
          cam.position.set(Math.sin(ang) * 18, h, Math.cos(ang) * 18 + 10);
          cam.up.set(Math.sin(ang), 0, -Math.cos(ang));
          cam.lookAt(0, 0, 0);
          city.update(t);
          renderer.render(scene, cam);
        }
        await K.bindSeek(canvas, render, { warm: [{ renderer, scene, camera: cam }], duration: __DUR__ });
      });
    })();
  </script>
</template>
