<!-- f06: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f06.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.07 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f06-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f06" data-width="1080" data-height="1920">
    <canvas id="f06-canvas" width="1080" height="1920"></canvas>
    <div id="f06-r1" class="rot" style="top: 660px"><span id="f06-r1-in" class="rot-t">Mais de <span class="y">1 hora</span><br>depois</span></div>
    <div id="f06-r2" class="rot" style="top: 660px"><span id="f06-r2-in" class="rot-t">A luz vai<br><span class="y">e volta</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.07;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f06-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f06" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f06-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.0 * K);
      tl.to("#f06-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.15 * K);
      tl.fromTo("#f06-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.6 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f06"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f06"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/solkit.js")
      ]).then(async ([K_, T, A, SOLKIT]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f06-canvas");

        const SK = SOLKIT;
        await SK.fontes();
        const st = T.createToyStage(canvas, { fov: 40, nevoa: null, nuvens: 0 });
        const S = SK.espaco(st), cam = st.cam;
        const stars = SK.estrelas(S, { n: 2400, seed: 61 });
        const RE = 2, RJ = 10.4;   // Terra a 1 UA, Júpiter a 5,2 UA (proporção real)
        const sol = SK.criaSol(S, { r: 0.55, pos: [0, 0, 0], halo: 6 });
        // plano do diagrama: órbitas, frente da última luz e região ainda iluminada
        const pm = new THREE.ShaderMaterial({
          transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
          uniforms: { uR: { value: 0 }, uRE: { value: RE }, uRJ: { value: RJ } },
          vertexShader: `varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
          fragmentShader: `uniform float uR; uniform float uRE; uniform float uRJ; varying vec2 vP;
            void main(){ float d = length(vP);
              float orb = exp(-pow((d - uRE) / 0.035, 2.0)) + exp(-pow((d - uRJ) / 0.05, 2.0));
              float ring = exp(-pow((d - uR) / 0.09, 2.0)) * step(0.01, uR);
              float lit = smoothstep(uR - 0.02, uR + 0.6, d) * exp(-d * 0.09) * step(0.01, uR);
              vec3 c = vec3(0.35, 0.5, 0.8) * orb * 0.55 + vec3(1.0, 0.85, 0.55) * ring * 1.5 + vec3(1.0, 0.72, 0.4) * lit * 0.07;
              gl_FragColor = vec4(c, 1.0); }`,
        });
        const plano = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), pm); plano.rotation.x = -Math.PI / 2; S.add(plano);
        const tm = new THREE.MeshBasicMaterial({ map: SK.terraTex(), toneMapped: false });
        const terra = new THREE.Mesh(new THREE.SphereGeometry(0.28, 32, 20), tm); terra.position.set(RE, 0, 0); S.add(terra);
        const jc = document.createElement("canvas"); jc.width = 256; jc.height = 128;
        { const g = jc.getContext("2d"), r = mulberry32(62); for (let y = 0; y < 128; y += 4) { const k = 0.5 + 0.5 * Math.sin(y * 0.21 + r()); g.fillStyle = `rgb(${200 + k * 40},${150 + k * 50},${110 + k * 40})`; g.fillRect(0, y, 256, 4); }
          g.fillStyle = "#b5573a"; g.beginPath(); g.ellipse(170, 80, 18, 9, 0, 0, 6.3); g.fill(); }
        const jt = new THREE.CanvasTexture(jc); jt.colorSpace = THREE.SRGBColorSpace;
        const jm = new THREE.MeshBasicMaterial({ map: jt, toneMapped: false });
        const jup = new THREE.Mesh(new THREE.SphereGeometry(0.62, 40, 24), jm); jup.position.set(RJ, 0, 0); S.add(jup);
        const jGlow = SK.brilho(0xffd9a8, 3.2, "suave", 0.6); jGlow.position.copy(jup.position); S.add(jGlow);
        const reflexo = SK.brilho(0xfff0d0, 1.6, "suave", 1); S.add(reflexo);
        const v = new THREE.Vector3();
        const tag = (p, s, o) => { const [x, y, z] = SK.proj(p, cam); if (z < 1) SK.txt(st.ctx, s, x, y, o); };
        // minutos depois de o Sol apagar: 0 -> 43 (até Júpiter) -> 78 (reflexo de volta à Terra)
        const minutos = (t) => t < 2.5 ? 43 * range(t, 0.15, 2.5) : 43 + 35 * ease.inOutSine(range(t, 2.55, 4.5));
        function render(t) {
          sol.set(0, t);
          const m = minutos(t);
          pm.uniforms.uR.value = (m / 43) * RJ;
          const terraLuz = m < 8.3 ? 1 : 0.25, jLuz = (t < 2.5) ? 1 : 0.18;
          tm.color.setScalar(terraLuz); jm.color.setScalar(jLuz); jGlow.material.opacity = 0.6 * jLuz;
          terra.rotation.y = t * 0.5; jup.rotation.y = t * 0.8;
          // último reflexo saindo de Júpiter em direção à Terra
          const q = range(t, 2.55, 4.5);
          reflexo.visible = t > 2.5 && q < 1;
          reflexo.position.set(lerp(RJ, RE, ease.inOutSine(q)), 0, 0);
          reflexo.scale.setScalar(1.6 + 0.3 * Math.sin(t * 18));
          // câmera de cima, com o Sol no topo; grua descendo e leve giro
          const e = ease.inOutSine(range(t, 0, 5.07));
          cam.up.set(-1, 0, lerp(-0.12, 0.12, e)).normalize();
          cam.position.set(lerp(6.6, 5.6, e), lerp(30, 26, e), lerp(9, 6, e));
          cam.lookAt(5.6, 0, 0);
          stars.set(1, t);
          st.draw();
          const c = st.ctx;
          // relógio do tempo da luz
          SK.pilula(c, 540, 255, 420, 150);
          SK.txt(c, "DEPOIS DE APAGAR", 540, 212, { tam: 28, cor: SK.AZUL });
          SK.txt(c, m < 60 ? Math.round(m) + " MIN" : "1 H " + String(Math.round(m - 60)).padStart(2, "0") + " MIN", 540, 278, { tam: 74, fonte: "mono", peso: 600, esp: 0.02 });
          tag(v.set(-0.2, 0, 1.3), "SOL", { tam: 28, cor: "#9fb6d8" });
          tag(v.set(RE, 0, 1.0), "TERRA", { tam: 30 });
          tag(v.set(RJ, 0, 1.6), "JÚPITER", { tam: 32, cor: "#FFD9A8" });
          const na = range(t, 2.6, 2.9) * (1 - range(t, 4.4, 4.5));
          tag(v.set(RJ, 0, -1.9), "JÁ APAGOU, MAS A TERRA", { tam: 26, cor: "#cfd8ea", a: na });
          tag(v.set(RJ + 0.45, 0, -1.9), "AINDA VÊ O BRILHO", { tam: 26, cor: "#cfd8ea", a: na });
          tag(v.set(RJ, 0, -1.9), "SUMIU DO CÉU", { tam: 34, cor: SK.AZUL, a: range(t, 4.5, 4.7) });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
