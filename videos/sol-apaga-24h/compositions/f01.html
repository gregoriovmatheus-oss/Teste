<!-- f01: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f01.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 4.13 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f01-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f01" data-width="1080" data-height="1920">
    <canvas id="f01-canvas" width="1080" height="1920"></canvas>
    <div id="f01-r1" class="rot" style="top: 660px"><span id="f01-r1-in" class="rot-t"><span class="k">UM EXPERIMENTO MENTAL</span><br>E se o Sol <span class="y">apagasse</span>?</span></div>
    <div id="f01-r2" class="rot" style="top: 660px"><span id="f01-r2-in" class="rot-t">E ele <span class="y">apaga</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 4.13;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f01-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f01" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f01-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.05 * K);
      tl.to("#f01-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.0 * K);
      tl.fromTo("#f01-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 3.5 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f01"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f01"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/solkit.js")
      ]).then(async ([K_, T, A, SOLKIT]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f01-canvas");

        const SK = SOLKIT;
        await SK.fontes();
        const st = T.createToyStage(canvas, { fov: 58, nevoa: null, nuvens: 0 });
        const S = SK.espaco(st), cam = st.cam;
        SK.estrelas(S, { n: 2200, seed: 11 });
        const s = new THREE.Vector3(0, 0.3, -1).normalize(), w = new THREE.Vector3(0, 1, 0.3).normalize();
        const SUN = s.clone().multiplyScalar(70);
        const sol = SK.criaSol(S, { r: 6.5, pos: SUN.toArray(), halo: 10 });
        const terra = SK.criaTerra(S, st, { detalhe: 32 });
        const alvo = new THREE.Vector3(), c = new THREE.Vector3();
        function render(t) {
          st.T = t + 0.2; st.D = 4.33;   // gancho: o quadro 0 já é a imagem cheia, sem o "dip" de entrada
          // o Sol apaga em 3,57 s ("apaga"): pisca, vira brasa e some em ~0,35 s
          const ap = range(t, 3.5, 3.9);
          const L = t < 3.5 ? 1 + 0.06 * Math.sin(t * 9) * range(t, 3.0, 3.5) : (1 - ease.inCubic(ap)) * (1 + 0.5 * Math.sin(ap * 9) * (1 - ap));
          sol.set(Math.max(0, L), t);
          // a Terra continua iluminada: a luz que já saiu do Sol ainda está a caminho
          terra.set({ sol: s, luz: 1, cidades: 0.7, rotY: 0.3 + t * 0.06, incl: 1.45 });
          // voo por cima da Terra: começa no lado do dia e o Sol "nasce" atrás do horizonte
          const e = ease.inOutSine(range(t, 0, 3.6));
          const th = lerp(0.75, 2.42, e) , R = lerp(3.3, 3.9, e);
          c.copy(s).multiplyScalar(Math.cos(th)).addScaledVector(w, Math.sin(th)).multiplyScalar(R);
          cam.position.copy(c);
          cam.up.copy(s);
          alvo.set(0, 0, 0).lerp(SUN, 0.16 * ease.inOutSine(range(e, 0.45, 1)));
          cam.lookAt(alvo);
          st.draw();
          // brilho do Sol "atrás da câmera" no começo e clarão enquanto brilha
          const cx = st.ctx;
          cx.save(); cx.globalCompositeOperation = "screen";
          const gl = (1 - range(t, 0.5, 2.6)) * 0.55;
          if (gl > 0) { const g = cx.createLinearGradient(0, 0, 0, 900); g.addColorStop(0, "rgba(255,214,150," + gl + ")"); g.addColorStop(1, "rgba(255,214,150,0)"); cx.fillStyle = g; cx.fillRect(0, 0, 1080, 900); }
          cx.globalAlpha = 0.08 * Math.max(0, L); cx.fillStyle = "#ffcf8a"; cx.fillRect(0, 0, 1080, 1920);
          cx.restore();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
