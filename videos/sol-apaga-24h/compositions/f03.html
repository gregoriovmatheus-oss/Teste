<!-- f03: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f03.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 4.95 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f03-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f03" data-width="1080" data-height="1920">
    <canvas id="f03-canvas" width="1080" height="1920"></canvas>
    <div id="f03-r1" class="rot" style="top: 660px"><span id="f03-r1-in" class="rot-t"><span class="k">DISTÂNCIA SOL → TERRA</span><br><span class="y">150 milhões</span> de km</span></div>
  </div>
  <script>
    (function () {
      const D0 = 4.95;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f03-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f03" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f03-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.5 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f03"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f03"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/solkit.js")
      ]).then(async ([K_, T, A, SOLKIT]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f03-canvas");

        const SK = SOLKIT;
        await SK.fontes();
        const st = T.createToyStage(canvas, { fov: 50, nevoa: null, nuvens: 0 });
        const S = SK.espaco(st), cam = st.cam;
        const stars = SK.estrelas(S, { n: 2600, seed: 31 });
        const SX = -60;
        const sol = SK.criaSol(S, { r: 4, pos: [SX, 0, 0], halo: 8 });
        const terra = SK.criaTerra(S, st, {});
        const feixe = SK.criaFeixe(S, { raio: 3.4 });
        const frente = SK.brilho(0xfff0d0, 16, "suave", 1); S.add(frente);
        const anel = new THREE.Mesh(new THREE.TorusGeometry(4.6, 0.07, 8, 96), new THREE.MeshBasicMaterial({ color: 0xfff2d0, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
        anel.rotation.y = Math.PI / 2; S.add(anel);
        const rr = mulberry32(32), NS = 110;
        const stk = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 0.045, 0.045), new THREE.MeshBasicMaterial({ color: 0xffe2a8, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }), NS);
        stk.frustumCulled = false; S.add(stk);
        const sd = Array.from({ length: NS }, () => { const a = rr() * 6.283, r = Math.sqrt(rr()) * 3.2; return [rr() * 60, Math.cos(a) * r, Math.sin(a) * r, 0.8 + rr() * 2.4]; });
        // régua de distância (Sol -> Terra)
        const regua = new THREE.Mesh(new THREE.BoxGeometry(1, 0.05, 0.05), new THREE.MeshBasicMaterial({ color: 0x8fb4e0, toneMapped: false }));
        regua.scale.x = (SX + 4) * -1 - 1.2; regua.position.set((SX + 4 - 1.2) / 2, -5.5, 0); S.add(regua);
        const ticks = new THREE.InstancedMesh(new THREE.BoxGeometry(0.05, 0.5, 0.05), regua.material, 16);
        const o3 = new THREE.Object3D(), X0 = SX + 4, X1 = -1.2;
        for (let i = 0; i <= 15; i++) { o3.position.set(lerp(X0, X1, i / 15), -5.5, 0); o3.scale.y = i % 5 ? 0.6 : 1.4; o3.updateMatrix(); ticks.setMatrixAt(i, o3.matrix); }
        S.add(ticks);
        const m4 = new THREE.Matrix4(), v = new THREE.Vector3(), SUNDIR = new THREE.Vector3(-1, 0, 0);
        const tag = (p, s, o) => { const [x, y, z] = SK.proj(p, cam); if (z < 1 && x > 40 && x < 1040 && y > 180 && y < 1320) SK.txt(st.ctx, s, x, y, o); };
        function render(t) {
          sol.set(0.0, t);
          // a luz anda com velocidade constante: 150 milhões de km em 8 min 20 s
          const p = range(t, 0.25, 4.3), xf = lerp(X0, -1.05, p);
          const apaga = range(t, 4.3, 4.6);
          terra.set({ sol: SUNDIR, luz: 1 - apaga, cidades: 0.8, rotY: 1.6 + t * 0.05 });
          frente.position.set(xf, 0, 0); frente.material.opacity = 1 - apaga;
          anel.position.set(xf, 0, 0); anel.material.opacity = 1 - apaga;
          anel.scale.setScalar(1 + 0.04 * Math.sin(t * 20));
          feixe.de(new THREE.Vector3(xf, 0, 0), new THREE.Vector3(-0.2, 0, 0), 3.4, 1 - apaga);
          let k = 0;
          for (const [off, y, z, L] of sd) {
            const x = xf + off;
            const vis = x < -0.9 && apaga < 1;
            o3.position.set(Math.min(x, -0.9) - L / 2, y, z); o3.scale.set(vis ? L : 0.001, 1, 1); o3.rotation.set(0, 0, 0); o3.updateMatrix();
            stk.setMatrixAt(k++, o3.matrix);
          }
          stk.instanceMatrix.needsUpdate = true;
          // câmera persegue a frente de luz
          const e = ease.inOutSine(p);
          cam.position.set(xf - lerp(7, 9, e), lerp(3.4, 2.2, e), lerp(9, 7, e));
          cam.up.set(0, 1, 0);
          cam.lookAt(Math.min(xf + 16, 0), -0.6, 0);
          stars.set(1, t);
          st.draw();
          const c = st.ctx;
          tag(v.set(xf, 6.2, 0), "ÚLTIMA LUZ", { tam: 34, cor: "#FFE2A8", a: 1 - apaga });
          tag(v.set(xf, 8.6, 0), SK.mmss(p * 500), { tam: 64, fonte: "mono", peso: 600, esp: 0.02, a: range(t, 0.3, 0.6) });
          tag(v.set(SX, 6, 0), "SOL APAGADO", { tam: 30, cor: "#9fb6d8" });
          tag(v.set(0, 2.2, 0), "TERRA", { tam: 34, a: range(t, 1.5, 2.2) });
          for (const [i, s] of [[0, "0"], [5, "50"], [10, "100"], [15, "150 mi km"]]) tag(v.set(lerp(X0, X1, i / 15), -6.6, 0), s, { tam: 26, cor: "#9fc0ea" });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
