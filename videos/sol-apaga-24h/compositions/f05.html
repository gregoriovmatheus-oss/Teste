<!-- f05: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f05.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 4.55 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f05-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f05" data-width="1080" data-height="1920">
    <canvas id="f05-canvas" width="1080" height="1920"></canvas>
    <div id="f05-r1" class="rot" style="top: 660px"><span id="f05-r1-in" class="rot-t">Ela só <span class="y">reflete</span><br>a luz do Sol</span></div>
    <div id="f05-r2" class="rot" style="top: 660px"><span id="f05-r2-in" class="rot-t">As estrelas<br><span class="y">continuam</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 4.55;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f05-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f05" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f05-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.45 * K);
      tl.to("#f05-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.5 * K);
      tl.fromTo("#f05-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.9 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f05"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f05"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/solkit.js")
      ]).then(async ([K_, T, A, SOLKIT]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f05-canvas");

        const SK = SOLKIT;
        await SK.fontes();
        const st = T.createToyStage(canvas, { fov: 55, ceu: ["#02040b", "#0c1630"], nevoa: [80, 600], corNevoa: "#0a1226", nuvens: 0 });
        const S = st.scene, cam = st.cam;
        S.environmentIntensity = 0.1; st.hemi.intensity = 0.12; st.hemi.color.setHex(0x6f86c0); st.rim.intensity = 0;
        st.key.intensity = 0.35; st.key.color.setHex(0x8fa8ff); st.key.castShadow = false;
        const cid = T.cidade({ n: 4, seed: 51, verde: 0.1, hMin: 8, hMax: 30 }); S.add(cid.group);
        const rr = mulberry32(52);
        cid.buildings.forEach((b) => { b.userData.win.emissiveIntensity = rr() < 0.6 ? 0.9 + rr() * 0.6 : 0; });
        const stars = SK.estrelas(S, { n: 3400, r: 900, seed: 53, tam: 3.6 });
        // Lua: textura de crateras, iluminada só pela luz do Sol (sem luz própria)
        const mc = document.createElement("canvas"); mc.width = 512; mc.height = 256;
        { const g = mc.getContext("2d"); g.fillStyle = "#b9b6ae"; g.fillRect(0, 0, 512, 256); const r = mulberry32(54);
          for (let i = 0; i < 14; i++) { g.fillStyle = "rgba(70,70,75,0.35)"; g.beginPath(); g.ellipse(r() * 512, 60 + r() * 140, 30 + r() * 50, 20 + r() * 30, r() * 3, 0, 6.3); g.fill(); }
          for (let i = 0; i < 160; i++) { const x = r() * 512, y = r() * 256, R = 2 + Math.pow(r(), 2) * 16; g.strokeStyle = "rgba(240,238,230,0.45)"; g.lineWidth = 1.5; g.beginPath(); g.arc(x, y, R, 0, 6.3); g.stroke(); g.fillStyle = "rgba(60,60,64,0.25)"; g.beginPath(); g.arc(x + R * 0.15, y + R * 0.15, R * 0.85, 0, 6.3); g.fill(); } }
        const mtex = new THREE.CanvasTexture(mc); mtex.colorSpace = THREE.SRGBColorSpace;
        const moonMat = new THREE.ShaderMaterial({
          uniforms: { map: { value: mtex }, uSun: { value: new THREE.Vector3(0.75, -0.35, 0.55).normalize() }, uL: { value: 1 } },
          vertexShader: `varying vec3 vN; varying vec2 vUv; void main(){ vUv = uv; vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
          fragmentShader: `uniform sampler2D map; uniform vec3 uSun; uniform float uL; varying vec3 vN; varying vec2 vUv;
            void main(){ vec3 tx = texture2D(map, vUv).rgb; float lam = smoothstep(-0.05, 0.35, dot(normalize(vN), uSun));
              vec3 c = tx * lam * 1.25 * uL + vec3(0.012, 0.016, 0.03); gl_FragColor = vec4(c, 1.0); }`,
        });
        const MD = new THREE.Vector3(0.18, 0.72, -1).normalize();
        const moon = new THREE.Mesh(new THREE.SphereGeometry(36, 48, 32), moonMat); moon.position.copy(MD).multiplyScalar(760); S.add(moon);
        const moonGlow = SK.brilho(0xcfd8ff, 230, "suave", 0.6); moonGlow.position.copy(moon.position); S.add(moonGlow);
        function render(t) {
          const L = 1 - ease.inOutSine(range(t, 0.6, 1.5));
          moonMat.uniforms.uL.value = L; moonGlow.material.opacity = 0.55 * L;
          stars.set(lerp(0.55, 1.15, range(t, 1.2, 3.4)), t);
          // panorâmica para cima: dos telhados até o céu
          const e = ease.inOutSine(range(t, 0, 4.55));
          cam.position.set(lerp(-6, 4, e), lerp(30, 36, e), lerp(70, 62, e));
          const pitch = lerp(0.02, 0.5, ease.inOutSine(range(t, 0, 3.0))), yaw = lerp(-0.12, 0.1, e);
          cam.lookAt(cam.position.x + Math.sin(yaw) * 10, cam.position.y + Math.tan(pitch) * 10, cam.position.z - Math.cos(yaw) * 10);
          st.draw();
          // a Lua continua lá, só não reflete mais nada: contorno tracejado
          const [x, y, z] = SK.proj(moon.position, cam);
          const a = range(t, 1.3, 1.8);
          if (z < 1 && a > 0) {
            const c = st.ctx, R = 36 / (760 * Math.tan(55 * Math.PI / 360)) * 960;
            c.save(); c.globalAlpha = a * 0.8; c.setLineDash([10, 12]); c.lineWidth = 3; c.strokeStyle = "#9fb6d8";
            c.beginPath(); c.arc(x, y, R * 1.06, 0, 6.3); c.stroke(); c.restore();
            SK.txt(c, "LUA (APAGADA)", x, y + R * 1.06 + 40, { tam: 30, cor: "#b8c8e6", a });
          }
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
