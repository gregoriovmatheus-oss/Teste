<!-- f08: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f08.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.13 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f08-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f08" data-width="1080" data-height="1920">
    <canvas id="f08-canvas" width="1080" height="1920"></canvas>
    <div id="f08-r1" class="rot" style="top: 660px"><span id="f08-r1-in" class="rot-t">Os postes<br><span class="y">acendem</span></span></div>
    <div id="f08-r2" class="rot" style="top: 660px"><span id="f08-r2-in" class="rot-t">Essa noite<br><span class="y">não termina</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.13;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f08-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f08" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f08-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.8 * K);
      tl.to("#f08-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.8 * K);
      tl.fromTo("#f08-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 3.3 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f08"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f08"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/solkit.js")
      ]).then(async ([K_, T, A, SOLKIT]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f08-canvas");

        const SK = SOLKIT;
        await SK.fontes();
        const st = T.createToyStage(canvas, { fov: 50, ceu: ["#02040b", "#0e1932"], nevoa: [50, 260], corNevoa: "#0b1326", nuvens: 0 });
        const S = st.scene, cam = st.cam;
        S.environmentIntensity = 0.1; st.hemi.intensity = 0.14; st.hemi.color.setHex(0x6f86c0); st.rim.intensity = 0.15; st.rim.color.setHex(0x7f9bd8);
        st.key.intensity = 0.3; st.key.color.setHex(0x8fa8ff);
        const rua = T.rua({ len: 260, larg: 14, seed: 81, hMin: 14, hMax: 38 }); S.add(SK.aliviar(rua.group));
        const stars = SK.estrelas(S, { n: 2400, r: 900, seed: 82 });
        const rr = mulberry32(83);
        rua.buildings.forEach((b) => { b.userData.on = 1.4 + rr() * 2.6; b.userData.max = rr() < 0.25 ? 0 : 0.8 + rr() * 0.8; });
        const postes = [];
        for (let z = 56, i = 0; z > -120; z -= 15, i++) for (const s of [1, -1]) {
          const p = SK.poste(7.5, s); p.group.position.set(s * 7.7, 0.4, z + (s > 0 ? 0 : 7)); S.add(p.group);
          p.on = 0.85 + i * 0.05 + (s > 0 ? 0 : 0.03); postes.push(p);
        }
        const car = T.carro(0xd9583b); S.add(car);
        const farois = [0.65, -0.65].map((x) => { const g = SK.brilho(0xfff2c8, 3.2, "suave", 1); S.add(g); g.dx = x; return g; });
        function render(t) {
          // cada poste acende sozinho (fotocélula), com a piscadinha da lâmpada esquentando
          postes.forEach((p) => {
            const u = t - p.on;
            let k = clamp(u / 0.5);
            if (u > 0 && u < 0.3) k *= Math.sin(u * 60) > 0 ? 1 : 0.35;
            p.set(k);
          });
          rua.buildings.forEach((b) => { b.userData.win.emissiveIntensity = b.userData.max * range(t, b.userData.on, b.userData.on + 0.1); });
          const cz = -110 + t * 16;
          car.position.set(-3.4, 0.1, cz); car.rotation.y = 0;
          farois.forEach((g) => g.position.set(-3.4 + g.dx, 0.95, cz + 2.2));
          // travelling para a frente, câmera baixa subindo
          const e = ease.inOutSine(range(t, 0, 5.13));
          cam.position.set(lerp(2.5, -0.5, e), lerp(2.2, 4.4, e), lerp(44, 22, e));
          cam.lookAt(lerp(-1, 1, e), lerp(6, 7.5, e), -40);
          st.sol(0, cam.position.z - 30, 60);
          stars.set(1, t);
          st.draw();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
