<!-- f13: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f13.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 8.62 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f13-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f13" data-width="1080" data-height="1920">
    <canvas id="f13-canvas" width="1080" height="1920"></canvas>
    <div id="f13-r1" class="rot" style="top: 700px"><span id="f13-r1-in" class="rot-t">O Sol <span class="y">volta</span></span></div>
    <div id="f13-r2" class="rot" style="top: 700px"><span id="f13-r2-in" class="rot-t"><span class="k">DE NOVO</span><br><span class="y">8 min 20 s</span></span></div>
    <div id="f13-r3" class="rot" style="top: 680px"><span id="f13-r3-in" class="rot-t">Tudo parece <span class="y">normal</span></span></div>
    <div id="f13-r4" class="rot" style="top: 680px"><span id="f13-r4-in" class="rot-t">O planeta estaria<br><span class="y">mesmo igual</span>?</span></div>
  </div>
  <script>
    (function () {
      const D0 = 8.62;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f13-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f13" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f13-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.5 * K);
      tl.to("#f13-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 1.6 * K);
      tl.fromTo("#f13-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.05 * K);
      tl.to("#f13-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.45 * K);
      tl.fromTo("#f13-r3-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 4.2 * K);
      tl.to("#f13-r3-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 5.1 * K);
      tl.fromTo("#f13-r4-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 5.5 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f13"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f13"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/solkit.js")
      ]).then(async ([K_, T, A, SOLKIT]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f13-canvas");

        const SK = SOLKIT;
        await SK.fontes();
        // parte A: espaço (o Sol reacende e a frente de luz volta a viajar)
        const st = T.createToyStage(canvas, { fov: 40, nevoa: null, nuvens: 0 });
        const S = SK.espaco(st), cam = st.cam;
        st.bloom = 0.8;
        const stars = SK.ceuDoc(S, { seed: 131 });
        const SP = new THREE.Vector3(0, 13, -2);
        const sol = SK.criaSol(S, { r: 1.7, pos: SP.toArray(), halo: 9 });
        const terra = await SK.terraDoc(S);
        const cascaMat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
          uniforms: { uA: { value: 1 } },
          vertexShader: `varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
          fragmentShader: `uniform float uA; varying vec3 vN; varying vec3 vV; void main(){ float f = 1.0 - abs(dot(vN, vV)); float a = (pow(f, 7.0) * 1.6 + 0.025) * uA; gl_FragColor = vec4(vec3(1.0, 0.86, 0.6) * a, 1.0); }` });
        const casca = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 48), cascaMat); casca.position.copy(SP); S.add(casca);
        const SUND = SP.clone().normalize();
        // parte B: a mesma rua do começo, ensolarada de novo
        const st2 = T.createToyStage(canvas, { fov: 50, ceu: ["#3f86d6", "#d9e8ee"], nevoa: [90, 340], exposicao: 1.05, nuvens: 10 });
        const S2 = st2.scene, cam2 = st2.cam;
        const rua = T.rua({ len: 280, larg: 14, seed: 21, hMin: 12, hMax: 36 }); S2.add(SK.aliviar(rua.group));
        const rr = mulberry32(132);
        const pessoas = Array.from({ length: 10 }, (_, i) => { const h = A.createAnimal("humano", { cor: [0xd9583b, 0x3d6a8c, 0xe8b24a, 0x6c7880, 0xae6848][i % 5], cor2: [0x3f5677, 0x2d2f36][i % 2], mulher: i % 2 === 0, fase: rr() });
          h.dir = rr() < 0.5 ? 1 : -1; h.x = (i % 2 ? 1 : -1) * (8.2 + rr() * 1.4); h.z0 = 20 - i * 6; h.v = 1.1 + rr() * 0.4; S2.add(h.group); return h; });
        const D2 = new THREE.Vector3(-0.32, 0.5, -1).normalize();
        const sh = SK.brilho(0xffe2b0, 260, "suave", 0.95), sc = SK.brilho(0xffffff, 60, "disco", 1); S2.add(sh, sc);
        st.extraWarm = [st2.warm];
        function render(t) {
          if (t < 4.1) {
            // reacende em 0,72 s ("volta"): brasa -> brilho total
            const L = ease.outCubic(range(t, 0.55, 1.1));
            sol.set(L, t);
            // a frente de luz sai do Sol e anda em velocidade constante até a Terra (chega em 3,6 s: "chegar")
            const p = range(t, 0.75, 3.6), R = Math.max(0.01, p * (SP.length() - 1.0) + 1.7 * (p > 0 ? 1 : 0));
            casca.scale.setScalar(R); casca.visible = p > 0 && p < 1;
            const chegou = range(t, 3.55, 3.85);
            terra.set({ sol: SUND, luz: chegou, cidades: 1 - 0.5 * chegou, rotY: 1.0 + t * 0.06, incl: 0.25 });
            const e = ease.inOutSine(range(t, 0, 4.1));
            cam.position.set(lerp(9, 6, e), lerp(3.5, 4.5, e), lerp(30, 22, e));
            cam.lookAt(0, lerp(6.8, 5.5, e), 0);
            stars.set(1, t);
            st.draw();
            const fl = range(t, 3.6, 4.1);
            if (fl > 0) { const c = st.ctx; c.save(); c.globalAlpha = fl; c.fillStyle = "#fff6e0"; c.fillRect(0, 0, 1080, 1920); c.restore(); }
          } else {
            const u = t - 4.1;
            st2.T = t; st2.D = 8.62;
            pessoas.forEach((h) => { h.group.position.set(h.x, 0.4, h.z0 + h.dir * h.v * t); A.face(h.group, 0, h.dir); h.update(t, { passo: h.v * 1.3 }); });
            // grua: de dentro da rua até acima dos prédios, olhando o céu de novo
            const e = ease.inOutSine(range(u, 0, 4.52));
            cam2.position.set(lerp(1.5, -2, e), lerp(3, 30, e), lerp(30, 52, e));
            cam2.lookAt(0, lerp(9, 16, e), -60);
            st2.sol(0, 0, 70);
            st2.key.position.copy(st2.key.target.position).addScaledVector(D2, 100);
            for (const s of [sh, sc]) s.position.copy(cam2.position).addScaledVector(D2, 900);
            st2.draw(S2, cam2, { cor: "#fff6e0", a: 1 - range(u, 0, 0.5) });
          }
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
