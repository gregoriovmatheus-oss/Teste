<!-- f02: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f02.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.98 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f02-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f02" data-width="1080" data-height="1920">
    <canvas id="f02-canvas" width="1080" height="1920"></canvas>
    <div id="f02-r1" class="rot" style="top: 660px"><span id="f02-r1-in" class="rot-t">Ninguém <span class="y">percebe</span></span></div>
    <div id="f02-r2" class="rot" style="top: 660px"><span id="f02-r2-in" class="rot-t"><span class="k">A LUZ AINDA ESTÁ A CAMINHO</span><br><span class="y">8 min 20 s</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.98;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f02-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f02" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f02-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.9 * K);
      tl.to("#f02-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.3 * K);
      tl.fromTo("#f02-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 3.9 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f02"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f02"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/solkit.js")
      ]).then(async ([K_, T, A, SOLKIT]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f02-canvas");

        const SK = SOLKIT;
        await SK.fontes();
        const st = T.createToyStage(canvas, { fov: 52, ceu: ["#3f86d6", "#d9e8ee"], nevoa: [90, 340], exposicao: 1.05, nuvens: 10 });
        const S = st.scene, cam = st.cam;
        const rua = T.rua({ len: 280, larg: 14, seed: 21, hMin: 12, hMax: 36 }); S.add(SK.aliviar(rua.group));
        const rr = mulberry32(22);
        const CAM = [0xd9583b, 0x3d6a8c, 0xe8b24a, 0x6c7880, 0xae6848, 0x7dbb5a];
        const pessoas = Array.from({ length: 12 }, (_, i) => {
          const h = A.createAnimal("humano", { cor: CAM[i % 6], cor2: [0x3f5677, 0x2d2f36, 0x6b5a48][i % 3], mulher: i % 3 === 0, fase: rr() });
          h.lado = i % 2 ? 1 : -1; h.dir = rr() < 0.5 ? 1 : -1; h.x = h.lado * (8.2 + rr() * 1.4); h.z0 = 30 - i * 7 - rr() * 3; h.v = 1.1 + rr() * 0.5;
          S.add(h.group); return h;
        });
        const carros = [0, 1, 2, 3].map((i) => { const c = T.carro([0xd9583b, 0xf6f1e8, 0x3d6a8c, 0xe8b24a][i]); c.lane = i % 2 ? 3.4 : -3.4; c.z0 = -60 + i * 35; c.v = i % 2 ? -9 : 11; S.add(c); return c; });
        // o Sol no céu (ainda brilhando para quem está aqui)
        const SDIR = new THREE.Vector3(-0.32, 0.5, -1).normalize();
        const sunHalo = SK.brilho(0xffe2b0, 260, "suave", 0.95), sunCore = SK.brilho(0xffffff, 60, "disco", 1), sunRaios = SK.brilho(0xfff0d0, 420, "raios", 0.35);
        S.add(sunHalo, sunRaios, sunCore);
        function render(t) {
          pessoas.forEach((h) => {
            const z = h.z0 + h.dir * h.v * t;
            h.group.position.set(h.x, 0.4, z); A.face(h.group, 0, h.dir); h.update(t, { passo: h.v * 1.3 });
          });
          carros.forEach((c) => { c.position.set(c.lane, 0.1, c.z0 + c.v * t); c.rotation.y = c.v > 0 ? 0 : Math.PI; });
          // travelling para a frente, grua subindo devagar
          const e = ease.inOutSine(range(t, 0, 5.98));
          cam.position.set(lerp(-2.5, 1.0, e), lerp(2.4, 5.0, e), lerp(34, 12, e));
          cam.lookAt(lerp(1.5, -1, e), lerp(7, 10, e), -40);
          st.sol(0, cam.position.z - 30, 70);
          st.key.position.copy(st.key.target.position).addScaledVector(SDIR, 100);
          for (const s of [sunHalo, sunCore, sunRaios]) s.position.copy(cam.position).addScaledVector(SDIR, 900);
          sunRaios.material.rotation = t * 0.04;
          st.draw();
          const c2 = st.ctx, g = c2.createLinearGradient(0, 560, 0, 1080);
          g.addColorStop(0, "rgba(6,10,20,0)"); g.addColorStop(0.45, "rgba(6,10,20,0.5)"); g.addColorStop(1, "rgba(6,10,20,0)");
          c2.fillStyle = g; c2.fillRect(0, 560, 1080, 520);
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
