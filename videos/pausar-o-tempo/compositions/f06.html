<!-- f06: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f06.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.31 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f06-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f06" data-width="1080" data-height="1920">
    <canvas id="f06-canvas" width="1080" height="1920"></canvas>
    <div id="f06-r1" class="rot" style="top: 700px"><span id="f06-r1-in" class="rot-t"><span class="k">POR MÁGICA</span><br>Você ainda <span class="y">vê e respira</span></span></div>
    <div id="f06-r2" class="rot" style="top: 700px"><span id="f06-r2-in" class="rot-t">Aí começa <span class="y">o preço</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.31;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f06-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f06" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f06-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.95 * K);
      tl.to("#f06-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.2 * K);
      tl.fromTo("#f06-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 3.65 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f06"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f06"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/pausa.js")
      ]).then(async ([K_, T, A, PAUSA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f06-canvas");

        // f06 — "por mágica": do escuro total, faíscas azuis giram em volta do protagonista e a rua congelada volta a aparecer.
        //       Ele respira fundo (vapor). Grua: do nível da poça até o alto, olhando a multidão parada lá de cima.
        const st = T.createToyStage(canvas, { fov: 42, ceu: ["#1a2336", "#b0735a"], nevoa: [16, 140], corNevoa: "#4b4f60", nuvens: 0, exposicao: 1.05 });
        const S = st.scene, cam = st.cam;
        const R = PAUSA.ruaChuva(S, st);
        const TM = 1.17; R.update(0, TM, { k: 1 });
        const [px, , pz] = PAUSA.PROTA;
        const NF = 420, F = PAUSA.pontos(S, NF, { tam: 1, atenua: 200 }), rr = mulberry32(606), FB = Array.from({ length: NF }, () => [rr() * 6.28, 0.5 + rr() * 2.4, rr() * 3.2, 0.5 + rr()]);
        const NV = 60, V = PAUSA.pontos(S, NV, { tam: 1, atenua: 220, aditivo: true }), VB = Array.from({ length: NV }, () => [rr() - 0.5, rr() - 0.5, rr() - 0.5, rr()]);
        function render(t) {
          R.p.group.position.set(px, 0, pz); R.p.group.rotation.y = Math.PI / 2 + 0.4;
          const resp = Math.sin(Math.PI * range(t, 1.9, 3.1));
          R.p.pose(t, { respira: resp, cabeca: 0.15 * resp });
          const luz = ease.inOutSine(range(t, 0.5, 2.3));
          for (let i = 0; i < NF; i++) { // faíscas em espiral, abrindo enquanto a luz volta
            const [a0, r0, y0, v] = FB[i], a = a0 + t * v * 1.6, r = r0 * (0.4 + 0.9 * luz), y = (y0 + t * 0.5 * v) % 3.4;
            F.P.set([px + Math.cos(a) * r, y, pz + Math.sin(a) * r], i * 3); F.C.set([0.49, 0.78, 1], i * 3); F.Z[i] = 0.09; F.A[i] = (0.4 + 0.6 * Math.sin(t * 7 + a0 * 5) ** 2) * (1 - range(t, 3.2, 4.6));
          }
          F.sync();
          for (let i = 0; i < NV; i++) { // vapor da respiração saindo da boca
            const [dx, dy, dz, k] = VB[i], u = range(t, 2.8 + k * 0.4, 4.2 + k * 0.4);
            V.P.set([px + 0.25 + dx * 0.4 * u + 0.5 * u, 1.75 + dy * 0.3 * u + 0.15 * u, pz - 0.3 + dz * 0.4 * u - 0.6 * u], i * 3); V.C.set([0.8, 0.88, 0.95], i * 3); V.Z[i] = 0.25 + u * 0.4; V.A[i] = 0.18 * Math.sin(Math.PI * u);
          }
          V.sync();
          st.bloom = 0.8;
          const e = ease.inOutCubic(range(t, 0, 5.31));
          const a = lerp(2.4, 3.6, e), d = lerp(3.2, 8.5, e);
          cam.position.set(px + Math.sin(a) * d, lerp(0.35, 6.2, e), pz + Math.cos(a) * d);
          cam.lookAt(px, lerp(1.6, 0.8, e), pz);
          st.sol(0, 20, 50);
          st.draw(S, cam, { cor: "#000000", a: 1 - luz });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
