<!-- f04: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f04.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 7.95 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f04-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f04" data-width="1080" data-height="1920">
    <canvas id="f04-canvas" width="1080" height="1920"></canvas>
    <div id="f04-r1" class="rot" style="top: 700px"><span id="f04-r1-in" class="rot-t"><span class="k">O AR</span><br>O ar <span class="y">também</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 7.95;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f04-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f04" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f04-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.2 * K);
      tl.to("#f04-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 1.6 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f04"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f04"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/pausa.js")
      ]).then(async ([K_, T, A, PAUSA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f04-canvas");

        // f04 — moléculas de ar (N₂ e O₂) voando a ~500 m/s com rastro; travam no ar (4,4 s). Depois a câmera recua e revela
        //       um rosto de perfil diante de uma "parede" de moléculas paradas: respirar seria puxar uma parede.
        const st = T.createToyStage(canvas, { fov: 46, ceu: ["#04060c", "#0e1626"], nevoa: [6, 34], corNevoa: "#070b14", nuvens: 0, exposicao: 1.15 });
        const S = st.scene, cam = st.cam;
        st.key.castShadow = false; st.key.intensity = 1.6; st.key.color.set(0xcfe4ff); st.hemi.intensity = 0.6; st.rim.color.set(0x7cc8ff); st.rim.intensity = 1.6;
        const MOL = PAUSA.moleculas(S, { n: 150, seed: 404, caixa: [-1.6, 14, -5, 6, -9, 5] });
        const PAR = PAUSA.moleculas(S, { n: 34, seed: 405, caixa: [-3.0, -2.45, -0.95, 0.55, -1.0, 1.0], cores: [0xff8a4c, 0xffb58a], o2: 0.3 });
        PAR.at.material = PAR.at.material.clone(); PAR.at.material.emissive = new THREE.Color(0xff6a2c); PAR.at.material.emissiveIntensity = 0;
        // rosto de perfil (humano grande) olhando para +x, boca diante da parede
        const H = PAUSA.pessoa({ cor: 0x2a3340, cabelo: 0x2b1d16 }); H.group.scale.setScalar(3.6); H.group.position.set(-4.3, -6.25, 0); S.add(H.group);
        const heroi = MOL.P[7]; heroi.v.set(1, 0.25, 0.4).normalize().multiplyScalar(7);
        MOL.at.setColorAt(14, new THREE.Color(0xff8a4c)); MOL.at.setColorAt(15, new THREE.Color(0xff8a4c));
        const TS = 4.35, TB = 5.1;
        function render(t) {
          const te = PAUSA.tMundo(t, TS, 0.22) * 0.55, vk = 1 - range(t, TS - 0.1, TS + 0.45);
          MOL.update(te, vk); PAR.update(te, 0);
          const parede = ease.inOutSine(range(t, 5.5, 7.3));
          PAR.at.material.emissiveIntensity = 0.9 * parede; PAR.at.visible = t > TB - 0.2;
          H.pose(t, { cabeca: 0.05, respira: Math.sin(Math.PI * range(t, 5.6, 7.4)) * 0.4 });
          H.group.visible = t > TB - 0.2;
          st.bloom = 0.6 + 0.3 * parede;
          let c0, l0;
          if (t < TB) { // voo entre as moléculas, seguindo a molécula-herói
            const e = ease.inOutSine(range(t, 0, TB));
            const hp = heroi.pos || new THREE.Vector3();
            cam.position.set(lerp(1.5, 6, e), lerp(-0.5, 1.2, e), lerp(5.5, 3.2, e));
            cam.lookAt(lerp(5, hp.x, range(t, 2.0, 2.8)), lerp(0.5, hp.y, range(t, 2.0, 2.8)), lerp(-3, hp.z, range(t, 2.0, 2.8)));
          } else { // recua e revela o rosto diante da parede
            const e = ease.inOutCubic(range(t, TB, 7.95));
            cam.position.set(lerp(1.2, -0.6, e), lerp(0.8, 0.9, e), lerp(3.2, 10.5, e));
            cam.lookAt(lerp(-1.8, -3.3, e), lerp(0.4, 0.3, e), 0);
          }
          cam.near = t < TB ? 0.9 : 0.05; cam.updateProjectionMatrix(); // não atravessar moléculas no voo
          st.sol(0, 0, 15);
          st.draw(S, cam, t > TB - 0.15 && t < TB + 0.15 ? { cor: "#05070d", a: 1 - Math.abs(t - TB) / 0.15 } : null);
          const c = st.ctx;
          if (t < TB && heroi.pos) {
            const [hx, hy, ok] = PAUSA.proj(heroi.pos, cam);
            const vel = t < 4.71 ? "500 m/s" : "0 m/s";
            if (ok) PAUSA.tag(c, hx, hy, hx > 540 ? hx - 200 : hx + 200, hy > 1000 ? hy - 260 : hy + 220, [["MOLÉCULA DE AR", PAUSA.AZUL], [vel, t < 4.71 ? "#fff" : PAUSA.LARANJA]], { a: PAUSA.vis(t, 2.7, TB - 0.05) });
          } else {
            const [wx, wy] = PAUSA.proj(new THREE.Vector3(-2.6, 1.2, 0), cam);
            PAUSA.tag(c, wx, wy, 700, 560, [["AR TRAVADO", PAUSA.LARANJA], ["uma parede", "#fff"]], { a: PAUSA.vis(t, 6.9, 7.95), cor: PAUSA.LARANJA });
            // seta de inspiração bloqueada
            const k = PAUSA.vis(t, 5.47, 7.95), [bx, by] = PAUSA.proj(new THREE.Vector3(-3.35, -0.05, 0), cam), [ax, ay] = PAUSA.proj(new THREE.Vector3(-0.4, -0.05, 0), cam);
            if (k > 0) { c.save(); c.globalAlpha = k; c.strokeStyle = PAUSA.AZUL; c.lineWidth = 6; c.setLineDash([18, 12]); c.beginPath(); c.moveTo(ax, ay); c.lineTo(lerp(ax, bx, 0.62), lerp(ay, by, 0.62)); c.stroke();
              c.setLineDash([]); c.strokeStyle = PAUSA.LARANJA; const xx = lerp(ax, bx, 0.62), yy = lerp(ay, by, 0.62); c.beginPath(); c.moveTo(xx - 22, yy - 22); c.lineTo(xx + 22, yy + 22); c.moveTo(xx + 22, yy - 22); c.lineTo(xx - 22, yy + 22); c.stroke(); c.restore();
              PAUSA.texto(c, "INSPIRAR", (ax + bx) / 2 + 60, ay + 60, { a: k, cor: PAUSA.AZUL, tam: 26, esp: 0.3 }); }
          }
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
