<!-- f13: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f13.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 7.59 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f13-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f13" data-width="1080" data-height="1920">
    <canvas id="f13-canvas" width="1080" height="1920"></canvas>
    <div id="f13-r1" class="rot" style="top: 700px"><span id="f13-r1-in" class="rot-t">Só você carrega<br><span class="y">esse tempo</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 7.59;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f13-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f13" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f13-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 4.45 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f13"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f13"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/pausa.js")
      ]).then(async ([K_, T, A, PAUSA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f13-canvas");

        // f13 — fechamento: o mesmo plano do gancho. Novo estalo (1,0 s): as contas de vidro voltam a ser chuva e todos voltam a andar.
        //       A câmera repete o avanço da abertura e depois contorna o protagonista (agora grisalho), parado no meio da multidão.
        const st = T.createToyStage(canvas, { fov: 44, ceu: ["#1a2336", "#b0735a"], nevoa: [18, 150], corNevoa: "#4b4f60", nuvens: 0, exposicao: 1.05 });
        const S = st.scene, cam = st.cam;
        const R = PAUSA.ruaChuva(S, st);
        const AN = PAUSA.anel(S);
        const TS = 1.0, TM = 1.17;
        const [px, , pz] = PAUSA.PROTA;
        R.p.setIdade(0.9);
        function render(t) {
          const tm = PAUSA.tVolta(t, TS, 0.7, TM), k = 1 - ease.inOutSine(range(t, TS, TS + 0.8));
          R.update(t, tm, { k });
          const br = lerp(0.05, 2.25, ease.outCubic(range(t, 0.25, 0.85))) * (1 - ease.inOutSine(range(t, 1.6, 2.4)));
          R.p.pose(t, { braco: br, abre: -0.25 - 0.75 * range(t, 0.25, 0.85) * (1 - range(t, 1.6, 2.4)) });
          const fl = AN.update(t, TS, [0.92, 1.92, 24.95]);
          st.vel = Math.sin(Math.PI * range(t, TS, TS + 1.0)) * 0.45; st.velT = t;
          st.bloom = 0.75 + 0.4 * fl;
          // 0–3,6 s: o mesmo avanço da abertura; 3,6 s em diante: contorna até ficar de frente para ele
          const e = ease.inOutSine(range(t, 0, 3.6)), e2 = ease.inOutCubic(range(t, 0.6, 3.6));
          const A1 = new THREE.Vector3(lerp(2.5, 1.9, e2), lerp(1.8, 1.7, e), lerp(30.8, 28.2, e));
          const ar = ease.inOutCubic(range(t, 3.2, 7.4)), ang = lerp(0.55, 2.75, ar), d = lerp(2.8, 2.3, ar);
          const A2 = new THREE.Vector3(px + Math.sin(ang) * d, lerp(1.7, 1.75, ar), pz + Math.cos(ang) * d);
          cam.position.lerpVectors(A1, A2, range(t, 3.2, 3.6) * 0 + ar);
          const L1 = new THREE.Vector3(lerp(0.4, 0.4, e), lerp(1.75, 1.65, e), lerp(22, 20, e)), L2 = new THREE.Vector3(px, 1.6, pz);
          cam.lookAt(new THREE.Vector3().lerpVectors(L1, L2, ease.inOutSine(range(t, 3.0, 5.0))));
          st.sol(0, 20, 50);
          st.draw(S, cam, fl > 0.01 ? { cor: "#dff1ff", a: fl * 0.35 } : null);
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
