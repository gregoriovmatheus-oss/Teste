<!-- f12: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f12.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 2.71 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f12-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f12" data-width="1080" data-height="1920">
    <canvas id="f12-canvas" width="1080" height="1920"></canvas>
    <div id="f12-r1" class="rot" style="top: 700px"><span id="f12-r1-in" class="rot-t">Quanto valeria <span class="y">um segundo</span><br>da sua vida?</span></div>
  </div>
  <script>
    (function () {
      const D0 = 2.71;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f12-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f12" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f12-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.35 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f12"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f12"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/pausa.js")
      ]).then(async ([K_, T, A, PAUSA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f12-canvas");

        // f12 — a pergunta: um único segundo luminoso flutuando entre as gotas paradas, com o anel de 60 marcas
        //       e só uma acesa. Dolly lento com leve órbita.
        const st = T.createToyStage(canvas, { fov: 40, ceu: ["#03050a", "#0b1020"], nevoa: [4, 30], corNevoa: "#05070d", nuvens: 0, exposicao: 1.1 });
        const S = st.scene, cam = st.cam;
        st.key.castShadow = false; st.hemi.intensity = 0.2;
        const nucleo = new THREE.Mesh(new THREE.SphereGeometry(0.32, 32, 20), new THREE.MeshBasicMaterial({ color: 0xffe2c8 })); nucleo.position.set(0, 2.2, 0); S.add(nucleo);
        const h1 = PAUSA.glow(0xff9a5a, 2.6, S), h2 = PAUSA.glow(0xffe8d0, 1.2, S); h1.position.copy(nucleo.position); h2.position.copy(nucleo.position);
        const tick = new THREE.InstancedMesh(new THREE.BoxGeometry(0.02, 0.12, 0.02), new THREE.MeshBasicMaterial({ color: 0xffffff }), 60); S.add(tick);
        const o = new THREE.Object3D();
        for (let i = 0; i < 60; i++) { const a = (i / 60) * Math.PI * 2; o.position.set(Math.sin(a) * 0.95, 2.2 + Math.cos(a) * 0.95, 0); o.rotation.set(0, 0, -a); o.scale.set(i % 5 ? 1 : 1.6, i % 5 ? 1 : 1.6, 1); o.updateMatrix(); tick.setMatrixAt(i, o.matrix); tick.setColorAt(i, new THREE.Color(i ? 0x3a5b7a : 0xff8a4c)); }
        const ch = PAUSA.chuva(S, { n: 2600, seed: 121, caixa: [-5, 5, 0, 5, -6, 4], tam: 0.6 }); ch.update(1.17, 1);
        function render(t) {
          const p = 0.5 + 0.5 * Math.sin(t * 3.2);
          h1.scale.setScalar(2.4 + 0.5 * p); h2.material.opacity = 0.7 + 0.3 * p;
          tick.rotation.z = 0; st.bloom = 1.0;
          const e = ease.inOutSine(range(t, 0, 2.71)), a = lerp(-0.35, 0.2, e);
          cam.position.set(Math.sin(a) * lerp(5.6, 3.4, e), lerp(2.6, 2.3, e), Math.cos(a) * lerp(5.6, 3.4, e));
          cam.lookAt(0, lerp(2.0, 2.2, e), 0);
          st.draw();
          const [x, y] = PAUSA.proj(nucleo.position, cam);
          PAUSA.texto(st.ctx, "1 s", x, y, { a: range(t, 0.2, 0.6), cor: "#2a1408", tam: 44, peso: 600, alinha: "center", esp: 0 });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
