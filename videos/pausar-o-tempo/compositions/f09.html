<!-- f09: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f09.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 6.05 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f09-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f09" data-width="1080" data-height="1920">
    <canvas id="f09-canvas" width="1080" height="1920"></canvas>

  </div>
  <script>
    (function () {
      const D0 = 6.05;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f09-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f09" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });

      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f09"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f09"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/pausa.js")
      ]).then(async ([K_, T, A, PAUSA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f09-canvas");

        // f09 — a ampulheta pessoal no asfalto molhado, escorrendo enquanto a chuva está parada em volta.
        //       Um grão acende (1 dia a menos), depois cai uma rajada (1 ano). A câmera sobe e revela o protagonista e a multidão congelada.
        const st = T.createToyStage(canvas, { fov: 40, ceu: ["#1a2336", "#b0735a"], nevoa: [14, 140], corNevoa: "#4b4f60", nuvens: 0, exposicao: 1.05 });
        const S = st.scene, cam = st.cam;
        const R = PAUSA.ruaChuva(S, st);
        const TM = 1.17; R.update(0, TM, { k: 1 });
        const [px, , pz] = PAUSA.PROTA;
        R.p.group.position.set(px, 0, pz); R.p.group.rotation.y = -Math.PI / 2 + 0.2;
        const AM = PAUSA.ampulheta(), s = 0.36; AM.scale.setScalar(s); AM.position.set(px - 0.3, 1.15 * s + 0.12, pz - 2.0); S.add(AM);
        const luzA = new THREE.PointLight(0xff9a50, 4, 4, 1.5); luzA.position.set(px - 0.3, 0.4, pz - 2.0); S.add(luzA);
        function render(t) {
          const k = 0.3 + 0.04 * t + 0.16 * ease.inOutSine(range(t, 2.4, 3.2));
          AM.set(k, t, 1);
          R.p.setIdade(0.25 * range(t, 3.3, 6.0)); R.p.pose(t, {});
          st.bloom = 0.8;
          const e = ease.inOutSine(range(t, 0, 6.05)), up = ease.inOutCubic(range(t, 2.9, 6.05));
          const a = lerp(-0.5, 0.5, e), d = lerp(1.25, 4.6, up);
          const cx = px - 0.3, cz = pz - 2.0;
          cam.position.set(cx + Math.sin(a) * d, lerp(0.42, 2.1, up), cz - Math.cos(a) * d);
          cam.lookAt(cx, lerp(0.38, 1.0, up), lerp(cz, cz + 1.2, up));
          st.sol(0, 20, 50);
          st.draw();
          const c = st.ctx;
          const [ax, ay] = PAUSA.proj(AM.localToWorld(new THREE.Vector3(0, -0.45, 0)), cam);
          PAUSA.tag(c, ax, ay, ax + (ax < 540 ? 200 : -200), ay - 380, [["UM DIA PAUSADO", PAUSA.LARANJA], ["−1 dia", "#fff"]], { a: PAUSA.vis(t, 1.1, 2.3), cor: PAUSA.LARANJA });
          PAUSA.tag(c, ax, ay, ax + (ax < 540 ? 200 : -200), ay - 380, [["UM ANO PAUSADO", PAUSA.LARANJA], ["−365 dias", "#fff"]], { a: PAUSA.vis(t, 2.4, 3.6), cor: PAUSA.LARANJA });
          const v = PAUSA.vis(t, 3.3, 6.05);
          PAUSA.painel(c, 290, 1360, "VOCÊ", "+1 ano", { a: v, cor: PAUSA.LARANJA, tam: 70 });
          PAUSA.painel(c, 790, 1360, "TODOS OS OUTROS", "+0 s", { a: v * range(t, 4.6, 4.9), cor: PAUSA.AZUL, tam: 70 });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
