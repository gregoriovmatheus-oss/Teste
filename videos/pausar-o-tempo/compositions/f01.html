<!-- f01: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f01.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 4.14 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f01-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f01" data-width="1080" data-height="1920">
    <canvas id="f01-canvas" width="1080" height="1920"></canvas>
    <div id="f01-r1" class="rot" style="top: 700px"><span id="f01-r1-in" class="rot-t"><span class="k">UM EXPERIMENTO MENTAL</span><br>E se você pudesse <span class="y">pausar o tempo?</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 4.14;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f01-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f01" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f01-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.05 * K);
      tl.to("#f01-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 1.85 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f01"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f01"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/pausa.js")
      ]).then(async ([K_, T, A, PAUSA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f01-canvas");

        // f01 — gancho: rua na chuva ao entardecer. Estalo de dedos (0,85 s): anel azul, a chuva desacelera em câmera lenta
        //       e vira contas de vidro paradas; a câmera passa pelo ombro do protagonista e atravessa as gotas congeladas.
        const st = T.createToyStage(canvas, { fov: 44, ceu: ["#1a2336", "#b0735a"], nevoa: [18, 150], corNevoa: "#4b4f60", nuvens: 0, exposicao: 1.05 });
        const S = st.scene, cam = st.cam;
        const R = PAUSA.ruaChuva(S, st);
        const AN = PAUSA.anel(S);
        // gota-herói (conta de vidro) por onde a câmera passa
        const heroi = new THREE.Mesh(PAUSA.SPH_L, new THREE.MeshStandardMaterial({ color: 0xdff0ff, roughness: 0.02, metalness: 0.2, transparent: true, opacity: 0.55, envMapIntensity: 3 }));
        heroi.scale.setScalar(0.045); heroi.position.set(0.15, 1.5, 19.4); S.add(heroi);
        const hg = PAUSA.glow(0xcfe6ff, 0.35, S); hg.position.copy(heroi.position);
        const TS = 0.85;
        function render(t) {
          const tm = PAUSA.tMundo(t, TS, 0.32), k = ease.inOutSine(range(t, 0.95, 1.8));
          R.update(t, tm, { k });
          heroi.visible = hg.visible = t > 1.3;
          // protagonista levanta a mão e estala os dedos
          const br = lerp(0.05, 2.25, ease.outCubic(range(t, 0.15, 0.7))) - 0.15 * Math.sin(Math.PI * range(t, 0.8, 0.95));
          R.p.pose(tm, { braco: br, abre: -0.25 - 0.75 * range(t, 0.15, 0.7) });
          const fl = AN.update(t, TS, [0.92, 1.92, 24.95]);
          st.vel = Math.sin(Math.PI * range(t, TS, 1.9)) * 0.5; st.velT = t;
          st.bloom = 0.75 + 0.4 * fl;
          // câmera: sobre o ombro, depois atravessa as gotas paradas rumo à faixa congelada
          const e = ease.inOutSine(range(t, 0, 4.14)), e2 = ease.inOutCubic(range(t, 1.2, 4.14));
          cam.position.set(lerp(2.5, 0.35, e2), lerp(1.8, 1.55, e) + 0.12 * Math.sin(Math.PI * e2), lerp(30.8, 23.2, e) - e2 * 0.0);
          cam.lookAt(lerp(0.4, 0.2, e), lerp(1.75, 1.45, e), lerp(22, 12, e));
          st.sol(0, 20, 50);
          st.T = t + 0.2; // gancho: sem o dip de entrada no frame 0 (o vídeo começa já na chuva)
          st.draw(S, cam, fl > 0.01 ? { cor: "#dff1ff", a: fl * 0.35 } : null);
          // etiqueta na gota-herói: "chuva suspensa"
          const [hx, hy] = PAUSA.proj(heroi.position, cam);
          PAUSA.tag(st.ctx, hx, hy, 690, 560, [["CHUVA SUSPENSA", PAUSA.AZUL], ["0 m/s", "#fff"]], { a: PAUSA.vis(t, 2.35, 4.1, 0.3) });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
