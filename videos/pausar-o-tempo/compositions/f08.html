<!-- f08: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f08.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 6.3 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f08-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f08" data-width="1080" data-height="1920">
    <canvas id="f08-canvas" width="1080" height="1920"></canvas>
    <div id="f08-r1" class="rot" style="top: 700px"><span id="f08-r1-in" class="rot-t"><span class="k">VIDA MÉDIA NO PLANETA</span><br><span class="y">73 anos</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 6.3;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f08-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f08" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f08-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.2 * K);
      tl.to("#f08-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.85 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f08"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f08"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/pausa.js")
      ]).then(async ([K_, T, A, PAUSA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f08-canvas");

        // f08 — 73 anos ≈ 26.700 dias: uma parede de pontos, 1 coluna = 1 ano (366 linhas). Os dias acendem em ordem
        //       enquanto a câmera recua do primeiro dia até revelar a vida inteira.
        const st = T.createToyStage(canvas, { fov: 40, ceu: ["#04060c", "#0b1120"], nevoa: null, nuvens: 0, exposicao: 1.1 });
        const S = st.scene, cam = st.cam;
        st.key.castShadow = false;
        const COL = 73, LIN = 366, N = 26700, sp = 0.12, G = PAUSA.pontos(S, N, { tam: 1, atenua: 3000 });
        const x0 = -(COL - 1) * sp / 2, y0 = -(LIN - 1) * sp / 2;
        for (let i = 0; i < N; i++) { const cx = Math.floor(i / LIN), ly = i % LIN; G.P.set([x0 + cx * sp, y0 + ly * sp, 0], i * 3); G.Z[i] = 0.075; }
        const ch = PAUSA.chuva(S, { n: 1600, seed: 88, caixa: [-30, 30, -30, 30, -40, 20], tam: 2 }); ch.update(1.17, 1); ch.mat.uniforms.uA.value = 0.35;
        function render(t) {
          const aceso = N * ease.inOutSine(range(t, 0.25, 5.56));
          for (let i = 0; i < N; i++) {
            const k = clamp(aceso - i), novo = Math.exp(-Math.max(0, aceso - i) / 120);
            G.C.set(k > 0 ? [lerp(1, 0.95, 1 - novo), lerp(0.93, 0.85, 1 - novo), lerp(0.8, 0.7, 1 - novo)] : [0.12, 0.2, 0.32], i * 3);
            G.A[i] = k > 0 ? 0.75 + 0.6 * novo : 0.5; G.Z[i] = 0.075 * (1 + novo * 0.6);
          }
          G.sync();
          st.bloom = 0.6;
          // recua do 1º dia (canto de baixo, à esquerda) até ver a parede inteira
          const e = ease.inOutCubic(range(t, 0, 6.3));
          const tx = lerp(x0 + 0.6, 0, e), ty = lerp(y0 + 1.2, 0, e);
          cam.position.set(tx + lerp(0.6, 6, e), ty + lerp(-0.4, -4, e), lerp(2.2, 66, e));
          cam.lookAt(tx, ty, 0);
          st.draw();
          const c = st.ctx;
          PAUSA.painel(c, 540, 1360, "DIAS DE VIDA", PAUSA.fmt(Math.min(26700, aceso)), { a: PAUSA.vis(t, 0.3, 6.3), cor: PAUSA.AZUL, tam: 84, sub: t > 4.1 ? "≈ 26.700 DIAS" : "1 PONTO = 1 DIA" });
          PAUSA.texto(c, "1 COLUNA = 1 ANO", 540, 1520, { a: PAUSA.vis(t, 2.4, 6.3) * 0.9, cor: "#cfe3f5", tam: 24, alinha: "center", esp: 0.3 });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
