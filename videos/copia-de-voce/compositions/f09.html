<!-- f09: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f09.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.71 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f09-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f09" data-width="1080" data-height="1920">
    <canvas id="f09-canvas" width="1080" height="1920"></canvas>
    <div id="f09-r1" class="rot" style="top: 700px"><span id="f09-r1-in" class="rot-t">Gêmeos <span class="y">idênticos</span></span></div>
    <div id="f09-r2" class="rot" style="top: 700px"><span id="f09-r2-in" class="rot-t"><span class="k">EPIGENÉTICA</span><br>Marcas <span class="y">diferentes</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.71;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f09-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f09" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f09-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.1 * K);
      tl.to("#f09-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.0 * K);
      tl.fromTo("#f09-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 4.41 * K);
      tl.to("#f09-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 5.41 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f09"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f09"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/copia.js")
      ]).then(async ([K_, T, A, COPIA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f09-canvas");

        // Duas duplas hélices iguais; com os anos surgem marcas epigenéticas (pontos laranja) em lugares diferentes.
        const st = T.createToyStage(canvas, { ceu: "#04070f", nevoa: [5, 20], corNevoa: "#04070f", fov: 46, nuvens: 0 });
        const S = st.scene, cam = st.cam;
        S.environment = null; st.bloom = 0.8;
        st.key.color.set(0xdfeeff); st.key.intensity = 2.0; st.rim.color.set(0x7cc8ff); st.rim.intensity = 2.0; st.hemi.intensity = 0.5;
        await COPIA.fontes();
        const NB = 34, passo = 0.17, R = 0.42;
        const esf = new THREE.SphereGeometry(0.075, 10, 8), deg = new THREE.CylinderGeometry(0.03, 0.03, 1, 6);
        const cores = [0x7cc8ff, 0x9fe0c8, 0xf2d27a, 0xe8a0c8].map((c) => new THREE.Color(c));
        const O = new THREE.Object3D(), Y = new THREE.Vector3(0, 1, 0);
        const helices = [-0.85, 0.85].map((x0, h) => {
          const g = new THREE.Group(); g.position.x = x0; S.add(g);
          const bb = new THREE.InstancedMesh(esf, new THREE.MeshStandardMaterial({ color: 0xcfe4ff, roughness: 0.3, metalness: 0.2, emissive: 0x1a3550 }), NB * 2);
          const rg = new THREE.InstancedMesh(deg, new THREE.MeshStandardMaterial({ roughness: 0.5 }), NB * 2);
          const pos = [];
          for (let i = 0; i < NB; i++) {
            const a = i * 0.6, y = i * passo;
            const p1 = new THREE.Vector3(Math.cos(a) * R, y, Math.sin(a) * R), p2 = new THREE.Vector3(-Math.cos(a) * R, y, -Math.sin(a) * R);
            pos.push(p1, p2);
            O.position.copy(p1); O.scale.setScalar(1); O.rotation.set(0, 0, 0); O.updateMatrix(); bb.setMatrixAt(i * 2, O.matrix);
            O.position.copy(p2); O.updateMatrix(); bb.setMatrixAt(i * 2 + 1, O.matrix);
            const m = p1.clone().lerp(p2, 0.5);
            for (const [k, q] of [[0, p1], [1, p2]]) {
              const mid = q.clone().lerp(m, 0.5), d = m.clone().sub(q);
              O.position.copy(mid); O.quaternion.setFromUnitVectors(Y, d.clone().normalize()); O.scale.set(1, d.length(), 1); O.updateMatrix();
              rg.setMatrixAt(i * 2 + k, O.matrix); rg.setColorAt(i * 2 + k, cores[(i * 3 + k * 2) % 4]);
              O.quaternion.identity();
            }
          }
          g.add(bb, rg);
          // marcas: posições e momentos sorteados com sementes diferentes
          const rr = mulberry32(900 + h * 77), M = [];
          for (let k = 0; k < 22; k++) M.push({ i: Math.floor(rr() * NB * 2), t0: 2.55 + rr() * 2.3 });
          const mk = new THREE.InstancedMesh(new THREE.SphereGeometry(0.06, 10, 8), new THREE.MeshStandardMaterial({ color: 0xff8a4c, emissive: 0xff6a20, emissiveIntensity: 1.2, roughness: 0.3 }), M.length);
          g.add(mk);
          const halos = M.map(() => { const s = COPIA.brilho(0xff8a4c, 0.35, 0); g.add(s); return s; });
          return { g, pos, M, mk, halos };
        });
        const v = new THREE.Vector3();
        function render(t) {
          helices.forEach((H, h) => {
            H.g.rotation.y = t * 0.5 + h * 0.4;
            H.M.forEach((m, k) => {
              const s = ease.outBack(range(t, m.t0, m.t0 + 0.35)), p = H.pos[m.i];
              O.position.copy(p).multiplyScalar(1.28); O.position.y = p.y; O.rotation.set(0, 0, 0); O.scale.setScalar(Math.max(0.0001, s)); O.updateMatrix(); H.mk.setMatrixAt(k, O.matrix);
              H.halos[k].position.copy(O.position); H.halos[k].material.opacity = range(t, m.t0, m.t0 + 0.2) * (0.5 + 0.5 * (t > 4.41 ? Math.sin(t * 9 + k) * 0.5 + 0.5 : 0.4));
            });
            H.mk.instanceMatrix.needsUpdate = true;
          });
          // grua subindo ao longo das hélices
          const e = ease.inOutSine(range(t, 0, 5.71));
          cam.position.set(lerp(-1.2, 1.0, e), lerp(0.6, 4.4, e), lerp(5.0, 4.3, e));
          cam.lookAt(0, lerp(1.6, 3.6, e), 0);
          st.sol(0, 0, 5);
          st.draw();
          const c = st.ctx, a = COPIA.vis(st);
          const tg = a * range(t, 0.3, 0.6) * (1 - range(t, 2.3, 2.5));
          COPIA.tag(c, cam, v.set(-0.85, 3.4, 0), "GÊMEO A", { a: tg, dx: -60, dy: -150 });
          COPIA.tag(c, cam, v.set(0.85, 3.4, 0), "GÊMEO B", { a: tg, dx: 60, dy: -150 });
          const anos = Math.round(50 * range(t, 2.55, 4.85)), ca = a * range(t, 2.45, 2.65) * (1 - range(t, 4.3, 4.45));
          COPIA.txt(c, "IDADE DOS GÊMEOS", 540, 740, { tam: 24, cor: COPIA.AZUL, a: ca });
          COPIA.txt(c, anos + " ANOS", 540, 800, { tam: 56, a: ca, esp: 0.04 });
          COPIA.txt(c, "● MARCA EPIGENÉTICA", 540, 870, { tam: 22, cor: COPIA.LARANJA, a: ca });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
