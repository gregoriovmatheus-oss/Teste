<!-- f04: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f04.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 4.2 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f04-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f04" data-width="1080" data-height="1920">
    <canvas id="f04-canvas" width="1080" height="1920"></canvas>
    <div id="f04-r1" class="rot" style="top: 700px"><span id="f04-r1-in" class="rot-t">Quem é o <span class="y">original?</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 4.2;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f04-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f04" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f04-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.95 * K);
      tl.to("#f04-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.9 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f04"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f04"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/copia.js")
      ]).then(async ([K_, T, A, COPIA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f04-canvas");

        // Palco escuro: as duas pessoas de pé, frente a frente, iguais. "ORIGINAL?" pisca sobre uma e outra.
        const st = T.createToyStage(canvas, { ceu: "#05070d", nevoa: [8, 26], fov: 50, nuvens: 0 });
        const S = st.scene, cam = st.cam;
        COPIA.estudio(st);
        await COPIA.fontes();
        const EU = COPIA.pessoa({ fase: 0.1 }), CO = COPIA.pessoa({ fase: 0.1 });
        EU.emPe(-0.85, 0, 0); CO.emPe(0.85, 0, Math.PI); S.add(EU.p, CO.p);
        EU.olhos(1); CO.olhos(1);
        // poças de luz sob cada um
        const poca = (x) => { const m = new THREE.Mesh(new THREE.CircleGeometry(0.9, 40), new THREE.MeshBasicMaterial({ map: COPIA.glowTex(), color: 0x7cc8ff, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
          m.rotation.x = -Math.PI / 2; m.position.set(x, 0.01, 0); S.add(m); return m; };
        const pA = poca(-0.85), pB = poca(0.85);
        const linha = new THREE.Mesh(new THREE.PlaneGeometry(0.012, 3.2), new THREE.MeshBasicMaterial({ color: 0x7cc8ff, transparent: true, opacity: 0.5, toneMapped: false }));
        linha.position.set(0, 1.0, 0); S.add(linha);
        const v = new THREE.Vector3();
        function render(t) {
          EU.update(t, {}); CO.update(t, {});
          EU.olha(0, Math.sin(t * 0.9) * 0.03); CO.olha(0, Math.sin(t * 0.9) * 0.03);
          // órbita lenta e baixa, de trás de uma até o perfil das duas
          const e = ease.inOutSine(range(t, 0, 4.2)), ang = lerp(-0.95, 0.55, e), R = lerp(5.6, 4.4, e);
          cam.position.set(Math.sin(ang) * R, lerp(0.9, 1.35, e), Math.cos(ang) * R);
          cam.lookAt(0, lerp(1.25, 1.05, e), 0);
          // o rótulo pula de um para o outro: a luz acompanha
          const pis = t < 0.99 ? -1 : Math.floor((t - 0.99) / 0.32) % 2;
          pA.material.opacity = pis === 0 ? 0.42 : 0.16; pB.material.opacity = pis === 1 ? 0.42 : 0.16;
          linha.material.opacity = 0.25 + 0.25 * Math.sin(t * 6);
          st.sol(0, 0, 4);
          st.draw();
          const c = st.ctx, a = COPIA.vis(st);
          if (t > 0.99) {
            const fl = (k) => (pis === k ? 1 : 0.28);
            COPIA.tag(c, cam, EU.cabeca(0.3), "ORIGINAL?", { cor: COPIA.LARANJA, a: a * fl(0), dx: 0, dy: -150, tam: 30 });
            COPIA.tag(c, cam, CO.cabeca(0.3), "ORIGINAL?", { cor: COPIA.LARANJA, a: a * fl(1), dx: 0, dy: -150, tam: 30 });
          }
          COPIA.txt(c, "UM DEBATE DE SÉCULOS", 540, 1010 - 400, { tam: 24, cor: COPIA.AZUL, a: a * range(t, 1.85, 2.2) });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
