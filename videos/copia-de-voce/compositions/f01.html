<!-- f01: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f01.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 3.42 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f01-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f01" data-width="1080" data-height="1920">
    <canvas id="f01-canvas" width="1080" height="1920"></canvas>
    <div id="f01-r1" class="rot" style="top: 700px"><span id="f01-r1-in" class="rot-t"><span class="k">UM EXPERIMENTO MENTAL</span><br>E se você acordasse com uma <span class="y">cópia</span>?</span></div>
  </div>
  <script>
    (function () {
      const D0 = 3.42;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f01-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f01" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f01-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.85 * K);
      tl.to("#f01-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.12 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f01"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f01"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/copia.js")
      ]).then(async ([K_, T, A, COPIA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f01-canvas");

        // Gancho: quarto na luz azul do amanhecer. Você abre os olhos, vira, e ao lado está você mesmo dormindo.
        const st = T.createToyStage(canvas, { ceu: "#081120", nevoa: [6, 22], fov: 50, nuvens: 0 });
        const S = st.scene, cam = st.cam;
        COPIA.amanhecer(st);
        await COPIA.fontes();
        const Q = COPIA.quarto(S);
        const EU = COPIA.pessoa({ fase: 0.1 }), CO = COPIA.pessoa({ fase: 0.6 });
        EU.deitar(-0.47, 0.9); CO.deitar(0.47, 0.9); S.add(EU.p, CO.p);
        const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
        function render(t) {
          // acorda (0,29 s), vira para o lado (0,69 s) e vê a cópia (1,83 s)
          EU.olhos(t > 0.32 ? 1 : 0);
          const vira = ease.inOutCubic(range(t, 0.69, 1.4));
          EU.olha(vira * 1.15, Math.sin(t * 1.3) * 0.02);
          CO.olha(-0.18 + Math.sin(t * 0.9) * 0.02, 0); CO.olhos(0);
          EU.update(t, {}); CO.update(t, {});
          Q.celA.tela(0); Q.celB.tela(0);
          // câmera: de rente ao rosto dele, sobe por cima da cama e revela a cópia; push-in lento até o fim
          const e1 = ease.inOutCubic(range(t, 0.55, 2.1)), e2 = ease.inOutSine(range(t, 1.9, 3.42));
          const p0 = v3(-0.62, 2.05, -0.35), p1 = v3(-0.05, 4.3, 0.75), p2 = v3(0.12, 3.6, 0.55);
          const l0 = v3(-0.47, 0.98, -0.78), l1 = v3(0.0, 0.8, -0.08), l2 = v3(0.12, 0.85, -0.22);
          const P = p0.clone().lerp(p1, e1).lerp(p2, e2), L = l0.clone().lerp(l1, e1).lerp(l2, e2);
          cam.position.copy(P); cam.position.x += Math.sin(t * 0.7) * 0.03; cam.lookAt(L);
          st.sol(0, 0, 4);
          st.draw();
          const c = st.ctx, a = COPIA.vis(st);
          COPIA.tag(c, cam, EU.cabeca(0.04, 0.2), "VOCÊ", { a: a * range(t, 0.35, 0.7) * (1 - range(t, 1.6, 1.9)), dx: -150, dy: -150 });
          COPIA.tag(c, cam, CO.cabeca(0.04, 0.2), "VOCÊ?", { cor: COPIA.LARANJA, a: a * range(t, 1.85, 2.15), dx: 120, dy: -170 });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
