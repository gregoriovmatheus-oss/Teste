<template>

  </style>
  <div id="root" data-composition-id="f01" data-width="1080" data-height="1920">
    <canvas id="f01-canvas" width="1080" height="1920"></canvas>

  </div>
  <script>
    (function () {
      const D0 = 5.21;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f01-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f01" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });

      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f01"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f01"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/lowpoly.js"), import("./assets/lib/blocks/cinema.js"), import("./assets/lib/blocks/idade.js")
      ]).then(async ([K_, T, A, LOWPOLY, CINEMA, IDADE]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f01-canvas");

const LP = LOWPOLY, CI = CINEMA, ID = IDADE;
await ID.prepara();
const st = LP.palco(canvas, { foco: 2.1, faixa: 0.9, desfoque: 22, bloom: 0.55 });
const { S, cam } = st;
LP.luz(st, "interior"); st.exposicao = 1.0; st.quente.intensity = 1.7; st.quente.position.set(1.2, 2.2, 3.0); st.hemi.intensity = 0.8;
CI.cenario(S, "cozinha"); st.sol(new THREE.Vector3(-2.94, 1.6, -1.2), 1.0);
LP.bokeh(S, { n: 30, seed: 5, y: [0.8, 2.8], z: [-6, -3], cores: [0xffd08a, 0xff8a4c, 0x7cc8ff, 0xff6a9a] });
const poe = LP.poeira(S, { n: 60, centro: [0, 1.6, 0.3], raio: [0.9, 0.6, 0.5], cor: 0xffd89a });
const p = ID.heroi(LP, { camisa: 0x2f6f9a }); S.add(p.root);
const B = ID.bolo(LP); S.add(B.g); B.g.position.set(0, 1.24, 0.34); B.g.scale.setScalar(0.75);
const R = new THREE.Vector3(0, 1.62, 0.06), v = new THREE.Vector3();
function render(t) {
  if (t < 0.17) st.T = 0.17;  // quadro 0 = miniatura: sem o dip escuro de entrada
  // segura o bolo "25" sorrindo; em "parar ali" (2,3 s) surpresa; em "nunca mais envelheceria" volta a sorrir
  CI.trilho(cam, t, [[0, [0.5, 1.55, 2.25], [0, 1.19, 0.1]], [2.6, [0.3, 1.53, 2.1], [0, 1.19, 0.1]], [5.21, [0.08, 1.52, 1.9], [0, 1.2, 0.1]]], { mao: 1, seed: 3 });
  LP.ator(p, t, { seed: 12, emocao: t < 2.2 ? ["alegre", "alegre", 1] : t < 3.4 ? ["alegre", "surpresa", range(t, 2.25, 2.6)] : ["surpresa", "alegre", range(t, 3.5, 4.1)], olharPara: cam.position, olharK: 0.7 });
  p.root.updateMatrixWorld(true);
  LP.alcancar(p, 0, v.set(0.14, 1.23, 0.33), 1, { polo: new THREE.Vector3(1, -0.6, -0.4) });
  LP.alcancar(p, 1, v.set(-0.14, 1.23, 0.33), 1, { polo: new THREE.Vector3(-1, -0.6, -0.4) });
  B.g.position.y = 1.24 + 0.006 * Math.sin(t * 2.2); B.update(t);
  CI.focoEntre(st, R, B.vela.getWorldPosition(v), 0.35); CI.preenche(st, R, { forca: 1.5 }); poe.update(t);
  st.draw();
  const c = st.ctx;
  ID.titulo(c, "", ["E se você *parasse aos 25*?"], 1 - range(t, 1.9, 2.3), { y: 985, tam: 62 });
  ID.txt(c, "NUNCA MAIS ENVELHECER", 540, 975, { tam: 30, cor: ID.AZUL, a: range(t, 3.48, 3.8), esp: 0.3 });
}

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
