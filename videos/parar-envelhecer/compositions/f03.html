const p = ID.heroi(LP, { roupa: "pijama", camisa: 0x8ab0c8 }); p.root.position.set(0.5, 0.92, -0.45); S.add(p.root);

}

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
