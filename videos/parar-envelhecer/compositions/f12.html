<!-- f12: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f12.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.72 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f12-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f12" data-width="1080" data-height="1920">
    <canvas id="f12-canvas" width="1080" height="1920"></canvas>

  </div>
  <script>
    (function () {
      const D0 = 5.72;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f12-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f12" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });

      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f12"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f12"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/idade.js")
      ]).then(async ([K_, T, A, IDADE]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f12-canvas");

const ID = IDADE;
await ID.prepara();
const st = ID.palcoDoc(T, canvas, { fov: 34, ceu: "#02040a" });
const S = st.scene, cam = st.cam;
st.scene.children.filter((o) => o.geometry && o.geometry.type === "CircleGeometry").forEach((o) => (o.visible = false));
// Terra facetada: continentes secos e cinzentos que esverdeiam a partir de um ponto em "cuidasse melhor"
const geo = new THREE.IcosahedronGeometry(1, 4), P = geo.attributes.position, cor = new Float32Array(P.count * 3), base = [];
const ruido = (x, y, z) => Math.sin(x * 3.1 + 1.3) * Math.cos(y * 2.7 - 0.4) + Math.sin(z * 3.7 + x * 1.9) * 0.7 + Math.sin(y * 5.3 + z * 4.1) * 0.35;
const ORIG = new THREE.Vector3(0.3, 0.4, 0.86).normalize(), q = new THREE.Vector3();
for (let i = 0; i < P.count; i += 3) { q.set(0, 0, 0); for (let j = 0; j < 3; j++) q.add(new THREE.Vector3().fromBufferAttribute(P, i + j)); q.normalize();
  const terra = ruido(q.x, q.y, q.z) > 0.35, gelo = Math.abs(q.y) > 0.88; for (let j = 0; j < 3; j++) base.push([terra, gelo, q.angleTo(ORIG)]); }
geo.setAttribute("color", new THREE.BufferAttribute(cor, 3));
const terra = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.7 })); terra.position.y = 1.2; S.add(terra);
const atm = ID.brilho(0x6ab8ff, 3.0, "suave", 0.55); atm.position.copy(terra.position); atm.position.z = -0.3; S.add(atm);
const est = new THREE.BufferGeometry(), r = mulberry32(9), ep = []; for (let i = 0; i < 500; i++) { const a = r() * 6.283, b = r() * 2 - 1, R = 30; ep.push(Math.cos(a) * Math.sqrt(1 - b * b) * R, b * R, Math.sin(a) * Math.sqrt(1 - b * b) * R - 10); }
est.setAttribute("position", new THREE.Float32BufferAttribute(ep, 3)); S.add(new THREE.Points(est, new THREE.PointsMaterial({ color: 0xffffff, size: 0.06 })));
st.key.position.set(-4, 3, 5);
const al = new THREE.Vector3(), c3 = new THREE.Color(), seco = new THREE.Color(0x8a7a62), verde = new THREE.Color(0x3f8a3a), mar = new THREE.Color(0x1d4a8a), gelo = new THREE.Color(0xeef4ff);
function render(t) {
  const onda = ease.inOutSine(range(t, 2.75, 5.0)) * 3.3;
  base.forEach(([tt, g, ang], i) => { if (g) c3.copy(gelo); else if (!tt) c3.copy(mar); else c3.copy(seco).lerp(verde, Math.min(1, Math.max(0, (onda - ang) / 0.4)));
    cor[i * 3] = c3.r; cor[i * 3 + 1] = c3.g; cor[i * 3 + 2] = c3.b; });
  geo.attributes.color.needsUpdate = true;
  terra.rotation.y = -0.4 + t * 0.12; terra.rotation.x = 0.2;
  const e = ease.inOutSine(range(t, 0, 5.72));
  cam.position.set(lerp(1.6, -0.6, e), lerp(1.7, 1.4, e), lerp(11, 8.5, e)); al.set(0, lerp(0.7, 0.75, e), 0); cam.lookAt(al);
  st.bloom = 0.7; st.draw();
  const c = st.ctx;
  ID.txt(c, "TANTO TEMPO PELA FRENTE", 540, 700, { tam: 30, cor: ID.AZUL, a: range(t, 0.48, 0.8) * (1 - range(t, 2.5, 2.7)), esp: 0.28 });
  ID.txt(c, "CUIDAR MELHOR DO PLANETA", 540, 985, { tam: 34, cor: "#fff", a: range(t, 3.26, 3.5), esp: 0.2 });
}

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
