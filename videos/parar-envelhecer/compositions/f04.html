<!-- f04: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f04.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.04 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f04-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f04" data-width="1080" data-height="1920">
    <canvas id="f04-canvas" width="1080" height="1920"></canvas>
    <div id="f04-r1" class="rot" style="top: 700px"><span id="f04-r1-in" class="rot-t"><span class="k">RISCO DE MORTE POR ANO</span><br><span class="y">1 em 1.000</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.04;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f04-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f04" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f04-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 3.69 * K);
      tl.to("#f04-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 4.74 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f04"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f04"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/idade.js")
      ]).then(async ([K_, T, A, IDADE]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f04-canvas");

const ID = IDADE;
await ID.prepara();
const st = ID.palcoDoc(T, canvas, { fov: 34 });
const S = st.scene, cam = st.cam;
// 1.000 pessoas = 1.000 pontos (40 × 25); uma acende em laranja em "1 em mil"
const N = 1000, C = 40, geo = new THREE.OctahedronGeometry(0.035, 0), m = new THREE.MeshStandardMaterial({ color: 0x9fd6ff, emissive: 0x7cc8ff, emissiveIntensity: 0.6, roughness: 0.3 });
const im = new THREE.InstancedMesh(geo, m, N); S.add(im);
const o = new THREE.Object3D(), pos = [];
for (let i = 0; i < N; i++) { const x = (i % C - (C - 1) / 2) * 0.12, y = 0.35 + Math.floor(i / C) * 0.12; pos.push([x, y]); }
const ALVO = 612, cor = new THREE.Color(), halo = ID.brilho(0xff8a4c, 0.8, "suave", 0); S.add(halo);
const um = new THREE.Mesh(new THREE.OctahedronGeometry(0.06, 0), new THREE.MeshStandardMaterial({ color: 0xff8a4c, emissive: 0xff8a4c, emissiveIntensity: 1.6 })); S.add(um);
um.position.set(pos[ALVO][0], pos[ALVO][1], 0.02); halo.position.copy(um.position);
const al = new THREE.Vector3();
function render(t) {
  for (let i = 0; i < N; i++) { const [x, y] = pos[i], a = ease.outBack(range(t, 0.4 + (y - 0.35) * 0.35 + Math.abs(x) * 0.08, 1.2 + (y - 0.35) * 0.35 + Math.abs(x) * 0.08));
    o.position.set(x, y, 0.02 * Math.sin(t * 2 + i)); o.scale.setScalar(Math.max(0.001, a * (i === ALVO ? 0 : 1))); o.rotation.y = t + i; o.updateMatrix(); im.setMatrixAt(i, o.matrix); }
  im.instanceMatrix.needsUpdate = true;
  const k = ease.outBack(range(t, 3.69, 4.0)); um.scale.setScalar(Math.max(0.001, k)); um.rotation.y = t * 2; halo.material.opacity = k; halo.scale.setScalar(0.8 + 0.15 * Math.sin(t * 6));
  m.emissiveIntensity = 0.6 - 0.35 * range(t, 3.69, 4.1);
  // câmera: começa dentro da multidão de pontos e recua até ver as 1.000; depois aproxima do ponto laranja
  const e = ease.inOutSine(range(t, 0, 3.6)), f = ease.inOutCubic(range(t, 3.7, 5.04));
  cam.position.set(lerp(-1.2, 0.3, e) + f * 0.4, lerp(1.6, 1.0, e) + f * 0.4, lerp(1.3, 6.0, e) - f * 1.6);
  al.set(lerp(-0.9, 0, e) + f * 0.45, lerp(1.5, 0.45, e) + f * 0.55, 0); cam.lookAt(al);
  st.bloom = 0.8; st.draw();
  ID.txt(st.ctx, "JOVENS DE 25 ANOS", 540, 980, { tam: 30, cor: ID.AZUL, a: range(t, 1.87, 2.1) * (1 - range(t, 3.4, 3.6)), esp: 0.3 });
  ID.txt(st.ctx, "POR ANO", 540, 1000, { tam: 30, cor: ID.LARANJA, a: range(t, 4.28, 4.5), esp: 0.3 });
}

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
