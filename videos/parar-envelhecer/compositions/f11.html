<!-- f11: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f11.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.0 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f11-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }

.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }

    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f11" data-width="1080" data-height="1920">
    <canvas id="f11-canvas" width="1080" height="1920"></canvas>

  </div>
  <script>
    (function () {
      const D0 = 5.0;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f11-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f11" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });

      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f11"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f11"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/lowpoly.js"), import("./assets/lib/blocks/cinema.js"), import("./assets/lib/blocks/idade.js")
      ]).then(async ([K_, T, A, LOWPOLY, CINEMA, IDADE]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f11-canvas");

const LP = LOWPOLY, CI = CINEMA, ID = IDADE;
await ID.prepara();
const st = LP.palco(canvas, { foco: 3, faixa: 1.0, desfoque: 18, bloom: 0.9 });
const { S, cam } = st;
LP.luz(st, "dia"); st.exposicao = 1.15;
CI.cenario(S, "quarto"); const ab = CI.luzPratica(S, "abajur", [-1.6, 0.5, -2.4], { forca: 1.0 });
// avó, pai e neto: todos com corpo de 25 anos; a tataraneta (criança) chega em "tataranetos"
const F = [[{ seed: 31, feminina: true, roupa: "casaco", camisa: 0x7a3b5a, cabelo: 0x3a2214, pele: 0xc89070 }, -0.75, "AVÓ · 25"],
  [{ seed: 12, roupa: "camiseta", camisa: 0x2f6f9a, pele: 0xc89070, barba: false, cabeloTipo: "topete" }, 0, "PAI · 25"],
  [{ seed: 44, roupa: "jaqueta", camisa: 0x3a3a40, jaqueta: 0xd9a21e, pele: 0xc89070, barba: false }, 0.75, "NETO · 25"]].map(([o, x, s]) => { const p = LP.pessoa(o); p.root.position.set(x, 0, 0); S.add(p.root); return { p, x, s }; });
const k = LP.pessoa({ seed: 52, idade: "crianca", roupa: "camiseta", camisa: 0xff8a4c, pele: 0xc89070 }); S.add(k.root);
const v = new THREE.Vector3(), T0 = [0.1, 0.4, 0.84];
function render(t) {
  const dk = LP.ator(k, t, { seed: 52, andar: t < 3.6 ? { vel: 1.1 } : null, emocao: "alegre" });
  k.root.position.set(1.6 - Math.min(dk, 1.6) * 0.55, 0, 0.75); k.root.rotation.y = t < 3.6 ? -Math.PI / 2 : lerp(-Math.PI / 2, -0.2, range(t, 3.6, 4.0));
  const kc = k.cab.getWorldPosition(new THREE.Vector3());
  F.forEach(({ p, x }, i) => { LP.ator(p, t, { seed: 20 + i, emocao: t < 2.6 ? "alegre" : ["alegre", "surpresa", range(t, 2.7, 3.1) * (1 - range(t, 3.9, 4.4))], olharPara: t > 2.6 ? kc : null, olharK: range(t, 2.6, 3.0) }); });
  ab.update(t);
  // câmera: passa pelos 3 rostos (avó → pai → neto), abre em "mesma cara", desce até a criança
  CI.trilho(cam, t, [[0, [-0.75, 1.65, 1.3], [-0.75, 1.55, 0]], [0.45, [-0.1, 1.65, 1.35], [0, 1.55, 0]], [0.95, [0.6, 1.65, 1.4], [0.75, 1.55, 0]], [2.1, [0.2, 1.7, 4.2], [0.05, 1.3, 0]], [3.0, [0.25, 1.6, 4.4], [0.2, 1.2, 0.2]], [5.0, [0.6, 1.35, 3.6], [0.4, 1.15, 0.3]]], { mao: 1, seed: 8 });
  LP.focar(st, v.set(0.1, 1.5, 0));
  st.draw();
  const c = st.ctx;
  F.forEach(({ p, x, s }, i) => ID.tag(c, s, v.set(x, 1.25, 0.15), cam, range(t, T0[i], T0[i] + 0.2) * (1 - range(t, 2.4, 2.6)), { cor: i === 0 ? ID.LARANJA : ID.AZUL, dy: 0 }));
  ID.txt(c, "A MESMA CARA", 540, 700, { tam: 34, cor: "#fff", a: range(t, 1.74, 2.0) * (1 - range(t, 3.3, 3.5)), esp: 0.3 });
  ID.tag(c, "TATARANETA", v.set(k.root.position.x, 0.75, 0.8), cam, range(t, 4.06, 4.3), { cor: ID.LARANJA, dy: -60 });
}

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
