<!-- f06: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f06.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.48 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f06-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }

    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f06" data-width="1080" data-height="1920">
    <canvas id="f06-canvas" width="1080" height="1920"></canvas>

  </div>
  <script>
    (function () {
      const D0 = 5.48;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f06-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f06" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });

      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f06"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f06"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/lowpoly.js"), import("./assets/lib/blocks/cinema.js"), import("./assets/lib/blocks/idade.js")
      ]).then(async ([K_, T, A, LOWPOLY, CINEMA, IDADE]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f06-canvas");

const LP = LOWPOLY, CI = CINEMA, ID = IDADE;
await ID.prepara();
const st = LP.palco(canvas, { fundo: 0x0a141c, foco: 1.2, faixa: 0.4, desfoque: 20, bloom: 0.9 });
const { S, cam } = st;
LP.luz(st, "dramatica"); st.exposicao = 1.25; st.hemi.intensity = 0.8;
const chao = new THREE.Mesh(new THREE.CircleGeometry(8, 40), LP.mat(0x3a2e26, 0.95)); chao.rotation.x = -Math.PI / 2; S.add(chao);
// à esquerda: aquário com a hidra numa pedra; à direita: o rato-toupeira-pelado na terra
const aq = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 1.0, 28, 1, true), new THREE.MeshStandardMaterial({ color: 0x6ab8e0, transparent: true, opacity: 0.18, roughness: 0.05, side: THREE.DoubleSide })); aq.position.set(-0.6, 0.5, 0); S.add(aq);
const agua = new THREE.Mesh(new THREE.CylinderGeometry(0.41, 0.41, 0.9, 28), new THREE.MeshStandardMaterial({ color: 0x1a6a8a, transparent: true, opacity: 0.22, roughness: 0.1, emissive: 0x0a3a5a, emissiveIntensity: 0.4 })); agua.position.set(-0.6, 0.45, 0); S.add(agua);
const pedra = new THREE.Mesh(new THREE.DodecahedronGeometry(0.14, 0), LP.mat(0x5a6058, 0.9)); pedra.position.set(-0.6, 0.06, 0); pedra.scale.y = 0.6; S.add(pedra);
const h = ID.hidra(LP); h.root.position.set(-0.6, 0.1, 0); S.add(h.root);
const bol = LP.poeira(S, { n: 60, centro: [-0.6, 0.5, 0], raio: [0.3, 0.4, 0.3], cor: 0xbfe8ff, tam: 0.006, seed: 8 });
const ra = ID.rato(LP); ra.root.position.set(0.65, 0, 0.05); ra.root.rotation.y = 0.6; ra.root.scale.setScalar(1.15); S.add(ra.root);
[[0.4, -0.3, 0.25], [1.0, -0.2, 0.3], [0.8, 0.35, 0.18]].forEach(([x, z, s], i) => { const m = new THREE.Mesh(LP.facetado(1, () => {}, 20 + i, 0.3), LP.mat(0x4a3a2c, 0.95)); m.position.set(x, 0, z); m.scale.set(s, s * 0.5, s); S.add(m); });
const lamp = new THREE.PointLight(0xffd0a0, 2.5, 4, 2); lamp.position.set(0.6, 1.2, 0.8); S.add(lamp);
const lampA = new THREE.PointLight(0x7cd8ff, 2.5, 3, 2); lampA.position.set(-0.6, 1.1, 0.6); S.add(lampA);
const v = new THREE.Vector3();
function render(t) {
  h.update(t); ra.update(t, 0); bol.update(t);
  ra.root.position.x = 0.65 + 0.08 * ease.inOutSine(range(t, 3.0, 4.2));
  // hidra de perto → panorâmica para o rato → recua e mostra os dois
  CI.trilho(cam, t, [[0, [-0.25, 0.85, 1.7], [-0.6, 0.35, 0]], [2.4, [-0.3, 0.8, 1.8], [-0.6, 0.32, 0]], [3.2, [1.0, 0.6, 1.5], [0.7, 0.05, 0]], [4.0, [0.95, 0.62, 1.7], [0.68, 0.05, 0]], [5.48, [0.1, 1.2, 3.6], [0.05, 0.15, 0]]], { mao: 1, seed: 7 });
  LP.focar(st, v.set(range(t, 2.5, 3.2) * 1.25 - 0.6, 0.35, 0));
  st.draw();
  const c = st.ctx;
  ID.tag(c, "HIDRA", v.set(-0.6, 0.72, 0), cam, range(t, 2.34, 2.55), { dy: 120 });
  ID.tag(c, "RATO-TOUPEIRA-PELADO", v.set(0.7, 0.2, 0.1), cam, range(t, 2.96, 3.2), { cor: ID.LARANJA, dy: -200 });
  ID.txt(c, "QUASE NÃO ENVELHECEM", 540, 985, { tam: 34, cor: "#fff", a: range(t, 4.02, 4.3), esp: 0.2 });
}

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
