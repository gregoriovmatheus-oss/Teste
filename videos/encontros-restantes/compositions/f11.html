<!-- f11: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f11.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 4.04 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f11-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }

  </style>
  <div id="root" data-composition-id="f11" data-width="1080" data-height="1920">
    <canvas id="f11-canvas" width="1080" height="1920"></canvas>

  </div>
  <script>
    (function () {
      const D0 = 4.04;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f11-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f11" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });

      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f11"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f11"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/lowpoly.js"), import("./assets/lib/blocks/cinema.js"), import("./assets/lib/blocks/encontros.js")
      ]).then(async ([K_, T, A, LOWPOLY, CINEMA, ENCONTROS]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f11-canvas");

const LP = LOWPOLY, CI = CINEMA, E = ENCONTROS;
await E.prepara();
const st = LP.palco(canvas, { foco: 5, faixa: 2.0, desfoque: 14, bloom: 0.5 });
const { S, cam } = st;
LP.luz(st, "frio"); st.exposicao = 1.0; CI.clima(st, "memoria"); st.U.sat.value = 0.45;
CI.cenario(S, "rua", { seed: 13 }); CI.ceu(S, { topo: 0x8a96a4, horizonte: 0xc8ccd0 });
// uma terça qualquer: rua comum, gente passando; o avô segue andando na calçada e o 1 vira 0 sem alarde
const av = E.avo(LP); av.root.position.set(-3.1, 0.11, -3.5); av.root.rotation.y = Math.PI; S.add(av.root);
const F = E.multidao(LP, S, [[-2.0, -6.5, 81, 0x4a5058, 0.6, 1], [2.9, -4.0, 82, 0x5a4a44, 0], [3.4, -8.0, 83, 0x3e4a5a, 0.7, -1], [-3.4, -10.0, 84, 0x52525a, 0]]);
F.forEach((f) => (f.root.position.y = Math.abs(f.root.position.x) > 2.2 ? 0.11 : 0));
const poste = CI.luzPratica(S, "poste", [-2.3, 0.11, -5.5], { forca: 0.3 });
const v = new THREE.Vector3();
function render(t) {
  E.andaMultidao(LP, F, t); F.forEach((f) => (f.root.position.y = Math.abs(f.userData.x) > 2.2 ? 0.11 : 0));
  const d = LP.ator(av, t, { seed: 44, andar: { vel: 0.55 }, emocao: "calmo" });
  av.root.position.z = -3.5 - d * 0.55;
  const e = ease.inOutSine(range(t, 0, 4.04));
  cam.position.set(lerp(-0.9, -1.3, e), lerp(1.5, 1.55, e), lerp(1.6, 0.9, e)); cam.lookAt(v.set(-3.0, 1.0, av.root.position.z - 1.2)); LP.camMao(cam, t, { seed: 7, intens: 0.6 });
  LP.focar(st, av.cab.getWorldPosition(v));
  st.draw();
  const c = st.ctx;
  // 1 → 0 em "zero" (1,29 s), depois o selo apaga devagar
  const n = 1 - ease.inOutCubic(range(t, 1.1, 1.5));
  E.sobreCabeca(c, n, av, cam, (1 - range(t, 2.4, 3.6)) * 0.9, { tam: 56, sobe: 0.3, cor: "#c8d0da", numCor: "#e8ecf0" });
  E.txt(c, "TERÇA-FEIRA", 540, 985, { tam: 30, cor: "#c8d0da", a: range(t, 1.82, 2.1), esp: 0.34 });
  E.txt(c, "SEM AVISO", 540, 935, { tam: 24, cor: "#8a96a4", a: range(t, 3.48, 3.7), esp: 0.34 });
}

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
