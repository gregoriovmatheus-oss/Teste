<!-- f10: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f10.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.77 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f10-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }

  </style>
  <div id="root" data-composition-id="f10" data-width="1080" data-height="1920">
    <canvas id="f10-canvas" width="1080" height="1920"></canvas>

  </div>
  <script>
    (function () {
      const D0 = 5.77;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f10-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f10" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });

      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f10"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f10"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/encontros.js")
      ]).then(async ([K_, T, A, ENCONTROS]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f10-canvas");

const E = ENCONTROS;
await E.prepara();
const st = E.palcoDoc(T, canvas, { fov: 34 });
const S = st.scene, cam = st.cam;
// agenda: um mês (7 × 5) de quadradinhos; cada "mais um encontro" acende um dia e o número sobe
const g = new THREE.Group(); S.add(g); g.position.set(0, 1.05, 0); g.rotation.x = -0.25;
const base = new THREE.Mesh(new THREE.BoxGeometry(1.75, 1.45, 0.04), new THREE.MeshStandardMaterial({ color: 0x141a24, roughness: 0.5 })); base.position.set(0, 0.02, -0.03); g.add(base);
const topo = new THREE.Mesh(new THREE.BoxGeometry(1.75, 0.16, 0.06), new THREE.MeshStandardMaterial({ color: 0xff8a4c, emissive: 0xff8a4c, emissiveIntensity: 0.4 })); topo.position.set(0, 0.73, 0); g.add(topo);
const dias = []; for (let i = 0; i < 35; i++) { const d = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.03), new THREE.MeshStandardMaterial({ color: 0x2a3444, emissive: 0xff8a4c, emissiveIntensity: 0, roughness: 0.4 }));
  d.position.set(-0.72 + (i % 7) * 0.24, 0.5 - Math.floor(i / 7) * 0.24, 0.01); g.add(d); dias.push(d); }
const MARCA = [[9, 1.95], [12, 2.79], [16, 3.67], [20, 4.0], [23, 4.2], [26, 4.4], [30, 4.6]];
const brilhos = MARCA.map(([i]) => { const b = E.brilho(0xff8a4c, 0.45, "suave", 0); b.position.copy(dias[i].position); b.position.z = 0.06; g.add(b); return b; });
const al = new THREE.Vector3(), topoV = new THREE.Vector3();
function render(t) {
  let n = 1;
  MARCA.forEach(([i, t0], j) => { const k = ease.outBack(range(t, t0, t0 + 0.3)); dias[i].material.emissiveIntensity = 1.4 * range(t, t0, t0 + 0.15); dias[i].position.z = 0.01 + 0.05 * k;
    brilhos[j].material.opacity = range(t, t0, t0 + 0.2) * 0.9; n += ease.inOutCubic(range(t, t0, t0 + 0.35)); });
  const e = ease.inOutSine(range(t, 0, 5.77));
  cam.position.set(lerp(-0.9, 0.5, e), lerp(1.3, 1.5, e), lerp(4.0, 3.5, e)); al.set(lerp(-0.15, 0.05, e), lerp(1.15, 1.2, e), 0); cam.lookAt(al);
  st.bloom = 0.85; st.draw();
  const c = st.ctx;
  g.localToWorld(topoV.set(0, 0.95, 0));
  E.sobreCabeca(c, n, topoV, cam, range(t, 0.2, 0.5), { rotulo: "ENCONTROS", tam: 84, ymin: 520, pulso: LP_mola(t) });
  E.txt(c, "MAIS UM ENCONTRO", 540, 985, { tam: 32, cor: E.LARANJA, a: range(t, 2.33, 2.6) * (1 - range(t, 3.25, 3.4)), esp: 0.22 });
  E.txt(c, "E MAIS OUTRO", 540, 985, { tam: 32, cor: E.LARANJA, a: range(t, 3.4, 3.6) * (1 - range(t, 4.3, 4.45)), esp: 0.22 });
  E.txt(c, "SÓ PARA VER O NÚMERO MUDAR", 540, 985, { tam: 30, cor: "#fff", a: range(t, 4.46, 4.7), esp: 0.16 });
}
function LP_mola(t) { let s = 0; MARCA.forEach(([, t0]) => { if (t >= t0) s += Math.exp(-5 * (t - t0)) * Math.sin(2.2 * 6.283 * (t - t0)); }); return s; }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
