<!-- f02: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f02.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 3.49 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f02-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }

  </style>
  <div id="root" data-composition-id="f02" data-width="1080" data-height="1920">
    <canvas id="f02-canvas" width="1080" height="1920"></canvas>

  </div>
  <script>
    (function () {
      const D0 = 3.49;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f02-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f02" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });

      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f02"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f02"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/lowpoly.js"), import("./assets/lib/blocks/cinema.js"), import("./assets/lib/blocks/encontros.js")
      ]).then(async ([K_, T, A, LOWPOLY, CINEMA, ENCONTROS]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f02-canvas");

const LP = LOWPOLY, CI = CINEMA, E = ENCONTROS;
await E.prepara();
const st = LP.palco(canvas, { foco: 2.4, faixa: 0.8, desfoque: 22, bloom: 0.9, raios: 0.5 });
const { S, cam } = st;
LP.luz(st, "por-do-sol"); st.exposicao = 1.12;
CI.cenario(S, "rua", { seed: 5 }); CI.ceu(S, { topo: 0x2a3466, horizonte: 0xffa070 });
st.sol(new THREE.Vector3(5, 3, -30), 0.9);
LP.bokeh(S, { n: 30, seed: 8, y: [0.8, 3.5], z: [-16, -9], cores: [0xffc07a, 0xff8a4c, 0x7cc8ff] });
// você no meio da calçada, girando o olhar: cada desconhecido tem o seu número
const eu = E.heroi(LP); S.add(eu.root);
const F = E.multidao(LP, S, [[-2.9, -3.2, 71, 0x3d5a80, 0.7, 1], [2.2, -4.6, 72, 0x7a3b3b, 0.6, -1], [-1.9, -6.4, 73, 0x4a6b4a, 0], [1.7, -7.6, 74, 0x6b5a7a, 0.8, -1], [3.2, -9.0, 75, 0x8a6a3a, 0], [0.2, -10.5, 76, 0x2f4f6f, 0.5, 1]]);
const NUM = [12, 480, 3, 1250, 76, 9], T0 = [0.15, 0.35, 0.55, 0.75, 0.95, 1.15];
const olho = new THREE.Vector3(), rosto = new THREE.Vector3(0, 1.6, 0);
function render(t) {
  E.andaMultidao(LP, F, t);
  olho.set(lerp(-2.5, 2.0, ease.inOutSine(range(t, 0.2, 2.8))), 1.65, -5);
  LP.ator(eu, t, { seed: 12, emocao: ["surpresa", "alegre", range(t, 2.0, 2.8)], olharPara: olho, olharK: 0.75 });
  // câmera baixa, em arco lento na frente dele (os de trás ficam abaixo do rosto, na faixa dos números)
  const e = ease.inOutSine(range(t, 0, 3.49)), a = lerp(-0.35, 0.3, e);
  cam.position.set(Math.sin(a) * 3.7, 1.15, Math.cos(a) * 3.7); cam.lookAt(0, 1.32, -1.0);
  LP.camMao(cam, t, { seed: 2 }); LP.focar(st, rosto); CI.preenche(st, rosto, { forca: 1.3 });
  st.draw();
  const c = st.ctx;
  F.forEach((f, i) => E.sobreCabeca(c, NUM[i] * ease.outCubic(range(t, T0[i], T0[i] + 0.9)) , f, cam, range(t, T0[i], T0[i] + 0.25), { tam: 40, sobe: 0.32, ymin: 540, pulso: 0 }));
  E.txt(c, "ENCONTROS RESTANTES", 540, 985, { tam: 34, cor: "#fff", a: range(t, 2.18, 2.45), esp: 0.24 });
}

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
