<!-- f06: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f06.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.43 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f06-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }

  </style>
  <div id="root" data-composition-id="f06" data-width="1080" data-height="1920">
    <canvas id="f06-canvas" width="1080" height="1920"></canvas>

  </div>
  <script>
    (function () {
      const D0 = 5.43;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f06-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f06" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });

      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f06"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f06"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/encontros.js")
      ]).then(async ([K_, T, A, ENCONTROS]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f06-canvas");

const E = ENCONTROS;
await E.prepara();
const st = E.palcoDoc(T, canvas, { fov: 36 });
const S = st.scene, cam = st.cam;
// um mar de pedras iguais ("parece infinito") que afunda; sobra uma só, que brilha ("escasso")
const N = 900, r = mulberry32(17), geo = new THREE.DodecahedronGeometry(0.06, 0);
const m = new THREE.MeshStandardMaterial({ color: 0x6a7078, roughness: 0.8 });
const im = new THREE.InstancedMesh(geo, m, N); im.frustumCulled = false; S.add(im);
const P = []; for (let i = 0; i < N; i++) { const a = r() * 6.283, d = 0.35 + Math.sqrt(r()) * 6; P.push([Math.cos(a) * d, Math.sin(a) * d - 2, r() * 6.283, 0.7 + r() * 0.6]); }
const gema = new THREE.Mesh(new THREE.OctahedronGeometry(0.13, 0), new THREE.MeshStandardMaterial({ color: 0xffc08a, emissive: 0xff8a4c, emissiveIntensity: 0.2, roughness: 0.15, metalness: 0.3, flatShading: true }));
gema.scale.y = 1.35; S.add(gema);
const halo = E.brilho(0xff8a4c, 1.4, "suave", 0), raios = E.brilho(0xffc08a, 1.6, "raios", 0); S.add(halo, raios);
const o = new THREE.Object3D(), al = new THREE.Vector3();
function render(t) {
  const afunda = ease.inOutCubic(range(t, 3.6, 4.6));
  for (let i = 0; i < N; i++) { const [x, z, rot, s] = P[i]; o.position.set(x, 0.05 - afunda * 0.2 * (0.6 + s * 0.4), z); o.rotation.set(rot, rot * 2, 0); o.scale.setScalar(s * (1 - afunda * 0.9) + 0.001); o.updateMatrix(); im.setMatrixAt(i, o.matrix); }
  im.instanceMatrix.needsUpdate = true;
  const sobe = ease.outBack(range(t, 3.95, 4.7)); gema.position.set(0, 0.08 + sobe * 0.45, 0); gema.rotation.y = t * 0.9;
  gema.material.emissiveIntensity = 0.2 + 1.6 * range(t, 4.0, 4.6);
  halo.position.copy(gema.position); raios.position.copy(gema.position); halo.material.opacity = range(t, 4.1, 4.6) * (0.9 + 0.1 * Math.sin(t * 5)); raios.material.opacity = 0.7 * range(t, 4.3, 4.8); raios.material.rotation = t * 0.3;
  // câmera: voo rasante sobre as pedras até parar diante da única que sobrou
  const e = ease.inOutSine(range(t, 0, 3.9)), f = ease.inOutCubic(range(t, 3.9, 5.43));
  cam.position.set(lerp(-2.2, -0.4, e) + f * 0.4, lerp(0.9, 0.55, e) - f * 0.05, lerp(-3.6, 1.6, e) + f * 0.1); al.set(lerp(-0.4, 0, e), lerp(0.0, 0.18, e) + f * 0.3, lerp(-6, 0, e)); cam.lookAt(al);
  st.bloom = 0.9; st.draw();
  const c = st.ctx;
  E.txt(c, "VIÉS DE ESCASSEZ", 540, 690, { tam: 30, cor: E.AZUL, a: range(t, 1.06, 1.35), esp: 0.3 });
  E.txt(c, "PARECE INFINITO → NÃO VALORIZA", 540, 985, { tam: 28, cor: "#c8d0da", a: range(t, 2.08, 2.35) * (1 - range(t, 3.7, 3.9)), esp: 0.14 });
  E.txt(c, "ESCASSO → VALORIZA", 540, 985, { tam: 34, cor: E.LARANJA, a: range(t, 4.47, 4.7), esp: 0.2 });
}

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
