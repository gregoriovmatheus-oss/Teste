<!-- f05: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f05.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 4.54 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f05-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }

  </style>
  <div id="root" data-composition-id="f05" data-width="1080" data-height="1920">
    <canvas id="f05-canvas" width="1080" height="1920"></canvas>

  </div>
  <script>
    (function () {
      const D0 = 4.54;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f05-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f05" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });

      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f05"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f05"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/encontros.js")
      ]).then(async ([K_, T, A, ENCONTROS]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f05-canvas");

const E = ENCONTROS;
await E.prepara();
const st = E.palcoDoc(T, canvas, { fov: 34 });
const S = st.scene, cam = st.cam;
// uma barra por ano de vida (0–60): altura = tempo com os pais. Quase tudo fica na infância.
const N = 60, W = 0.05, geo = new THREE.BoxGeometry(W * 0.8, 1, W * 0.8);
const m = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x7cc8ff, emissiveIntensity: 0.55, roughness: 0.35 });
const im = new THREE.InstancedMesh(geo, m, N); im.frustumCulled = false; S.add(im);
const alt = (i) => (i < 18 ? 1.25 - 0.012 * i : 0.09 * Math.exp(-(i - 18) / 14) + 0.03), x0 = -N * W / 2;
const o = new THREE.Object3D(), cor = new THREE.Color(), azul = new THREE.Color(0x9fd6ff), cinza = new THREE.Color(0x3a4048), lar = new THREE.Color(0xff8a4c);
const agora = new THREE.Mesh(new THREE.BoxGeometry(0.012, 1.6, 0.012), new THREE.MeshBasicMaterial({ color: 0xffffff })); S.add(agora);
const ponto = E.brilho(0xffffff, 0.35, "suave", 1); S.add(ponto);
const al = new THREE.Vector3(), v = new THREE.Vector3();
for (let i = 0; i < N; i++) im.setColorAt(i, azul);
function render(t) {
  const VOC = 32, xa = x0 + (lerp(0, VOC, ease.inOutSine(range(t, 2.6, 3.4))) + 0.5) * W;
  for (let i = 0; i < N; i++) { const k = ease.outCubic(range(t, 0.2 + i * 0.03, 0.8 + i * 0.03)), h = Math.max(0.001, alt(i) * k);
    o.position.set(x0 + (i + 0.5) * W, h / 2, 0); o.scale.set(1, h, 1); o.updateMatrix(); im.setMatrixAt(i, o.matrix);
    const pass = x0 + (i + 0.5) * W < xa && t > 2.6;
    im.setColorAt(i, cor.copy(azul).lerp(i < 18 ? lar : cinza, pass ? (i < 18 ? 0.5 + 0.5 * range(t, 3.82, 4.1) : 0.8) : 0)); }
  im.instanceMatrix.needsUpdate = true; im.instanceColor.needsUpdate = true;
  agora.position.set(xa, 0.8, 0.02); agora.visible = t > 2.6; ponto.position.set(xa, 1.62, 0.02); ponto.visible = t > 2.6;
  const e = ease.inOutSine(range(t, 0, 4.54));
  cam.position.set(lerp(-1.1, 0.2, e), lerp(0.7, 0.95, e), lerp(2.6, 4.0, e)); al.set(lerp(-0.9, -0.05, e), lerp(0.5, 0.35, e), 0); cam.lookAt(al);
  st.bloom = 0.8; st.draw();
  const c = st.ctx;
  E.txt(c, "TEMPO COM OS PAIS", 540, 985, { tam: 30, cor: E.AZUL, a: range(t, 1.95, 2.25), esp: 0.3 });
  E.tag(c, "VOCÊ HOJE", v.set(xa, 1.62, 0), cam, range(t, 2.75, 3.0), { dy: -90, dx: 60 });
  E.tag(c, "JÁ PASSOU", v.set(x0 + 25 * W, 0.12, 0), cam, range(t, 2.93, 3.2), { cor: "#9aa4b0", dy: 150, dx: -40 });
  E.tag(c, "INFÂNCIA", v.set(x0 + 9 * W, 1.2, 0), cam, range(t, 3.82, 4.05), { cor: E.LARANJA, dy: -110, dx: -60 });
}

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
