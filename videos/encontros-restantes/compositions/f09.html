<!-- f09: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f09.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 4.5 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f09-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }

  </style>
  <div id="root" data-composition-id="f09" data-width="1080" data-height="1920">
    <canvas id="f09-canvas" width="1080" height="1920"></canvas>

  </div>
  <script>
    (function () {
      const D0 = 4.5;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f09-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f09" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });

      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f09"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f09"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/lowpoly.js"), import("./assets/lib/blocks/cinema.js"), import("./assets/lib/blocks/encontros.js")
      ]).then(async ([K_, T, A, LOWPOLY, CINEMA, ENCONTROS]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f09-canvas");

const LP = LOWPOLY, CI = CINEMA, E = ENCONTROS;
await E.prepara();
const st = LP.palco(canvas, { foco: 1.2, faixa: 0.4, desfoque: 26, bloom: 0.7 });
const { S, cam } = st;
LP.luz(st, "frio"); st.exposicao = 0.95; CI.clima(st, "hospital");
CI.cenario(S, "rua", { seed: 11 }); CI.ceu(S, { topo: 0x6a7a8e, horizonte: 0xc8d2dc });
// luz fria de fim de tarde nublado; o avô sentado no banco, você de pé olhando para ele
const banco = new THREE.Group(); S.add(banco); banco.position.set(-0.6, 0, -1.6);
[[1.5, 0.06, 0.42, 0, 0.46, 0], [1.5, 0.4, 0.05, 0, 0.75, -0.2], [0.06, 0.46, 0.4, -0.7, 0.23, 0], [0.06, 0.46, 0.4, 0.7, 0.23, 0]].forEach(([w, h, d, x, y, z]) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), LP.mat(x ? 0x2a2c30 : 0x6a4a34, 0.7)); b.position.set(x, y, z); banco.add(b); });
const av = E.avo(LP); av.root.position.set(-0.6, 0, -1.55); av.root.rotation.y = 0.35; S.add(av.root);
const eu = E.heroi(LP); eu.root.position.set(0.55, 0, 0.2); eu.root.rotation.y = Math.PI + 0.45; S.add(eu.root);
const cai = LP.poeira(S, { n: 90, centro: [0, 1.4, -0.6], raio: [1.6, 1.0, 1.2], cor: 0xdfe8f2, tam: 0.006, seed: 9 });
const v = new THREE.Vector3(), hEu = new THREE.Vector3(), hAv = new THREE.Vector3(), CORTE = 2.15;
function render(t) {
  av.root.updateMatrixWorld(true); av.cab.getWorldPosition(hAv);
  LP.ator(av, t, { seed: 44, pose: "sentado", emocao: ["calmo", "alegre", range(t, 2.6, 3.4)], olharPara: eu.cab.getWorldPosition(v), olharK: 0.6 });
  LP.ator(eu, t, { seed: 12, emocao: ["calmo", "triste", range(t, 0.6, 1.5)], olharPara: hAv, olharK: 0.8 });
  eu.cab.getWorldPosition(hEu); cai.update(t);
  if (t < CORTE) { CI.plano(st, hEu, t, t / CORTE, "close", { lado: -1, seed: 9 }); }
  else { const u = (t - CORTE) / (4.5 - CORTE);   // por cima do ombro dele, o avô
    cam.position.set(lerp(1.75, 1.55, u), lerp(1.45, 1.4, u), lerp(1.1, 0.75, u)); cam.lookAt(v.set(-0.5, 1.2, -1.55)); LP.camMao(cam, t, { seed: 3 }); LP.focar(st, hAv); }
  CI.preenche(st, t < CORTE ? hEu : hAv, { forca: 1.0, cor: 0xd8e6ff });
  st.draw();
  const c = st.ctx;
  E.txt(c, "HAVERIA DOR", 540, 985, { tam: 34, cor: "#dfe8f2", a: range(t, 1.27, 1.5) * (1 - range(t, 1.9, 2.1)), esp: 0.24 });
  // contagem regressiva até "um" (4,09 s)
  const n = 1 + 11 * (1 - ease.inOutCubic(range(t, 2.6, 4.09)));
  E.sobreCabeca(c, n, av, cam, range(t, 2.4, 2.65), { rotulo: "ENCONTROS", tam: 80, sobe: 0.32, cor: t > 4.0 ? E.LARANJA : E.AZUL, pulso: LP.mola(t, 4.09, 1, 2, 4) });
}

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
