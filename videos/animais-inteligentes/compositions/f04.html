<!-- f04: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f04.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 6.54 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f04-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f04" data-width="1080" data-height="1920">
    <canvas id="f04-canvas" width="1080" height="1920"></canvas>
    <div id="f04-r1" class="rot" style="top: 700px"><span id="f04-r1-in" class="rot-t"><span class="k">CORVOS</span><br>Cérebro <span class="y">pequeno</span></span></div>
    <div id="f04-r2" class="rot" style="top: 700px"><span id="f04-r2-in" class="rot-t">Neurônios<br><span class="y">apertados</span></span></div>
    <div id="f04-r3" class="rot" style="top: 700px"><span id="f04-r3-in" class="rot-t"><span class="k">FERRAMENTA COMPOSTA</span><br><span class="y">3</span> peças</span></div>
  </div>
  <script>
    (function () {
      const D0 = 6.54;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f04-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f04" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f04-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.25 * K);
      tl.to("#f04-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 1.55 * K);
      tl.fromTo("#f04-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.1 * K);
      tl.to("#f04-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.45 * K);
      tl.fromTo("#f04-r3-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 4.55 * K);
      tl.to("#f04-r3-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 6.24 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f04"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f04"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/mente.js")
      ]).then(async ([K_, T, A, MENTE]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f04-canvas");

        const st = T.createToyStage(canvas, { fov: 32, ceu: ["#050912", "#16243a"], nevoa: [2, 9], corNevoa: "#0a1424", luz: 0.85, nuvens: 0 });
        const S = st.scene, cam = st.cam;
        st.bloom = 0.8;
        const pal = MENTE.palcoDiagrama(st, { y: 0, grade: true });
        st.key.intensity = 2.4; st.rim.intensity = 1.6; st.rim.color.set(0x7cc8ff);
        const poleiro = T.mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.6, 12), 0x5b4532, S, 0.8); poleiro.rotation.x = Math.PI / 2; poleiro.position.set(0, 0.5, 0);
        const cv = MENTE.corvo(); cv.group.position.set(0, 0.52, 0); S.add(cv.group);
        // materiais próprios (o corvo vira holograma sem mexer no cache compartilhado)
        const mats = [];
        cv.group.traverse((m) => { if (m.isMesh) { m.material = m.material.clone(); m.material.transparent = true; mats.push(m.material); } });
        // cérebro do corvo dentro da cabeça: muitos pontos num volume minúsculo
        const C = MENTE.cerebro(cv.head, { tipo: "corvo", pontos: { cortex: 1500, cerebelo: 350 }, seed: 41, tam: 0.006 });
        C.group.scale.setScalar(0.27); C.group.position.set(-0.005, 0.005, 0);
        // três peças (tubos de diâmetros diferentes) que se encaixam
        const pecas = [[0.012, 0.22, 0xc8a66a], [0.009, 0.2, 0xb48d55], [0.006, 0.18, 0xd9bd86]].map(([r, l, c], i) => {
          const g = new THREE.Group(); S.add(g);
          const m = T.mesh(new THREE.CylinderGeometry(r, r, l, 14), c, g, 0.75); m.rotation.z = Math.PI / 2;
          const h = MENTE.glow(0x7cc8ff, 0.08, 0); g.add(h); h.position.x = -l / 2;
          g.userData = { l, r, h };
          return g;
        });
        const flash = MENTE.glow(0xffffff, 0.25, 0); S.add(flash);
        function render(t) {
          pal.update(t);
          const holo = Math.sin(Math.PI * range(t, 0.7, 3.9));
          mats.forEach((m) => { m.opacity = 1 - 0.85 * holo; m.depthWrite = holo < 0.5; });
          C.update(t, { fill: { cortex: ease.inOutSine(range(t, 1.0, 2.6)), cerebelo: ease.inOutSine(range(t, 1.0, 2.6)) }, brilho: { cortex: 1.4 * holo, cerebelo: 1.4 * holo }, casca: holo, pisca: 0.5 });
          C.group.visible = holo > 0.02;
          // peças: chegam flutuando, giram e se encaixam uma na outra (5,3-6,0 s)
          const chega = ease.outCubic(range(t, 3.85, 4.7));
          const enc = [ease.inOutCubic(range(t, 5.25, 5.65)), ease.inOutCubic(range(t, 5.75, 6.15))];
          const base = new THREE.Vector3(0.42, 0.62, 0.05);
          let x = base.x;
          pecas.forEach((g, i) => {
            const { l } = g.userData;
            const solto = new THREE.Vector3(base.x + (i - 1) * 0.06, base.y + 0.11 - i * 0.1, base.z + (i - 1) * 0.08);
            const junto = new THREE.Vector3(x, base.y, base.z);
            x += l * 0.82;
            const k = i === 0 ? 1 : enc[i - 1];
            g.position.lerpVectors(solto, junto, i === 0 ? ease.inOutCubic(range(t, 5.25, 5.65)) : k);
            g.position.y += (1 - chega) * 0.4;
            g.rotation.set(0, (1 - Math.max(k, enc[0])) * (0.6 - i * 0.5) + Math.sin(t * 1.3 + i) * 0.05 * (1 - k), (1 - chega) * 1.5);
            g.visible = t > 3.8;
            g.userData.h.material.opacity = Math.sin(Math.PI * range(t, 4.3 + i * 0.2, 5.0 + i * 0.2)) * 0.9;
          });
          const enc2 = Math.max(Math.sin(Math.PI * range(t, 5.6, 5.85)), Math.sin(Math.PI * range(t, 6.1, 6.35)));
          flash.position.set(base.x + 0.16, base.y, base.z); flash.material.opacity = enc2;
          // o corvo olha para as peças
          const olha = ease.inOutSine(range(t, 4.0, 4.8));
          cv.update(t, { cabeca: -0.25 * olha + 0.05, vira: olha * 0.1, inclina: Math.sin(t * 0.9) * 0.08 + olha * 0.25 });
          // câmera: macro na cabeça → recua e gira revelando as peças
          const e = ease.inOutSine(range(t, 0, 3.6)), b = ease.inOutCubic(range(t, 3.6, 5.2));
          const head = new THREE.Vector3(0.18, 0.92, 0);
          const p0 = new THREE.Vector3(0.2 + lerp(0.12, 0.0, e), 0.94, lerp(0.62, 0.42, e));
          const p1 = new THREE.Vector3(0.62, 0.9, 1.75);
          cam.position.lerpVectors(p0, p1, b);
          cam.position.x += Math.sin(t * 0.4) * 0.02;
          const l1 = new THREE.Vector3(0.5, 0.68, 0.05);
          cam.lookAt(new THREE.Vector3().lerpVectors(head, l1, b));
          st.sol(0, 0, 2, 0.5);
          st.draw();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
