<!-- f08: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f08.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 4.22 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f08-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f08" data-width="1080" data-height="1920">
    <canvas id="f08-canvas" width="1080" height="1920"></canvas>
    <div id="f08-r1" class="rot" style="top: 700px"><span id="f08-r1-in" class="rot-t"><span class="k">A PERGUNTA</span><br>Uma pergunta <span class="y">difícil</span></span></div>
    <div id="f08-r2" class="rot" style="top: 700px"><span id="f08-r2-in" class="rot-t">Por que os humanos<br><span class="y">mandam no planeta?</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 4.22;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f08-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f08" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f08-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.2 * K);
      tl.to("#f08-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 1.4 * K);
      tl.fromTo("#f08-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.8 * K);
      tl.to("#f08-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.92 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f08"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f08"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/mente.js")
      ]).then(async ([K_, T, A, MENTE]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f08-canvas");

        const st = T.createToyStage(canvas, { fov: 38, ceu: ["#0e1330", "#c8704c"], nevoa: [30, 260], corNevoa: "#6a4a58", luz: 0.6, nuvens: 10 });
        const S = st.scene, cam = st.cam;
        st.bloom = 0.9;
        st.key.color.set(0xff9a68);
        // colina em primeiro plano + cidade lá embaixo acendendo
        const morro = T.mesh(new THREE.SphereGeometry(1, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2), 0x3d4a2c, S, 0.95); morro.scale.set(9, 2.2, 7); morro.position.set(0, -1.6, 2);
        const rr = mulberry32(81);
        const capim = new THREE.InstancedMesh(new THREE.ConeGeometry(0.04, 0.4, 3), T.M(0x55603a, 0.9), 500); S.add(capim);
        { const o = new THREE.Object3D(); for (let i = 0; i < 500; i++) { const a = rr() * 6.28, d = Math.sqrt(rr()) * 4; const x = Math.cos(a) * d, z = 2 + Math.sin(a) * d * 0.9; const y = -1.6 + 2.2 * Math.sqrt(Math.max(0, 1 - (x / 9) ** 2 - ((z - 2) / 7) ** 2)); o.position.set(x, y + 0.12, z); o.rotation.set((rr() - 0.5) * 0.5, 0, (rr() - 0.5) * 0.5); o.scale.setScalar(0.6 + rr()); o.updateMatrix(); capim.setMatrixAt(i, o.matrix); } }
        const baixada = T.mesh(new THREE.PlaneGeometry(600, 600), 0x2a2a2c, S, 0.95); baixada.rotation.x = -Math.PI / 2; baixada.position.y = -6; baixada.castShadow = false;
        const sky = MENTE.skyline(S, { n: 220, seed: 82, cx: 0, cz: -120, raio: 50, hMin: 2, hMax: 26 }); sky.mesh.position.y = -6;
        const solp = MENTE.glow(0xffb070, 30, 0.8); solp.position.set(40, 2, -160); S.add(solp);
        // o macaco sentado no topo, olhando a cidade
        const mc = A.createAnimal("macaco", { fase: 0.3 }); mc.group.position.set(0.2, 0.6, 2.2); A.face(mc.group, 0, -1); S.add(mc.group);
        mc.legs.forEach((l) => { l.rotation.z = 1.35; }); mc.group.position.y = 0.12;
        const luzesC = [];
        for (let i = 0; i < 60; i++) { const l = MENTE.glow(rr() < 0.7 ? 0xffc27a : 0xcfe2ff, 1.2 + rr() * 2, 0); l.position.set((rr() - 0.5) * 80, -5 + rr() * 6, -120 + (rr() - 0.5) * 70); S.add(l); luzesC.push([l, rr()]); }
        function render(t) {
          mc.update(t, { cabeca: 0.06 + Math.sin(t * 0.7) * 0.03 });
          mc.legs.forEach((l) => { l.rotation.z = 1.35; });
          mc.body.position.y = 0;
          mc.arms.forEach((a, i) => { a.rotation.z = 0.5; a.rotation.x = (i ? 1 : -1) * 0.25; });
          // a cidade acende enquanto ele olha
          sky.win.emissiveIntensity = lerp(0.4, 1.6, range(t, 0.3, 3.0));
          luzesC.forEach(([l, r]) => { l.material.opacity = range(t, 0.3 + r * 2.4, 0.6 + r * 2.4) * 0.6; });
          // por cima do ombro → grua subindo e girando
          const e = ease.inOutSine(range(t, 0, 4.22));
          const a = lerp(-0.35, 0.3, e), R = lerp(3.6, 5.2, e);
          cam.position.set(0.2 + Math.sin(a) * R, lerp(1.8, 3.0, e), 2.2 + Math.cos(a) * R);
          cam.lookAt(lerp(0.1, -1.5, e), lerp(0.9, -1.5, e), lerp(-2, -40, e));
          st.sol(0, 2, 6);
          st.draw();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
