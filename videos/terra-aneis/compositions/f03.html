<!-- f03: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f03.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.91 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f03-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f03" data-width="1080" data-height="1920">
    <canvas id="f03-canvas" width="1080" height="1920"></canvas>
    <div id="f03-r1" class="rot" style="top: 520px"><span id="f03-r1-in" class="rot-t"><span class="k">SATURNO</span><br><span class="y">280 mil km</span> de largura</span></div>
    <div id="f03-r2" class="rot" style="top: 520px"><span id="f03-r2-in" class="rot-t">espessura: <span class="y">~10 m</span><br><span class="p">a altura de um prédio</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.91;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f03-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f03" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f03-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.25 * K);
      tl.to("#f03-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.0 * K);
      tl.fromTo("#f03-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 4.15 * K);
      tl.to("#f03-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 5.61 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f03"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f03"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/terra.js"), import("./assets/lib/blocks/aneis.js")
      ]).then(async ([K_, T, A, TERRA, ANEIS]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f03-canvas");

        const AN = ANEIS;
        await AN.prepara();
        const st = T.createToyStage(canvas, { fov: 34, ceu: "#000000", nevoa: null, nuvens: 0, exposicao: 1.0 });
        const S = st.scene, cam = st.cam;
        S.environment = null; st.hemi.intensity = 0.04; st.key.intensity = 0; st.rim.intensity = 0; st.key.castShadow = false;
        S.add(TERRA.createCeu({ seed: 21, n: 4000, via: 0.35 }));
        const SOLD = new THREE.Vector3(1, 0.32, 0.55).normalize();
        // plano A: Saturno inteiro com os anéis
        const eixo = new THREE.Group(); eixo.rotation.set(0.18, 0, -0.47); S.add(eixo);
        const SA = AN.saturno(1); SA.u.uL.value.copy(SOLD); eixo.add(SA.mesh);
        const R = AN.anel({ Re: 1, r1: 1.24, r2: 2.27, op: 0.75, br: 1.15, amb: 0.015, cor: 0xead9bb, sombraA: 0.85 });
        R.mesh.rotation.x = -Math.PI / 2; eixo.add(R.mesh);
        const SH = AN.sombraAnel(1.004, R, { forca: 0.8 }); SH.scale.y = 0.9; eixo.add(SH);
        R.u.uL.value.copy(SOLD);
        // plano B: o anel de perfil, de perto — pedras e gelo numa lâmina fina, com um prédio de escala
        const S2 = new THREE.Scene(); S2.background = new THREE.Color(0x000000);
        S2.add(TERRA.createCeu({ seed: 22, n: 3000, via: 0.3 }));
        S2.add(new THREE.HemisphereLight(0x8090b0, 0x201810, 0.25));
        const L2 = new THREE.DirectionalLight(0xfff0dc, 3.2); L2.position.set(6, 2.2, 4); S2.add(L2);
        const RO = AN.campoRochas(S2, { n: 1300, area: [36, 0.55, 12], tam: [0.015, 0.16], seed: 8 });
        const PR = AN.predioEscala(0.62); PR.position.set(1.2, -0.31, 1.6); S2.add(PR);
        const SB = AN.saturno(1, { seed: 6 }); SB.mesh.scale.set(70, 63, 70); SB.mesh.position.set(-60, -60, -260); SB.u.uL.value.set(1, 0.4, 0.3).normalize(); S2.add(SB.mesh);
        const cam2 = new THREE.PerspectiveCamera(34, 1080 / 1920, 0.01, 2000);
        st.extraWarm = [{ renderer: st.renderer, scene: S2, camera: cam2 }];
        const alvo = new THREE.Vector3(), d = new THREE.Vector3(), up = new THREE.Vector3(), p1 = new THREE.Vector3(), p2 = new THREE.Vector3();
        function render(t) {
          if (t < 3.3) {
            const e = ease.inOutSine(range(t, 0, 3.3)), az = lerp(-0.35, 0.05, e), el = lerp(0.42, 0.3, e), r = lerp(12.5, 11, e);
            cam.position.set(Math.sin(az) * Math.cos(el) * r, Math.sin(el) * r, Math.cos(az) * Math.cos(el) * r);
            alvo.set(0, lerp(1.9, 1.6, e), 0); cam.lookAt(alvo);
            SA.mesh.rotation.y = t * 0.05; R.sync();
            st.bloom = 0.6; st.draw(S, cam, { cor: "#000", a: range(t, 3.12, 3.3) });
            // cota da largura do anel (da borda interna à externa)
            const k = range(t, 1.2, 1.9);
            if (k > 0) { up.set(0, 1, 0).applyQuaternion(eixo.quaternion); d.crossVectors(up, cam.position).normalize();
              p1.copy(d).multiplyScalar(1.24); p2.copy(d).multiplyScalar(lerp(1.24, 2.27, ease.outCubic(k)));
              const [x1, y1] = AN.proj(p1, cam), [x2, y2] = AN.proj(p2, cam), c = st.ctx;
              c.save(); c.globalAlpha = k * (1 - range(t, 3.0, 3.25)); c.strokeStyle = AN.AZUL; c.fillStyle = AN.AZUL; c.lineWidth = 4; c.shadowColor = "#000"; c.shadowBlur = 8;
              c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
              const nx = -(y2 - y1), ny = x2 - x1, nl = Math.hypot(nx, ny) || 1;
              [[x1, y1], [x2, y2]].forEach(([x, y]) => { c.beginPath(); c.moveTo(x - nx / nl * 18, y - ny / nl * 18); c.lineTo(x + nx / nl * 18, y + ny / nl * 18); c.stroke(); });
              c.restore(); }
          } else {
            const u = t - 3.3, e = ease.inOutSine(range(u, 0, 2.6));
            cam2.position.set(lerp(-3.0, -1.4, e), lerp(0.6, 0.25, e), lerp(7.0, 6.2, e));
            alvo.set(lerp(0.6, 1.0, e), lerp(1.15, 1.05, e), 0.8); cam2.lookAt(alvo);
            RO.update(u, 0.25); PR.rotation.y = 0.5 + 0.05 * u;
            st.bloom = 0.5; st.draw(S2, cam2, { cor: "#000", a: 1 - range(u, 0, 0.2) });
            const c = st.ctx, kb = range(u, 0.9, 1.3);
            if (kb > 0) {   // régua da espessura ao lado do prédio
              p1.set(2.0, -0.3, 1.6); p2.set(2.0, 0.3, 1.6);
              const [x1, y1] = AN.proj(p1, cam2), [x2, y2] = AN.proj(p2, cam2);
              c.save(); c.globalAlpha = kb; c.strokeStyle = AN.AZUL; c.lineWidth = 4; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2);
              c.moveTo(x1 - 16, y1); c.lineTo(x1 + 16, y1); c.moveTo(x2 - 16, y2); c.lineTo(x2 + 16, y2); c.stroke(); c.restore();
            }
          }
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
