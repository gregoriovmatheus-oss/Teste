<!-- f04: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f04.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.52 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f04-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f04" data-width="1080" data-height="1920">
    <canvas id="f04-canvas" width="1080" height="1920"></canvas>
    <div id="f04-r1" class="rot" style="top: 520px"><span id="f04-r1-in" class="rot-t">um <span class="y">arco enorme</span><br>ao norte</span></div>
    <div id="f04-r2" class="rot" style="top: 520px"><span id="f04-r2-in" class="rot-t"><span class="k">NO EQUADOR</span><br>só uma <span class="y">linha fina</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.52;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f04-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f04" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f04-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.5 * K);
      tl.to("#f04-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.65 * K);
      tl.fromTo("#f04-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 3.95 * K);
      tl.to("#f04-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 5.22 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f04"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f04"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/lowpoly.js"), import("./assets/lib/blocks/cinema.js"), import("./assets/lib/blocks/aneis.js")
      ]).then(async ([K_, T, A, LOWPOLY, CINEMA, ANEIS]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f04-canvas");

        const LP = LOWPOLY, CI = CINEMA, AN = ANEIS;
        await AN.prepara();
        const st = LP.palco(canvas, { fov: 60, foco: 3, faixa: 3, desfoque: 6, fundo: 0x9fc4e8, bloom: 0.8 });
        const { S, cam } = st;
        LP.luz(st, "dia"); st.U.nevoa.value = 0.002; st.exposicao = 1.05;
        CI.ceu(S, { topo: 0x0e2a62, horizonte: 0x9ab8d8, nuvens: 6, corNuvem: 0xf4f0ea, seed: 9 });
        const C = AN.ceuAnel(S, { lat: -23, br: 3.2, op: 0.85, amb: 0.35, sombraA: 0.4 });
        C.u.uL.value.copy(C.dirSol(300, 38));
        AN.chao(S, LP, { cor: 0x6a7a3a, morro: 0x4a5a3a, seed: 6, tufos: 700, raioTufo: 7 });
        st.fria.position.copy(AN.dir(300, 38)).multiplyScalar(8); st.fria.intensity = 3.0;
        const pai = LP.pessoa({ seed: 31, pele: 0x8a5a40, cabelo: 0x1a120c, jaqueta: 0x8a3a2a, camisa: 0xe8e0d0 });
        const fil = LP.pessoa({ seed: 33, idade: "crianca", pele: 0x8a5a40, cabelo: 0x1a120c, jaqueta: 0xf0b030, camisa: 0x2c4a6a });
        S.add(pai.root, fil.root); pai.root.rotation.y = Math.PI - 0.1; fil.root.position.set(0.62, 0, 0.12); fil.root.rotation.y = Math.PI + 0.15;
        const olho = new THREE.Vector3(), alvo = new THREE.Vector3(), cab = new THREE.Vector3(), mao = new THREE.Vector3();
        AN.semNaN(S);
        function render(t) {
          // a latitude "viaja" do Brasil (23° S) ao equador: o arco sobe e afina até virar uma linha no alto
          const kl = ease.inOutCubic(range(t, 2.9, 4.6));
          C.setLat(lerp(-23, -0.35, kl));
          olho.copy(AN.dir(lerp(-5, 0, kl), lerp(32, 80, kl))).multiplyScalar(40);
          LP.ator(pai, t, { seed: 31, olharPara: olho, emocao: "surpresa" });
          LP.ator(fil, t, { seed: 33, olharPara: olho, emocao: "alegre", pose: [["apontar", range(t, 1.4, 1.9) * (1 - range(t, 2.9, 3.3))]] });
          if (t > 1.4 && t < 3.3) { fil.root.updateMatrixWorld(true); mao.copy(AN.dir(-8, 30)).multiplyScalar(20); LP.alcancar(fil, 0, fil.cab.getWorldPosition(cab).add(mao.normalize().multiplyScalar(0.55)), range(t, 1.4, 1.9) * (1 - range(t, 2.9, 3.3))); }
          // câmera atrás deles, grua subindo → no equador, olha para o zênite
          const e = ease.inOutSine(range(t, 0, 2.9));
          cam.position.set(lerp(0.9, 0.5, e), lerp(0.7, 1.2, e), lerp(3.6, 3.0, e));
          cam.position.lerp(new THREE.Vector3(0.45, 0.55, 1.1), kl);
          alvo.set(0.2, 1.0, 0).add(AN.dir(0, lerp(lerp(14, 22, e), 84, kl)).multiplyScalar(30));
          cam.lookAt(alvo); cam.fov = lerp(60, 74, kl); cam.updateProjectionMatrix(); LP.camMao(cam, t, { seed: 4 });
          st.U.foco.value = lerp(3.2, 300, range(t, 0.6, 1.6)); st.U.faixa.value = 200;
          st.draw();
          const c = st.ctx;
          AN.etq(c, "BRASIL · OLHANDO PARA O NORTE", pai.cab.getWorldPosition(cab), cam, range(t, 0.25, 0.6) * (1 - range(t, 1.3, 1.5)), { dy: -260 });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
