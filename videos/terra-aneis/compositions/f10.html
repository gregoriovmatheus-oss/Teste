<!-- f10: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f10.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 6.72 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f10-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f10" data-width="1080" data-height="1920">
    <canvas id="f10-canvas" width="1080" height="1920"></canvas>
    <div id="f10-r1" class="rot" style="top: 520px"><span id="f10-r1-in" class="rot-t"><span class="k">ESTAÇÃO ESPACIAL</span><br>a <span class="y">400 km</span></span></div>
    <div id="f10-r2" class="rot" style="top: 520px"><span id="f10-r2-in" class="rot-t"><span class="y">abaixo</span> dos anéis</span></div>
    <div id="f10-r3" class="rot" style="top: 520px"><span id="f10-r3-in" class="rot-t">cada lançamento<br><span class="o">mais arriscado</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 6.72;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f10-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f10" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f10-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.4 * K);
      tl.to("#f10-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.65 * K);
      tl.fromTo("#f10-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 3.0 * K);
      tl.to("#f10-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 4.1 * K);
      tl.fromTo("#f10-r3-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 4.45 * K);
      tl.to("#f10-r3-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 6.42 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f10"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f10"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/terra.js"), import("./assets/lib/blocks/aneis.js")
      ]).then(async ([K_, T, A, TERRA, ANEIS]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f10-canvas");

        const AN = ANEIS;
        await AN.prepara();
        const st = T.createToyStage(canvas, { fov: 34, ceu: "#000000", nevoa: null, nuvens: 0, exposicao: 1.0 });
        const S = st.scene, cam = st.cam;
        S.environment = null; st.hemi.intensity = 0.04; st.key.intensity = 0; st.rim.intensity = 0; st.key.castShadow = false;
        S.add(TERRA.createCeu({ seed: 33, n: 4500, via: 0.5 }));
        const E = await TERRA.createTerra({ raio: 1 }); S.add(E.group);
        E.sol.set(0.6, 0.55, 0.6).normalize(); E.u.nuvens.value = 0.55; E.u.luzes.value = 0.6;
        const R = AN.anel({ Re: 1, r1: 1.25, r2: 2.4, op: 0.7, br: 1.5, amb: 0.02, sombraA: 0.7 });
        R.mesh.rotation.x = -Math.PI / 2; S.add(R.mesh);
        // órbita da estação: 400 km = 0,063 raio da Terra, inclinada 51,6°
        const orb = new THREE.Group(); orb.rotation.x = 51.6 * Math.PI / 180; S.add(orb);
        const tor = new THREE.Mesh(new THREE.TorusGeometry(1.063, 0.0045, 6, 200), new THREE.MeshBasicMaterial({ color: 0x7cc8ff, transparent: true, opacity: 0 }));
        tor.rotation.x = Math.PI / 2; orb.add(tor);
        const ISS = AN.brilho(0xcfe8ff, 0.09, "suave", 1); S.add(ISS);
        // trajetória de lançamento (equador → além do anel)
        const curva = new THREE.CatmullRomCurve3([[0, 0, 1.0], [0.25, 0.04, 1.35], [0.75, 0.06, 1.85], [1.5, 0.05, 2.35], [2.3, 0.02, 2.65]].map((v) => new THREE.Vector3(...v)));
        const tubo = new THREE.Mesh(new THREE.TubeGeometry(curva, 120, 0.012, 6), new THREE.MeshBasicMaterial({ color: 0xff8a4c }));
        S.add(tubo); const NT = tubo.geometry.index.count;
        const cab = AN.brilho(0xffc890, 0.22, "suave", 1); S.add(cab);
        const alerta = AN.brilho(0xff6a3a, 0.8, "raios", 0); S.add(alerta);
        const alvo = new THREE.Vector3(), q = new THREE.Vector3();
        function render(t) {
          E.earth.rotation.y = (-60 + 3 * t) * Math.PI / 180; E.nuv.rotation.y = t * 0.01;
          tor.material.opacity = 0.9 * range(t, 0.25, 0.8);
          const a = 0.6 + t * 0.55; q.set(Math.cos(a) * 1.063, 0, Math.sin(a) * 1.063); orb.localToWorld(q); ISS.position.copy(q);
          const kl = range(t, 4.45, 6.3);
          tubo.geometry.setDrawRange(0, Math.floor(NT * kl / 6) * 6); tubo.visible = kl > 0;
          curva.getPoint(Math.max(0.001, kl), cab.position); cab.material.opacity = kl > 0 && kl < 1 ? 1 : 0;
          const cruza = range(kl, 0.2, 0.3) * (1 - range(kl, 0.55, 0.75)); curva.getPoint(0.42, alerta.position); alerta.material.opacity = cruza; alerta.scale.setScalar(0.5 + 0.5 * cruza);
          const e = ease.inOutSine(range(t, 0, 6.72)), az = lerp(-0.2, 0.35, e), el = lerp(0.95, 0.62, e), r = lerp(10.5, 9.0, e);
          cam.position.set(Math.sin(az) * Math.cos(el) * r, Math.sin(el) * r, Math.cos(az) * Math.cos(el) * r);
          alvo.set(0, lerp(1.6, 1.3, e), 0); cam.lookAt(alvo);
          R.u.uL.value.copy(E.sol); R.sync();
          st.bloom = 0.7; st.draw();
          const c = st.ctx;
          AN.etq(c, "ESTAÇÃO · 400 KM", ISS.position, cam, range(t, 1.45, 1.75) * (1 - range(t, 2.75, 2.95)), { dy: 300, dx: 160 });
          AN.etq(c, "ANEL · MILHARES DE KM", q.set(1.9, 0, 1.0), cam, range(t, 3.0, 3.3) * (1 - range(t, 4.2, 4.45)), { dy: -200, dx: -260 });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
