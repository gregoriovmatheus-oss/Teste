<!-- f01: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f01.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 6.0 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f01-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }

  </style>
  <div id="root" data-composition-id="f01" data-width="1080" data-height="1920">
    <canvas id="f01-canvas" width="1080" height="1920"></canvas>
    <div id="f01-r1" class="rot" style="top: 700px"><span id="f01-r1-in" class="rot-t"><span class="k">UM EXPERIMENTO MENTAL</span><br>E se você nunca mais sentisse <span class="y">dor</span>?</span></div>
  </div>
  <script>
    (function () {
      const D0 = 6.0;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f01-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f01" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f01-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.0 * K);
      tl.to("#f01-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 1.7 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f01"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f01"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/lowpoly.js"), import("./assets/lib/blocks/dor.js")
      ]).then(async ([K_, T, A, LOWPOLY, DOR]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f01-canvas");

        const LP = LOWPOLY;
        const st = LP.palco(canvas, { foco: 1.6, faixa: 0.5, desfoque: 26 });
        const { S, cam } = st;
        S.background = new THREE.Color(0x1a1612);
        st.hemi.intensity = 0.9; st.quente.intensity = 2.6;
        const p = LP.pessoa({ seed: 4 }); S.add(p.root);
        const KZ = DOR.cozinhaR11(S, LP);
        KZ.cebola.position.set(0.27, 1.04, 0.47); KZ.cebola.rotation.y = -0.3;
        const esq = p.bracos[0];
        // corte no dedo da mão esquerda: risco escuro + gota discreta (sem sangue explícito)
        esq.cot.add(KZ.risco); KZ.risco.position.set(-0.025, -0.405, 0.022);
        esq.cot.add(KZ.gota); KZ.gota.position.set(-0.025, -0.41, 0.026);
        LP.bokeh(S, { n: 30, seed: 5, y: [1.2, 3], z: [-6, -2], cores: [0xffc070, 0xffe0b0, 0x7fb6ff] });
        const alvo = new THREE.Vector3(), mp = new THREE.Vector3();
        const ROSTO = [0.02, 1.64, 0.06];
        function render(t) {
          // picando ~2,2 vezes/s; a picada do corte cai em 2,1 s ("não sente nada")
          const ch = Math.pow(0.5 + 0.5 * Math.sin((t - 2.1) * Math.PI * 2 * 2.2 + Math.PI / 2), 2);
          DOR.poseCozinha(p, ch, KZ.faca, { inclina: 0.3 });
          p.emocao("calmo", [0.05, -0.45]);
          KZ.risco.scale.set(range(t, 2.1, 2.2) || 1e-4, 1, 1);
          const g = ease.outCubic(range(t, 2.3, 4.4));
          KZ.gota.scale.setScalar(g ? 0.5 + g : 1e-4); KZ.gota.position.y = -0.41 - g * 0.014;
          esq.cot.updateMatrixWorld(true); KZ.risco.getWorldPosition(mp);
          // câmera: rosto calmo (miniatura) → grua até as mãos no corte → sobe de volta ao rosto, ainda calmo
          const a = ease.inOutCubic(range(t, 1.55, 2.1)), b = ease.inOutSine(range(t, 3.9, 5.2));
          const c0 = [0.32, 1.66, 1.62], l0 = [0.04, 1.4, 0.06];
          const c1 = [mp.x - 0.02, mp.y + 0.3, mp.z + 0.46], l1 = [mp.x + 0.01, mp.y - 0.07, mp.z - 0.02];
          const c2 = [-0.34, 1.6, 1.4], l2 = [0.02, 1.36, 0.2];
          const P = [0, 1, 2].map((i) => lerp(lerp(c0[i], c1[i], a), c2[i], b)), L = [0, 1, 2].map((i) => lerp(lerp(l0[i], l1[i], a), l2[i], b));
          const dr = t * 0.025;
          cam.position.set(P[0] - dr, P[1] + dr * 0.3, P[2] - dr); cam.lookAt(L[0], L[1], L[2]);
          // foco: no rosto nas pontas, na mão no meio
          const dRosto = cam.position.distanceTo(alvo.set(...ROSTO)), dMao = cam.position.distanceTo(mp);
          st.U.foco.value = lerp(dRosto, dMao, a * (1 - b)); st.U.faixa.value = lerp(0.45, 0.18, a * (1 - b));
          st.T = Math.max(st.T, 0.18);   // miniatura: sem o dip de entrada no quadro 0
          st.draw();
          LP.etiqueta(st.ctx, "DOR: 0", mp, cam, range(t, 2.4, 2.65) * (1 - range(t, 3.85, 4.0)), { cor: "#ff8a4c", y0: 720, y1: 900, tam: 34 });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
