<!-- f05: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f05.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 4.84 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f05-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
    [data-composition-id="f05"] .rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); }
    [data-composition-id="f05"] .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    [data-composition-id="f05"] .rot-t .r { font-weight: 800; color: #ff8a4c; }
    [data-composition-id="f05"] .rot-t .k { font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; -webkit-text-stroke: 0; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    [data-composition-id="f05"] .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f05" data-width="1080" data-height="1920">
    <canvas id="f05-canvas" width="1080" height="1920"></canvas>
    <div id="f05-r1" class="rot" style="top: 700px"><span id="f05-r1-in" class="rot-t">A queimadura cresce em <span class="y">silêncio</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 4.84;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f05-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f05" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f05-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 3.05 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f05"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f05"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/dor.js")
      ]).then(async ([K_, T, A, DOR]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f05-canvas");

        const st = T.createToyStage(canvas, { fov: 36, ceu: ["#07080b", "#121318"], nevoa: [2, 9], corNevoa: "#0b0c10", nuvens: 0, exposicao: 1.05 });
        const S = st.scene, cam = st.cam;
        st.hemi.intensity = 0.4; st.key.intensity = 1.8; st.rim.intensity = 1.6;
        // cooktop de vidro preto
        const vid = new THREE.Mesh(new THREE.BoxGeometry(4, 0.04, 3), new THREE.MeshStandardMaterial({ color: 0x050507, roughness: 0.08, metalness: 0.3 })); vid.position.y = -0.02; S.add(vid);
        const fogo = DOR.boca(S, 0, 0.004, 0.15);
        const m = DOR.mao({ escala: 0.55 }); m.g.position.set(0.05, 0.1, -0.42); m.g.rotation.y = -0.12; S.add(m.g);
        // nervo do dedo ao punho: o sinal sai e morre no caminho (sem reflexo)
        const ner = new THREE.CatmullRomCurve3([new THREE.Vector3(0.0, 0.17, 0.12), new THREE.Vector3(0.02, 0.2, -0.2), new THREE.Vector3(0.05, 0.22, -0.55), new THREE.Vector3(0.07, 0.2, -1.0)]);
        const nm = new THREE.MeshBasicMaterial({ color: new THREE.Color(0x7cc8ff).multiplyScalar(1.4), toneMapped: false, transparent: true, opacity: 0, depthTest: false });
        const nt = new THREE.Mesh(new THREE.TubeGeometry(ner, 30, 0.006, 5), nm); nt.renderOrder = 4; S.add(nt);
        const pu = DOR.glowSprite(0xff8a4c, 0.18, 0); S.add(pu);
        // fumaça fina subindo das pontas dos dedos
        const R = mulberry32(55), NF = 260, fb = new Float32Array(NF * 4), fa = new Float32Array(NF * 3);
        for (let i = 0; i < NF; i++) { fb[i * 4] = (R() - 0.5) * 0.35; fb[i * 4 + 1] = R(); fb[i * 4 + 2] = 0.05 + (R() - 0.3) * 0.25; fb[i * 4 + 3] = R() * 6; }
        const fg = new THREE.BufferGeometry(); fg.setAttribute("position", new THREE.BufferAttribute(fa, 3));
        const fum = new THREE.Points(fg, new THREE.PointsMaterial({ color: 0xb8b0a8, size: 0.035, transparent: true, opacity: 0, depthWrite: false, map: DOR.glowTex() })); S.add(fum);
        const ponta = new THREE.Vector3();
        function render(t) {
          fogo.set(0.85 + 0.1 * Math.sin(t * 7));
          const qk = ease.inOutSine(range(t, 1.9, 4.84)); m.queima(qk);
          // dedos se apoiam e não se mexem
          m.dedos.forEach((d, i) => { d.rotation.x = 0.18 + 0.02 * Math.sin(i); });
          nm.opacity = range(t, 0.5, 0.8) * (1 - range(t, 1.6, 2.2) * 0.75);
          const q = range(t, 0.7, 1.5); pu.position.copy(ner.getPointAt(q * 0.5)); pu.material.opacity = q > 0 ? (1 - q) : 0; pu.scale.setScalar(0.18 * (1 - q * 0.7));
          const fp = fum.geometry.attributes.position;
          for (let i = 0; i < NF; i++) { const life = (fb[i * 4 + 1] + t * 0.25) % 1; fp.setXYZ(i, fb[i * 4] + Math.sin(t * 1.3 + fb[i * 4 + 3]) * 0.05 * life, 0.1 + life * 0.9, fb[i * 4 + 2] + life * 0.05); }
          fp.needsUpdate = true; fum.material.opacity = 0.45 * qk;
          // macro: desliza e aproxima da ponta dos dedos
          const e = ease.inOutSine(range(t, 0, 4.84));
          cam.position.set(lerp(1.5, 0.8, e), lerp(1.1, 0.85, e), lerp(2.0, 1.5, e));
          cam.lookAt(0.0, lerp(-0.55, -0.62, e), lerp(-0.1, 0.0, e));
          st.bloom = 0.75;
          st.sol(0, 0, 2);
          st.draw();
          const c = st.ctx, vv = DOR.vis(st); DOR.quadro();
          m.pontas[1].getWorldPosition(ponta);
          DOR.frase(c, cam, ner.getPointAt(0.5), "REFLEXO: DESLIGADO", range(t, 1.48, 1.65) * (1 - range(t, 2.75, 2.95)) * vv, { cor: DOR.LARANJA, tam: 28, dy: 120 });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
