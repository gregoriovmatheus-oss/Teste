<!-- f12: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f12.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 3.46 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f12-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
    [data-composition-id="f12"] .rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); }
    [data-composition-id="f12"] .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    [data-composition-id="f12"] .rot-t .r { font-weight: 800; color: #ff8a4c; }
    [data-composition-id="f12"] .rot-t .k { font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; -webkit-text-stroke: 0; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    [data-composition-id="f12"] .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f12" data-width="1080" data-height="1920">
    <canvas id="f12-canvas" width="1080" height="1920"></canvas>
    <div id="f12-r1" class="rot" style="top: 700px"><span id="f12-r1-in" class="rot-t">A dor não é<br>o <span class="y">inimigo</span></span></div>
    <div id="f12-r2" class="rot" style="top: 700px"><span id="f12-r2-in" class="rot-t">Ela é o <span class="r">alarme</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 3.46;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f12-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f12" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f12-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.4 * K);
      tl.to("#f12-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 1.75 * K);
      tl.fromTo("#f12-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.15 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f12"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f12"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/dor.js")
      ]).then(async ([K_, T, A, DOR]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f12-canvas");

        const st = T.createToyStage(canvas, { fov: 42, ceu: ["#0a0b0f", "#16181e"], nevoa: [3, 12], corNevoa: "#101218", nuvens: 0, exposicao: 1.05 });
        const S = st.scene, cam = st.cam;
        st.hemi.intensity = 0.45; st.key.intensity = 1.2;
        const teto = new THREE.Mesh(new THREE.PlaneGeometry(12, 12).rotateX(Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x8a8d94, roughness: 0.9 })); teto.position.y = 3; S.add(teto);
        const det = new THREE.Group(); det.position.set(0, 2.96, 0); S.add(det);
        const corpo = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.36, 0.1, 40), new THREE.MeshStandardMaterial({ color: 0xeeeeea, roughness: 0.35 })); corpo.position.y = -0.05; det.add(corpo);
        for (let i = 0; i < 3; i++) { const r = new THREE.Mesh(new THREE.TorusGeometry(0.12 + i * 0.07, 0.008, 6, 40), new THREE.MeshStandardMaterial({ color: 0xc8c8c4, roughness: 0.4 })); r.rotation.x = Math.PI / 2; r.position.y = -0.105; det.add(r); }
        const ledM = new THREE.MeshBasicMaterial({ color: 0x220404, toneMapped: false });
        const led = new THREE.Mesh(new THREE.SphereGeometry(0.03, 12, 8), ledM); led.position.set(0.2, -0.1, 0.05); det.add(led);
        const lg = DOR.glowSprite(0xff3020, 1.4, 0); lg.position.set(0.2, 2.84, 0.05); S.add(lg);
        const ondas = [0, 1, 2].map(() => { const m = new THREE.Mesh(new THREE.TorusGeometry(1, 0.012, 6, 64), new THREE.MeshBasicMaterial({ color: new THREE.Color(0xff4a2a).multiplyScalar(1.5), toneMapped: false, transparent: true, opacity: 0 })); m.rotation.x = Math.PI / 2; m.position.y = 2.9; S.add(m); return m; });
        // fumaça subindo até o sensor
        const R = mulberry32(121), NF = 300, fb = [], fa = new Float32Array(NF * 3);
        for (let i = 0; i < NF; i++) fb.push([(R() - 0.5) * 2.4, R(), (R() - 0.5) * 2.4, R() * 6]);
        const fg = new THREE.BufferGeometry(); fg.setAttribute("position", new THREE.BufferAttribute(fa, 3));
        const fum = new THREE.Points(fg, new THREE.PointsMaterial({ color: 0x9a9ca4, size: 0.16, map: DOR.glowTex(), transparent: true, opacity: 0.35, depthWrite: false })); S.add(fum);
        const TA = 2.72;
        function render(t) {
          for (let i = 0; i < NF; i++) { const [x, f, z, ph] = fb[i], u = (f + t * 0.18) % 1; fa[i * 3] = x * (1 - u * 0.6) + Math.sin(t + ph) * 0.15; fa[i * 3 + 1] = 0.6 + u * 2.3; fa[i * 3 + 2] = z * (1 - u * 0.6) + Math.cos(t * 0.8 + ph) * 0.15; }
          fg.attributes.position.needsUpdate = true;
          const on = t > TA ? 1 : 0, pis = on * (0.5 + 0.5 * Math.sign(Math.sin((t - TA) * Math.PI * 5)));
          ledM.color.setHex(on ? (pis > 0.5 ? 0xff2a1a : 0x501010) : 0x220404); if (on && pis > 0.5) ledM.color.multiplyScalar(2);
          lg.material.opacity = on * (0.3 + 0.6 * pis);
          ondas.forEach((m, i) => { const q = ((t - TA) * 0.9 + i / 3) % 1; m.scale.setScalar(0.4 + q * 3); m.material.opacity = on * (1 - q) * 0.8; });
          st.rim.color.set(0xff4a2a); st.rim.intensity = on * (0.5 + 2.5 * pis);
          const e = ease.inOutSine(range(t, 0, 3.46));
          cam.position.set(lerp(0.9, 0.3, e), lerp(0.4, 0.8, e), lerp(3.2, 2.6, e));
          cam.lookAt(0, lerp(1.95, 2.05, e), 0);
          st.bloom = 0.6 + on * 0.3;
          st.sol(0, 0, 3, 2);
          st.draw(undefined, undefined, on ? { cor: "#ff3a1a", a: 0.08 * pis } : null);
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
