<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{position:absolute;inset:0;width:1080px;height:1920px}</style></head><body><canvas id="c"></canvas>
<script type="module">
import * as THREE from "./assets/lib/three.module.js";
import * as LP from "./assets/lib/blocks/lowpoly.js";
import * as CI from "./assets/lib/blocks/cinema.js";
const U = new URLSearchParams(location.search), q = +(U.get("q") || 0), ang = +(U.get("a") || 0.35), t = +(U.get("t") || 1);
const P = LP.palco(null, { webgl: document.getElementById("c"), foco: 3, faixa: 1.5, desfoque: 14 }); const { S, cam } = P;
LP.luz(P, "interior"); CI.cenario(S, "escritorio");
const E = [{ seed: 4, jaqueta: 0x2f4f6f }, { seed: 31, feminina: true, roupa: "camiseta", camisa: 0xc84a6a, pele: 0xd9a07e, cabelo: 0x2a1a10 }, { seed: 32, idade: "idoso", roupa: "casaco", pele: 0xc89478 }, { seed: 34, roupa: "jaleco", oculos: true, pele: 0xe0b898, barba: false, cabelo: 0x6a4a2a }];
const p = LP.pessoa(E[q]); S.add(p.root);
const op = { seed: q + 1, emocao: "calmo" }; if (U.get("m") === "andar") op.andar = true; if (U.get("m") === "gestos") op.gestos = true;
LP.ator(p, t, op);
cam.position.set(Math.sin(ang) * 3.4, 1.2, Math.cos(ang) * 3.4); cam.lookAt(0, 0.95, 0); LP.focar(P, new THREE.Vector3(0, 1.2, 0));
P.T = 1; P.D = 10; P.draw(); window.PRONTO = true;
</script></body></html>
