<!-- f10: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f10.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.46 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f10-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
    [data-composition-id="f10"] .rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); }
    [data-composition-id="f10"] .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    [data-composition-id="f10"] .rot-t .r { font-weight: 800; color: #ff8a4c; }
    [data-composition-id="f10"] .rot-t .k { font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 28px; letter-spacing: 0.3em; color: #7cc8ff; margin-bottom: 18px; -webkit-text-stroke: 0; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    [data-composition-id="f10"] .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f10" data-width="1080" data-height="1920">
    <canvas id="f10-canvas" width="1080" height="1920"></canvas>
    <div id="f10-r1" class="rot" style="top: 700px"><span id="f10-r1-in" class="rot-t">Um <span class="y">freio</span> forte</span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.46;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f10-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f10" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f10-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.9 * K);
      tl.to("#f10-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.5 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f10"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f10"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/regen.js")
      ]).then(async ([K_, T, A, REGEN]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f10-canvas");

        const RG = REGEN;
        const st = T.createToyStage(canvas, { fov: 38, ceu: ["#04070d", "#101c2c"], nevoa: [4, 14], corNevoa: "#060a12", nuvens: 0, exposicao: 1.08 });
        const S = st.scene, cam = st.cam;
        st.hemi.intensity = 0.55; st.key.intensity = 2.6; st.rim.color.set(0x7cc8ff); st.rim.intensity = 2.8; st.sol(0, 0, 3, 1);
        const grade = new THREE.GridHelper(12, 48, 0x1f4a6a, 0x13283c); S.add(grade);
        // braço: o contorno (mapa) já está lá; a pele cresce e para exatamente no contorno
        const BR = RG.braco(); BR.g.position.set(0, 2.72, 0); S.add(BR.g);
        BR.mats.mP.color.set(0xd49a78);
        const mm = new THREE.MeshBasicMaterial({ color: 0x7cc8ff, wireframe: true, transparent: true, opacity: 0.28, depthWrite: false, fog: false });
        BR.pele.children.forEach((o) => { const w = new THREE.Mesh(o.geometry, mm); w.scale.copy(o.scale).multiplyScalar(1.03); BR.g.add(w); });
        // painel com a alavanca do "freio" e duas lâmpadas
        const pn = new THREE.Group(); pn.position.set(0.75, 1.0, 0.1); pn.rotation.y = -0.35; S.add(pn);
        const base = new THREE.Mesh(T.roundBox(0.34, 0.5, 0.12, 0.03), T.M(0x2a2e36, 0.4, { metalness: 0.6 })); pn.add(base);
        const piv = new THREE.Group(); piv.position.set(0, -0.05, 0.07); pn.add(piv);
        const hast = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.22, 10), T.M(0xc8ccd2, 0.25, { metalness: 0.9 })); hast.position.y = 0.11; piv.add(hast);
        const bola = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 12), T.M(0xd83a2a, 0.3)); bola.position.y = 0.23; piv.add(bola);
        const lv = RG.emiss(0x3aff8a, 0.2), lr = RG.emiss(0xff4a2a, 0.2);
        const lamV = new THREE.Mesh(new THREE.SphereGeometry(0.03, 12, 8), lv); lamV.position.set(-0.09, 0.18, 0.07); pn.add(lamV);
        const lamR = new THREE.Mesh(new THREE.SphereGeometry(0.03, 12, 8), lr); lamR.position.set(0.09, 0.18, 0.07); pn.add(lamR);
        const gV = RG.glowSprite(0x3aff8a, 0.3, 0); gV.position.copy(lamV.position); pn.add(gV);
        const gR = RG.glowSprite(0xff4a2a, 0.3, 0); gR.position.copy(lamR.position); pn.add(gR);
        const v = new THREE.Vector3(), CV = new THREE.Color(0x3aff8a), CR = new THREE.Color(0xff4a2a);
        function render(t) {
          const liga = range(t, 2.86, 3.0), desliga = range(t, 4.01, 4.15);
          piv.rotation.z = lerp(0.6, -0.6, ease.outBack(liga)) + 1.2 * ease.outBack(desliga) - 0.0;
          const on = liga * (1 - desliga);
          lv.color.copy(CV).multiplyScalar(0.2 + 2.8 * on); gV.material.opacity = 0.9 * on;
          lr.color.copy(CR).multiplyScalar(0.2 + 2.8 * desliga); gR.material.opacity = 0.9 * desliga;
          // cresce só com o freio aberto e para no contorno, sem passar
          const k = lerp(0.42, 1.0, ease.inOutSine(range(t, 2.9, 4.0)));
          BR.set({ osso: 1, musculo: 1, nervo: 1, pele: k, peleOp: 1.0 });
          BR.mats.mP.userData.u.forca.value = 2.4 * on;
          mm.opacity = 0.28 + 0.25 * desliga * Math.max(0, Math.sin((t - 4.01) * 9)) * (1 - range(t, 4.6, 5.0));
          // câmera: perto do antebraço e do painel, girando devagar
          const e = ease.inOutSine(range(t, 0, 5.46));
          cam.position.set(lerp(1.9, 1.3, e), lerp(1.65, 1.35, e), lerp(2.3, 2.6, e)); cam.lookAt(lerp(0.3, 0.28, e), lerp(0.85, 0.75, e), 0);
          st.bloom = 0.5 + 0.3 * Math.max(on, desliga);
          st.draw();
          const c = st.ctx, vv = RG.vis(st); RG.quadro();
          pn.localToWorld(v.copy(lamV.position)); RG.frase(c, cam, v, "LIGA", ease.outCubic(range(t, 2.84, 3.05)) * vv, { cor: "#3aff8a", tam: 36, dy: 300, dx: -60 });
          pn.localToWorld(v.copy(lamR.position)); RG.frase(c, cam, v, "DESLIGA NA HORA CERTA", ease.outCubic(range(t, 4.0, 4.2)) * vv, { cor: RG.LARANJA, tam: 30, dy: 420, dx: -60 });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
