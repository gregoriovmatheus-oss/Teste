<!-- f07: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f07.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 6.86 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f07-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
    [data-composition-id="f07"] .rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); }
    [data-composition-id="f07"] .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    [data-composition-id="f07"] .rot-t .r { font-weight: 800; color: #ff8a4c; }
    [data-composition-id="f07"] .rot-t .k { font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 28px; letter-spacing: 0.3em; color: #7cc8ff; margin-bottom: 18px; -webkit-text-stroke: 0; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    [data-composition-id="f07"] .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f07" data-width="1080" data-height="1920">
    <canvas id="f07-canvas" width="1080" height="1920"></canvas>
    <div id="f07-r1" class="rot" style="top: 700px"><span id="f07-r1-in" class="rot-t">Hospitais <span class="y">mudariam</span></span></div>
    <div id="f07-r2" class="rot" style="top: 700px"><span id="f07-r2-in" class="rot-t">Ninguém ficaria<br>sem <span class="y">perna</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 6.86;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f07-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f07" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f07-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.1 * K);
      tl.to("#f07-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 1.35 * K);
      tl.fromTo("#f07-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 4.95 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f07"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f07"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/lowpoly.js"), import("./assets/lib/blocks/cinema.js"), import("./assets/lib/blocks/regen.js")
      ]).then(async ([K_, T, A, LOWPOLY, CINEMA, REGEN]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f07-canvas");

        const LP = LOWPOLY, CI = CINEMA, RG = REGEN;
        const st = LP.palco(canvas, { foco: 2.2, faixa: 0.8, desfoque: 18 });
        const { S, cam } = st;
        LP.luz(st, "dia"); st.hemi.intensity = 0.6; st.exposicao = 1.05;
        CI.cenario(S, "hospital"); CI.clima(st, "hospital");
        // paciente sentado na beira da cama; a perna direita (abaixo do joelho) cresce dentro do curativo-guia
        const p = LP.pessoa({ seed: 27, roupa: "pijama", jaqueta: 0x8fb0c8, pele: 0x9a6648, cabelo: 0x1a120c, barba: false });
        p.root.position.set(0.5, 0.33, -0.42); S.add(p.root);
        const perna = p.pernas[1];
        const tg = RG.texGuia(); tg.map.repeat.set(2, 2); tg.emissiveMap.repeat.set(2, 2);
        const gm = new THREE.MeshStandardMaterial({ map: tg.map, emissiveMap: tg.emissiveMap, emissive: 0xffffff, emissiveIntensity: 1.0, roughness: 0.85, flatShading: true });
        const cur = new THREE.Mesh(new THREE.CylinderGeometry(0.078, 0.07, 0.44, 12), gm); cur.position.y = -0.2; perna.j.add(cur);
        const brilho = RG.glowSprite(0x7cc8ff, 0.35, 0.6); perna.j.add(brilho); brilho.position.y = -0.42;
        // médica examina o curativo
        const m = LP.pessoa({ seed: 33, feminina: true, roupa: "jaleco", oculos: true, pele: 0xd9a07e, cabelo: 0x3a2214 });
        m.root.position.set(1.25, 0, 0.25); m.root.rotation.y = -Math.PI / 2 - 0.35; S.add(m.root);
        // prótese antiga no canto (some: não seria mais necessária)
        const pm = new THREE.MeshStandardMaterial({ color: 0x9aa0a8, roughness: 0.3, metalness: 0.8, transparent: true });
        const prot = new THREE.Group(); prot.position.set(-0.55, 0, 0.05); S.add(prot);
        const ha = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.5, 8), pm); ha.position.y = 0.33; prot.add(ha);
        const so = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.06, 0.2, 10), new THREE.MeshStandardMaterial({ color: 0x2a2c30, roughness: 0.5, transparent: true })); so.position.y = 0.66; prot.add(so);
        const pz = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.05, 0.24), pm); pz.position.set(0, 0.04, 0.05); prot.add(pz);
        const v = new THREE.Vector3(), RP = new THREE.Vector3(0.5, 1.55, -0.38), RM = new THREE.Vector3(1.2, 1.6, 0.25);
        function render(t) {
          p.reset(); m.reset();
          LP.sentar(p, 1);
          p.pernas.forEach((l, i) => (l.j.rotation.x += 0.1 * Math.sin(t * 1.3 + i)));
          const k = lerp(0.3, 1, ease.inOutSine(range(t, 2.6, 6.6)));
          perna.j.scale.set(1, k, 1); perna.pe.scale.set(range(k, 0.75, 1) || 1e-3, (range(k, 0.75, 1) || 1e-3) / k, range(k, 0.75, 1) || 1e-3);
          gm.emissiveIntensity = 0.6 + 0.5 * Math.sin(t * 3) ** 2; brilho.material.opacity = 0.35 + 0.3 * Math.sin(t * 3) ** 2;
          p.root.updateMatrixWorld(true); cur.getWorldPosition(v);
          LP.olharPara(p, v, 0.6 * (1 - ease.inOutSine(range(t, 4.8, 5.6))));
          p.emocaoMix("surpresa", "alegre", ease.inOutSine(range(t, 3.5, 5.4)));
          LP.vida(p, t, { seed: 27, balanco: 0.3, olhos: false });
          // médica se inclina, toca o curativo e depois sorri para o paciente
          m.coluna.rotation.x = 0.35 * ease.inOutSine(range(t, 0.6, 2.0)) * (1 - ease.inOutSine(range(t, 4.6, 5.6)));
          LP.alcancar(m, 0, v.clone().add(new THREE.Vector3(0.09, 0.05, 0.0)), ease.inOutSine(range(t, 1.0, 2.2)) * (1 - ease.inOutSine(range(t, 4.6, 5.4))), { maoGira: 0.3 });
          LP.olharPara(m, t < 4.9 ? v : RP, 0.8);
          m.emocaoMix("foco", "alegre", ease.inOutSine(range(t, 4.8, 5.6)));
          LP.vida(m, t, { seed: 33, balanco: 0.3, olhos: false });
          // prótese desaparece
          const pf = 1 - ease.inOutSine(range(t, 2.7, 3.6)); pm.opacity = pf; so.material.opacity = pf; prot.visible = pf > 0.01;
          // câmera: sala aberta → desce até o curativo → grua de volta aos dois rostos
          CI.trilho(cam, t, [[0, [0.05, 1.75, 2.4], [0.6, 1.15, -0.3]], [2.2, [0.3, 1.2, 1.4], [0.45, 0.55, -0.1]], [4.3, [0.65, 0.95, 1.1], [0.45, 0.45, -0.05]], [5.4, [0.95, 1.55, 2.8], [0.7, 1.1, -0.3]], [6.86, [1.05, 1.6, 3.1], [0.7, 1.1, -0.3]]], { mao: 1, seed: 7 });
          cur.getWorldPosition(v);
          CI.focoEntre(st, RP, v, ease.inOutSine(range(t, 1.6, 2.4)) * (1 - ease.inOutSine(range(t, 4.7, 5.6))));
          st.draw();
          const c = st.ctx, vv = RG.vis(st); RG.quadro();
          RG.frase(c, cam, v, "CURATIVO-GUIA", ease.outCubic(range(t, 2.8, 3.1)) * (1 - range(t, 4.6, 4.85)) * vv, { cor: RG.AZUL, tam: 32, dy: -160, dx: 160 });
          prot.localToWorld(v.set(0, 0.6, 0));
          RG.frase(c, cam, v, "PRÓTESE", ease.outCubic(range(t, 2.25, 2.5)) * (1 - range(t, 3.4, 3.7)) * vv, { cor: RG.LARANJA, tam: 32, dy: 40, dx: -40 });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
