<!-- f01: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f01.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.84 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f01-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }

  </style>
  <div id="root" data-composition-id="f01" data-width="1080" data-height="1920">
    <canvas id="f01-canvas" width="1080" height="1920"></canvas>
    <div id="f01-r1" class="rot" style="top: 700px"><span id="f01-r1-in" class="rot-t"><span class="k">UM EXPERIMENTO MENTAL</span><br>E se a Terra tivesse <span class="y">dois sóis?</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.84;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f01-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f01" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f01-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.0 * K);
      tl.to("#f01-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.6 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f01"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f01"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/lowpoly.js"), import("./assets/lib/blocks/doissois.js")
      ]).then(async ([K_, T, A, LOWPOLY, DOISSOIS]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f01-canvas");

        const LP = LOWPOLY, DS = DOISSOIS;
        await DS.fontes();
        const st = LP.palco(canvas, { fov: 34, foco: 1.7, faixa: 0.7, desfoque: 28, fundo: 0x1a120e });
        const { S, cam } = st;
        const Q = DS.quarto(S, LP);
        const p = LP.pessoa({ seed: 7, pele: 0xc08a6a, cabelo: 0x2a1a10, jaqueta: 0x56657a, camisa: 0xd8d2c6, barba: false, iris: 0x4a3420 });
        S.add(p.root);
        // luz dos dois sóis entrando pela janela: amarela (com sombra) e vermelha
        st.fria.color.set(0xffdca0); st.fria.intensity = 3.0; st.fria.position.set(-1.2, 3.6, 6);
        st.quente.color.set(0xff7a50); st.quente.intensity = 1.3; st.quente.position.set(2.6, 2.3, 6);
        st.rim.color.set(0x8fb4ff); st.rim.intensity = 1.4; st.rim2.intensity = 0.6; st.hemi.intensity = 0.35;
        const v3 = new THREE.Vector3(), olho = new THREE.Vector3(), alvo = new THREE.Vector3();
        const A0 = new THREE.Vector3(0, 1.45, 0), A1 = new THREE.Vector3(-0.2, 1.4, 50);
        function render(t) {
          st.T = Math.max(st.T, 0.17);   // frame 0 = miniatura: sem dip de entrada
          // rosto: espanto crescendo; em "vê dois sóis" (1,65 s) a boca abre
          p.emocao(t < 1.6 ? "medo" : t < 3.4 ? "panico" : "medo", [lerp(0.05, -0.12, range(t, 0.4, 1.4)), 0.35]);
          p.cab.rotation.set(-0.12 - 0.05 * ease.inOutSine(range(t, 1.4, 2.2)), lerp(0.1, -0.06, ease.inOutSine(range(t, 0, 2))), 0.03);
          Q.SA.set(1, t); Q.SV.set(1, t * 1.3);
          const pul = 1 + 0.06 * Math.sin(t * 2.1);
          Q.SV.halo.scale.setScalar(9 * pul);
          // câmera: rosto de frente (dentro do quarto) -> gira por trás do ombro -> empurra para a janela
          const o = ease.inOutCubic(range(t, 1.85, 3.15));
          const a = lerp(lerp(-0.18, 0.12, ease.inOutSine(range(t, 0, 1.85))), Math.PI - 0.1, o);
          const r = lerp(1.55, 1.15, o) - 0.75 * Math.sin(Math.PI * o) - 0.35 * ease.inOutSine(range(t, 3.15, 5.84));
          olho.set(Math.sin(a) * r, lerp(1.6, 1.82, o), Math.cos(a) * r);
          cam.position.copy(olho);
          alvo.lerpVectors(A0, A1, ease.inCubic(o));
          cam.lookAt(alvo);
          st.U.foco.value = lerp(r, 48, ease.inOutCubic(range(t, 2.4, 3.3)));
          st.U.faixa.value = lerp(0.7, 30, range(t, 2.4, 3.3));
          st.draw();
          const c = st.ctx;
          DS.etq(c, "AMARELO", Q.SA.group.position, cam, range(t, 3.06, 3.36), { cor: "#ffd27a", dy: 150 });
          DS.etq(c, "VERMELHO · MENOR", Q.SV.group.position, cam, range(t, 4.65, 4.95), { cor: DS.LARANJA, dy: 150 });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
