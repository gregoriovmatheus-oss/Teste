<!-- f03: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f03.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.67 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f03-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }

  </style>
  <div id="root" data-composition-id="f03" data-width="1080" data-height="1920">
    <canvas id="f03-canvas" width="1080" height="1920"></canvas>
    <div id="f03-r1" class="rot" style="top: 700px"><span id="f03-r1-in" class="rot-t"><span class="k">ESTRELAS COMO O SOL</span><br>quase <span class="y">metade</span><br>vive em par</span></div>
    <div id="f03-r2" class="rot" style="top: 700px"><span id="f03-r2-in" class="rot-t">nós somos a <span class="y">exceção</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.67;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f03-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f03" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f03-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.55 * K);
      tl.to("#f03-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.2 * K);
      tl.fromTo("#f03-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 3.95 * K);
      tl.to("#f03-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 5.37 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f03"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f03"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/terra.js"), import("./assets/lib/blocks/doissois.js")
      ]).then(async ([K_, T, A, TERRA, DOISSOIS]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f03-canvas");

        const DS = DOISSOIS;
        const st = T.createToyStage(canvas, { fov: 46, ceu: "#000000", nevoa: null, nuvens: 0, exposicao: 1.0 });
        const S = st.scene, cam = st.cam;
        S.environment = null; st.hemi.intensity = 0; st.key.intensity = 0; st.rim.intensity = 0; st.key.castShadow = false;
        S.add(TERRA.createCeu({ seed: 31, n: 5000, via: 0.7 }));
        const R = mulberry32(303), SIS = [];
        const CORES = [0xfff0d0, 0xffd49a, 0xffb070, 0xff7a50, 0xd8e4ff];
        const SOL = new THREE.Vector3(2.6, 1.2, -26);
        for (let i = 0; i < 34; i++) {
          const pos = new THREE.Vector3((R() - 0.5) * 26, (R() - 0.5) * 22, -6 - R() * 60);
          if (pos.distanceTo(SOL) < 6) pos.x -= 9;
          const par = i % 2 === 0 && i !== 0;
          const g = new THREE.Group(); g.position.copy(pos); S.add(g);
          const a = DS.brilho(CORES[i % 5], 2.4), a2 = DS.brilho(0xffffff, 0.5, "disco"); g.add(a, a2);
          const s = { g, par, a, a2, ph: R() * 6.28, w: 0.8 + R() * 1.4, sep: 0.5 + R() * 0.4 };
          if (par) {
            s.b = DS.brilho(CORES[(i + 2) % 5], 1.6); s.b2 = DS.brilho(0xffffff, 0.35, "disco"); g.add(s.b, s.b2);
            s.anel = new THREE.Mesh(new THREE.TorusGeometry(1.4, 0.035, 4, 64), new THREE.MeshBasicMaterial({ color: 0x7cc8ff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
            g.add(s.anel);
          }
          SIS.push(s);
        }
        // o nosso Sol: sozinho, com anel laranja
        const sol = new THREE.Group(); sol.position.copy(SOL); S.add(sol);
        sol.add(DS.brilho(0xffe2a8, 3.4), DS.brilho(0xffffff, 0.7, "disco"), DS.brilho(0xffd7a0, 9, "raios", 0.4));
        const anelSol = new THREE.Mesh(new THREE.TorusGeometry(1.8, 0.05, 4, 64), new THREE.MeshBasicMaterial({ color: 0xff8a4c, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
        sol.add(anelSol);
        const alvo = new THREE.Vector3();
        function render(t) {
          const hl = ease.outCubic(range(t, 0.58, 1.3)), apaga = range(t, 3.7, 4.4);
          for (const s of SIS) {
            if (!s.par) continue;
            const a = s.ph + t * s.w, d = s.sep;
            s.a.position.set(Math.cos(a) * d * 0.4, Math.sin(a) * d * 0.25, 0); s.a2.position.copy(s.a.position);
            s.b.position.set(-Math.cos(a) * d, -Math.sin(a) * d * 0.6, 0); s.b2.position.copy(s.b.position);
            s.anel.material.opacity = 0.75 * hl * (1 - 0.7 * apaga);
            s.anel.lookAt(cam.position);
          }
          anelSol.material.opacity = ease.outCubic(range(t, 3.8, 4.3));
          anelSol.lookAt(cam.position); anelSol.scale.setScalar(1 + 0.08 * Math.sin(t * 4));
          // voo pelo campo de estrelas; em "Nós" vira para o Sol solitário
          const e = ease.inOutSine(range(t, 0, 3.8)), v = ease.inOutCubic(range(t, 3.5, 5.67));
          cam.position.set(lerp(-2, 1, e) + v * 1.2, lerp(-1, 0.5, e), lerp(14, -4, e) - v * 12);
          alvo.set(lerp(0, 1, e), lerp(2.2, 1.5, e), -40).lerp(SOL.clone().add(new THREE.Vector3(0, -2.2, 0)), v);
          cam.lookAt(alvo);
          st.bloom = 0.9;
          st.draw();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
