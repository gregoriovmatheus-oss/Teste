<!-- f05: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f05.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 4.95 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f05-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }

  </style>
  <div id="root" data-composition-id="f05" data-width="1080" data-height="1920">
    <canvas id="f05-canvas" width="1080" height="1920"></canvas>
    <div id="f05-r1" class="rot" style="top: 700px"><span id="f05-r1-in" class="rot-t"><span class="y">pequeno</span> e <span class="y">distante</span></span></div>
    <div id="f05-r2" class="rot" style="top: 700px"><span id="f05-r2-in" class="rot-t">só <span class="y">um pouco</span> a mais<br>de luz e calor</span></div>
  </div>
  <script>
    (function () {
      const D0 = 4.95;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f05-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f05" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f05-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.05 * K);
      tl.to("#f05-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.3 * K);
      tl.fromTo("#f05-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.65 * K);
      tl.to("#f05-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 4.65 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f05"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f05"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/terra.js"), import("./assets/lib/blocks/doissois.js")
      ]).then(async ([K_, T, A, TERRA, DOISSOIS]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f05-canvas");

        const DS = DOISSOIS;
        await DS.fontes();
        const st = T.createToyStage(canvas, { fov: 40, ceu: "#000000", nevoa: null, nuvens: 0, exposicao: 1.0 });
        const S = st.scene, cam = st.cam;
        S.environment = null; st.hemi.intensity = 0; st.key.intensity = 0; st.rim.intensity = 0; st.key.castShadow = false;
        S.add(TERRA.createCeu({ seed: 52, n: 4500, via: 0.55 }));
        const E = await DS.terraDupla({ raio: 1 }); S.add(E.group); E.aim(-50, -10);
        E.u.s1.value.set(-1, 0.3, 0.55);   // o nosso Sol fica fora do quadro, à esquerda e atrás
        const PV = new THREE.Vector3(4, 24, -70);
        const SV = DS.estrela(S, { r: 0.9, tipo: "vermelho", halo: 7, pos: PV.toArray() });
        E.u.s2.value.copy(PV);
        const F = DS.feixe(S, 0xff6a40);
        // régua tracejada Terra -> anã vermelha
        const pts = []; for (let i = 0; i < 40; i++) { const s = DS.brilho(0x7cc8ff, 0.35, "disco"); S.add(s); pts.push(s); }
        const v = new THREE.Vector3();
        function render(t) {
          SV.set(1, t);
          const reg = range(t, 1.84, 2.5), luz = ease.inOutSine(range(t, 2.55, 3.9));
          pts.forEach((s, i) => { const k = 0.06 + 0.94 * i / 40; v.lerpVectors(new THREE.Vector3(0.6, 1.1, -0.4), PV, k * 0.92); s.position.copy(v); s.material.opacity = (k < reg ? 1 : 0) * 0.55 * (1 - luz * 0.6) * (1 - range(k, 0.75, 0.95)); s.scale.setScalar(0.12 + k * 0.6); });
          F.de(PV, E.group.position, 2.2, luz * 0.45, t);
          E.u.c1.value.set(1.05, 1.0, 0.92); E.u.c2.value.set(0.55, 0.16, 0.08).multiplyScalar(0.12 + 0.35 * luz);
          E.earth.rotation.y = -(-50 + 90) * Math.PI / 180 + t * 0.04;
          // da Terra, olhando a anã vermelha lá longe; zoom lento até ela
          const e = ease.inOutSine(range(t, 0, 4.95));
          cam.fov = lerp(42, 36, e); cam.updateProjectionMatrix();
          cam.position.set(lerp(0.4, 0.6, e), lerp(0.5, 0.65, e), lerp(3.4, 3.0, e));
          cam.lookAt(lerp(1.2, 1.8, e), lerp(3.0, 5.0, e), -40);
          st.bloom = 0.75;
          st.draw();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
