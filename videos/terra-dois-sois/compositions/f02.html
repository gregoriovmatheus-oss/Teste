<!-- f02: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f02.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 6.21 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f02-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }

  </style>
  <div id="root" data-composition-id="f02" data-width="1080" data-height="1920">
    <canvas id="f02-canvas" width="1080" height="1920"></canvas>
    <div id="f02-r1" class="rot" style="top: 700px"><span id="f02-r1-in" class="rot-t"><span class="k">NASA · 2011</span><br><span class="y">Kepler-16b</span></span></div>
    <div id="f02-r2" class="rot" style="top: 700px"><span id="f02-r2-in" class="rot-t">gira em volta de<br><span class="y">2 estrelas</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 6.21;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f02-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f02" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f02-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.9 * K);
      tl.to("#f02-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 4.55 * K);
      tl.fromTo("#f02-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 4.95 * K);
      tl.to("#f02-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 5.91 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f02"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f02"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/terra.js"), import("./assets/lib/blocks/doissois.js")
      ]).then(async ([K_, T, A, TERRA, DOISSOIS]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f02-canvas");

        const DS = DOISSOIS;
        await DS.fontes();
        const st = T.createToyStage(canvas, { fov: 40, ceu: "#000000", nevoa: null, nuvens: 0, exposicao: 1.0 });
        const S = st.scene, cam = st.cam;
        S.environment = null; st.hemi.intensity = 0.04; st.key.intensity = 0; st.rim.intensity = 0; st.key.castShadow = false;
        S.add(TERRA.createCeu({ seed: 16, n: 4500, via: 0.6 }));
        // binária: estrela A (laranja, maior) e B (anã vermelha) girando em volta do centro de massa
        const SA = DS.estrela(S, { r: 0.55, tipo: "amarelo", halo: 9 });
        const SB = DS.estrela(S, { r: 0.3, tipo: "vermelho", halo: 10 });
        const LA = new THREE.PointLight(0xffd6a8, 3.2, 0, 0), LB = new THREE.PointLight(0xff5a3a, 1.4, 0, 0); S.add(LA, LB);
        const RA = 0.45, RB = 1.55, RP = 5.2;
        S.add(DS.anel(RA, 0xffb070, 0.35, 0.012), DS.anel(RB, 0xff6a4a, 0.35, 0.012), DS.anel(RP, 0x7cc8ff, 0.6, 0.02));
        const P = DS.gigante(0.42); P.rotation.z = 0.2; S.add(P);
        const pp = new THREE.Vector3(), alvo = new THREE.Vector3();
        function render(t) {
          const w = 0.9 * t + 0.6;
          SA.group.position.set(Math.cos(w) * RA, 0, Math.sin(w) * RA);
          SB.group.position.set(-Math.cos(w) * RB, 0, -Math.sin(w) * RB);
          LA.position.copy(SA.group.position); LB.position.copy(SB.group.position);
          SA.set(1, t); SB.set(1, t * 1.3);
          const f = 1.15 + t * 0.07;
          pp.set(Math.cos(f) * RP, 0, Math.sin(f) * RP); P.position.copy(pp); P.rotation.y = t * 0.4;
          // do planeta em primeiro plano (sóis atrás) para o sistema inteiro visto de cima
          const e = ease.inOutCubic(range(t, 0.4, 5.6));
          const c0 = new THREE.Vector3(Math.cos(f - 0.32) * RP * 1.08, 0.4, Math.sin(f - 0.32) * RP * 1.08);
          const c1 = new THREE.Vector3(4.5, 10.5, 12.5);
          cam.position.lerpVectors(c0, c1, e);
          alvo.lerpVectors(pp.clone().multiplyScalar(0.62).add(new THREE.Vector3(0, -0.25, 0)), new THREE.Vector3(0.6, 0, 2.6), e);
          cam.lookAt(alvo);
          st.bloom = 0.85;
          st.draw();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
