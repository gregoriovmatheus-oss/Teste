<!-- f06: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f06.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 6.16 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f06-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }

  </style>
  <div id="root" data-composition-id="f06" data-width="1080" data-height="1920">
    <canvas id="f06-canvas" width="1080" height="1920"></canvas>
    <div id="f06-r1" class="rot" style="top: 600px"><span id="f06-r1-in" class="rot-t"><span class="k">MESMO LADO</span><br>a noite <span class="y">existe</span></span></div>
    <div id="f06-r2" class="rot" style="top: 700px"><span id="f06-r2-in" class="rot-t"><span class="k">LADOS OPOSTOS</span><br>a noite some <span class="y">por meses</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 6.16;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f06-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f06" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f06-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.6 * K);
      tl.to("#f06-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.4 * K);
      tl.fromTo("#f06-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 4.0 * K);
      tl.to("#f06-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 5.86 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f06"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f06"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/terra.js"), import("./assets/lib/blocks/doissois.js")
      ]).then(async ([K_, T, A, TERRA, DOISSOIS]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f06-canvas");

        const DS = DOISSOIS;
        await DS.fontes();
        const st = T.createToyStage(canvas, { fov: 40, ceu: "#000000", nevoa: null, nuvens: 0, exposicao: 1.0 });
        const S = st.scene, cam = st.cam;
        S.environment = null; st.hemi.intensity = 0; st.key.intensity = 0; st.rim.intensity = 0; st.key.castShadow = false;
        S.add(TERRA.createCeu({ seed: 61, n: 4500, via: 0.45 }));
        // diagrama (fora de escala): Sol amarelo no centro, órbita da Terra, anã vermelha longe (norte)
        const RO = 4.6, PV = new THREE.Vector3(0, 0, -12);
        const SA = DS.estrela(S, { r: 0.85, tipo: "amarelo", halo: 7 });
        const SV = DS.estrela(S, { r: 0.45, tipo: "vermelho", halo: 9, pos: PV.toArray() });
        S.add(DS.anel(RO, 0x7cc8ff, 0.55, 0.025));
        const E = await DS.terraDupla({ raio: 0.62, seg: 64 }); S.add(E.group); E.u.atmo.value = 1.3;
        const AY = DS.seta(0xffd27a), AR = DS.seta(0xff6a4a); S.add(AY.group, AR.group);
        const ep = new THREE.Vector3(), a = new THREE.Vector3(), b = new THREE.Vector3(), d = new THREE.Vector3();
        function render(t) {
          SA.set(1, t); SV.set(1, t * 1.2);
          // Terra: ao sul do Sol (os dois sóis do mesmo lado) -> meia volta -> entre os dois (lados opostos)
          const th = Math.PI * ease.inOutCubic(range(t, 2.75, 4.3));
          ep.set(Math.sin(th) * RO * 0.999, 0, Math.cos(th) * RO); E.group.position.copy(ep);
          E.earth.rotation.y = t * 0.9;
          E.u.s1.value.copy(ep).negate(); E.u.s2.value.copy(PV).sub(ep);
          E.u.c1.value.set(1.05, 1.0, 0.92); E.u.c2.value.set(0.95, 0.32, 0.18);
          // setas de luz: de cada sol até a Terra
          d.copy(ep).normalize(); a.copy(d).multiplyScalar(1.1); b.copy(ep).addScaledVector(d, -0.85); AY.apontar(a, b, 0.05, 0.9);
          d.copy(ep).sub(PV).normalize(); a.copy(PV).addScaledVector(d, 0.7); b.copy(ep).addScaledVector(d, -0.85); AR.apontar(a, b, 0.05, 0.9);
          // câmera alta em órbita lenta
          const e = ease.inOutSine(range(t, 0, 6.16)), ang = lerp(0.55, -0.15, e);
          cam.position.set(Math.sin(ang) * 15, lerp(15, 13, e), Math.cos(ang) * 15 + 3);
          cam.lookAt(0, -6.2, -2.4);
          st.bloom = 0.8;
          st.draw();
          const c = st.ctx;
          // marcadores no próprio diagrama (acima da faixa dos títulos)
          const [x1, y1] = DS.proj(ep.clone().add(new THREE.Vector3(0, 0, 1.25)), cam);
          if (t < 2.7) DS.txt(c, "NOITE", x1, Math.min(y1 + 20, 1000), { tam: 30, cor: DS.AZUL, a: range(t, 2.15, 2.4) * (1 - range(t, 2.5, 2.7)) });
          if (t > 4.6) DS.txt(c, "SEM NOITE", x1, Math.max(640, Math.min(y1 - 130, 1000)), { tam: 30, cor: DS.LARANJA, a: range(t, 5.0, 5.3) });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
