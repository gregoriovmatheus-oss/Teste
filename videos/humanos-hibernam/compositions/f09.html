<!-- f09: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f09.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 4.03 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f09-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f09" data-width="1080" data-height="1920">
    <canvas id="f09-canvas" width="1080" height="1920"></canvas>
    <div id="f09-r1" class="rot" style="top: 700px"><span id="f09-r1-in" class="rot-t">Nave <span class="y">⅓ menor</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 4.03;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f09-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f09" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f09-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.38 * K);
      tl.to("#f09-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.73 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f09"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f09"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/hiber.js"), import("./assets/lib/blocks/terra.js")
      ]).then(async ([K_, T, A, HIBER, TERRA]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f09-canvas");

        await HIBER.prepara();
        const st = T.createToyStage(canvas, { fov: 36, ceu: ["#000000", "#02030a"], nevoa: null, nuvens: 0, exposicao: 1.0 });
        const S = st.scene, cam = st.cam;
        st.hemi.intensity = 0.15; st.rim.intensity = 0.6; st.rim.color.set(0x7cc8ff); st.key.intensity = 2.6; st.key.color.set(0xfff4e0);
        S.add(TERRA.createCeu({ seed: 9, n: 4000, via: 0.4 }));
        const nv = HIBER.nave(T.M); S.add(nv.g);
        const fant = HIBER.nave(T.M), fm = new THREE.MeshBasicMaterial({ color: 0x7cc8ff, wireframe: true, transparent: true, opacity: 0.35, toneMapped: false });
        fant.g.traverse((o) => { if (o.isMesh) o.material = fm; }); fant.motor.visible = false; fant.g.scale.setScalar(0.3); fant.g.position.set(0, 2.2, 0); S.add(fant.g);
        // carga: caixas de comida (laranja) e tambores de água (azul) ao lado
        const RR = mulberry32(91), NC = 24;
        const cx = new THREE.InstancedMesh(new THREE.BoxGeometry(0.14, 0.14, 0.14), T.M(0xc8823a, 0.6), NC);
        const ag = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.07, 0.07, 0.17, 12), T.M(0x3a7ac8, 0.35, { metalness: 0.4 }), NC);
        const PC = Array.from({ length: NC }, (_, i) => [-1.2 + (i % 8) * 0.13, 1.5 - Math.floor(i / 8) * 0.17, 0.3, RR()]);
        const PA = Array.from({ length: NC }, (_, i) => [0.1 + (i % 8) * 0.13, 1.5 - Math.floor(i / 8) * 0.19, 0.3, RR()]);
        S.add(cx, ag);
        const o3 = new THREE.Object3D();
        const setI = (im, L, t0, t) => { L.forEach(([x, y, z, r], i) => { const s = 1 - ease.inCubic(range(t, t0 + r * 0.4, t0 + r * 0.4 + 0.35)) * (i % 3 === 0 ? 0 : 1); o3.position.set(x, y, z); o3.rotation.set(r, r * 2, 0); o3.scale.setScalar(Math.max(s, 1e-4)); o3.updateMatrix(); im.setMatrixAt(i, o3.matrix); }); im.instanceMatrix.needsUpdate = true; };
        function render(t) {
          const k = ease.inOutCubic(range(t, 1.38, 2.0)), s = lerp(1, 0.667, k);
          nv.g.scale.setScalar(0.3 * s); nv.g.position.set(0.2 * (1 - s), 2.2, 0); fm.opacity = 0.15 + 0.35 * k;
          nv.motor.material.opacity = 0.8 + 0.2 * Math.sin(t * 20);
          setI(cx, PC, 2.63, t); setI(ag, PA, 3.36, t);
          const e = ease.inOutSine(range(t, 0, 4.03));
          cam.position.set(lerp(0.9, -0.6, e), lerp(1.3, 0.9, e), lerp(8.0, 7.2, e));
          cam.lookAt(-0.07, 0.3, 0);
          st.bloom = 0.6; st.draw();
          const c = st.ctx, vv = HIBER.vis(st), [x1, y1] = HIBER.proj(new THREE.Vector3(-0.75, 1.02, 0.3), cam), [x2, y2] = HIBER.proj(new THREE.Vector3(0.55, 1.02, 0.3), cam);
          HIBER.txt(c, "− COMIDA", x1, y1, { tam: 26, cor: HIBER.LARANJA, a: vv * range(t, 2.97, 3.2), esp: 0.2 });
          HIBER.txt(c, "− ÁGUA", x2, y2, { tam: 26, cor: HIBER.AZUL, a: vv * range(t, 3.49, 3.7), esp: 0.2 });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
