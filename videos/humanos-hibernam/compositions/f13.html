<!-- f13: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f13.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 6.3 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f13-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f13" data-width="1080" data-height="1920">
    <canvas id="f13-canvas" width="1080" height="1920"></canvas>
    <div id="f13-r1" class="rot" style="top: 700px"><span id="f13-r1-in" class="rot-t">O inverno não é<br>para ser <span class="y">vencido</span></span></div>
    <div id="f13-r2" class="rot" style="top: 700px"><span id="f13-r2-in" class="rot-t">É para ser <span class="y">dormido</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 6.3;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f13-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f13" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f13-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.46 * K);
      tl.to("#f13-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.3 * K);
      tl.fromTo("#f13-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 3.69 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f13"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f13"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/lowpoly.js"), import("./assets/lib/blocks/hiber.js")
      ]).then(async ([K_, T, A, LOWPOLY, HIBER]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f13-canvas");

        await HIBER.prepara();
        const LP = LOWPOLY;
        const st = LP.palco(canvas, { foco: 0.9, faixa: 0.4, desfoque: 22 });
        const { S, cam } = st;
        S.background = new THREE.Color(0x3a4656); st.exposicao = 1.25;
        st.hemi.intensity = 0.75; st.fria.color.set(0xfff0d0); st.fria.intensity = 2.4; st.fria.position.set(-1.2, 3.2, -4); st.quente.intensity = 1.3; st.quente.position.set(1.5, 1.4, 3); st.rim.color.set(0xffd8a0);
        const q = HIBER.quarto(S, { mk: LP.mat, estacao: "primavera" });
        q.cal.set(3); q.cob.visible = false; q.dobra.visible = false;
        // sentado na beira da cama, de frente, a janela de primavera atrás
        const p = LP.pessoa({ seed: 7, pele: 0xc08a6a, cabelo: 0x2a1a10, jaqueta: 0x3c4c62, camisa: 0x8a9ab0, barba: 0x3a2618, iris: 0x4a3020 });
        p.root.position.set(-0.85, -0.29, -0.42); S.add(p.root);
        p.pernas.forEach((l) => { l.q.rotation.x = -Math.PI / 2 + 0.1; l.j.rotation.x = Math.PI / 2 - 0.12; });
        p.bracos.forEach((b) => { b.om.rotation.x = -0.55; b.cot.rotation.x = -0.75; });
        const rosto = new THREE.Vector3(-0.85, 1.4, -0.32), alvo = new THREE.Vector3();
        const R = mulberry32(13), NP = 60, P = new Float32Array(NP * 3), J = Array.from({ length: NP }, () => [-1.0 + (R() - 0.5) * 1.4, R(), -1.4 - R() * 0.3, R() * 6.28]);
        const pg = new THREE.BufferGeometry(); pg.setAttribute("position", new THREE.BufferAttribute(P, 3));
        S.add(new THREE.Points(pg, new THREE.PointsMaterial({ map: HIBER.glowTex(), color: 0xfff0c8, size: 0.03, transparent: true, opacity: 0.7, depthWrite: false, blending: THREE.AdditiveBlending })));
        function render(t) {
          for (let i = 0; i < NP; i++) { const [x, o, z, ph] = J[i]; P[i * 3] = x + Math.sin(t * 0.5 + ph) * 0.1; P[i * 3 + 1] = 0.7 + ((o + t * 0.05) % 1) * 1.6; P[i * 3 + 2] = z + Math.cos(t * 0.4 + ph) * 0.1; }
          pg.attributes.position.needsUpdate = true;
          const olha = ease.inOutSine(range(t, 1.2, 2.2)) * (1 - ease.inOutSine(range(t, 3.6, 4.4)));
          p.emocao({ br: 0.04, by: 0.32, bo: [1.12, 0.32], ab: lerp(0.5, 0.62, range(t, 3.6, 4.4)), ol: [lerp(0.05, -0.45, olha), lerp(0.02, 0.15, olha)] });
          p.cab.rotation.set(lerp(0.05, -0.05, olha), lerp(0.05, -0.55, olha), 0);
          // começa no rosto e recua até o quarto inteiro: a mesma janela do começo, agora primavera
          const e = ease.inOutCubic(range(t, 0.2, 6.3));
          cam.position.set(lerp(-0.74, -0.2, e), lerp(1.45, 1.5, e), lerp(1.3, 3.1, e));
          alvo.set(lerp(-0.84, -0.75, e), lerp(0.98, 0.9, e), lerp(-0.32, -1.0, e)); cam.lookAt(alvo);
          st.U.foco.value = cam.position.distanceTo(rosto); st.U.faixa.value = lerp(0.35, 1.6, e);
          st.draw();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
