<!-- f07: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f07.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.66 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f07-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f07" data-width="1080" data-height="1920">
    <canvas id="f07-canvas" width="1080" height="1920"></canvas>
    <div id="f07-r1" class="rot" style="top: 700px"><span id="f07-r1-in" class="rot-t"><span class="k">MEDICINA</span><br>Isso mudaria <span class="y">tudo</span></span></div>
    <div id="f07-r2" class="rot" style="top: 700px"><span id="f07-r2-in" class="rot-t">Um paciente <span class="y">grave</span></span></div>
    <div id="f07-r3" class="rot" style="top: 700px"><span id="f07-r3-in" class="rot-t"><span class="y">Pausado</span><br><span class="p">até a cirurgia</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.66;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f07-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f07" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f07-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.3 * K);
      tl.to("#f07-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 1.85 * K);
      tl.fromTo("#f07-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.42 * K);
      tl.to("#f07-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.65 * K);
      tl.fromTo("#f07-r3-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 4.03 * K);
      tl.to("#f07-r3-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 5.36 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f07"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f07"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/hiber.js")
      ]).then(async ([K_, T, A, HIBER]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f07-canvas");

        await HIBER.prepara();
        const st = T.createToyStage(canvas, { fov: 36, ceu: ["#0c1418", "#16242a"], nevoa: [7, 22], corNevoa: "#0e1a20", nuvens: 0, exposicao: 1.0 });
        const S = st.scene, cam = st.cam;
        st.key.color.set(0xe0f4ff); st.key.intensity = 1.1; st.hemi.intensity = 0.3; st.rim.color.set(0x7cc8ff);
        const piso = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), T.M(0x5e6e70, 0.3, { metalness: 0.2 })); piso.rotation.x = -Math.PI / 2; piso.receiveShadow = true; S.add(piso);
        const parede = new THREE.Mesh(new THREE.PlaneGeometry(30, 8), T.M(0x5a6c70, 0.8)); parede.position.set(0, 4, -3); S.add(parede);
        // câmara fria de vidro com o paciente
        const leito = new THREE.Mesh(T.roundBox(2.4, 0.7, 1.0, 0.1), T.M(0xaab6bc, 0.4)); S.add(leito);
        const h = A.createAnimal("humano", { cor: 0xbfd8e8, cor2: 0xbfd8e8 }); h.group.rotation.z = -Math.PI / 2; h.group.position.set(-0.95, 0.92, 0); S.add(h.group);
        const lenc = new THREE.Mesh(T.roundBox(1.5, 0.22, 0.85, 0.1), T.M(0xb8c8d4, 0.9)); lenc.position.set(0.25, 0.72, 0); S.add(lenc);
        const cam_ = new THREE.Mesh(new THREE.BoxGeometry(2.7, 1.3, 1.3), new THREE.MeshStandardMaterial({ color: 0xbfe4ff, roughness: 0.05, transparent: true, opacity: 0.18, depthWrite: false }));
        cam_.position.set(0, 1.35, 0); S.add(cam_);
        const quadro = new THREE.Mesh(new THREE.BoxGeometry(2.74, 1.34, 1.34), new THREE.MeshBasicMaterial({ color: 0x7cc8ff, wireframe: true, transparent: true, opacity: 0.5, toneMapped: false })); quadro.position.copy(cam_.position); S.add(quadro);
        const frio = new THREE.PointLight(0x7cc8ff, 0, 4, 1.5); frio.position.set(0, 1.7, 0.3); S.add(frio);
        // monitor ao lado
        const mon = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.5, 0.08), T.M(0x1a1e22, 0.4)); mon.position.set(1.9, 1.9, -0.4); mon.rotation.y = -0.4; S.add(mon);
        const haste = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.7, 8), T.M(0x8a9098, 0.3, { metalness: 0.8 })); haste.position.set(1.9, 0.85, -0.45); S.add(haste);
        // geada: partículas finas dentro da câmara
        const NP = 500, P = new Float32Array(NP * 3), RR = mulberry32(77), J = Array.from({ length: NP }, () => [(RR() - 0.5) * 2.6, RR() * 1.2 + 0.75, (RR() - 0.5) * 1.2, RR() * 6.28]);
        const pg = new THREE.BufferGeometry(); pg.setAttribute("position", new THREE.BufferAttribute(P, 3));
        const pm = new THREE.PointsMaterial({ map: HIBER.glowTex(), color: 0xcfeaff, size: 0.04, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0 }); S.add(new THREE.Points(pg, pm));
        function render(t) {
          const fr = range(t, 3.0, 4.6);
          for (let i = 0; i < NP; i++) { const [x, y, z, p] = J[i]; P[i * 3] = x + Math.sin(t * 0.4 + p) * 0.05; P[i * 3 + 1] = y + Math.sin(t * 0.3 + p * 2) * 0.04; P[i * 3 + 2] = z; }
          pg.attributes.position.needsUpdate = true; pm.opacity = 0.15 + 0.75 * fr;
          cam_.material.opacity = 0.14 + 0.2 * fr; frio.intensity = 2.5 * fr;
          // dolly lateral ao longo da câmara
          const e = ease.inOutSine(range(t, 0, 5.66));
          cam.position.set(lerp(-2.6, 2.2, e), lerp(3.0, 2.7, e), lerp(5.4, 5.0, e));
          cam.lookAt(lerp(-0.5, 0.4, e), -0.45, 0);
          st.bloom = 0.5 + 0.3 * fr; st.sol(0, 0, 6);
          st.draw();
          const c = st.ctx, vv = HIBER.vis(st), [x, y] = HIBER.proj(new THREE.Vector3(1.9, 2.25, -0.4), cam);
          HIBER.txt(c, t < 4.03 ? "ESTÁVEL" : "PAUSADO", x, y - 30, { tam: 26, cor: t < 4.03 ? "#9fe8b0" : HIBER.LARANJA, a: vv * range(t, 0.4, 0.8), esp: 0.25 });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
