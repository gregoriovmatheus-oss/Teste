<!-- f04: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f04.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.63 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f04-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f04" data-width="1080" data-height="1920">
    <canvas id="f04-canvas" width="1080" height="1920"></canvas>
    <div id="f04-r1" class="rot" style="top: 700px"><span id="f04-r1-in" class="rot-t"><span class="k">METABOLISMO</span><br>Cai para <span class="y">¼</span> do normal</span></div>
    <div id="f04-r2" class="rot" style="top: 700px"><span id="f04-r2-in" class="rot-t">Quase <span class="y">nenhuma</span><br>energia gasta</span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.63;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f04-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f04" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f04-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.91 * K);
      tl.to("#f04-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.85 * K);
      tl.fromTo("#f04-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 3.22 * K);
      tl.to("#f04-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 5.33 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f04"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f04"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/hiber.js")
      ]).then(async ([K_, T, A, HIBER]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f04-canvas");

        await HIBER.prepara();
        const st = T.createToyStage(canvas, { fov: 36, ceu: ["#05070d", "#0d1320"], nevoa: [8, 26], corNevoa: "#0a0f1a", nuvens: 0, exposicao: 1.0 });
        const S = st.scene, cam = st.cam;
        st.key.color.set(0xdfe9ff); st.key.intensity = 1.8; st.hemi.intensity = 0.3; st.rim.color.set(0x7cc8ff);
        const piso = new THREE.Mesh(new THREE.CircleGeometry(12, 48), T.M(0x141a24, 0.35, { metalness: 0.3 })); piso.rotation.x = -Math.PI / 2; piso.receiveShadow = true; S.add(piso);
        const mesa = new THREE.Mesh(T.roundBox(2.4, 0.5, 0.9, 0.12), T.M(0x2a3240, 0.4, { metalness: 0.4 })); S.add(mesa);
        const h = A.createAnimal("humano", { cor: 0x8a9ab0, cor2: 0x3c4c62 }); h.group.rotation.z = -Math.PI / 2; h.group.position.set(-2.1, 0.72, 0); S.add(h.group); mesa.position.x = -1.15;
        h.arms.forEach((a) => (a.rotation.z = 0.05));
        // medidor em arco (270°) atrás da pessoa
        const N = 54, seg = new THREE.InstancedMesh(new THREE.BoxGeometry(0.05, 0.17, 0.03), new THREE.MeshBasicMaterial({ toneMapped: false }), N);
        const o3 = new THREE.Object3D(), RG = 0.85, CY = 1.25, GX = 1.05;
        for (let i = 0; i < N; i++) { const an = THREE.MathUtils.degToRad(225 - 270 * i / (N - 1)); o3.position.set(GX + Math.cos(an) * RG, CY + Math.sin(an) * RG, 0); o3.rotation.set(0, 0, an - Math.PI / 2); o3.updateMatrix(); seg.setMatrixAt(i, o3.matrix); seg.setColorAt(i, new THREE.Color(0x10161f)); }
        S.add(seg);
        // calor saindo do corpo (partículas laranja subindo)
        const NP = 260, P = new Float32Array(NP * 3), RR = mulberry32(44), J = Array.from({ length: NP }, () => [-1.15 + (RR() - 0.5) * 1.9, (RR() - 0.5) * 0.5, RR(), 0.5 + RR()]);
        const pg = new THREE.BufferGeometry(); pg.setAttribute("position", new THREE.BufferAttribute(P, 3));
        const pm = new THREE.PointsMaterial({ map: HIBER.glowTex(), color: 0xff8a4c, size: 0.09, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false });
        S.add(new THREE.Points(pg, pm));
        const cA = new THREE.Color(0x7cc8ff), cB = new THREE.Color(0xff8a4c), cOff = new THREE.Color(0x10161f), cc = new THREE.Color();
        const pctF = (t) => lerp(1, 0.25, ease.inOutCubic(range(t, 1.41, 2.46)));
        function render(t) {
          const pct = pctF(t), lit = Math.round(pct * N), k = range(t, 1.41, 2.46);
          cc.copy(cA).lerp(cB, k);
          for (let i = 0; i < N; i++) seg.setColorAt(i, i < lit ? cc : cOff);
          seg.instanceColor.needsUpdate = true;
          for (let i = 0; i < NP; i++) { const [x, z, o, v] = J[i], uu = ((t * 0.35 * v * (0.3 + pct) + o) % 1); P[i * 3] = x; P[i * 3 + 1] = 0.85 + uu * 1.4; P[i * 3 + 2] = z + Math.sin(t + i) * 0.05; }
          pg.attributes.position.needsUpdate = true; pm.opacity = 0.2 + 0.8 * pct;
          // grua descendo e girando devagar
          const e = ease.inOutSine(range(t, 0, 5.63)), a = lerp(-0.12, 0.12, e), d = lerp(11, 9.8, e);
          cam.position.set(Math.sin(a) * d, lerp(2.4, 1.8, e), Math.cos(a) * d);
          cam.lookAt(-0.3, lerp(-0.9, -0.8, e), 0);
          st.bloom = 0.6; st.sol(0, 0, 6);
          st.draw();
          const c = st.ctx, vv = HIBER.vis(st), [x, y] = HIBER.proj(new THREE.Vector3(GX, CY, 0), cam);
          HIBER.txt(c, "METABOLISMO", x, y - 40, { tam: 20, cor: HIBER.AZUL, a: vv * range(t, 0.6, 1.0), esp: 0.3 });
          HIBER.txt(c, Math.round(pct * 100) + "%", x, y + 20, { tam: 64, cor: k > 0.5 ? HIBER.LARANJA : "#fff", a: vv * range(t, 0.6, 1.0), esp: 0 });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
