<!-- f03: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f03.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.71 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f03-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f03" data-width="1080" data-height="1920">
    <canvas id="f03-canvas" width="1080" height="1920"></canvas>
    <div id="f03-r1" class="rot" style="top: 700px"><span id="f03-r1-in" class="rot-t">Um <span class="y">primata</span> que hiberna</span></div>
    <div id="f03-r2" class="rot" style="top: 700px"><span id="f03-r2-in" class="rot-t"><span class="k">MADAGASCAR</span><br><span class="p">lêmure-anão-de-<span class="y">cauda-gorda</span></span></span></div>
    <div id="f03-r3" class="rot" style="top: 700px"><span id="f03-r3-in" class="rot-t">Primata, <span class="y">como nós</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.71;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f03-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f03" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f03-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.03 * K);
      tl.to("#f03-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 1.95 * K);
      tl.fromTo("#f03-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.31 * K);
      tl.to("#f03-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.3 * K);
      tl.fromTo("#f03-r3-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 3.69 * K);
      tl.to("#f03-r3-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 5.41 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f03"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f03"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/hiber.js")
      ]).then(async ([K_, T, A, HIBER]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f03-canvas");

        await HIBER.prepara();
        const st = T.createToyStage(canvas, { fov: 34, ceu: ["#2a2440", "#e89a5c"], nevoa: [10, 60], corNevoa: "#c07a58", nuvens: 0, exposicao: 1.0 });
        const S = st.scene, cam = st.cam;
        st.key.color.set(0xffb070); st.key.intensity = 2.4; st.hemi.intensity = 0.5; st.rim.color.set(0xff8a4c);
        const chao = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), T.M(0xa07a54, 0.95)); chao.rotation.x = -Math.PI / 2; chao.receiveShadow = true; S.add(chao);
        const b = HIBER.baoba(T.M, 3, 1); S.add(b.g);
        const R = mulberry32(33);
        for (let i = 0; i < 7; i++) { const o = HIBER.baoba(T.M, 40 + i, 0.7 + R() * 0.6); o.g.position.set((R() - 0.5) * 40, 0, -10 - R() * 30); o.g.rotation.y = R() * 6; S.add(o.g); }
        for (let i = 0; i < 14; i++) { const o = T.arvore(0.5 + R() * 0.5, 0x6a7a3a, 60 + i); o.position.set((R() - 0.5) * 30, 0, -4 - R() * 20); S.add(o); }
        const l = HIBER.lemure(T.M); l.g.position.copy(b.oco).add(new THREE.Vector3(0.0, -0.3, -0.12)); l.g.rotation.y = -1.3; l.g.scale.setScalar(1.25); S.add(l.g);
        const luz = new THREE.PointLight(0xffc890, 1.4, 2, 1.5); luz.position.copy(b.oco).add(new THREE.Vector3(0.2, 0.3, 0.8)); S.add(luz);
        const alvo = new THREE.Vector3();
        function render(t) {
          l.respira(t, 1);
          // aproxima em arco do oco do baobá ao entardecer
          const e = ease.inOutSine(range(t, 0, 5.71)), a = lerp(0.5, -0.15, e), r = lerp(5.2, 1.5, e);
          cam.position.set(Math.sin(a) * r, lerp(1.6, 1.45, e), b.oco.z + Math.cos(a) * r);
          alvo.set(0, lerp(1.0, 1.05, e), b.oco.z); cam.lookAt(alvo);
          st.bloom = 0.55; st.sol(0, 0, 8);
          st.draw();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
