<!-- f01: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f01.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.96 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f01-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f01" data-width="1080" data-height="1920">
    <canvas id="f01-canvas" width="1080" height="1920"></canvas>
    <div id="f01-r1" class="rot" style="top: 700px"><span id="f01-r1-in" class="rot-t"><span class="k">UM EXPERIMENTO MENTAL</span><br>E se a gente pudesse <span class="y">hibernar</span>?</span></div>
    <div id="f01-r2" class="rot" style="top: 700px"><span id="f01-r2-in" class="rot-t"><span class="y">3 meses</span> depois</span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.96;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f01-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f01" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f01-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.0 * K);
      tl.to("#f01-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.45 * K);
      tl.fromTo("#f01-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 4.32 * K);
      tl.to("#f01-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 5.66 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f01"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f01"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/lowpoly.js"), import("./assets/lib/blocks/hiber.js")
      ]).then(async ([K_, T, A, LOWPOLY, HIBER]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f01-canvas");

        await HIBER.prepara();
        const LP = LOWPOLY, Q = HIBER.QUARTO;
        const st = LP.palco(canvas, { foco: 1.0, faixa: 0.35, desfoque: 24 });
        const { S, cam } = st;
        S.background = new THREE.Color(0x0b1220); st.exposicao = 1.2;
        st.hemi.intensity = 0.45; st.fria.intensity = 1.8; st.fria.position.set(-1.6, 3.5, -2.5); st.quente.intensity = 1.1; st.quente.position.set(-2.5, 1.2, 1.5);
        const q = HIBER.quarto(S, { mk: LP.mat, estacao: "inverno" });
        const p = LP.pessoa({ seed: 7, pele: 0xc08a6a, cabelo: 0x2a1a10, jaqueta: 0x3c4c62, camisa: 0x8a9ab0, barba: false, iris: 0x4a3020 });
        p.root.rotation.z = Math.PI / 2; p.root.position.set(Q.cabeca.x + 1.65, Q.cabeca.y, Q.cabeca.z); S.add(p.root);
        p.bracos.forEach((b) => { b.om.rotation.x = -1.1; b.cot.rotation.x = -1.2; });
        const alvo = new THREE.Vector3(), upD = new THREE.Vector3(-0.8, 0.6, 0).normalize(), up0 = new THREE.Vector3(0, 1, 0);
        const CAL = new THREE.Vector3(0.8, 1.7, -1.52);
        function render(t) {
          q.neve.update(t, 0.08);
          // olhos pesados: piscada em 0,9 s; fecham em "deita" (2,56 s) e ficam fechados
          const fecha = ease.inOutSine(range(t, 2.2, 2.95)), pisc = Math.max(0, 1 - Math.abs(t - 0.95) / 0.12);
          const ab = lerp(lerp(0.5, -1.3, pisc), -1.3, fecha);
          p.emocao({ br: lerp(-0.14, 0.04, fecha), by: 0.33, bo: [0.9, 0.25], ab, ol: [lerp(-0.25, 0, range(t, 0, 1.2)), 0.08] });
          p.cab.rotation.set(0.0, 0.15, lerp(0.05, -0.03, fecha));
          // câmera: rosto (deitado, câmera inclinada junto) empurra devagar; depois sobe, endireita e abre para o calendário
          const e1 = ease.inOutSine(range(t, 0, 2.9)), e2 = ease.inOutCubic(range(t, 2.8, 4.3));
          cam.up.copy(upD).lerp(up0, e2).normalize();
          cam.position.set(lerp(lerp(-0.6, -0.7, e1), 0.45, e2), lerp(lerp(0.88, 0.86, e1), 1.4, e2), lerp(lerp(0.75, 0.55, e1), 0.55, e2));
          alvo.set(lerp(-0.92, 0.75, e2), lerp(0.64, 1.22, e2), lerp(-0.6, -1.5, e2));
          cam.lookAt(alvo);
          st.U.foco.value = lerp(cam.position.distanceTo(Q.cabeca), cam.position.distanceTo(CAL), e2);
          st.U.faixa.value = lerp(0.35, 0.9, e2);
          // calendário: dezembro → março em "acorda em março" (3,2–3,9 s)
          q.cal.set(3 * ease.inOutSine(range(t, 3.15, 3.95)));
          st.T = Math.max(t, 0.17);   // frame 0 = miniatura: sem o dip de entrada
          st.draw();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
