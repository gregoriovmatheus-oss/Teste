<!-- f11: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f11.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 3.57 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f11-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f11" data-width="1080" data-height="1920">
    <canvas id="f11-canvas" width="1080" height="1920"></canvas>
    <div id="f11-r1" class="rot" style="top: 700px"><span id="f11-r1-in" class="rot-t">Quem fica <span class="y">acordado</span></span></div>
    <div id="f11-r2" class="rot" style="top: 700px"><span id="f11-r2-in" class="rot-t"><span class="y">Vigia</span> de um<br>mundo adormecido</span></div>
  </div>
  <script>
    (function () {
      const D0 = 3.57;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f11-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f11" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f11-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.1 * K);
      tl.to("#f11-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 1.35 * K);
      tl.fromTo("#f11-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.72 * K);
      tl.to("#f11-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.27 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f11"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f11"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/hiber.js")
      ]).then(async ([K_, T, A, HIBER]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f11-canvas");

        await HIBER.prepara();
        const st = T.createToyStage(canvas, { fov: 36, ceu: ["#03060e", "#1a2438"], nevoa: [12, 60], corNevoa: "#111a2a", nuvens: 0, exposicao: 0.8 });
        const S = st.scene, cam = st.cam;
        st.key.color.set(0x9fb8e0); st.key.intensity = 0.9; st.hemi.intensity = 0.3; st.rim.intensity = 0.3;
        const r = T.rua({ len: 80, larg: 10, calc: 3, seed: 14, arvores: false, hMin: 9, hMax: 24, chao: 0xdfe8f2 }); S.add(r.group);
        r.buildings.forEach((b, i) => (b.userData.win.emissiveIntensity = i === 5 ? 0.8 : 0));
        const neveRua = new THREE.Mesh(new THREE.PlaneGeometry(16, 80), T.M(0xb8c4d4, 0.85)); neveRua.rotation.x = -Math.PI / 2; neveRua.position.y = 0.42; S.add(neveRua);
        for (let i = 0; i < 6; i++) { const p = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 4.5, 8), T.M(0x2a2c30, 0.4)); p.position.set(5.5, 2.6, 10 - i * 12); S.add(p); }
        const h = A.createAnimal("humano", { cor: 0x6a3a2a, cor2: 0x2a2e38 }); S.add(h.group);
        const lan = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffd28a, toneMapped: false })); S.add(lan);
        const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: HIBER.glowTex(), color: 0xffb060, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, toneMapped: false })); halo.scale.set(0.9, 0.9, 1); S.add(halo);
        const luz = new THREE.PointLight(0xffb066, 2.5, 7, 1.6); S.add(luz);
        const nv = HIBER.neve(S, { n: 1500, x: [-8, 8], y: [0, 9], z: [-30, 10], seed: 71, tam: 0.07, vel: 0.6 });
        function render(t) {
          nv.update(t, 0.15);
          // o vigia anda rua abaixo, sozinho, com a lanterna
          const z = lerp(0, -4.2, t / 3.57);
          h.group.position.set(1.2, 0.42, z); h.group.rotation.y = Math.PI / 2; h.update(t, { passo: 1.1 });
          lan.position.set(1.5, 1.35 + Math.sin(t * 7) * 0.03, z - 0.15); halo.position.copy(lan.position); luz.position.copy(lan.position);
          const e = ease.inOutSine(range(t, 0, 3.57));
          cam.position.set(lerp(-0.6, 0.2, e), lerp(5.2, 4.4, e), z + lerp(9.5, 8.0, e));
          cam.lookAt(0.8, -1.7, z - 3);
          st.bloom = 0.7; st.sol(0, z, 12);
          st.draw();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
