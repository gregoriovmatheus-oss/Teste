<!-- f12: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f12.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.43 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f12-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f12" data-width="1080" data-height="1920">
    <canvas id="f12-canvas" width="1080" height="1920"></canvas>

  </div>
  <script>
    (function () {
      const D0 = 5.43;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f12-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f12" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });

      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f12"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f12"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/lowpoly.js"), import("./assets/lib/blocks/hiber.js")
      ]).then(async ([K_, T, A, LOWPOLY, HIBER]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f12-canvas");

        await HIBER.prepara();
        const LP = LOWPOLY, Q = HIBER.QUARTO;
        const st = LP.palco(canvas, { foco: 1.0, faixa: 0.35, desfoque: 24 });
        const { S, cam } = st;
        S.background = new THREE.Color(0x2a3442); st.exposicao = 1.25;
        st.hemi.intensity = 0.6; st.fria.color.set(0xfff0d8); st.fria.intensity = 2.2; st.fria.position.set(-1.6, 3.5, -2.5); st.quente.intensity = 1.2; st.quente.position.set(-2.5, 1.2, 1.5);
        const q = HIBER.quarto(S, { mk: LP.mat, estacao: "primavera" });
        q.cal.set(3);
        const p = LP.pessoa({ seed: 7, pele: 0xc08a6a, cabelo: 0x2a1a10, jaqueta: 0x3c4c62, camisa: 0x8a9ab0, barba: 0x3a2618, iris: 0x4a3020 });
        p.root.rotation.z = Math.PI / 2; p.root.position.set(Q.cabeca.x + 1.65, Q.cabeca.y, Q.cabeca.z); S.add(p.root);
        p.bracos.forEach((b) => { b.om.rotation.x = -1.1; b.cot.rotation.x = -1.2; });
        const alvo = new THREE.Vector3(), up = new THREE.Vector3(), v3 = new THREE.Vector3();
        const NOT = [["MENSAGENS NÃO LIDAS", 3.07], ["CONTAS DO TRIMESTRE", 3.38], ["RESULTADOS DO CAMPEONATO", 3.75], ["PREVISÃO: PRIMAVERA", 3.94], ["3 MESES DE NOTÍCIAS", 4.48]];
        function render(t) {
          // acordar devagar: pálpebras pesadas (músculos lentos), piscadas, sobrancelhas confusas, boca abre na "fome"
          const abre = ease.inOutSine(range(t, 0.1, 1.9)), pisc = Math.max(0, 1 - Math.abs(t - 2.6) / 0.14);
          const ab = lerp(lerp(-1.05, 0.42, abre), -1.0, pisc);
          const conf = range(t, 1.0, 1.6), fome = Math.sin(Math.PI * range(t, 2.2, 3.1));
          p.emocao({ br: lerp(0, -0.34, conf), by: lerp(0.31, 0.39, conf), bo: [lerp(0.9, 0.85, fome), lerp(0.3, 1.25, fome)], ab, ol: [Math.sin(t * 1.3) * 0.3 * conf, 0.1] });
          p.cab.rotation.set(0, 0.12 + Math.sin(t * 0.9) * 0.05, -0.04 + 0.08 * conf);
          // câmera inclinada (deitado), recua e endireita devagar
          const e = ease.inOutSine(range(t, 0, 5.43));
          up.set(lerp(-0.85, -0.5, e), lerp(0.55, 0.85, e), 0).normalize(); cam.up.copy(up);
          cam.position.set(lerp(-0.82, -0.55, e), lerp(0.86, 0.95, e), lerp(0.5, 0.85, e));
          alvo.set(lerp(-0.96, -0.85, e), lerp(0.66, 0.6, e), -0.6); cam.lookAt(alvo);
          st.U.foco.value = cam.position.distanceTo(Q.cabeca);
          st.draw();
          const c = st.ctx, vv = HIBER.vis(st);
          [["MÚSCULOS LENTOS", 1.25, HIBER.AZUL, 760], ["FOME ENORME", 2.2, HIBER.LARANJA, 850]].forEach(([s, t0, cor, y]) => {
            const a = vv * range(t, t0, t0 + 0.25) * (1 - range(t, 2.9, 3.05)); if (a <= 0) return;
            HIBER.painel(c, 290, y - 32, 500, 64, a, { borda: cor }); HIBER.txt(c, s, 540, y, { tam: 30, cor, a, esp: 0.15 });
          });
          // notícias acumuladas caindo em pilha
          NOT.forEach(([s, t0], i) => {
            const k = ease.outBack ? ease.outBack(range(t, t0, t0 + 0.35)) : ease.outCubic(range(t, t0, t0 + 0.35)), a = vv * range(t, t0, t0 + 0.15);
            if (a <= 0) return;
            const y = lerp(560, 940 - i * 64, k), rot = (i % 2 ? 1 : -1) * 0.025 * (i + 1), ult = i === NOT.length - 1;
            c.save(); c.translate(540, y); c.rotate(rot);
            HIBER.painel(c, -300, -28, 600, 56, a, { borda: ult ? HIBER.LARANJA : HIBER.AZUL });
            HIBER.txt(c, s, 0, 0, { tam: ult ? 30 : 24, cor: ult ? HIBER.LARANJA : "#e8f2ff", a, esp: 0.12 });
            c.restore();
          });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
