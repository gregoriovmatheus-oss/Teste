<!-- f06: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f06.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.84 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f06-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f06" data-width="1080" data-height="1920">
    <canvas id="f06-canvas" width="1080" height="1920"></canvas>
    <div id="f06-r1" class="rot" style="top: 700px"><span id="f06-r1-in" class="rot-t"><span class="k">MARMOTAS</span><br>Relógio das <span class="y">células</span></span></div>
    <div id="f06-r2" class="rot" style="top: 700px"><span id="f06-r2-in" class="rot-t"><span class="y">Quase para</span></span></div>
    <div id="f06-r3" class="rot" style="top: 700px"><span id="f06-r3-in" class="rot-t">Envelhecer<br><span class="y">mais lento</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.84;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f06-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f06" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f06-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.93 * K);
      tl.to("#f06-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 1.68 * K);
      tl.fromTo("#f06-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.03 * K);
      tl.to("#f06-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.3 * K);
      tl.fromTo("#f06-r3-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 3.7 * K);
      tl.to("#f06-r3-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 5.54 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f06"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f06"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/hiber.js")
      ]).then(async ([K_, T, A, HIBER]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f06-canvas");

        await HIBER.prepara();
        const st = T.createToyStage(canvas, { fov: 38, ceu: ["#04060c", "#0b1222"], nevoa: [6, 22], corNevoa: "#070b16", nuvens: 0, exposicao: 1.0 });
        const S = st.scene, cam = st.cam;
        st.key.color.set(0xffd8b0); st.key.intensity = 1.8; st.hemi.intensity = 0.35; st.rim.color.set(0x7cc8ff);
        // toca da marmota (terra) embaixo
        const chao = new THREE.Mesh(new THREE.CircleGeometry(4, 40), T.M(0x3a2a1c, 0.95)); chao.rotation.x = -Math.PI / 2; S.add(chao);
        const ninho = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.12, 8, 24), T.M(0x8a7040, 0.95)); ninho.rotation.x = -Math.PI / 2; ninho.position.y = 0.06; S.add(ninho);
        const m = HIBER.marmota(T.M); m.g.rotation.y = -0.9; S.add(m.g);
        // DNA em dupla hélice (instanciado) + relógio
        const NB = 34, esf = new THREE.InstancedMesh(new THREE.SphereGeometry(0.09, 12, 8), new THREE.MeshStandardMaterial({ color: 0x7cc8ff, emissive: 0x2a6aa0, emissiveIntensity: 0.8, roughness: 0.3 }), NB * 2);
        const deg = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.03, 0.03, 1, 6), new THREE.MeshStandardMaterial({ color: 0xff8a4c, emissive: 0x803010, emissiveIntensity: 0.6, roughness: 0.4 }), NB);
        const dna = new THREE.Group(); dna.position.set(0, 3.1, -0.5); dna.rotation.z = Math.PI / 2 - 0.25; dna.scale.setScalar(0.5); dna.add(esf, deg); S.add(dna);
        const o3 = new THREE.Object3D();
        const rel = new THREE.Group(); rel.position.set(0, 3.1, -1.6); rel.scale.setScalar(0.45); S.add(rel);
        rel.add(new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.08, 48), T.M(0x10161f, 0.4)).rotateX(Math.PI / 2));
        const aro = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.04, 8, 64), new THREE.MeshBasicMaterial({ color: 0x7cc8ff, toneMapped: false })); rel.add(aro);
        for (let i = 0; i < 12; i++) { const tk = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.18, 0.02), new THREE.MeshBasicMaterial({ color: 0xcfe6ff })); const a = i / 12 * 6.283; tk.position.set(Math.sin(a) * 1.32, Math.cos(a) * 1.32, 0.06); tk.rotation.z = -a; rel.add(tk); }
        const ponteiro = (l, w, c) => { const g = new THREE.Group(); const b = new THREE.Mesh(new THREE.BoxGeometry(w, l, 0.02), new THREE.MeshBasicMaterial({ color: c, toneMapped: false })); b.position.y = l / 2; g.add(b); g.position.z = 0.08; rel.add(g); return g; };
        const ph = ponteiro(0.8, 0.07, 0xffffff), pm = ponteiro(1.2, 0.04, 0xff8a4c);
        // ângulo do tempo: corre rápido e freia até quase parar em "quase para" (2,36 s)
        const vel = (t) => lerp(6, 0.15, ease.outCubic(range(t, 1.2, 2.6)));
        const ang = (t) => { let s = 0; const n = Math.ceil(t * 60); for (let i = 0; i < n; i++) s += vel(i / 60) / 60; return s; };
        function render(t) {
          m.respira(t, 1);
          const A = ang(t);
          pm.rotation.z = -A * 2.2; ph.rotation.z = -A * 2.2 / 12;
          for (let i = 0; i < NB; i++) {
            const y = (i - NB / 2) * 0.2, a = i * 0.55 + A * 0.8;
            for (let s = 0; s < 2; s++) { o3.position.set(Math.cos(a + s * Math.PI) * 0.5, y, Math.sin(a + s * Math.PI) * 0.5); o3.rotation.set(0, 0, 0); o3.scale.setScalar(1); o3.updateMatrix(); esf.setMatrixAt(i * 2 + s, o3.matrix); }
            o3.position.set(0, y, 0); o3.rotation.set(0, -a, Math.PI / 2); o3.scale.set(1, 1, 1); o3.updateMatrix(); deg.setMatrixAt(i, o3.matrix);
          }
          esf.instanceMatrix.needsUpdate = true; deg.instanceMatrix.needsUpdate = true;
          esf.material.emissiveIntensity = lerp(0.9, 0.35, range(t, 1.2, 2.6));
          // grua: da marmota dormindo sobe até o DNA e o relógio
          const e = ease.inOutCubic(range(t, 0.5, 2.3)), e0 = ease.inOutSine(range(t, 0, 5.84));
          cam.position.set(lerp(1.4, 0.4, e) + e0 * 0.4, lerp(0.9, 2.9, e), lerp(1.6, 5.4, e) - e0 * 0.3);
          cam.lookAt(0, lerp(0.05, 1.95, e), lerp(0, -1, e)); m.g.visible = ninho.visible = e < 0.75;
          st.bloom = 0.6; st.sol(0, 0, 6);
          st.draw();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
