<!-- f16: cena 3D de massinha. Lógica em cenas/f16.js (gerado por scripts/monta-cenas.py). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #8CC7D8; }
    #f16-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-size: 92px; line-height: 1.0; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 4px #1a1410; paint-order: stroke fill; text-shadow: 7px 7px 0 #1a1410; }
    .rot-t .y { color: #F2B53A; }
    .rot-t .p { font-size: 70px; }

  </style>
  <div id="root" data-composition-id="f16" data-width="1080" data-height="1920">
    <canvas id="f16-canvas" width="1080" height="1920"></canvas>
    <div id="f16-r1" class="clip rot" style="top: 690px" data-start="4.8" data-duration="2.92"><span id="f16-r1-in" class="rot-t"><span class="p">E VOCÊ,</span><br>QUAL ANIMAL <span class="y">SERIA?</span></span></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f16-r1-in", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 4.8);
      tl.set({}, {}, 7.72);
      window.__timelines = window.__timelines || {};
      window.__timelines["f16"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f16"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/globe.js")
      ]).then(async ([K, T, A, GLOBE]) => {
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = 7.72;
        const canvas = document.getElementById("f16-canvas");

        const st = T.createToyStage(canvas, { fov: 50, ceu: ["#6FB6CC", "#D7EBE6"], nevoa: [120, 600] });
        const S = st.scene, cam = st.cam;
        const c = T.cidade({ n: 7, seed: 161, verde: 0.3 }); S.add(c.group);
        const rr = mulberry32(162);
        const nuv = Array.from({ length: 40 }, (_, i) => { const n = T.nuvem(700 + i); n.scale.setScalar(4 + rr() * 5); n.position.set((rr() - 0.5) * 160, 120 + rr() * 90, (rr() - 0.5) * 160); S.add(n); return n; });
        const ele = A.createAnimal("elefante", { fase: 0.3 }); ele.group.scale.setScalar(1.6); A.face(ele.group, 0, 1); ele.group.position.set(-18, 0.5, 4); S.add(ele.group);
        const GS = new THREE.Scene();
        const G = GLOBE.createGlobe(GS, { detalhe: 64, destaque: null, marcador: false, onda: null, nuvensAlvo: 0,
          caminho: [{ t: 0, lon: -40, lat: -12, alt: 0.9 }, { t: 4.4, lon: -10, lat: 8, alt: 5.2 }] });
        st.extraWarm = [{ renderer: st.renderer, scene: GS, camera: G.camera }];
        function render(t) {
          if (t < 3.3) {
            const e = ease.inCubic(range(t, 0, 3.3));
            ele.update(t, { passo: 0.6 });
            ele.group.position.z = 4 + t * 0.9;
            cam.position.set(-18 + e * 10, lerp(14, 230, e), 16 + e * 20);
            cam.up.set(0, 0, -1);
            cam.lookAt(-18 + e * 10, 0, 4);
            st.sol(-10, 0, 80);
            st.draw(S, cam, { cor: "#ffffff", a: range(t, 2.4, 3.2) });
          } else {
            const u = t - 3.3;
            G.update(u);
            G.earth.rotation.y += u * 0.04;
            const blk = 0.8 * ease.inOutSine(range(t, 5.6, 7.72));
            st.draw(GS, G.camera, blk > 0 ? { cor: "#000000", a: blk } : { cor: "#ffffff", a: 1 - range(u, 0, 0.6) });
          }
        }

        await K.bindSeek(canvas, render, { warm: [st.warm, ...(st.extraWarm || [])], duration: D });
      });
    })();
  </script>
</template>
