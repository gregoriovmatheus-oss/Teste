<!-- f04: cena 3D anime cel-shaded (R09). Lógica em cenas/f04.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 6.0 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f04-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-size: 92px; line-height: 1.0; color: #fff; text-transform: uppercase;
      letter-spacing: 0.02em; text-shadow: 0 4px 18px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #FFC56B; }
    .rot-t .p { font-size: 70px; }

  </style>
  <div id="root" data-composition-id="f04" data-width="1080" data-height="1920">
    <canvas id="f04-canvas" width="1080" height="1920"></canvas>
    <div id="f04-r1" class="rot" style="top: 700px"><span id="f04-r1-in" class="rot-t"><span class="y">TONELADAS</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 6.0;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f04-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f04" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f04-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.7 * K);
      tl.to("#f04-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 5.5 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f04"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f04"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js")
      ]).then(async ([K_, T, A]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f04-canvas");

        const st = T.createToyStage(canvas, { fov: 50, nevoa: [50, 220] });
        const S = st.scene, cam = st.cam;
        /* beco estreito em x = -200 */
        const beco = T.rua({ len: 90, larg: 5, calc: 1.2, seed: 41, arvores: false, hMin: 10, hMax: 22 });
        beco.group.position.x = -200; S.add(beco.group);
        const fio = T.mesh(new THREE.CylinderGeometry(0.06, 0.06, 9, 8), 0x2a2a2a, S); fio.rotation.z = Math.PI / 2; fio.position.set(-200, 5.2, -2);
        const placa = T.mesh(T.roundBox(3.2, 0.9, 0.2, 0.1), T.PAL.tijolo, S); placa.position.set(-198.4, 6.4, 4);
        const gir = A.createAnimal("girafa", { fase: 0.1 }); A.face(gir.group, 0, 1); S.add(gir.group);
        /* avenida engarrafada */
        const city = T.rua({ len: 200, larg: 18, seed: 42 }); S.add(city.group);
        const r = mulberry32(43), cores = [T.PAL.tijolo, T.PAL.amarelo, 0x9fc9d9, 0xf6f1e8, 0x6fafa6, 0xe9a3a0];
        const cars = [];
        for (let i = 0; i < 16; i++) { const c = T.carro(cores[i % cores.length]); const lane = [-6, -2.2, 2.2, 6][i % 4]; c.position.set(lane, 0, -60 + Math.floor(i / 4) * 8 + r() * 2); if (lane > 0) c.rotation.y = Math.PI; S.add(c); cars.push(c); }
        const rino = A.createAnimal("rinoceronte", { fase: 0.3 }); rino.group.scale.setScalar(1.3); A.face(rino.group, 0, 1); S.add(rino.group);
        const ele = A.createAnimal("elefante", { fase: 0.6 }); ele.group.scale.setScalar(2.1); A.face(ele.group, 0, 1); S.add(ele.group);
        function render(t) {
          const b = t < 2.5;
          if (b) {
            const gz = -14 + t * 2.4;
            gir.group.position.set(-200, 0, gz);
            const dz = gz + 1.2 - (-2);
            const duck = Math.max(0, 1 - Math.abs(dz) / 2.6);
            gir.update(t, { passo: 1.1, pescoco: ease.inOutSine(duck) * 0.9 });
            cam.position.set(-201.2, lerp(1.6, 2.6, t / 2.5), gz + 9 - t * 0.6);
            cam.lookAt(-200, 4.2, gz);
            st.sol(-200, gz, 20);
          } else {
            const u = t - 2.5;
            rino.group.position.set(-0.1 + Math.sin(u * 1.5) * 0.4, 0, -38 + u * 2.6);
            rino.update(t, { passo: 1.4 });
            ele.group.position.set(-3, 0, -52 + u * 1.6);
            ele.update(t, { passo: 0.7, tromba: 0.3 + Math.sin(u) * 0.3 });
            cars.forEach((c, i) => { c.position.y = 0; c.rotation.z = 0; });
            const e = ease.inOutSine(clamp(u / 3.5));
            cam.position.set(lerp(4, 12, e), lerp(3, 16, e), lerp(-22, -6, e));
            cam.lookAt(-1, lerp(2.5, 3, e), lerp(-36, -44, e));
            st.sol(0, -42, 35);
          }
          st.draw();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
