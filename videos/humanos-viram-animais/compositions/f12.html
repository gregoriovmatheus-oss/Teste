<!-- f12: cena 3D de massinha. Lógica em cenas/f12.js (gerado por scripts/monta-cenas.py). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #8CC7D8; }
    #f12-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-size: 92px; line-height: 1.0; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 4px #1a1410; paint-order: stroke fill; text-shadow: 7px 7px 0 #1a1410; }
    .rot-t .y { color: #F2B53A; }
    .rot-t .p { font-size: 70px; }

  </style>
  <div id="root" data-composition-id="f12" data-width="1080" data-height="1920">
    <canvas id="f12-canvas" width="1080" height="1920"></canvas>
    <div id="f12-r1" class="clip rot" style="top: 700px" data-start="0.4" data-duration="2.6"><span id="f12-r1-in" class="rot-t">FINALMENTE <span class="y">VOANDO</span></span></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f12-r1-in", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 0.4);
      tl.to("#f12-r1-in", { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" }, 2.7);
      tl.set({}, {}, 6.44);
      window.__timelines = window.__timelines || {};
      window.__timelines["f12"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f12"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js")
      ]).then(async ([K, T, A]) => {
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = 6.44;
        const canvas = document.getElementById("f12-canvas");

        const st = T.createToyStage(canvas, { fov: 55, nevoa: [60, 260] });
        const S = st.scene, cam = st.cam;
        const city = T.rua({ len: 320, larg: 14, seed: 121, hMin: 22, hMax: 46 }); S.add(city.group);
        const ag = A.createAnimal("aguia", { fase: 0.1 }); ag.group.scale.setScalar(2.2); A.face(ag.group, 0, -1); S.add(ag.group);
        const fl = T.bando(S, { n: 160, seed: 12 });
        function render(t) {
          const v = 18;
          const z = 120 - t * v - Math.max(0, t - 3) * 4;
          const x = Math.sin(t * 1.4) * 2.5, y = 12 + Math.sin(t * 0.9) * 2 + range(t, 3, 6) * 18;
          ag.group.position.set(x, y, z);
          ag.group.rotation.x = -Math.cos(t * 1.4) * 0.35;
          ag.update(t, { voa: t < 3 ? 2.2 : 3 });
          const w = ease.inOutCubic(range(t, 2.8, 5.6));
          fl.update(t, [0, 46 + t * 0.5, z - 40], [26, 9, 30], Math.PI / 2, 1.6);
          cam.position.set(x * 0.6 + lerp(1.5, 0, w), lerp(y + 1.2, y - 4, w), z + lerp(7, 34, w));
          cam.lookAt(x, lerp(y + 0.3, y + 22, w), z - lerp(10, 40, w));
          st.sol(0, z - 10, 50);
          st.draw();
        }

        await K.bindSeek(canvas, render, { warm: [st.warm, ...(st.extraWarm || [])], duration: D });
      });
    })();
  </script>
</template>
