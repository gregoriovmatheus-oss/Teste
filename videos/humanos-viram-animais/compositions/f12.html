<!-- f12: cena 3D anime cel-shaded (R09). Lógica em cenas/f12.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 6.44 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #3A7BD5; }
    #f12-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-size: 92px; line-height: 1.0; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 4px #1A1A2E; paint-order: stroke fill; text-shadow: 6px 6px 0 #1A1A2E; opacity: 0; }
    .rot-t .y { color: #FF5A5F; }
    .rot-t .p { font-size: 70px; }

  </style>
  <div id="root" data-composition-id="f12" data-width="1080" data-height="1920">
    <canvas id="f12-canvas" width="1080" height="1920"></canvas>
    <div id="f12-r1" class="rot" style="top: 700px"><span id="f12-r1-in" class="rot-t">FINALMENTE <span class="y">VOANDO</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 6.44;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f12-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f12" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f12-r1-in", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 0.4 * K);
      tl.to("#f12-r1-in", { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" }, 2.7 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f12"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f12"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js")
      ]).then(async ([K_, T, A]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f12-canvas");

        const st = T.createToyStage(canvas, { fov: 55, nevoa: [60, 260] });
        const S = st.scene, cam = st.cam;
        const city = T.rua({ len: 320, larg: 14, seed: 121, hMin: 22, hMax: 46 }); S.add(city.group);
        const ag = A.createAnimal("aguia", { fase: 0.1 }); ag.group.scale.setScalar(3.4); A.face(ag.group, 0, -1); S.add(ag.group);
        const fl = T.bando(S, { n: 160, seed: 12 });
        function render(t) {
          const v = 18;
          const z = 120 - t * v - Math.max(0, t - 3) * 4;
          const x = Math.sin(t * 1.4) * 2.5, y = 12 + Math.sin(t * 0.9) * 2 + range(t, 3, 6) * 18;
          ag.group.position.set(x, y, z);
          ag.group.rotation.x = -Math.cos(t * 1.4) * 0.35;
          ag.update(t, { voa: t < 3 ? 2.2 : 3 });
          const w = ease.inOutCubic(range(t, 2.8, 5.6));
          fl.update(t, [0, 46 + t * 0.5, z - 40], [26, 9, 30], Math.PI / 2, 1.6);
          cam.position.set(x * 0.6 + lerp(1.5, 0, w), lerp(y + 1.6, y - 4, w), z + lerp(10, 40, w));
          st.vel = 0.7 * (1 - w); st.velT = t;
          cam.lookAt(x, lerp(y + 0.3, y + 22, w), z - lerp(10, 40, w));
          st.sol(0, z - 10, 50);
          st.draw();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => render(t * D / DR), { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
