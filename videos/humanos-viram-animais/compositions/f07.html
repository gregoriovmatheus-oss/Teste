     Tempos escritos para 6.42 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #3A7BD5; }
    #f07-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-size: 92px; line-height: 1.0; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 4px #1A1A2E; paint-order: stroke fill; text-shadow: 6px 6px 0 #1A1A2E; opacity: 0; }
    .rot-t .y { color: #FF5A5F; }

  </style>
  <div id="root" data-composition-id="f07" data-width="1080" data-height="1920">
    <canvas id="f07-canvas" width="1080" height="1920"></canvas>
    <div id="f07-r1" class="rot" style="top: 700px"><span id="f07-r1-in" class="rot-t">HOSPITAIS <span class="y">VAZIOS</span></span></div>
    <div id="f07-r2" class="rot" style="top: 700px"><span id="f07-r2-in" class="rot-t"><span class="y">COLAPSO</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 6.42;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f07-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f07" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f07-r1-in", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 1.2 * K);
      tl.to("#f07-r1-in", { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" }, 3.3 * K);
      tl.fromTo("#f07-r2-in", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 4.6 * K);
      tl.to("#f07-r2-in", { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" }, 6.12 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f07"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f07"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js")
      ]).then(async ([K_, T, A]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f07-canvas");

        const st = T.createToyStage(canvas, { fov: 45, ceu: 0x5a8fd8, nevoa: [120, 420] });
        const S = st.scene, cam = st.cam;
        const c = T.cidade({ n: 6, seed: 71, hMax: 18 }); S.add(c.group);
        // hospital no centro
        const hosp = T.predio({ w: 16, d: 12, h: 14, cor: 0xf6f1e8, seed: 2 }); hosp.scale.setScalar(1.6); hosp.position.set(-18, 0.5, -18); S.add(hosp);
        const cr = T.M(0xff5a5f, 0.5, { emissive: 0xff5a5f, emissiveIntensity: 0.6 });
        const c1 = T.mesh(T.roundBox(6, 0.6, 1.8, 0.2), cr, hosp); c1.position.y = 14.5; const c2 = T.mesh(T.roundBox(1.8, 0.6, 6, 0.2), cr, hosp); c2.position.y = 14.5;
        const f1 = T.mesh(T.roundBox(3, 1, 0.4, 0.1), cr, hosp); f1.position.set(0, 11, 6.1); const f2 = T.mesh(T.roundBox(1, 3, 0.4, 0.1), cr, hosp); f2.position.set(0, 11, 6.1);
        // usina: torres de resfriamento
        const fum = [];
        for (const [x, z] of [[30, 14], [40, 22]]) {
          const tw = T.mesh(new THREE.CylinderGeometry(6, 9, 26, 28), 0xfff4d6, S, 0.8); tw.position.set(x, 13, z); const fx = T.mesh(new THREE.CylinderGeometry(6.6, 7.2, 2.4, 28), 0xff5a5f, S); fx.position.set(x, 21, z);
          for (let i = 0; i < 6; i++) { const p = T.nuvem(x + i, 0xf2f2f2); p.scale.setScalar(1.2); p.userData.o = [x, z, i]; S.add(p); fum.push(p); }
        }
        const usinaBase = T.mesh(T.roundBox(30, 1, 24, 0.3), 0xbfb6a6, S); usinaBase.position.set(35, 0, 18);
        const all = [...c.buildings, hosp];
        const rr = mulberry32(72);
        const off = all.map(() => 1.6 + rr() * 4.4);
        const skyA = new THREE.Color(0x5a8fd8), skyB = new THREE.Color(0x2b2850), tmp = new THREE.Color();
        function render(t) {
          const k = range(t, 0.8, 6.2);
          tmp.copy(skyA).lerp(skyB, ease.inOutSine(k));
          S.background = tmp.clone(); S.fog.color.copy(tmp);
          st.key.intensity = lerp(2.5, 0.5, k); st.key.color.setHex(k > 0.5 ? 0xff9f6a : 0xffd6a0);
          st.hemi.intensity = lerp(1.15, 0.55, k);
          all.forEach((b, i) => { b.userData.win.emissiveIntensity = lerp(0.3, 1.6, range(t, 0, 1.5)) * (1 - range(t, off[i], off[i] + 0.25)); });
          fum.forEach((p) => { const [x, z, i] = p.userData.o; const u = ((t * 0.25 + i / 6) % 1); const on = 1 - range(t, 3.2, 4.2); p.position.set(x + u * 8, 27 + u * 16, z); p.scale.setScalar((0.8 + u * 2) * on + 0.001); });
          const e = ease.inOutSine(clamp(t / D));
          cam.position.set(lerp(-70, -20, e), lerp(70, 48, e), lerp(70, 40, e));
          cam.lookAt(lerp(-14, 12, e), 0, lerp(-12, 6, e));
          st.sol(0, 0, 90);
          st.draw();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => render(t * D / DR), { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
