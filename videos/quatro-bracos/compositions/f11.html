<!-- f11: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f11.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.67 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f11-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f11" data-width="1080" data-height="1920">
    <canvas id="f11-canvas" width="1080" height="1920"></canvas>
    <div id="f11-r1" class="rot" style="top: 700px"><span id="f11-r1-in" class="rot-t"><span class="k">ATENÇÃO</span><br><span class="y">um foco</span> só</span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.67;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f11-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f11" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f11-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 3.1 * K);
      tl.to("#f11-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 5.37 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f11"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f11"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/quatro.js")
      ]).then(async ([K_, T, A, QUATRO]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f11-canvas");

        const Q4 = QUATRO;
        await Q4.prepara();
        const st = Q4.palcoDoc(T, canvas, { fov: 34, ceu: "#030409" });
        const S = st.scene, cam = st.cam; st.key.intensity = 0.25; st.hemi.intensity = 0.08; st.rim.intensity = 0.5;
        // 4 tarefas em pedestais num semicírculo: panela, notebook, celular, baqueta
        const N = ["COZINHAR", "DIGITAR", "CELULAR", "TOCAR"], P = N.map((n, i) => { const a = -0.75 + i * 0.5, x = Math.sin(a) * 1.5, z = -Math.cos(a) * 1.5 + 0.4;
          const g = new THREE.Group(); g.position.set(x, 0, z); S.add(g);
          const ped = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.3, 0.7, 20), T.M(0x2a2f3a, 0.5)); ped.position.y = 0.35; ped.castShadow = ped.receiveShadow = true; g.add(ped);
          const o = new THREE.Group(); o.position.y = 0.78; g.add(o); const M = (c, r = 0.4, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
          if (i === 0) { const p = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.14, 0.1, 16), M(0x2a2a2e, 0.3, 0.6)); o.add(p); const c = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.02, 0.03), M(0x2a2a2e)); c.position.set(0.26, 0.03, 0); o.add(c); }
          if (i === 1) { const b = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.02, 0.24), M(0x9aa0a8, 0.3, 0.5)); o.add(b); const tl = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.22, 0.015), new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x6a9cff, emissiveIntensity: 0.6 })); tl.position.set(0, 0.1, -0.12); tl.rotation.x = -0.25; o.add(tl); }
          if (i === 2) { const c = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 0.015), new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x9fd0ff, emissiveIntensity: 0.5 })); c.position.y = 0.1; c.rotation.x = -0.3; o.add(c); }
          if (i === 3) { [-1, 1].forEach((s) => { const b = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.012, 0.36, 6), M(0xe0c89a, 0.6)); b.rotation.set(Math.PI / 2, 0, s * 0.3); b.position.set(s * 0.04, 0.02, 0); o.add(b); }); }
          const luz = new THREE.SpotLight(0xffe8c8, 0, 6, 0.32, 0.5, 1); luz.position.set(x * 0.9, 3.4, z + 0.3); luz.target = o; S.add(luz);
          const cone = new THREE.Mesh(new THREE.ConeGeometry(0.5, 2.6, 24, 1, true), new THREE.MeshBasicMaterial({ color: 0xfff0d8, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
          cone.position.set(x * 0.95, 2.05, z + 0.15); S.add(cone);
          return { g, o, luz, cone, n };
        });
        const al = new THREE.Vector3();
        function render(t) {
          // 0,6–2,4 s: as 4 piscam juntas (cansa); 3,0 s+: só uma fica acesa e o foco pula de uma para outra
          const todas = range(t, 0.55, 0.9) * (1 - range(t, 2.5, 3.0)), canso = 0.75 + 0.25 * Math.sin(t * 23) * range(t, 1.6, 2.4);
          const foco = t < 3.0 ? -1 : Math.floor((t - 3.0) / 0.75) % 4;
          P.forEach((p, i) => { const a = Math.max(todas * canso * (t > 2.2 ? 0.55 : 1), i === foco ? range((t - 3.0) % 0.75, 0, 0.12) : 0);
            p.luz.intensity = 26 * a; p.cone.material.opacity = 0.07 * a; p.o.rotation.y = t * 0.4 + i; p.o.position.y = 0.78 + 0.03 * Math.sin(t * 2 + i); });
          const e = ease.inOutSine(range(t, 0, 5.67));
          cam.position.set(lerp(-0.9, 0.9, e), lerp(3.4, 3.0, e), lerp(6.4, 5.6, e)); al.set(0, -0.55, -0.4); cam.lookAt(al);
          st.bloom = 0.8; st.draw();
          const c = st.ctx;
          P.forEach((p, i) => Q4.tag(c, p.n, p.o.getWorldPosition(al), cam, (t < 2.6 ? range(t, 0.7 + i * 0.1, 0.95 + i * 0.1) * (1 - range(t, 2.4, 2.6)) : (i === foco ? 1 : 0)), { dy: i % 2 ? -150 : -90, cor: i === foco ? Q4.LARANJA : Q4.AZUL, tam: 22 }));
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
