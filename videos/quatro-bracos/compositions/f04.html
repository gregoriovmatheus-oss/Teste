<!-- f04: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f04.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 4.88 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f04-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f04" data-width="1080" data-height="1920">
    <canvas id="f04-canvas" width="1080" height="1920"></canvas>
    <div id="f04-r1" class="rot" style="top: 700px"><span id="f04-r1-in" class="rot-t">o coração bombearia<br><span class="y">mais sangue</span></span></div>
    <div id="f04-r2" class="rot" style="top: 700px"><span id="f04-r2-in" class="rot-t">e você comeria <span class="o">mais</span><br>todos os dias</span></div>
  </div>
  <script>
    (function () {
      const D0 = 4.88;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f04-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f04" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f04-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.45 * K);
      tl.to("#f04-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.65 * K);
      tl.fromTo("#f04-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 3.05 * K);
      tl.to("#f04-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 4.58 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f04"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f04"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/quatro.js")
      ]).then(async ([K_, T, A, QUATRO]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f04-canvas");

        const Q4 = QUATRO;
        await Q4.prepara();
        const st = Q4.palcoDoc(T, canvas, { fov: 34, ceu: "#0a0508", chao: 0x120c10 });
        const S = st.scene, cam = st.cam; st.rim.color.set(0xff6a4c);
        // coração estilizado (2 lóbulos + ponta), batendo
        const mc = new THREE.MeshStandardMaterial({ color: 0xb8222c, emissive: 0x5a0610, roughness: 0.35, metalness: 0.05, flatShading: true });
        const H = new THREE.Group(); H.position.set(0, 1.6, 0); S.add(H);
        [-1, 1].forEach((s) => { const l = new THREE.Mesh(new THREE.IcosahedronGeometry(0.3, 2), mc); l.position.set(s * 0.2, 0.12, 0); H.add(l); });
        const pt = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.62, 12), mc); pt.rotation.z = Math.PI; pt.position.y = -0.3; pt.scale.z = 0.65; H.add(pt);
        const ao = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.07, 6, 12, Math.PI), mc); ao.position.set(0.05, 0.42, 0); H.add(ao);
        const halo = Q4.brilho(0xff3a3a, 2.4, "suave", 0.4); H.add(halo);
        // sangue: partículas saindo do coração por 4 caminhos (2 azuis = braços de hoje, 2 laranja = braços novos)
        const N = 360, pos = new Float32Array(N * 3), cor = new Float32Array(N * 3), g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.BufferAttribute(pos, 3)); g.setAttribute("color", new THREE.BufferAttribute(cor, 3));
        const pts = new THREE.Points(g, new THREE.PointsMaterial({ map: Q4.glowTex(), size: 0.09, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false })); pts.frustumCulled = false; S.add(pts);
        const DIR = [[1.6, 0.5], [-1.6, 0.5], [1.5, -0.35], [-1.5, -0.35]], r = mulberry32(5), PD = [];
        for (let i = 0; i < N; i++) PD.push([i % 4, r(), 0.25 + r() * 0.2, (r() - 0.5) * 0.12]);
        // pratos que aparecem em "comer mais"
        const pratos = [-0.9, 0, 0.9].map((x, i) => { const pg = new THREE.Group(); pg.position.set(x, 0.0, 0.9); S.add(pg);
          const p = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.26, 0.05, 20), T.M(0xf2efe8, 0.35)); p.position.y = 0.03; pg.add(p);
          const rf = mulberry32(20 + i); for (let k = 0; k < 7; k++) { const f = new THREE.Mesh(new THREE.IcosahedronGeometry(0.07 + rf() * 0.05, 0), T.M([0xd9a23a, 0x5f8a3c, 0xb8442c, 0xe8d8b0][k % 4], 0.6));
            f.position.set((rf() - 0.5) * 0.35, 0.1, (rf() - 0.5) * 0.3); pg.add(f); }
          return pg; });
        const al = new THREE.Vector3();
        function render(t) {
          const fr = lerp(1.2, 1.9, range(t, 0.3, 2.0)), ph = (t * fr) % 1;
          const bat = Math.exp(-ph * 9) + 0.5 * Math.exp(-Math.max(0, ph - 0.18) * 11) * (ph > 0.18 ? 1 : 0);
          H.scale.setScalar(1 + 0.09 * bat); H.rotation.y = 0.25 * Math.sin(t * 0.6); halo.material.opacity = 0.3 + 0.5 * bat;
          const novos = range(t, 1.5, 2.1);
          PD.forEach((d, i) => { const [dx, dy] = DIR[d[0]], f = (d[1] + t * d[2] * 1.6) % 1, on = d[0] < 2 ? range(t, 0.2, 0.6) : novos;
            pos[i * 3] = dx * f + d[3]; pos[i * 3 + 1] = 1.6 + dy * f + Math.sin(f * 9 + d[1] * 6) * 0.04; pos[i * 3 + 2] = d[3] * 2;
            const c = d[0] < 2 ? [1.0, 0.18, 0.2] : [1.0, 0.45, 0.2], a = on * (1 - f) * (d[1] * 7 % 1 < on ? 1 : 0);
            cor[i * 3] = c[0] * a; cor[i * 3 + 1] = c[1] * a; cor[i * 3 + 2] = c[2] * a; });
          g.attributes.position.needsUpdate = true; g.attributes.color.needsUpdate = true;
          pratos.forEach((p, i) => p.scale.setScalar(Math.max(0.001, ease.outBack(range(t, 3.1 + i * 0.22, 3.6 + i * 0.22)))));
          // câmera: push-in no coração → tilt para baixo até os pratos
          const a = ease.inOutCubic(range(t, 2.7, 4.2)), e = range(t, 0, 4.88);
          cam.position.set(lerp(0.6, -0.4, e), lerp(1.9, 3.4, a), lerp(7.6, 6.6, e) + a * 0.4); al.set(0, lerp(0.62, -1.5, a), lerp(0, 0.6, a)); cam.lookAt(al);
          st.bloom = 0.75; st.draw();
          Q4.tag(st.ctx, "BRAÇOS NOVOS", new THREE.Vector3(1.2, 1.6 - 0.28, 0), cam, range(t, 2.0, 2.3) * (1 - range(t, 2.7, 2.9)), { cor: Q4.LARANJA, dy: -150, dx: -60 });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
