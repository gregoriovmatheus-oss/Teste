<!-- f02: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f02.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 7.24 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f02-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f02" data-width="1080" data-height="1920">
    <canvas id="f02-canvas" width="1080" height="1920"></canvas>
    <div id="f02-r1" class="rot" style="top: 700px"><span id="f02-r1-in" class="rot-t"><span class="k">CADA BRAÇO</span><br>≈ <span class="y">5%</span> do corpo</span></div>
    <div id="f02-r2" class="rot" style="top: 700px"><span id="f02-r2-in" class="rot-t"><span class="o">+10%</span> o dia inteiro</span></div>
  </div>
  <script>
    (function () {
      const D0 = 7.24;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f02-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f02" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f02-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.9 * K);
      tl.to("#f02-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.0 * K);
      tl.fromTo("#f02-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 5.25 * K);
      tl.to("#f02-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 6.94 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f02"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f02"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/quatro.js")
      ]).then(async ([K_, T, A, QUATRO]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f02-canvas");

        const Q4 = QUATRO;
        await Q4.prepara();
        const st = Q4.palcoDoc(T, canvas, { fov: 34 });
        const S = st.scene, cam = st.cam;
        // 4 barras de vidro (5% cada): 2 azuis (os braços de hoje) e 2 laranja (o par novo)
        const X = [-0.9, -0.3, 0.3, 0.9], H = 1.0, barras = X.map((x, i) => {
          const nova = i === 0 || i === 3, cor = nova ? 0xff8a4c : 0x7cc8ff;
          const m = new THREE.Mesh(new THREE.BoxGeometry(0.42, 1, 0.42), new THREE.MeshStandardMaterial({ color: cor, emissive: cor, emissiveIntensity: 0.35, roughness: 0.2, metalness: 0.1, transparent: true, opacity: 0.88 }));
          m.position.set(x, 0, 0); m.castShadow = true; S.add(m);
          const base = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.04, 0.5), T.M(0x1c2230, 0.4)); base.position.set(x, 0.02, 0); S.add(base);
          const halo = Q4.brilho(cor, 2.2, "suave", 0); halo.position.set(x, 0.2, 0.4); S.add(halo);
          return { m, nova, halo };
        });
        // linha "100% do corpo" ao fundo, para escala
        const ref = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.015, 0.015), new THREE.MeshBasicMaterial({ color: 0x7cc8ff, transparent: true, opacity: 0.35 })); ref.position.set(0, H + 0.02, -0.4); S.add(ref);
        const al = new THREE.Vector3();
        function render(t) {
          barras.forEach((b, i) => {
            const k = b.nova ? ease.outBack(range(t, 3.55 + (i === 3 ? 0.18 : 0), 4.3 + (i === 3 ? 0.18 : 0))) : ease.outCubic(range(t, 0.35 + i * 0.12, 1.4 + i * 0.12));
            const h = Math.max(0.001, H * k); b.m.scale.y = h; b.m.position.y = h / 2 + 0.04;
            const pulso = b.nova ? range(t, 5.3, 5.55) * (1 - range(t, 6.2, 7.0)) : 0;
            b.m.material.emissiveIntensity = 0.35 + 1.1 * pulso; b.halo.material.opacity = 0.9 * pulso; b.halo.position.y = h * 0.6;
          });
          // câmera: grua baixa → sobe e gira devagar
          const e = ease.inOutSine(range(t, 0, 7.24));
          cam.position.set(lerp(-1.4, 1.5, e), lerp(1.6, 2.4, e), lerp(8.6, 8.1, e)); al.set(lerp(-0.1, 0.1, e), -0.6, 0); cam.lookAt(al);
          st.bloom = 0.6; st.draw();
          const c = st.ctx;
          barras.forEach((b, i) => { const a = b.nova ? range(t, 4.1, 4.4) : range(t, 1.95, 2.2);
            Q4.tag(c, "5%", new THREE.Vector3(X[i], b.m.scale.y + 0.1, 0), cam, a, { cor: b.nova ? Q4.LARANJA : Q4.AZUL, dy: -60 }); });
          Q4.txt(c, "HOJE · 2 BRAÇOS", 540, 1290, { tam: 24, cor: Q4.AZUL, a: range(t, 1.0, 1.3) * (1 - range(t, 3.4, 3.6)), esp: 0.3 });
          Q4.txt(c, "COM MAIS DOIS · 4 BRAÇOS", 540, 1290, { tam: 24, cor: Q4.LARANJA, a: range(t, 3.7, 4.0), esp: 0.3 });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
