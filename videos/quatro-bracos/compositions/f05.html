<!-- f05: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f05.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 6.36 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f05-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f05" data-width="1080" data-height="1920">
    <canvas id="f05-canvas" width="1080" height="1920"></canvas>
    <div id="f05-r1" class="rot" style="top: 700px"><span id="f05-r1-in" class="rot-t"><span class="k">CÓRTEX MOTOR</span><br>um <span class="y">mapa</span> do corpo</span></div>
  </div>
  <script>
    (function () {
      const D0 = 6.36;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f05-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f05" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f05-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.1 * K);
      tl.to("#f05-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.9 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f05"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f05"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/quatro.js")
      ]).then(async ([K_, T, A, QUATRO]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f05-canvas");

        const Q4 = QUATRO;
        await Q4.prepara();
        const st = Q4.palcoDoc(T, canvas, { fov: 32, ceu: "#04060c" });
        const S = st.scene, cam = st.cam;
        // cérebro estilizado (2 hemisférios facetados, translúcidos)
        const mb = new THREE.MeshStandardMaterial({ color: 0xd9a0a8, emissive: 0x3a1a2a, roughness: 0.5, transparent: true, opacity: 0.82, flatShading: true });
        const B = new THREE.Group(); B.position.set(0, 1.3, 0); S.add(B);
        [-1, 1].forEach((s) => { const h = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5, 3), mb); h.scale.set(0.5, 0.72, 1.0); h.position.x = s * 0.255; B.add(h); });
        // faixa do córtex motor (arco de orelha a orelha) dividida em pedaços do corpo
        const PEC = [["PÉ", 0.5], ["PERNA", 0.7], ["TRONCO", 0.7], ["BRAÇO", 0.8], ["MÃO", 1.6], ["ROSTO", 1.4], ["BOCA", 1.2]];
        const segs = [], mkSeg = (cor) => { const m = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.05, 0.11), new THREE.MeshStandardMaterial({ color: cor, emissive: cor, emissiveIntensity: 0.5, roughness: 0.4 })); B.add(m); return m; };
        [1, -1].forEach((s) => PEC.forEach(([n, w], i) => segs.push({ m: mkSeg(0x7cc8ff), n, w, s, novo: false, i })));
        [1, -1].forEach((s) => { segs.push({ m: mkSeg(0xff8a4c), n: "BRAÇO 3", w: 0.8, s, novo: true, i: 3.5 }); });
        // homúnculo: mãos e boca grandes (proporcional ao córtex); o 2º par de braços nasce em "cada braço novo"
        const Hm = new THREE.Group(); Hm.position.set(0, 1.9, 0); S.add(Hm);
        const pele = T.M(0xd9a084, 0.6), lar = new THREE.MeshStandardMaterial({ color: 0xff8a4c, emissive: 0xff6a2c, emissiveIntensity: 0.4, roughness: 0.5 });
        const tr = new THREE.Mesh(new THREE.CapsuleGeometry(0.1, 0.18, 3, 8), pele); Hm.add(tr);
        const cb = new THREE.Mesh(new THREE.IcosahedronGeometry(0.13, 1), pele); cb.position.y = 0.26; Hm.add(cb);
        const boca = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.025, 5, 10), T.M(0xb04050, 0.5)); boca.position.set(0, 0.22, 0.12); Hm.add(boca);
        const braco = (y, s, m, ang) => { const g = new THREE.Group(); g.position.set(s * 0.1, y, 0); g.rotation.z = s * ang; Hm.add(g);
          const b = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.02, 0.22, 5), m); b.position.y = -0.11; g.add(b);
          const mao = new THREE.Mesh(new THREE.IcosahedronGeometry(0.075, 1), m); mao.scale.set(1, 1.2, 0.55); mao.position.y = -0.26; g.add(mao); return g; };
        [1, -1].forEach((s) => braco(0.1, s, pele, 2.1)); const NOVO = [1, -1].map((s) => braco(-0.02, s, lar, 1.0));
        [1, -1].forEach((s) => { const pn = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.02, 0.22, 5), pele); pn.position.set(s * 0.05, -0.25, 0); Hm.add(pn); });
        const al = new THREE.Vector3(), tmp = new THREE.Vector3();
        function render(t) {
          // arco: os pedaços se abrem para caber o braço novo (3,6 s → 4,4 s)
          const k = ease.inOutCubic(range(t, 3.6, 4.4)), luz = range(t, 2.1, 2.6);
          segs.forEach((g) => { const lista = segs.filter((x) => x.s === g.s && (!x.novo || k > 0)).sort((a, b) => a.i - b.i);
            const tot = lista.reduce((a, x) => a + x.w * (x.novo ? k : 1), 0); let acc = 0;
            for (const x of lista) { const w = x.w * (x.novo ? k : 1); if (x === g) { acc += w / 2; break; } acc += w; }
            const ang = 0.12 + (acc / tot) * 1.35, R = 0.53;
            g.m.position.set(g.s * Math.sin(ang) * R * 0.62, Math.cos(ang) * R * 0.8 + 0.02, 0.08);
            g.m.rotation.z = -g.s * ang; g.m.scale.set(Math.max(0.001, g.w * (g.novo ? k : 1)) * 1.1, 1, 1);
            g.m.material.emissiveIntensity = g.novo ? 0.6 + 0.6 * Math.sin(t * 6) * k : 0.2 + 0.7 * luz; });
          NOVO.forEach((n) => n.scale.setScalar(Math.max(0.001, ease.outBack(range(t, 3.9, 4.6)))));
          Hm.visible = t > 0.9; Hm.scale.setScalar(ease.outCubic(range(t, 0.9, 1.5)) * 0.65 + 0.001); Hm.rotation.y = 0.4 * Math.sin(t * 0.7);
          B.rotation.y = lerp(-0.5, 0.35, ease.inOutSine(range(t, 0, 6.36)));
          const e = ease.inOutSine(range(t, 0, 6.36));
          cam.position.set(lerp(0.8, -0.4, e), lerp(2.0, 2.2, e), lerp(6.2, 5.4, e)); al.set(0, 0.6, 0); cam.lookAt(al);
          st.bloom = 0.65; st.draw();
          const c = st.ctx;
          const s0 = segs.find((x) => x.n === "MÃO" && x.s === -1), s1 = segs.find((x) => x.novo && x.s === -1);
          Q4.tag(c, "MÃO", s0.m.getWorldPosition(tmp), cam, range(t, 2.6, 2.9) * (1 - range(t, 3.5, 3.7)), { dx: 140, dy: -40 });
          Q4.txt(c, "CADA BRAÇO NOVO · O SEU PEDAÇO", 540, 1290, { tam: 24, cor: Q4.LARANJA, a: range(t, 4.2, 4.5), esp: 0.28 });
          Q4.tag(c, "BRAÇO NOVO", s1.m.getWorldPosition(tmp), cam, range(t, 4.4, 4.7), { cor: Q4.LARANJA, dx: 170, dy: -30 });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
