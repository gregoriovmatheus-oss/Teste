<!-- f07: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f07.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 4.58 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f07-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f07" data-width="1080" data-height="1920">
    <canvas id="f07-canvas" width="1080" height="1920"></canvas>
    <div id="f07-r1" class="rot" style="top: 700px"><span id="f07-r1-in" class="rot-t"><span class="k">POLVO</span><br><span class="y">2/3</span> dos neurônios<br>nos braços</span></div>
  </div>
  <script>
    (function () {
      const D0 = 4.58;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f07-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f07" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f07-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.05 * K);
      tl.to("#f07-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 4.28 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f07"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f07"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/lowpoly.js"), import("./assets/lib/blocks/cinema.js"), import("./assets/lib/blocks/quatro.js")
      ]).then(async ([K_, T, A, LOWPOLY, CINEMA, QUATRO]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f07-canvas");

        const LP = LOWPOLY, CI = CINEMA, Q4 = QUATRO;
        await Q4.prepara();
        const st = LP.palco(canvas, { fundo: 0x04182a, foco: 2.2, faixa: 0.9, desfoque: 18, bloom: 1.1, nevoa: 0.09, corNevoa: 0x06263e, raios: 0.6 });
        const { S, cam } = st;
        LP.luz(st, "noite"); st.U.nevoa.value = 0.09; st.U.corNevoa.value.set(0.02, 0.15, 0.25); st.exposicao = 1.15;
        st.fria.color.set(0x9fd8ff); st.fria.position.set(0.5, 6, 1); st.sol(new THREE.Vector3(0.6, 6, -2), 1.0);
        const chao = new THREE.Mesh(new THREE.PlaneGeometry(30, 30, 20, 20), LP.mat(0x2a3a3a, 0.95)); chao.rotation.x = -Math.PI / 2; S.add(chao);
        for (let i = 0; i < 14; i++) { const r = LP.mulberry32(40 + i), pd = new THREE.Mesh(new THREE.DodecahedronGeometry(0.15 + r() * 0.35, 0), LP.mat(0x3a4a48, 0.9)); pd.position.set((r() - 0.5) * 6, 0.05, -1 - r() * 5); S.add(pd); }
        const neve = LP.poeira(S, { n: 220, centro: [0, 1.2, -0.5], raio: [2.5, 1.4, 2.0], cor: 0xbfe8ff, tam: 0.006, seed: 3 });
        const o = LP.polvo(5, 0xc45a3c); o.root.position.set(0, 0.35, 0); o.root.scale.setScalar(1.25); S.add(o.root);
        // neurônios: 1 terço no "cérebro" (manto), 2 terços ao longo dos 8 braços
        const nr = []; o.bracos.forEach((g0, k) => { let seg = g0.children.find((c) => c.isGroup), j = 0;
          while (seg) { if (j > 0 && j < 8) { const s = Q4.brilho(0x7cc8ff, 0.09, "suave", 0); s.position.z = 0.09; seg.add(s); nr.push({ s, k, j }); } seg = seg.children.find((c) => c.isGroup); j++; } });
        const cer = Q4.brilho(0x7cc8ff, 0.7, "suave", 0); cer.position.set(0, 0.55, 0); o.root.add(cer);
        const al = new THREE.Vector3();
        function render(t) {
          Q4.ondaPolvo(o, t, { amp: 1.2 });
          o.root.position.y = 0.35 + 0.05 * Math.sin(t * 1.3); o.root.rotation.y = 0.5 * Math.sin(t * 0.3) - 0.2;
          o.olhos.forEach((q) => q.abrir(0.75 - 0.7 * Math.max(0, Math.sin(t * 2.3 - 2)) ** 30));
          const acende = range(t, 1.1, 2.0);
          cer.material.opacity = 0.35 + 0.5 * range(t, 0.6, 1.0);
          nr.forEach(({ s, k, j }) => { const on = range(acende * 9, k + j / 8, k + j / 8 + 1.5) * 0.5 + range(acende, 0.0, 1.0) * 0.5;
            s.material.opacity = on * (0.6 + 0.4 * Math.sin(t * 7 + k * 2 + j)); });
          const e = ease.inOutSine(range(t, 0, 4.58));
          cam.position.set(lerp(-2.9, 2.3, e), lerp(2.5, 2.2, e), lerp(5.2, 4.9, e)); al.set(0, lerp(-0.35, -0.25, e), 0); cam.lookAt(al);
          neve.update(t); LP.focar(st, o.root.position);
          st.draw();
          Q4.tag(st.ctx, "NEURÔNIOS", nr[22].s.getWorldPosition(al), cam, range(t, 2.0, 2.3), { dx: 120, dy: -120 });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
