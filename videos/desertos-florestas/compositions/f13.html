<!-- f13: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f13.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 7.4 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f13-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f13" data-width="1080" data-height="1920">
    <canvas id="f13-canvas" width="1080" height="1920"></canvas>
    <div id="f13-r1" class="rot" style="top: 600px"><span id="f13-r1-in" class="rot-t">ele também segura<br>o <span class="y">equilíbrio</span> do planeta</span></div>
  </div>
  <script>
    (function () {
      const D0 = 7.4;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f13-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f13" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f13-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 4.2 * K);
      tl.to("#f13-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 7.1 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f13"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f13"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/lowpoly.js"), import("./assets/lib/blocks/cinema.js"), import("./assets/lib/blocks/deserto.js")
      ]).then(async ([K_, T, A, LOWPOLY, CINEMA, DESERTO]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f13-canvas");

        const LP = LOWPOLY, CI = CINEMA, DS = DESERTO;
        await DS.prepara();
        const st = LP.palco(canvas, { fov: 30, foco: 1.1, faixa: 0.6, desfoque: 12, fundo: 0xe9cfa0, bloom: 0.9, raios: 0.5 });
        const { S, cam } = st; cam.far = 300; cam.updateProjectionMatrix();
        LP.luz(st, "dia"); st.U.nevoa.value = 0.018; st.U.corNevoa.value.set(0.93, 0.8, 0.62); st.exposicao = 1.05; st.U.split.value = 0.45;
        CI.ceu(S, { topo: 0x3a78c4, horizonte: 0xf4d9a8, nuvens: 0 });
        st.fria.color.set(0xfff0d0); st.fria.intensity = 3.6; st.fria.position.set(-2.5, 5, 4);
        st.quente.color.set(0xffc890); st.quente.intensity = 0.9; st.rim.color.set(0xbfd8ff); st.rim.intensity = 2.2; st.rim2.color.set(0xffb070); st.rim2.intensity = 1.2;
        st.hemi.color.setHex(0xcfe0ff); st.hemi.groundColor.setHex(0xc89a5a); st.hemi.intensity = 0.75;
        const SOL = DS.brilho(0xfff0c8, 40, "suave", 0.95); SOL.position.set(-60, 70, 90); S.add(SOL);
        const DU = DS.dunas(S, LP.mat, { tam: 220, seg: 84, amp: 1.3, plano: 3, centro: [0, -60] });
        const y0 = DU.h(0, 0);
        const p = DS.viajante(LP); p.root.position.y = y0; S.add(p.root);
        const voltaAbas = DS.guardaAbas(p);
        const PO = LP.poeira(S, { n: 140, centro: [0, y0 + 0.6, -1], raio: [4, 0.6, 4], cor: 0xffd8a0, seed: 6, tam: 0.01 });
        // o deserto não é vazio: um feneco sobe na duna ao lado e um escorpião passa
        const FN = DS.feneco(LP); FN.root.scale.setScalar(1.6); S.add(FN.root);
        const ES = DS.escorpiao(LP); ES.root.scale.setScalar(2.2); S.add(ES.root);
        const alvo = new THREE.Vector3(), rosto = new THREE.Vector3(), olhoA = new THREE.Vector3(9, y0 + 1.9, 30), fnP = new THREE.Vector3();
        const quente = new THREE.Color(0xffa45a), base = new THREE.Color(0xfff0d0);
        function render(t) {
          p.reset(); voltaAbas();
          p.root.rotation.y = 0.25;
          p.root.updateMatrixWorld(true);
          // olha o horizonte; depois baixa os olhos para o feneco (2,4 s) e volta, em paz
          const ve = range(t, 2.3, 2.8) * (1 - range(t, 3.8, 4.4));
          FN.root.getWorldPosition(fnP);
          LP.olharPara(p, olhoA, 0.8 * (1 - ve)); LP.olharPara(p, fnP, 0.6 * ve);
          p.bracos[1].om.rotation.x = -0.15; p.bracos[0].om.rotation.x = 0.1;
          const paz = { br: -0.04, by: 0.32, bo: [1.05, 0.4], ab: 0.5, ol: [0.2, 0.05], so: 0.45, su: 0.15 };
          p.emocaoMix({ br: 0.24, by: 0.3, bo: [0.85, 0.35], ab: 0.4, ol: [0.2, 0.08], so: -0.12, su: 0.25, pu: 0.7 }, paz, ease.inOutSine(range(t, 0.4, 1.6)));
          LP.vida(p, t, { seed: 21, balanco: 0.6, olhos: false });
          PO.update(t * 2.2);
          const fx = 1.3, fz = lerp(-0.2, 0.9, ease.outCubic(range(t, 1.9, 2.8)));
          FN.root.position.set(fx, DU.h(fx, fz) - 0.02, fz); FN.root.rotation.y = -1.2; FN.set(t, { olhar: [0.3, 0.2] });
          const ex = lerp(-1.6, -0.4, range(t, 2.6, 6.5)); ES.root.position.set(ex, DU.h(ex, 1.1), 1.1); ES.root.rotation.y = 1.5; ES.update(t);
          // luz caminha para o fim de tarde
          const k = range(t, 1, 7.4); st.fria.color.lerpColors(base, quente, k); st.exposicao = 1.05 - 0.08 * k;
          // câmera: mesmo close da abertura → recua e sobe até o plano aberto da duna
          p.cab.getWorldPosition(rosto);
          const o = ease.inOutCubic(range(t, 1.2, 7.4));
          const ang = lerp(0.42, 0.75, o), r = lerp(2.05, 9.5, o);
          cam.position.set(rosto.x + Math.sin(ang) * r, rosto.y + lerp(-0.05, 2.6, o), rosto.z + Math.cos(ang) * r);
          alvo.copy(rosto); alvo.y -= lerp(0.3, 1.6, o);
          cam.lookAt(alvo);
          LP.camMao(cam, t, { intens: 0.8, seed: 2 });
          st.U.foco.value = cam.position.distanceTo(rosto); st.U.faixa.value = lerp(0.6, 4, o);
          st.sol(SOL.position, 0.45);
          st.draw();
          DS.etq(st.ctx, "O DESERTO NÃO É VAZIO", fnP, cam, range(t, 2.4, 2.7) * (1 - range(t, 3.9, 4.1)), { dy: -200, cor: "#ffd27a" });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
