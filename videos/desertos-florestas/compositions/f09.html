     Tempos escritos para 6.27 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f09-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f09" data-width="1080" data-height="1920">
    <canvas id="f09-canvas" width="1080" height="1920"></canvas>
    <div id="f09-r1" class="rot" style="top: 520px"><span id="f09-r1-in" class="rot-t"><span class="k">NASA · SATÉLITE CALIPSO</span><br>~<span class="y">27 milhões</span> t/ano</span></div>
  </div>
  <script>
    (function () {
      const D0 = 6.27;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f09-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f09" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f09-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 3.1 * K);
      tl.to("#f09-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 4.55 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f09"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f09"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/terra.js"), import("./assets/lib/blocks/deserto.js")
      ]).then(async ([K_, T, A, TERRA, DESERTO]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f09-canvas");

        const DS = DESERTO;
        await DS.prepara();
        const st = T.createToyStage(canvas, { fov: 38, ceu: "#000000", nevoa: null, nuvens: 0, exposicao: 1.0 });
        const S = st.scene, cam = st.cam;
        S.environment = null; st.hemi.intensity = 0.04; st.key.intensity = 0; st.rim.intensity = 0; st.key.castShadow = false;
        S.add(TERRA.createCeu({ seed: 44, n: 4500, via: 0.5 }));
        const E = await DS.terraVerde(TERRA); S.add(E.group);
        E.sol.set(0.6, 0.5, 1); E.u.nuvens.value = 0.5; E.u.luzes.value = 0.3;
        const PO = DS.poeiraArco(E, { n: 2800, de: [6, 19], ate: [-62, -3], seed: 9, tam: 0.02, larg: 0.06 });
        const alvo = new THREE.Vector3(), a0 = new THREE.Vector3(), a1 = new THREE.Vector3();
        function render(t) {
          // do Saara (perto) para o Atlântico inteiro: a pluma atravessa o oceano e chega na Amazônia em "Brasil" (2,35 s)
          const e = ease.inOutSine(range(t, 0, 6.27));
          E.aim(lerp(0, -30, e), lerp(14, 4, e));
          E.nuv.rotation.y = t * 0.01;
          PO.update(t, ease.inOutSine(range(t, 0.85, 2.5)), range(t, 0.7, 1.1));
          cam.position.set(lerp(0.6, 0.15, e), lerp(0.8, 0.35, e), lerp(2.2, 3.55, e));
          alvo.set(lerp(0.35, 0.0, e), lerp(0.4, 0.0, e), 0); cam.lookAt(alvo);
          st.bloom = 0.75;
          st.draw();
          const c = st.ctx;
          a0.copy(PO.P0).multiplyScalar(E.raio); E.earth.localToWorld(a0);
          a1.copy(PO.P1).multiplyScalar(E.raio); E.earth.localToWorld(a1);
          DS.etq(c, "SAARA", a0, cam, range(t, 1.4, 1.7) * (1 - range(t, 2.9, 3.1)), { cor: DS.LARANJA, dy: -60 });
          DS.etq(c, "BRASIL · AMAZÔNIA", a1, cam, range(t, 2.3, 2.6) * (1 - range(t, 2.9, 3.1)) + range(t, 4.85, 5.15), { cor: "#8fe08a", dy: -90 });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
