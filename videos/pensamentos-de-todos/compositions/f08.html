<!-- f08: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f08.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 6.84 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f08-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f08" data-width="1080" data-height="1920">
    <canvas id="f08-canvas" width="1080" height="1920"></canvas>
    <div id="f08-r1" class="rot" style="top: 700px"><span id="f08-r1-in" class="rot-t"><span class="k">ESTUDO COM 2.250 PESSOAS</span><br><span class="y">47%</span> do tempo<br>divagando</span></div>
    <div id="f08-r2" class="rot" style="top: 700px"><span id="f08-r2-in" class="rot-t">A mente <span class="y">divaga</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 6.84;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f08-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f08" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f08-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.8 * K);
      tl.to("#f08-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 4.3 * K);
      tl.fromTo("#f08-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 5.4 * K);
      tl.to("#f08-r2-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 6.54 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f08"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f08"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/mente.js")
      ]).then(async ([K_, T, A, MENTE]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f08-canvas");

        const st = T.createToyStage(canvas, { fov: 42, ceu: ["#1b2440", "#d98a5a"], nevoa: [18, 95], corNevoa: "#5e4656", nuvens: 0, exposicao: 1.0 });
        const S = st.scene, cam = st.cam;
        const rua = MENTE.ruaNoite(S, { len: 140, larg: 10, seed: 801, luz: 0.9 });
        st.key.color.set(0xffb07a); st.key.intensity = 2.0; st.hemi.intensity = 0.5;
        const R = mulberry32(802), N = 30, L = [];
        for (let i = 0; i < N; i++) {
          const vz = (R() < 0.5 ? 1 : -1) * (0.9 + R() * 0.5), x = (R() - 0.5) * 13, z = -16 + R() * 26;
          L.push({ x, z, vx: 0, vz, ry: vz > 0 ? 0 : Math.PI, sent: 0 });
        }
        const p = MENTE.povo(S, L, { seed: 803 });
        // 47% divagam: 14 de 30 (escolhidos por sorteio fixo)
        const ord = L.map((q, i) => [i, R()]).sort((a, b) => a[1] - b[1]), DIV = new Set(ord.slice(0, 14).map((a) => a[0]));
        const tex = MENTE.bolhaTex();
        const B = L.map((q, i) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color: 0xcfe9ff, transparent: true, depthWrite: false, fog: false, opacity: 0 })); s.scale.setScalar(0.75); S.add(s); return s; });
        const cab = L.map(() => new THREE.Vector3()), bp = L.map(() => new THREE.Vector3());
        const cAz = new THREE.Color(0xa9dcff), cLa = new THREE.Color(0xff9a5c), tmp = new THREE.Color();
        function render(t) {
          p.update(t, {});
          const d1 = ease.inOutSine(range(t, 1.85, 3.4)), d2 = ease.inOutSine(range(t, 5.4, 6.8));
          B.forEach((s, i) => {
            p.cabeca(i, t, cab[i]);
            const dv = DIV.has(i) ? 1 : 0, ph = i * 1.9, dd = dv * (d1 * 0.8 + d2 * 0.9);
            bp[i].set(cab[i].x + Math.sin(ph + t * 0.6) * 1.6 * dd, cab[i].y + 0.55 + 1.5 * dd + Math.sin(t * 2 + ph) * 0.05, cab[i].z + Math.cos(ph) * 0.8 * dd);
            s.position.copy(bp[i]);
            s.material.opacity = 0.9 * range(t, 0.2 + (i % 7) * 0.08, 0.6 + (i % 7) * 0.08);
            s.material.color.copy(tmp.copy(cAz).lerp(cLa, dv * d1));
            s.scale.setScalar(0.75 * (1 - 0.2 * dd));
          });
          st.bloom = 0.6;
          // travelling lateral ao lado da multidão
          const e = ease.inOutSine(range(t, 0, 6.84));
          cam.position.set(lerp(8.5, 4.5, e), lerp(3.6, 3.0, e), lerp(9, 1, e));
          cam.lookAt(lerp(0, -0.5, e), lerp(1.8, 2.0, e), lerp(-1, -7, e));
          st.sol(0, -2, 18);
          st.draw();
          // fio pontilhado: o pensamento solto, longe de quem pensa
          const c = st.ctx, vv = MENTE.vis(st);
          c.save(); c.setLineDash([6, 8]); c.lineWidth = 2; c.strokeStyle = MENTE.LARANJA; c.globalAlpha = 0.7 * vv * d1;
          DIV.forEach((i) => { const [x0, y0, z0] = MENTE.proj(cab[i], cam), [x1, y1] = MENTE.proj(bp[i], cam); if (z0 < 1) { c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); } });
          c.restore();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
