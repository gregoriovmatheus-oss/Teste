<!-- f01: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f01.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.27 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f01-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f01" data-width="1080" data-height="1920">
    <canvas id="f01-canvas" width="1080" height="1920"></canvas>
    <div id="f01-r1" class="rot" style="top: 700px"><span id="f01-r1-in" class="rot-t"><span class="k">UM EXPERIMENTO MENTAL</span><br>E se você ouvisse os <span class="y">pensamentos</span> de todos?</span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.27;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f01-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f01" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f01-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.0 * K);
      tl.to("#f01-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 1.55 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f01"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f01"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/mente.js")
      ]).then(async ([K_, T, A, MENTE]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f01-canvas");

        const st = T.createToyStage(canvas, { fov: 44, ceu: ["#05070d", "#0b0f18"], nevoa: [6, 24], corNevoa: "#0b0f18", nuvens: 0, exposicao: 0.9 });
        const S = st.scene, cam = st.cam;
        const v = MENTE.vagao(S, st, { len: 20 });
        const L = MENTE.lugaresVagao({ len: 20, seed: 11, sent: 0.62, emPe: 7 });
        const p = MENTE.povo(S, L, { seed: 12 });
        const f = MENTE.fios(S, L.length, { seed: 13, alt: 0.75 });
        const cab = L.map(() => new THREE.Vector3());
        // fragmentos fixados em passageiros perto da câmera (escolhidos pela posição)
        const ord = L.map((q, i) => [i, q.x]).filter(([i, x]) => x > -5 && x < 0.8).sort((a, b) => b[1] - a[1]).map((a) => a[0]);
        const FR = [["ESQUECI A CHAVE", 2.3], ["ELE ME ODEIA?", 2.75], ["PIZZA", 3.1], ["FALTAM 3 ESTAÇÕES", 3.45], ["E SE DER ERRADO?", 3.8], ["QUE FOME", 4.15], ["SERÁ QUE ELA VIU?", 4.4]];
        function render(t) {
          v.update(t, 1);
          p.update(t, { olhaBaixo: 0.6 });
          // o evento em câmera lenta: em "escuta tudo" (1,9 s) os fios explodem das cabeças
          const ev = ease.outCubic(range(t, 1.85, 2.6)), base = 0.18 + 0.82 * ev, pens = range(t, 4.1, 4.6);
          f.update(t * (1 - 0.6 * Math.sin(Math.PI * range(t, 1.85, 3.0))), (i) => {
            p.cabeca(i, t, cab[i]);
            const dist = Math.abs(L[i].x - 2);
            return { p: cab[i], a: base * (0.6 + 0.4 * Math.sin(i * 1.7 + t)) * (dist < 9 ? 1 : 0.5), cor: i % 4 === 0 && pens < 1 ? MENTE.COR.laranja : MENTE.COR.azul, tumulto: ev * 0.4 };
          });
          st.vel = Math.sin(Math.PI * range(t, 1.85, 2.9)) * 0.55; st.velT = t;
          st.bloom = 0.45 + ev * 0.4;
          // dolly lento e pesado pelo corredor, um pouco abaixo dos olhos
          const e = ease.inOutSine(range(t, 0, 5.27));
          cam.position.set(lerp(7.2, 2.4, e), lerp(1.25, 1.45, e) + Math.sin(t * 1.3) * 0.02, lerp(0.35, -0.1, e));
          cam.lookAt(lerp(1, -4, e), lerp(1.5, 1.4, e), lerp(-0.25, 0.2, e));
          st.sol(0, 0, 14, 2);
          st.draw();
          const c = st.ctx, vv = MENTE.vis(st); MENTE.quadro();
          FR.forEach(([s, t0], k) => {
            const i = ord[k % ord.length]; if (i === undefined) return;
            const a = range(t, t0, t0 + 0.25) * vv;
            MENTE.frase(c, cam, cab[i].clone().add(new THREE.Vector3(0, 0.55, 0)), s, a, { cor: k % 3 === 1 ? MENTE.LARANJA : MENTE.AZUL, tam: 30 });
          });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
