<!-- f05: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f05.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.89 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f05-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f05" data-width="1080" data-height="1920">
    <canvas id="f05-canvas" width="1080" height="1920"></canvas>
    <div id="f05-r1" class="rot" style="top: 700px"><span id="f05-r1-in" class="rot-t"><span class="k">LIMITE DO FILTRO</span><br><span class="y">2 ou 3</span> vozes ao mesmo tempo</span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.89;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f05-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f05" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f05-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.0 * K);
      tl.to("#f05-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 3.85 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f05"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f05"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/mente.js")
      ]).then(async ([K_, T, A, MENTE]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f05-canvas");

        const st = T.createToyStage(canvas, { fov: 40, ceu: ["#05070e", "#0c1222"], nevoa: [9, 30], corNevoa: "#070a14", nuvens: 0, exposicao: 1.0 });
        const S = st.scene, cam = st.cam;
        st.key.color.set(0xdfe9ff); st.key.intensity = 2.0; st.hemi.intensity = 0.3; st.rim.color.set(0x7cc8ff);
        const piso = new THREE.Mesh(new THREE.CircleGeometry(9, 48), T.M(0x1a1f2a, 0.35, { metalness: 0.3 })); piso.rotation.x = -Math.PI / 2; piso.receiveShadow = true; S.add(piso);
        const halo = new THREE.Mesh(new THREE.RingGeometry(1.0, 1.06, 64), new THREE.MeshBasicMaterial({ color: 0x7cc8ff, transparent: true, opacity: 0.6, toneMapped: false })); halo.rotation.x = -Math.PI / 2; halo.position.y = 0.02; S.add(halo);
        // ouvinte no centro + 3 falantes em volta
        const F = [[-2.6, -1.6], [2.8, -1.2], [0.2, -3.4]];
        const L = [{ x: 0, z: 0.4, ry: Math.PI, sent: 0, cor: 0xe8e2d4 }, ...F.map(([x, z]) => ({ x, z, ry: Math.atan2(-x, 0.4 - z), sent: 0, braco: true }))];
        const p = MENTE.povo(S, L, { seed: 505 });
        const TV = [0.0, 2.26, 2.73];  // cada voz entra quando é dita ("duas", "três")
        // fluxos de voz: partículas indo da cabeça do falante até a do ouvinte
        const NP = 220, vp = new Float32Array(3 * NP * 3), vc = new Float32Array(3 * NP * 3);
        const vg = new THREE.BufferGeometry(); vg.setAttribute("position", new THREE.BufferAttribute(vp, 3)); vg.setAttribute("color", new THREE.BufferAttribute(vc, 3));
        S.add(new THREE.Points(vg, new THREE.PointsMaterial({ map: MENTE.glowTex(), size: 0.09, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false, fog: false })));
        const CV = [MENTE.COR.azul, [0.6, 1, 0.75], [1, 0.85, 0.45]], R = mulberry32(506), J = Array.from({ length: 3 * NP }, () => [R(), R() * 6.28]);
        const ch = new THREE.Vector3(), cs = new THREE.Vector3();
        // medidor de compreensão (barra vertical ao lado do ouvinte)
        const bar = MENTE.barras(S, 2, { larg: 0.16, prof: 0.16 });
        function render(t) {
          p.update(t, {});
          p.cabeca(0, t, ch); ch.y -= 0.1;
          const caos = range(t, 2.6, 4.4);
          for (let v = 0; v < 3; v++) {
            const on = range(t, TV[v], TV[v] + 0.35);
            p.cabeca(v + 1, t, cs); cs.y -= 0.12;
            for (let k = 0; k < NP; k++) {
              const q = v * NP + k, [o, ph] = J[q], u = ((t * 0.55 + o) % 1 + 1) % 1, w = t * 3 + ph + u * 9;
              const amp = 0.06 + caos * 0.35 * Math.sin(Math.PI * u);
              vp[q * 3] = lerp(cs.x, ch.x, u) + Math.sin(w) * amp; vp[q * 3 + 1] = lerp(cs.y, ch.y, u) + Math.sin(Math.PI * u) * 0.5 + Math.cos(w * 1.3) * amp; vp[q * 3 + 2] = lerp(cs.z, ch.z, u) + Math.cos(w) * amp;
              const e = on * (0.5 + 0.5 * Math.sin(u * 40 - t * 12)) * (u < (t - TV[v]) * 1.6 ? 1 : 0);
              const cc = CV[v]; vc[q * 3] = cc[0] * e; vc[q * 3 + 1] = cc[1] * e; vc[q * 3 + 2] = cc[2] * e;
            }
          }
          vg.attributes.position.needsUpdate = true; vg.attributes.color.needsUpdate = true;
          // compreensão: cheia com 1 voz, despenca em "despenca" (5,15 s)
          const comp = lerp(lerp(1, 0.72, range(t, 2.4, 3.2)), 0.12, ease.inCubic(range(t, 4.3, 5.3)));
          const lar = range(t, 4.4, 5.2), cor = [lerp(0.49, 1, lar) * 1.5, lerp(0.78, 0.54, lar) * 1.5, lerp(1, 0.3, lar) * 1.5];
          bar.set(0, 0.95, 0.4 + comp * 0.7, 0.4, comp * 1.4, cor);
          bar.set(1, 0.95, 1.1, 0.25, 1.4, [0.08, 0.1, 0.14]); bar.mesh.material.transparent = false;
          bar.fim();
          halo.material.opacity = 0.6 * (1 - lar * 0.5);
          st.bloom = 0.7;
          // órbita lenta ao redor do ouvinte
          const e = ease.inOutSine(range(t, 0, 5.89)), a = lerp(0.45, -0.3, e), r = lerp(9.4, 8.0, e);
          cam.position.set(Math.sin(a) * r, lerp(3.6, 2.8, e), 0.4 + Math.cos(a) * r);
          cam.lookAt(0, lerp(1.0, 1.3, e), -1.3);
          st.sol(0, 0, 8);
          st.draw();
          const c = st.ctx, vv = MENTE.vis(st);
          const [bx, by] = MENTE.proj(new THREE.Vector3(0.95, 1.85, 0.4), cam), [qx, qy] = MENTE.proj(new THREE.Vector3(0.95, 0.4 + comp * 1.4, 0.4), cam);
          MENTE.txt(c, "COMPREENSÃO", bx, by - 40, { tam: 24, cor: MENTE.AZUL, a: vv * range(t, 0.3, 0.8), esp: 0.25 });
          MENTE.txt(c, "DESPENCA", qx + 30, qy, { tam: 34, cor: MENTE.LARANJA, al: "left", a: vv * range(t, 5.1, 5.3), esp: 0.2 });
          ["1 VOZ", "2 VOZES", "3 VOZES"].forEach((s, v) => { const [x, y] = MENTE.proj(new THREE.Vector3(F[v][0], 2.45, F[v][1]), cam); MENTE.txt(c, s, x, Math.max(y, 500), { tam: 26, cor: "#e7f2ff", a: vv * range(t, TV[v], TV[v] + 0.25), esp: 0.2 }); });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
