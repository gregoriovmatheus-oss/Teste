<!-- f09: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f09.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.33 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f09-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f09" data-width="1080" data-height="1920">
    <canvas id="f09-canvas" width="1080" height="1920"></canvas>
    <div id="f09-r1" class="rot" style="top: 700px"><span id="f09-r1-in" class="rot-t">Tudo junto,<br><span class="y">sem pausa</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.33;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f09-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f09" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f09-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 3.6 * K);
      tl.to("#f09-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 5.03 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f09"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f09"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/mente.js")
      ]).then(async ([K_, T, A, MENTE]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f09-canvas");

        const st = T.createToyStage(canvas, { fov: 50, ceu: ["#03040a", "#0a0c18"], nevoa: [10, 60], corNevoa: "#05060c", nuvens: 0, exposicao: 1.0 });
        const S = st.scene, cam = st.cam;
        const R = mulberry32(901), NT = 7000;
        const tp = new Float32Array(NT * 3), tc = new Float32Array(NT * 3), TP = [];
        for (let i = 0; i < NT; i++) {
          const q = R(), cor = q < 0.45 ? MENTE.COR.laranja : q < 0.85 ? MENTE.COR.azul : MENTE.COR.branco;
          TP.push([R() * 6.283, 2.2 + R() * 2.4, -80 + R() * 90, 0.3 + R() * 0.9]);
          const b = 0.35 + R() * 0.65; tc[i * 3] = cor[0] * b; tc[i * 3 + 1] = cor[1] * b; tc[i * 3 + 2] = cor[2] * b;
        }
        const tg = new THREE.BufferGeometry(); tg.setAttribute("position", new THREE.BufferAttribute(tp, 3)); tg.setAttribute("color", new THREE.BufferAttribute(tc, 3));
        S.add(new THREE.Points(tg, new THREE.PointsMaterial({ map: MENTE.glowTex(), size: 0.16, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false, fog: true })));
        // posição da câmera ao longo do túnel (acelera em "tudo junto")
        const zc = (t) => -(t * 2.2 + Math.pow(range(t, 3.5, 5.33), 2) * 9);
        const CAT = [["MEDO · E SE EU CAIR?", 0.91, MENTE.LARANJA], ["CONTA · R$ 248,90", 1.28, MENTE.AZUL], ["MÚSICA · LA LA LA LA", 1.71, "#ffd27a"], ["MEDO · ELE VAI DESCOBRIR", 2.1, MENTE.LARANJA], ["LEMBRANÇA · O CHEIRO DA VÓ", 2.74, "#e9d8ff"]];
        const PEN = MENTE.PENS, chips = [];
        CAT.forEach(([s, t0, cor], k) => chips.push({ s, t0, cor, p: new THREE.Vector3((k % 2 ? 1 : -1) * (0.8 + R() * 0.6), (R() - 0.3) * 1.4, zc(t0) - 7) }));
        for (let k = 0; k < 22; k++) { const t0 = 3.63 + k * 0.07; chips.push({ s: PEN[k % PEN.length], t0, cor: k % 2 ? MENTE.LARANJA : MENTE.AZUL, p: new THREE.Vector3((R() - 0.5) * 4.4, (R() - 0.5) * 3.2, zc(t0) - 6 - R() * 8), emb: true, seed: k }); }
        function render(t) {
          const sp = 1 + 3 * range(t, 3.5, 5.0);
          TP.forEach(([a, r, z, v], i) => { const w = a + t * v * sp * 0.6 + z * 0.05; tp[i * 3] = Math.cos(w) * r; tp[i * 3 + 1] = Math.sin(w) * r; tp[i * 3 + 2] = z; });
          tg.attributes.position.needsUpdate = true;
          st.bloom = 0.9;
          st.vel = 0.25 + 0.55 * range(t, 3.6, 4.4); st.velT = t;
          cam.position.set(Math.sin(t * 0.7) * 0.3, Math.cos(t * 0.5) * 0.2, zc(t));
          cam.lookAt(Math.sin(t * 0.7 + 0.4) * 0.5, 0, zc(t) - 10);
          cam.rotateZ(t * 0.12 + range(t, 3.6, 5.3) * 0.5);
          st.draw();
          const c = st.ctx, vv = MENTE.vis(st); MENTE.quadro();
          chips.forEach((h) => {
            if (t < h.t0) return;
            const dz = cam.position.z - h.p.z; if (dz < 1.2) return;
            const a = range(t, h.t0, h.t0 + 0.15) * range(dz, 1.2, 2.5) * vv;
            const s = h.emb ? MENTE.embaralha(h.s, range(t, 4.2, 5.2) * 0.7, h.seed + Math.floor(t * 10)) : h.s;
            MENTE.frase(c, cam, h.p, s, a, { cor: h.cor, tam: h.emb ? 26 : 32, dy: 0, linha: false, ymin: 470, ymax: 1760, evita: [1030, 1230] });
          });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
