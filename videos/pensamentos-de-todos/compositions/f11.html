<!-- f11: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f11.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.62 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f11-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f11" data-width="1080" data-height="1920">
    <canvas id="f11-canvas" width="1080" height="1920"></canvas>
    <div id="f11-r1" class="rot" style="top: 700px"><span id="f11-r1-in" class="rot-t">O <span class="y">silêncio</span> viraria<br>a coisa mais rara</span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.62;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f11-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f11" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f11-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 2.8 * K);
      tl.to("#f11-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 5.32 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f11"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f11"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/mente.js")
      ]).then(async ([K_, T, A, MENTE]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f11-canvas");

        const st = T.createToyStage(canvas, { fov: 42, ceu: ["#070a16", "#1a2036"], nevoa: [14, 80], corNevoa: "#121626", nuvens: 0, exposicao: 1.0 });
        const S = st.scene, cam = st.cam;
        const rua = MENTE.ruaNoite(S, { len: 140, larg: 10, seed: 1101, luz: 1.1 });
        st.key.color.set(0xa9c2ff); st.key.intensity = 1.2; st.hemi.intensity = 0.4;
        const R = mulberry32(1102), L = [{ x: 0.6, z: -5, vx: 0, vz: 1.15, ry: 0, sent: 0, cor: 0xe8e2d4 }];
        for (let i = 0; i < 34; i++) { const vz = (R() - 0.5) * 1.2; L.push({ x: (R() - 0.5) * 14, z: -9 - R() * 16, vx: 0, vz, ry: vz > 0 ? 0 : Math.PI, sent: 0 }); }
        const p = MENTE.povo(S, L, { seed: 1103, leve: true });
        const f = MENTE.fios(S, L.length, { seed: 1104, alt: 1.3, np: 40 });
        const cab = L.map(() => new THREE.Vector3());
        function render(t) {
          p.update(t, {});
          const sil = range(t, 2.6, 5.2);
          f.update(t, (i) => { p.cabeca(i, t, cab[i]); return i ? { p: cab[i], a: 0.9 * (1 - 0.8 * sil), cor: i % 2 ? MENTE.COR.laranja : MENTE.COR.azul, tumulto: 0.6 * (1 - sil) } : { p: cab[i], a: 0.35, cor: MENTE.COR.azul, alt: 0.6 }; });
          st.bloom = 0.65;
          // grua: na frente de quem sai, recuando e subindo, a multidão ficando para trás
          const e = ease.inOutSine(range(t, 0, 5.62)), zp = -5 + 1.15 * t;
          cam.position.set(lerp(2.2, 3.4, e), lerp(1.7, 6.5, e), zp + lerp(4.5, 9.5, e));
          cam.lookAt(0.3, lerp(1.4, 0.8, e), zp - lerp(2, 7, e));
          st.sol(0, zp, 20);
          st.draw();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
