<!-- f02: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f02.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.11 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f02-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f02" data-width="1080" data-height="1920">
    <canvas id="f02-canvas" width="1080" height="1920"></canvas>
    <div id="f02-r1" class="rot" style="top: 700px"><span id="f02-r1-in" class="rot-t"><span class="k">NO COMEÇO</span><br>Parece um <span class="y">superpoder</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 5.11;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f02-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f02" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f02-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.2 * K);
      tl.to("#f02-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 2.75 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f02"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f02"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/mente.js")
      ]).then(async ([K_, T, A, MENTE]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f02-canvas");

        const st = T.createToyStage(canvas, { fov: 50, ceu: ["#05070d", "#0b0f18"], nevoa: [5, 22], corNevoa: "#0b0f18", nuvens: 0, exposicao: 0.95 });
        const S = st.scene, cam = st.cam;
        const v = MENTE.vagao(S, st, { len: 20 });
        const L = MENTE.lugaresVagao({ len: 20, seed: 21, sent: 0.7, emPe: 3 });
        // os três "lidos": sentados no banco de z = −1,18 perto de x = 0
        const alvo = [-0.62, 0, 0.62].map((x, k) => { L.push({ x, z: -1.18, ry: 0, sent: 1, cor: [0x2f5c8a, 0xd9a23a, 0x9b2f4f][k] }); return L.length - 1; });
        const p = MENTE.povo(S, L.filter((q, i) => !(q.z < 0 && q.sent && Math.abs(q.x) < 1.0 && !alvo.includes(i))), { seed: 22 });
        const LL = p.L, AL = LL.map((q, i) => i).filter((i) => LL[i].cor !== undefined);
        const f = MENTE.fios(S, LL.length, { seed: 23, alt: 0.8 });
        const cab = LL.map(() => new THREE.Vector3());
        const CH = [["QUER · FÉRIAS NA PRAIA", 3.77, MENTE.AZUL], ["TEME · SER DEMITIDO", 4.04, MENTE.LARANJA], ["ESCONDE · NÃO LEU O E-MAIL", 4.44, MENTE.AZUL]];
        function render(t) {
          v.update(t, 0.8);
          p.update(t, { olhaBaixo: 0.4 });
          f.update(t, (i) => {
            p.cabeca(i, t, cab[i]);
            const k = AL.indexOf(i), aa = k >= 0 ? 0.9 + 0.6 * range(t, CH[k][1] - 0.2, CH[k][1] + 0.2) : 0.45;
            return { p: cab[i], a: aa, cor: k === 1 && t > 3.9 ? MENTE.COR.laranja : MENTE.COR.azul, alt: k >= 0 ? 0.6 : 0.7 };
          });
          st.bloom = 0.7;
          // grua: do teto, em diagonal, descendo até a altura dos olhos de quem está em pé
          const e = ease.inOutSine(range(t, 0, 5.11));
          cam.position.set(lerp(3.2, -1.8, e), lerp(1.85, 1.6, e), 0.45);
          cam.lookAt(lerp(0.8, -0.2, e), lerp(1.0, 1.25, e), -1.15);
          st.sol(0, 0, 12, 2);
          st.draw();
          const c = st.ctx, vv = MENTE.vis(st); MENTE.quadro();
          CH.forEach(([s, t0, cor], k) => {
            const a = range(t, t0, t0 + 0.22) * vv;
            MENTE.frase(c, cam, cab[AL[k]].clone().add(new THREE.Vector3(0, 0.45, 0)), s, a, { cor, tam: 30, dy: -60 - k * 10 });
          });
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
