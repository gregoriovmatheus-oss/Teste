<!-- f03: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f03.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.96 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f03-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f03" data-width="1080" data-height="1920">
    <canvas id="f03-canvas" width="1080" height="1920"></canvas>

  </div>
  <script>
    (function () {
      const D0 = 5.96;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f03-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f03" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });

      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f03"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f03"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/sonho.js")
      ]).then(async ([K_, T, A, SONHO]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f03-canvas");

const SN = SONHO;
await SN.prepara();
const st = SN.palcoDoc(T, canvas, { fov: 34, ceu: "#07051a", chao: 0x0e0c1c });
const S = st.scene, cam = st.cam;
// anel de 100 pessoas (100 peças); em "metade" 55 acendem (meta-análise: ~55% já tiveram ao menos um sonho lúcido)
const N = 100, RA = 1.25, CY = 2.05, geo = new THREE.BoxGeometry(0.06, 0.2, 0.06);
const m = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.0, roughness: 0.35, metalness: 0.1 });
const im = new THREE.InstancedMesh(geo, m, N); S.add(im); im.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(N * 3), 3);
const o = new THREE.Object3D(), cor = new THREE.Color(), apag = new THREE.Color(0x2a3350), ac1 = new THREE.Color(0x7cc8ff), ac2 = new THREE.Color(0xc89aff);
const lu = SN.lua(0xd8c8ff, 0.32); lu.position.set(0, CY, 0); S.add(lu);
const hal = SN.brilho(0x9a7aff, 4.5, "suave", 0.0); hal.position.set(0, CY, -0.3); S.add(hal);
const est = new THREE.BufferGeometry(), rr = mulberry32(5), ep = []; for (let i = 0; i < 400; i++) ep.push((rr() - 0.5) * 30, rr() * 14, -6 - rr() * 14);
est.setAttribute("position", new THREE.Float32BufferAttribute(ep, 3)); S.add(new THREE.Points(est, new THREE.PointsMaterial({ color: 0xcfc0ff, size: 0.05 })));
st.key.position.set(2, 5, 6); st.rim.color.set(0x9a7aff);
const al = new THREE.Vector3();
function render(t) {
  const fill = ease.inOutCubic(range(t, 3.32, 4.3)) * 55;
  for (let i = 0; i < N; i++) { const a = Math.PI / 2 - (i / N) * 6.283, ap = ease.outBack(range(t, 0.2 + i * 0.012, 0.6 + i * 0.012)), on = Math.min(1, Math.max(0, fill - i));
    o.position.set(Math.cos(a) * RA, CY + Math.sin(a) * RA, 0.03 * Math.sin(t * 2 + i * 0.3)); o.rotation.set(0, 0, a - Math.PI / 2); o.scale.set(1, Math.max(0.001, ap) * (1 + 0.5 * on), 1); o.updateMatrix(); im.setMatrixAt(i, o.matrix);
    cor.copy(apag).lerp(i % 2 ? ac1 : ac2, on).multiplyScalar(1 + 1.8 * on); im.setColorAt(i, cor); }
  im.instanceMatrix.needsUpdate = true; im.instanceColor.needsUpdate = true;
  m.emissiveIntensity = 0.0; lu.scale.setScalar(1 + 0.05 * Math.sin(t * 2)); hal.material.opacity = 0.45 * range(t, 3.32, 4.3);
  const e = ease.inOutSine(range(t, 0, 5.96));
  cam.position.set(lerp(-0.7, 0.5, e), lerp(1.2, 1.0, e), lerp(6.4, 7.4, e)); al.set(0, lerp(1.35, 1.25, e), 0); cam.lookAt(al); cam.rotation.z += 0.02 * Math.sin(t * 0.7);
  st.bloom = 0.9; st.draw();
  const c = st.ctx;
  SN.txt(c, "SONHO LÚCIDO", 540, 760, { tam: 30, cor: SN.AZUL, a: range(t, 1.91, 2.1) * (1 - range(t, 3.1, 3.3)), esp: 0.34 });
  SN.titulo(c, "", ["saber que *está sonhando*"], range(t, 2.25, 2.5) * (1 - range(t, 3.1, 3.3)), { y: 850, tam: 58 });
  SN.numero(c, "≈ " + Math.round(fill) + "%", 540, 840, range(t, 3.32, 3.5), { tam: 150 });
  SN.txt(c, "METADE DAS PESSOAS", 540, 945, { tam: 30, cor: SN.LARANJA, a: range(t, 3.72, 3.95), esp: 0.26 });
  SN.txt(c, "JÁ TEVE PELO MENOS UM", 540, 995, { tam: 26, cor: "#fff", a: range(t, 4.41, 4.65), esp: 0.24 });
}

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
