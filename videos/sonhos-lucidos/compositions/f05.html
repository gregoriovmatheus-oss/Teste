<!-- f05: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f05.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 5.21 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f05-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 92px; line-height: 1.05; color: #fff; text-transform: uppercase;
      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }
    .rot-t .k { display: inline-block; font-size: 34px; letter-spacing: 0.12em; color: #F05A4A; -webkit-text-stroke: 0; text-shadow: 0 3px 0 #000; margin-bottom: 10px; }
    .rot-t .n { color: #F5C518; }
.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .o { font-weight: 800; color: #ff8a4c; } .rot-t .p { font-size: 60px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f05" data-width="1080" data-height="1920">
    <canvas id="f05-canvas" width="1080" height="1920"></canvas>

  </div>
  <script>
    (function () {
      const D0 = 5.21;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f05-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f05" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });

      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f05"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f05"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/lowpoly.js"), import("./assets/lib/blocks/cinema.js"), import("./assets/lib/blocks/sonho.js")
      ]).then(async ([K_, T, A, LOWPOLY, CINEMA, SONHO]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f05-canvas");

const LP = LOWPOLY, CI = CINEMA, SN = SONHO;
await SN.prepara();
const st = LP.palco(canvas, { foco: 2.2, faixa: 0.7, desfoque: 20, bloom: 1.0 });
const { S, cam } = st;
LP.luz(st, "noite"); st.exposicao = 1.15; st.hemi.intensity = 0.55;
CI.cenario(S, "quarto");
const ab = CI.luzPratica(S, "abajur", [-0.3, 0.5, -2.6], { forca: 0.7 });
const janela = new THREE.PointLight(0x8fb0ff, 2.5, 6, 1.5); janela.position.set(-2.4, 1.8, -0.8); S.add(janela);
const p = SN.heroi(LP); S.add(p.root);
// orbes do sonho: soltos e caóticos → em "controlar" formam um anel ordenado que gira sobre a cama
const N = 36, r = mulberry32(8), orb = [], C0 = new THREE.Vector3(0.8, 1.75, -1.75);
for (let i = 0; i < N; i++) { const s = SN.brilho([0xb08aff, 0x7cc8ff, 0xff9ad8, 0xffd27a][i % 4], 0.16 + r() * 0.12, "suave", 0.9); S.add(s); orb.push([s, new THREE.Vector3((r() - 0.5) * 2.6, (r() - 0.3) * 1.4, (r() - 0.5) * 2.2), r() * 6]); }
const v = new THREE.Vector3(), R = new THREE.Vector3(), al = new THREE.Vector3();
function render(t) {
  SN.deitado(LP, p, t, [0.8, 0.63, -0.72], { seed: 7, emocao: "dormindo", vida: { resp: 1.4 } });
  const k = ease.inOutCubic(range(t, 1.05, 1.9));
  orb.forEach(([s, d, f], i) => { const a = (i / N) * 6.283 + t * 0.6, rr = 0.55 + 0.05 * Math.sin(t * 2 + i);
    v.set(C0.x + d.x + 0.12 * Math.sin(t * 1.3 + f), C0.y + d.y + 0.1 * Math.sin(t + f), C0.z + d.z).lerp(R.set(C0.x + Math.cos(a) * rr, C0.y + 0.25, C0.z + Math.sin(a) * rr), k);
    s.position.copy(v); s.material.opacity = 0.6 + 0.35 * Math.sin(t * 3 + f); });
  CI.trilho(cam, t, [[0, [2.5, 1.5, 0.9], [0.8, 1.25, -1.9]], [2.6, [2.2, 1.65, 0.5], [0.8, 1.3, -1.9]], [5.21, [1.9, 1.85, 0.2], [0.8, 1.25, -1.95]]], { mao: 1, seed: 5 });
  LP.focar(st, al.set(0.8, 0.8, -2.0)); ab.update && ab.update(t);
  st.draw();
  const c = st.ctx, hk = ease.inOutCubic(range(t, 3.3, 4.2));
  SN.txt(c, "CONTROLAR TODOS", 540, 975, { tam: 32, cor: SN.AZUL, a: range(t, 1.05, 1.3) * (1 - range(t, 2.1, 2.3)), esp: 0.3 });
  SN.txt(c, "TODA NOITE", 540, 700, { tam: 28, cor: "#fff", a: range(t, 2.34, 2.55), esp: 0.34 });
  if (t > 3.2) { c.save(); c.globalAlpha = range(t, 3.2, 3.4); c.lineCap = "round";
    c.strokeStyle = "rgba(124,200,255,0.25)"; c.lineWidth = 10; c.beginPath(); c.arc(540, 850, 110, 0, 6.283); c.stroke();
    c.strokeStyle = "#ff8a4c"; c.shadowColor = "#ff8a4c"; c.shadowBlur = 20; c.beginPath(); c.arc(540, 850, 110, -Math.PI / 2, -Math.PI / 2 + hk * Math.PI * 2 * (2 / 8)); c.stroke(); c.restore(); }
  SN.numero(c, "2 h", 540, 852, range(t, 3.3, 3.5), { tam: 92 });
  SN.txt(c, "DE SONHO SÓ SEU", 540, 995, { tam: 28, cor: SN.LARANJA, a: range(t, 4.16, 4.4), esp: 0.28 });
}

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
