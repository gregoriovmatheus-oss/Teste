<!-- f10: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f10.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 4.84 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>

    #f10-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

      -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 10px 24px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { color: #F5C518; } .rot-t .r { color: #E8463A; } .rot-t .p { font-size: 70px; }

.rot-t { font-family: "Inter", sans-serif; font-weight: 300; font-size: 80px; line-height: 1.1; color: #fff; text-transform: none; letter-spacing: -0.01em; -webkit-text-stroke: 0; text-shadow: 0 2px 30px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6); }

  </style>
  <div id="root" data-composition-id="f10" data-width="1080" data-height="1920">
    <canvas id="f10-canvas" width="1080" height="1920"></canvas>

  </div>
  <script>
    (function () {
      const D0 = 4.84;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f10-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f10" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });

      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f10"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f10"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/lowpoly.js"), import("./assets/lib/blocks/cinema.js"), import("./assets/lib/blocks/sonho.js")
      ]).then(async ([K_, T, A, LOWPOLY, CINEMA, SONHO]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f10-canvas");

const LP = LOWPOLY, CI = CINEMA, SN = SONHO;
await SN.prepara();
const st = LP.palco(canvas, { foco: 1.4, faixa: 0.5, desfoque: 20, bloom: 0.9 });
const { S, cam } = st;
LP.luz(st, "dia"); st.exposicao = 1.05;
const Q = CI.cenario(S, "quarto"); st.sol(new THREE.Vector3(-2.94, 1.6, -0.8), 0.9);
// acordou sentado na beira da cama; o quarto tremula e ondula como se ainda fosse sonho
const p = SN.heroi(LP); S.add(p.root); p.root.position.set(0.2, 0, -1.4); p.root.rotation.y = -Math.PI / 2;
const R = new THREE.Vector3(), v = new THREE.Vector3();
function render(t) {
  const on = range(t, 1.7, 2.4) * (1 - 0.6 * range(t, 4.2, 4.84)), w = Math.sin(t * 5.5);
  LP.ator(p, t, { seed: 7, pose: [["sentado", 1], ["pensativo", range(t, 3.3, 3.9)]], emocao: t < 1.6 ? ["sono", "duvida", range(t, 0.6, 1.4)] : ["duvida", "surpresa", range(t, 2.2, 2.7) * (1 - range(t, 3.4, 4.0))], olharPara: v.set(-1.5, 1.9 + 0.3 * Math.sin(t), -1.4 + Math.sin(t * 0.8)), olharK: range(t, 1.0, 1.6) });
  Q.g.scale.set(1 + 0.012 * on * w, 1 + 0.018 * on * Math.sin(t * 4.3 + 1), 1); Q.g.rotation.z = 0.012 * on * Math.sin(t * 3.1); Q.g.position.y = 0.02 * on * Math.sin(t * 6);
  st.U.barril.value = 0.12 + 0.3 * on * (0.5 + 0.5 * w); st.U.ca.value = 0.6 + 2.2 * on; st.U.sat.value = 0.92 - 0.3 * on;
  p.root.updateMatrixWorld(true); R.copy(LP.pontoCabeca(p, "testa")).lerp(LP.pontoCabeca(p, "boca"), 0.5);
  const e = ease.inOutSine(range(t, 0, 4.84)); cam.position.set(R.x - lerp(1.9, 1.45, e), R.y + lerp(0.1, 0.04, e), R.z + lerp(0.6, 0.35, e)); cam.lookAt(R.x, R.y - 0.36, R.z); LP.camMao(cam, t, { seed: 5 }); LP.focar(st, R);
  st.draw();
  const c = st.ctx;
  SN.txt(c, "DEPOIS DE ACORDAR", 540, 700, { tam: 28, cor: SN.AZUL, a: range(t, 0.27, 0.5) * (1 - range(t, 2.4, 2.6)), esp: 0.3 });
  SN.titulo(c, "", ["*aconteceu*?"], range(t, 2.66, 2.9), { y: 880, tam: 70 });
  SN.txt(c, "OU FOI SÓ NA SUA CABEÇA?", 540, 975, { tam: 30, cor: SN.LARANJA, a: range(t, 3.62, 3.85), esp: 0.2 });
}

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
