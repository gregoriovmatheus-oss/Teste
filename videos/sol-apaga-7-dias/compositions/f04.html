<!-- f04: cena 3D padrão documentário (R10 + doc). Lógica em cenas/f04.js (gerado por scripts/monta-cenas.py).
     Tempos escritos para 4.55 s e esticados para a duração real do host (data-duration). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a12; }
    #f04-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* rótulos 2D: y 680-980, acima da faixa da legenda (1005-1235) */
    .rot { position: absolute; left: 100px; right: 260px; top: 700px; height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .rot-t { display: block; font-family: "Inter", sans-serif; font-weight: 300; font-size: 84px; line-height: 1.1; color: #fff; text-transform: none;
      letter-spacing: -0.01em; text-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.6); opacity: 0; }
    .rot-t .y { font-weight: 800; background: linear-gradient(90deg, #ffffff, #9fd6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
    .rot-t .p { font-size: 64px; }
    .rot-t .k { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px; letter-spacing: 0.32em; color: #7cc8ff; margin-bottom: 18px; }
    .rot-t .n { font-family: "JetBrains Mono", monospace; font-weight: 600; color: #7cc8ff; }

  </style>
  <div id="root" data-composition-id="f04" data-width="1080" data-height="1920">
    <canvas id="f04-canvas" width="1080" height="1920"></canvas>
    <div id="f04-r1" class="rot" style="top: 660px"><span id="f04-r1-in" class="rot-t">A <span class="y">escuridão</span> chega</span></div>
    <div id="f04-r2" class="rot" style="top: 660px"><span id="f04-r2-in" class="rot-t">O dia vira <span class="y">noite</span></span></div>
  </div>
  <script>
    (function () {
      const D0 = 4.55;
      // duração real = data-duration do host da cena (muda quando a narração muda)
      const durReal = () => {
        for (let n = document.getElementById("f04-canvas"); n; n = n.parentElement) {
          if (n.getAttribute && n.getAttribute("data-composition-id") === "f04" && n.hasAttribute("data-duration")) return parseFloat(n.getAttribute("data-duration")) || D0;
        }
        return D0;
      };
      const DR = durReal(), K = DR / D0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f04-r1-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.3 * K);
      tl.to("#f04-r1-in", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 1.35 * K);
      tl.fromTo("#f04-r2-in", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.7 * K);
      tl.set({}, {}, DR);
      window.__timelines = window.__timelines || {};
      window.__timelines["f04"] = tl;

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["f04"] = Promise.all([
        import("./assets/lib/kit.js"), import("./assets/lib/blocks/toy.js"), import("./assets/lib/blocks/animals.js"), import("./assets/lib/blocks/solkit.js")
      ]).then(async ([K_, T, A, SOLKIT]) => {
        const K = K_;
        const { THREE, ease, range, lerp, clamp, smoothstep, mulberry32 } = K;
        const D = D0;   // o corpo trabalha no tempo de autoria
        const canvas = document.getElementById("f04-canvas");

        const SK = SOLKIT;
        await SK.fontes();
        const st = T.createToyStage(canvas, { fov: 50, nevoa: [160, 560], nuvens: 0, ceu: ["#5E8FCB", "#F2D3A8"] });
        const S = st.scene, cam = st.cam;
        const ceu = SK.ceuDin(st, ["#5E8FCB", "#F2D3A8"], ["#02040a", "#0a1226"]);
        const cid = T.cidade({ n: 5, seed: 41, verde: 0.18 }); S.add(SK.aliviar(cid.group));
        const stars = SK.estrelas(S, { n: 2200, r: 900, seed: 42 });
        const rr = mulberry32(43);
        cid.buildings.forEach((b) => { b.userData.on = rr() < 0.55 ? 1.6 + rr() * 2.2 : 99; });
        const tremor = T.shaker(44);
        const SD = new THREE.Vector3(-1.2, 0.9, 0.6).normalize();
        const sunHalo = SK.brilho(0xffe2b0, 300, "suave", 1), sunCore = SK.brilho(0xffffff, 70, "disco", 1);
        S.add(sunHalo, sunCore);
        function render(t) {
          // a última luz chega a todo o lado iluminado quase ao mesmo tempo: o Sol, o céu e as sombras somem juntos em ~0,5 s
          st.sol(0, 0, 130);
          const k = ease.inOutSine(range(t, 0.4, 0.9));
          ceu.set(k);
          S.environmentIntensity = lerp(1, 0.07, k);
          st.hemi.intensity = 0.55 * lerp(1, 0.1, k);
          st.rim.intensity = 1.1 * (1 - k);
          st.key.intensity = 3.2 * (1 - k);
          stars.set(range(t, 1.0, 2.6), t);
          for (const s of [sunHalo, sunCore]) { s.position.copy(cam.position).addScaledVector(SD, 900); s.material.opacity = 1 - k; }
          cid.buildings.forEach((b) => { b.userData.win.emissiveIntensity = 1.3 * range(t, b.userData.on, b.userData.on + 0.15); });
          // grua aérea girando e descendo, com um leve tremor no instante do apagão
          const e = ease.inOutSine(range(t, 0, 4.55));
          const a = lerp(0.35, 0.85, e), R = lerp(175, 135, e);
          const [tx, ty, tz] = tremor(t, 1.6 * Math.exp(-Math.pow((t - 0.65) / 0.3, 2)));
          cam.position.set(Math.sin(a) * R + tx, lerp(125, 82, e) + ty, Math.cos(a) * R + tz);
          cam.lookAt(0, 0, -10);
          st.draw();
        }

        // DR foi lido na hora em que o script rodou (depois do inline o host pode mudar de atributos)
        await K.bindSeek(canvas, (t) => { st.T = t * D / DR; st.D = D; render(st.T); }, { warm: [st.warm, ...(st.extraWarm || [])], duration: DR });
      });
    })();
  </script>
</template>
